    <script>window.COURSEWARE_CONFIG = {"id":"english-story-01-the-talkative-tortoise","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"english_story_01_The_Talkative_Tortoise.html","steps":[{"title":"The Talkative Tortoise","scene":"meadow","detailsText":"Tilly the tortoise lived in a sunny meadow with her friends: the wise Owl, the busy Squirrel, and the gentle Rabbit. Tilly loved her friends, but she loved one thing more—her own voice. She talked all day long.","textEn":"Tilly the tortoise lived in a sunny meadow with her friends: the wise Owl, the busy Squirrel, and the gentle Rabbit.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-1.webp"],"imageAlt":"The Talkative Tortoise主题插图"},{"title":"Tilly's Endless Chatter","scene":"picnic","detailsText":"Tilly 🐢：Good morning, Owl! Did you see the dewdrops? I counted thirty-seven on one leaf. Well, maybe thirty-eight. One was very tiny. Do you think dewdrops have dreams? I dreamt I was a cloud once. It was very floaty...\nOwl 🦉：*nods politely, eyelids growing heavy*","textEn":"Tilly 🐢：Good morning, Owl!\nDid you see the dewdrops?\nI counted thirty-seven on one leaf.\nWell, maybe thirty-eight.\nOne was very tiny.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-2.webp"],"imageAlt":"Tilly's Endless Chatter主题插图"},{"title":"The Picnic","scene":"wind","detailsText":"One day, the animals decided to have a picnic by the sparkling pond. Everyone brought something to share. Rabbit brought clover buns, Squirrel brought acorn pie, and Owl brought a jar of honey. Tilly brought herself, and she brought plenty of stories.","textEn":"One day, the animals decided to have a picnic by the sparkling pond.\nEveryone brought something to share.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-3.webp"],"imageAlt":"The Picnic主题插图"},{"title":"The Talking Goes On","scene":"listening","detailsText":"Tilly 🐢：Did I ever tell you about the time I raced a turtle? Well, it was actually a snail. He was very slow. Or was it me who was slow? Let me think...\nTilly 🐢：And then the wind blew the flower petals all over. They were pink, but also a bit purple. Purple is an interesting color, isn't it? My cousin's shell has a purple speck...","textEn":"Tilly 🐢：Did I ever tell you about the time I raced a turtle?\nWell, it was actually a snail.\nHe was very slow.\nOr was it me who was slow?\nLet me think...","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-4.webp"],"imageAlt":"The Talking Goes On主题插图"},{"title":"Friends Grow Tired","scene":"bubbles","detailsText":"Her friends tried to listen, but their ears were tired. They were hungry too. The delicious smells from the picnic made their tummies rumble. Finally, Squirrel couldn't wait anymore. He reached for a clover bun.","textEn":"Her friends tried to listen, but their ears were tired.\nThey were hungry too.\nThe delicious smells from the picnic made their tummies rumble.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-5.webp"],"imageAlt":"Friends Grow Tired主题插图"},{"title":"Tilly Gets Upset","scene":"star","detailsText":"Tilly 🐢：Squirrel! I'm not finished with my story! It's not polite to eat when someone is talking.\nSquirrel pulled his paw back. The picnic was not fun anymore. Rabbit looked at the ground. Owl stared at the clouds. Tilly was so busy talking, she hadn't noticed how quiet her friends were.","textEn":"Tilly 🐢：Squirrel!\nI'm not finished with my story!\nIt's not polite to eat when someone is talking.\nSquirrel pulled his paw back.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-6.webp"],"imageAlt":"Tilly Gets Upset主题插图"},{"title":"The Wind Comes!","scene":"meadow","detailsText":"Just then, a loud WHOOOOSH swept through the meadow. A gust of wind grabbed the picnic blanket! It flipped it over, scattering buns, pie, and the honey jar high into the air! The food landed with a splish-splash right in the middle of the pond.","textEn":"Just then, a loud WHOOOOSH swept through the meadow.\nA gust of wind grabbed the picnic blanket!","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-1.webp"],"imageAlt":"The Wind Comes!主题插图"},{"title":"A Ruined Picnic","scene":"picnic","detailsText":"The four friends stood at the edge of the pond, very sad. The picnic was ruined, and nobody had gotten to eat a single bite. Tilly looked at her sad friends. For the first time all day, her mouth was closed.","textEn":"The four friends stood at the edge of the pond, very sad.\nThe picnic was ruined, and nobody had gotten to eat a single bite.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-1.webp"],"imageAlt":"A Ruined Picnic主题插图"},{"title":"Tilly's Realization","scene":"wind","detailsText":"Tilly 🐢：I'm sorry. I was so busy talking that I forgot to listen. And I forgot to let you eat. A picnic isn't just about talking. It's about sharing.\nOwl 🦉：We love hearing your stories, Tilly. But sharing means everyone gets a turn to speak. And to eat.","textEn":"Tilly 🐢：I'm sorry.\nI was so busy talking that I forgot to listen.\nAnd I forgot to let you eat.\nA picnic isn't just about talking.\nIt's about sharing.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-1.webp"],"imageAlt":"Tilly's Realization主题插图"},{"title":"Building Together","scene":"listening","detailsText":"The next day, Tilly invited her friends back to the meadow. This time, she was quiet at first. She had spent the morning thinking of a plan. \"Let's build a new picnic table, right here under this big oak tree. Then, the wind can't take our blanket away!\" Tilly didn't talk while they worked. She listened to Rabbit's ideas, and Squirrel's, and Owl's. They found smooth stones for legs and a wide, flat board for the top.","textEn":"The next day, Tilly invited her friends back to the meadow.\nThis time, she was quiet at first.\nShe had spent the morning thinking of a plan.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-1.webp"],"imageAlt":"Building Together主题插图"},{"title":"A Better Picnic","scene":"bubbles","detailsText":"When they were done, they had a wonderful, sturdy table. They sat down, and Tilly passed the food around first. \"Now,\" she said with a smile, \"I will tell you a new story. It's about a tortoise who learned how to listen. But first, does anyone want more clover buns?\" Her friends laughed. They shared the food, and then they shared stories, each animal taking a turn. Tilly talked, but she also listened. And she found that the stories from her friends were just as wonderful as her own.","textEn":"When they were done, they had a wonderful, sturdy table.\nThey sat down, and Tilly passed the food around first.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-1.webp"],"imageAlt":"A Better Picnic主题插图"},{"title":"Moral of the Story","scene":"star","detailsText":"Talking is wonderful, but listening is a gift. When we share our voices and our time, everyone feels happy and heard.\n说话是美好的，但倾听是一份礼物。当我们分享自己的声音和时间时，每个人都会感到快乐和被倾听。","textEn":"Talking is wonderful, but listening is a gift.\nWhen we share our voices and our time, everyone feels happy and heard.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-1.webp"],"imageAlt":"Moral of the Story主题插图"}]};</script>
