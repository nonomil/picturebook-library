    <script>window.COURSEWARE_CONFIG = {"id":"lesson-extra-03-finger-painting","template":"activity-studio","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"动手活动","requiredInteractions":["record:5"],"sourcePath":"lesson_extra_03_艺术创作：手指画.html","steps":[{"title":"今天要学会什么？","scene":"meadow","textZh":"我们要发现\n我们会发现：","detailsText":"我们要发现\n我们会发现：\n认识3-5种基础颜色（红、黄、蓝、绿、紫）及其混合变化\n了解手指画的基本创作原理（指纹、掌纹的纹理特性）\n初步感知不同触觉体验（颜料质地、纸张吸水性）\n我们会练习：\n发展手眼协调能力与精细动作控制\n培养色彩搭配与构图的基本意识\n锻炼想象力与创造性表达能力\n提升语言描述能力（描述自己的作品）\n我们会感受到：\n建立艺术创作的自信心与成就感\n体验自由创作的愉悦感\n培养对艺术活动的兴趣与开放性态度\n增进亲子/师生间的互动与情感联结","images":["../../local/generated-visuals/lesson-extra-03-finger-painting/page-1.webp"],"imageAlt":"今天要学会什么？主题插图"},{"title":"准备材料","scene":"picnic","textZh":"需要的东西\n核心材料：","detailsText":"需要的东西\n核心材料：\n无毒可水洗手指画颜料（6-8种基础色）\n加厚防渗透画纸（至少A4大小）\n调色盘或塑料盘\n湿纸巾/湿毛巾（随时清洁）\n防水围裙或旧T恤\n增强体验材料：\n不同纹理的纸张（砂纸、皱纹纸、锡纸等）\n自然物品（树叶、花瓣等可用于印压）\n亮片/彩色绒球（可粘贴装饰）\n创作背景音乐（轻快的小朋友歌曲）","images":["../../local/generated-visuals/lesson-extra-03-finger-painting/page-2.webp"],"imageAlt":"准备材料主题插图"},{"title":"准备阶段（10分钟）","scene":"wind","textZh":"我们来试试\n🛡️ 安全说明","detailsText":"我们来试试\n🛡️ 安全说明\n示范正确的颜料取用方法：\"手指轻轻蘸，不要挖太多\"。强调颜料不可入口、不可揉眼睛。\n💡 激发兴趣\n展示1-2幅简单的手指画作品范例，提问引导：\"猜猜这是用什么画的？\"\"你的手掌像什么？\"\n创作阶段（25-35分钟）\n感官探索（8分钟）：\n让孩子先空手在纸上\"画一画\"，感受手臂运动轨迹\n每人选择一种颜色，用食指在纸上轻轻点触\n观察手指按压力度不同产生的变化和指纹的独特纹理\n基础技法学习（10分钟）：\n掌印法：手掌蘸颜料后平稳压印，形成\"树干\"\"动物身体\"\n指纹画法：用不同手指创作细节（眼睛、花朵、星星）\n线条画法：用指尖或指甲侧面画简单线条\n主题创作（15分钟）：\n🌳 《春天的花园》\n用掌印做花朵，指纹做叶子\n🦋 《动物世界》\n掌印做身体，添加五官和腿\n🚀 《太空探险》\n指纹做星星，掌印做火箭\n收尾阶段（10分钟）\n协助孩子在作品背面写上名字和日期\n指导孩子用湿纸巾清洁双手和手臂\n每人用1分钟介绍自己的作品","images":["../../local/generated-visuals/lesson-extra-03-finger-painting/page-3.webp"],"imageAlt":"准备阶段（10分钟）主题插图"},{"title":"再试一试","scene":"listening","textZh":"还可以这样玩\n数学认知：点数手指印的数量，比较大小","detailsText":"还可以这样玩\n数学认知：点数手指印的数量，比较大小\n语言发展：为作品编一个简短故事并讲述\n科学探索：混合不同颜色，观察变化并记录\n家庭延伸：每周一个简单主题（如\"下雨天\"），制作作品集小书","images":["../../local/generated-visuals/lesson-extra-03-finger-painting/page-4.webp"],"imageAlt":"再试一试主题插图"},{"title":"安全提醒","scene":"meadow","textZh":"材料安全：必须使用AP/CE认证的无毒可水洗颜料\n操作安全：全程有成人监护，确保颜料不接触眼睛、口鼻","detailsText":"安全提醒\n材料安全：必须使用AP/CE认证的无毒可水洗颜料\n操作安全：全程有成人监护，确保颜料不接触眼睛、口鼻\n过程导向评价：避免使用\"画得真像\"等结果性评价\n情绪管理：准备应对可能的感官抗拒，提供替代方案","images":["../../local/generated-visuals/lesson-extra-03-finger-painting/page-5.webp"],"imageAlt":"安全提醒主题插图"},{"title":"老师小提示","scene":"picnic","textZh":"手指画不仅是艺术启蒙，更是多感官整合学习体验。它帮助孩子建立\"我可以创造\"的信念，这种自信将迁移到其他学习领域。最重要的不是\"画得好不好\"，而是\"孩子是否在探索与表达中获得了快乐与成长\"。","detailsText":"老师小提示\n手指画不仅是艺术启蒙，更是多感官整合学习体验。它帮助孩子建立\"我可以创造\"的信念，这种自信将迁移到其他学习领域。最重要的不是\"画得好不好\"，而是\"孩子是否在探索与表达中获得了快乐与成长\"。","images":["../../local/generated-visuals/lesson-extra-03-finger-painting/page-6.webp"],"imageAlt":"老师小提示主题插图","record":{"prompt":"这一课完成了吗？请勾选后保存学习记录。","label":"我完成了这一课"}}]};</script>
