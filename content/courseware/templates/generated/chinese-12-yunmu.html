    <script>window.COURSEWARE_CONFIG = {"id":"chinese-12-yunmu","template":"interactive-classroom","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"互动学习","requiredInteractions":["quiz:8"],"sourcePath":"childrens-library/courseware/chinese/chinese-12-yunmu.html","steps":[{"title":"韵母大冒险","scene":"meadow","textZh":"🔤\n第12课","detailsText":"🔤\n第12课\n✨ Finals Adventure ✨\na o e i u ü · ai ei ui · ao ou iu · ie üe · an en in un ün · ang eng ing ong\n探索韵母的奇妙世界！\n👆 点击 ▶ 开始冒险","images":["../../local/images/chinese-12/webp/page-01.webp"],"imageAlt":"韵母大冒险","audio":{"src":"../../local/audio/chinese-12-yunmu/page-1.mp3","lang":"zh-CN"}},{"title":"六个单韵母","scene":"picnic","textZh":"单韵母 · 1/5\n🔤 六个单韵母","detailsText":"单韵母 · 1/5\n🔤 六个单韵母\nSimple finals · 最基本的韵母\n💡 小知识：单韵母是韵母的基础！普通话共有 6 个单韵母：a, o, e, i, u, ü。发 a 时嘴巴张得最大，发 i 时嘴角向两边展开，发 ü 时嘴唇收圆像吹口哨。\na\nā á ǎ à · 四声\n啊 啊 啊 啊\no\nō ó ǒ ò · 四声\n喔 哦 噢 哦\ne\nē é ě è · 四声\n阿 鹅 恶 饿\ni\nī í ǐ ì · 四声\n一 移 椅 意\nu\nū ú ǔ ù · 四声\n乌 无 五 物\nü\nǖ ǘ ǚ ǜ · 四声\n迂 鱼 雨 玉\na 啊\no 哦\ne 鹅\ni 衣\nu 屋\nü 鱼\n单韵母 a o e i u ü\n👆 点击卡片听四声发音","images":["../../local/images/chinese-12/webp/page-02.webp"],"imageAlt":"六个单韵母","audio":{"src":"../../local/audio/chinese-12-yunmu/page-2.mp3","lang":"zh-CN"}},{"title":"八个复韵母","scene":"wind","textZh":"复韵母 · 2/5\n🔗 八个复韵母","detailsText":"复韵母 · 2/5\n🔗 八个复韵母\nCompound finals · 两个元音连在一起\n💡 发音秘诀：复韵母是\"滑音\"——从第一个元音快速滑到第二个元音！比如 ai 就像在说\"爱\" (ài)，嘴巴从大张慢慢合拢。\nai\n爱 ài\n爱 ❤️\nei\n飞 fēi\n飞 🕊️\nui\n水 shuǐ\n水 💧\nao\n猫 māo\n猫 🐱\nou\n狗 gǒu\n狗 🐶\niu\n球 qiú\n球 ⚽\nie\n叶 yè\n叶 🍃\nüe\n月 yuè\n月 🌙\nai 爱\nei 飞\nui 水\nao 猫\nou 狗\niu 球\nie 叶\nüe 月\n复韵母 ai ei ui ao ou iu ie üe\n👆 点击卡片听发音","images":["../../local/images/chinese-12/webp/page-03.webp"],"imageAlt":"八个复韵母"},{"title":"前鼻韵母","scene":"listening","textZh":"前鼻韵母 · 3/5\n👃 前鼻韵母","detailsText":"前鼻韵母 · 3/5\n👃 前鼻韵母\nFront nasal finals · an en in un ün\n👅 发音秘诀：舌尖抵住上齿龈，让气流从鼻腔出来！an 像\"安\" (ān)，en 像\"恩\" (ēn)。声音从嘴巴转到鼻子，是前鼻音的特点。\nan\n天安 tiān ān\n安 🏛️\nen\n恩情 ēn qíng\n恩 🤗\nin\n星星 xīng\n音 🎵\nun\n春天 chūn tiān\n春 🌸\nün\n白云 bái yún\n云 ☁️\nü + an = üan\nyuan 圆\n圆 ⭕\nan 安\nen 恩\nin 音\nun 春\nün 云\n前鼻韵母 an en in un ün\n👆 点击卡片听发音","images":["../../local/images/chinese-12/webp/page-04.webp"],"imageAlt":"前鼻韵母"},{"title":"后鼻韵母","scene":"bubbles","textZh":"后鼻韵母 · 4/5\n👃 后鼻韵母","detailsText":"后鼻韵母 · 4/5\n👃 后鼻韵母\nBack nasal finals · ang eng ing ong\n👅 发音秘诀：舌根抬起顶住软腭，让气流从鼻腔出来！ang 像\"昂\" (áng)，eng 像\"灯\" (dēng)。前鼻音和后鼻音的区别是舌头位置不同哦！\nang\n昂 áng\n昂 🏔️\neng\n灯 dēng\n灯 💡\ning\n星 xīng\n星 ⭐\nong\n龙 lóng\n龙 🐉\n⚡ 前鼻音 vs 后鼻音 对比\n前鼻音 (-n)后鼻音 (-ng)区别\nan 安ang 昂舌尖 vs 舌根\nen 恩eng 灯前鼻 vs 后鼻\nin 音ing 星前鼻 vs 后鼻\n后鼻韵母 ang eng ing ong\n👆 点击卡片听发音对比","images":["../../local/images/chinese-12/webp/page-05.webp"],"imageAlt":"后鼻韵母"},{"title":"所有韵母一览","scene":"star","textZh":"韵母总表 · 5/5\n📋 所有韵母一览","detailsText":"韵母总表 · 5/5\n📋 所有韵母一览\n一共 24 个韵母，今天都学啦！\n🔴 单韵母 (6)\naoeiuü\n🟠 复韵母 (8)\naieiuiaoouiuieüe\n🟢 前鼻韵母 (5)\naneninunün\n🟣 后鼻韵母 (4)\nangengingong\n💠 特殊韵母 (1)\ner\n✨ er 特殊韵母：又称\"卷舌韵母\"，发音时舌尖卷起。常见汉字：ér 儿 (儿子)、ěr 耳 (耳朵)、èr 二 (二)。\nér 儿 👶\něr 耳 👂\nèr 二 2️⃣\n韵母总表","images":["../../local/images/chinese-12/webp/page-06.webp"],"imageAlt":"所有韵母一览"},{"title":"声母 + 韵母拼读","scene":"meadow","textZh":"拼读练习\n🔊 声母 + 韵母拼读","detailsText":"拼读练习\n🔊 声母 + 韵母拼读\n把声母和韵母连起来读！点击卡片听读音\nm + a = mā\n声母 m (摸) + 韵母 a (一声) → mā\n👩 妈妈 mā ma\nb + i = bǐ\n声母 b (波) + 韵母 i (三声) → bǐ\n✏️ 铅笔 qiān bǐ\nd + a = dà\n声母 d (得) + 韵母 a (四声) → dà\n🐘 大象 dà xiàng\nl + ü = lǜ\n声母 l (勒) + 韵母 ü (四声) → lǜ\n🍃 绿色 lǜ sè\nh + ai\nhǎi 海\n🌊 大海\nn + iu\nniú 牛\n🐮 黄牛\nt + ian\ntiān 天\n☀️ 天空\nl + ong\nlóng 龙\n🐉 飞龙\nbā 八\npá 爬\ngē 歌\nkū 哭\nfēi 飞\npǎo 跑\ntiào 跳\nchàng 唱\n拼读练习","images":["../../local/images/chinese-12/webp/page-07.webp"],"imageAlt":"声母 + 韵母拼读"},{"title":"韵母歌","scene":"picnic","textZh":"韵母小诗\n🎵 韵母歌","detailsText":"韵母小诗\n🎵 韵母歌\n点击每句诗听朗读，找找里面的韵母！\n📖 声母韵母手拉手\n声母韵母手拉手 -u -u -ou\n拼出音节来走走 -ie -ou\n妈妈爱我我爱她 -a -ai -a -ai\n天天快乐笑哈哈 -ian -e -a\n👆 点击句子听朗读 · 找找红色的韵母\n诗行1\n诗行2\n诗行3\n诗行4\n🎯 找一找：你能在每句诗里找到几个韵母？试试看把每个字的韵母都读出来！比如\"妈\"(mā)的韵母是 a。","images":["../../local/images/chinese-12/webp/poem-line-1.webp","../../local/images/chinese-12/webp/poem-line-2.webp","../../local/images/chinese-12/webp/poem-line-3.webp","../../local/images/chinese-12/webp/poem-line-4.webp"],"imageAlt":"韵母歌"},{"title":"选择正确的韵母","scene":"wind","textZh":"小测验\n📝 选择正确的韵母","detailsText":"小测验\n📝 选择正确的韵母\n看图片或拼音，选出正确的韵母 🎯\nm___ mɑ 妈妈\na\no\ne\ni\nf___ 飞 fly\nei\nai\nui\nie\nl___ 龙 dragon\nong\nang\neng\ning\nx___ 星 star\ning\nin\neng\nun\ny___ 月 moon\nüe\nie\nui\niu\nquiz","images":["../../local/images/chinese-12/webp/page-07.webp"],"imageAlt":"选择正确的韵母","question":"选一选，看看你发现了什么。","options":[{"label":"a","correct":true,"hint":"再看一看图片和题目中的线索。"},{"label":"o","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"e","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"i","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"ei","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"ai","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"ui","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"ie","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"ong","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"ang","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"eng","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"ing","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"in","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"un","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"üe","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"iu","correct":false,"hint":"再看一看图片和题目中的线索。"}]},{"title":"完成啦！","scene":"listening","textZh":"🏆\n🎉 太棒了！完美完成！","detailsText":"🏆\n🎉 太棒了！完美完成！\n你学会了全部的韵母！\n🎊 24 个韵母全部掌握啦 🎊\n⭐⭐⭐⭐⭐\na\no\ne\ni\nu\nü\nai\nei\nui\nao\nou\niu\nie\nüe\nan\nen\nin\nun\nün\nang\neng\ning\nong\ner\ncelebration\n✨ 你已是韵母小达人 ✨\n🔄 再学一遍","images":["../../local/images/chinese-12/webp/page-01.webp"],"imageAlt":""}]};</script>
