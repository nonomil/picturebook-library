 一一𠃌丿","detailsText":"手\n4 画 · 笔画: 一一𠃌丿\n手 stroke order\n小手 xiǎoshǒu\n手机 shǒujī\n洗手 xǐshǒu\n手指 shǒuzhǐ\n宝宝的小手很白。Bǎobao de xiǎoshǒu hěn bái.\n妈妈在用手机。Māma zài yòng shǒujī.\n吃饭前要洗手。Chīfàn qián yào xǐshǒu.\nShǒu shǒu shǒu\n两只手，拍一拍。","images":["../../local/images/chinese-13-body/webp/page-04.webp"],"imageAlt":"shǒu","audio":{"src":"../../local/audio/chinese-13-body/page-5.mp3","lang":"zh-CN"}},{"title":"zú","scene":"star","textZh":"足\n7 画 · 笔画: 丨𠃍一丨一丿㇏","detailsText":"足\n7 画 · 笔画: 丨𠃍一丨一丿㇏\n足 stroke order\n足球 zúqiú\n足够 zúgòu\n十足 shízú\n足迹 zújì\n我喜欢踢足球。Wǒ xǐhuan tī zúqiú.\n我们有足够的时间。Wǒmen yǒu zúgòu de shíjiān.\n他信心十足。Tā xìnxīn shízú.\nZú zú zú\n两只足，走天下。","images":["../../local/images/chinese-13-body/webp/page-05.webp"],"imageAlt":"zú","audio":{"src":"../../local/audio/chinese-13-body/page-6.mp3","lang":"zh-CN"}},{"title":"tóu","scene":"meadow","textZh":"头\n5 画 · 笔画: 丶丶一丿丶","detailsText":"头\n5 画 · 笔画: 丶丶一丿丶\n头 stroke order\n头发 tóufa\n石头 shítou\n开头 kāitóu\n抬头 táitóu\n她的头发很长。Tā de tóufa hěn cháng.\n路上有一块石头。Lù shàng yǒu yí kuài shítou.\n故事的开头很有趣。Gùshi de kāitóu hěn yǒuqù.\nTóu tóu tóu\n圆圆的头，想问题。","images":["../../local/images/chinese-13-body/webp/page-06.webp"],"imageAlt":"tóu","audio":{"src":"../../local/audio/chinese-13-body/page-7.mp3","lang":"zh-CN"}},{"title":"yá","scene":"picnic","textZh":"牙\n4 画 · 笔画: 一𠃌丿丿","detailsText":"牙\n4 画 · 笔画: 一𠃌丿丿\n牙 stroke order\n牙齿 yáchǐ\n牙膏 yágāo\n牙刷 yáshuā\n象牙 xiàngyá\n每天要刷牙。Měitiān yào shuā yá.\n牙膏是薄荷味的。Yágāo shì bòhe wèi de.\n大象有长长的象牙。Dàxiàng yǒu chángcháng de xiàngyá.\nYá yá yá\n白白的牙，笑一笑。","images":["../../local/images/chinese-13-body/webp/page-07.webp"],"imageAlt":"yá","audio":{"src":"../../local/audio/chinese-13-body/page-8.mp3","lang":"zh-CN"}},{"title":"xīn","scene":"wind","textZh":"心\n4 画 · 笔画: 丶𠃌丶丶","detailsText":"心\n4 画 · 笔画: 丶𠃌丶丶\n心 stroke order\n开心 kāixīn\n心里 xīnli\n关心 guānxīn\n小心 xiǎoxīn\n我今天很开心。Wǒ jīntiān hěn kāixīn.\n老师很关心学生。Lǎoshī hěn guānxīn xuéshēng.\n过马路要小心。Guò mǎlù yào xiǎoxīn.\nXīn xīn xīn\n一颗心，咚咚跳。","images":["../../local/images/chinese-13-body/webp/page-08.webp"],"imageAlt":"xīn","audio":{"src":"../../local/audio/chinese-13-body/page-9.mp3","lang":"zh-CN"}},{"title":"练一练","scene":"listening","textZh":"✏️ 练一练\n把汉字和拼音连起来","detailsText":"✏️ 练一练\n把汉字和拼音连起来\n⟷\n✓ 检查答案\n🔄 重来\n🧠 小测验\n\"口\" 的拼音是什么？","audio":{"src":"../../local/audio/chinese-13-body/page-10.mp3","lang":"zh-CN"},"record":{"prompt":"这一课完成了吗？请勾选后保存学习记录。","label":"我完成了这一课"},"images":["../../local/generated-visuals/shared-chinese/page-1.webp"],"imageAlt":"练一练主题插图"}]};</script>
