    <script>window.COURSEWARE_CONFIG = {"id":"english-story-06-goldilocks-and-the-three-bears","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"english_story_06_Goldilocks_and_the_Three_Bears.html","steps":[{"title":"The Three Bears","scene":"meadow","detailsText":"Once upon a time, in a cheerful green forest, lived a family of three bears. There was a big Papa Bear, a medium-sized Mama Bear, and a tiny Baby Bear. They had a cozy little house with a roof made of moss and a door painted sunny yellow.","textEn":"Once upon a time, in a cheerful green forest, lived a family of three bears.\nThere was a big Papa Bear, a medium-sized Mama Bear, and a tiny Baby Bear.","images":["../../local/generated-visuals/english-story-06-goldilocks-and-the-three-bears/page-1.webp"],"imageAlt":"The Three Bears主题插图"},{"title":"A Walk in the Forest","scene":"picnic","detailsText":"One morning, Mama Bear made a delicious pot of warm porridge for breakfast. \"It's too hot to eat right now,\" she said. \"Let's go for a little walk while it cools down.\" So the three bears went out into the sunny forest, leaving their porridge on the table.","textEn":"One morning, Mama Bear made a delicious pot of warm porridge for breakfast.\n\"It's too hot to eat right now,\" she said.","images":["../../local/generated-visuals/english-story-06-goldilocks-and-the-three-bears/page-1.webp"],"imageAlt":"A Walk in the Forest主题插图"},{"title":"Goldilocks Arrives","scene":"wind","detailsText":"Now, not far from their house lived a little girl named Goldilocks. She had golden curls and a very curious mind. While wandering through the woods, she spotted the cute little house. \"What a lovely cottage!\" she thought. She looked around, saw no one, and peeked inside.","textEn":"Now, not far from their house lived a little girl named Goldilocks.\nShe had golden curls and a very curious mind.","images":["../../local/generated-visuals/english-story-06-goldilocks-and-the-three-bears/page-1.webp"],"imageAlt":"Goldilocks Arrives主题插图"},{"title":"The Three Bowls of Porridge","scene":"listening","detailsText":"👧 Goldilocks：She saw three bowls of porridge on the table. \"Mmm, something smells wonderful!\"\n👧 Goldilocks：She tried Papa Bear's big bowl. \"Yuck! This porridge is too hot!\"\n👧 Goldilocks：Then she tried Mama Bear's bowl. \"Bleh! This porridge is too cold.\"\n👧 Goldilocks：Finally, she tasted Baby Bear's porridge. \"Ah, this is just right!\" She ate it all up.","textEn":"👧 Goldilocks：She saw three bowls of porridge on the table.\n\"Mmm, something smells wonderful!\"\n👧 Goldilocks：She tried Papa Bear's big bowl.\n\"Yuck!","images":["../../local/generated-visuals/english-story-06-goldilocks-and-the-three-bears/page-1.webp"],"imageAlt":"The Three Bowls of Porridge主题插图"},{"title":"The Three Chairs","scene":"bubbles","detailsText":"👧 Goldilocks：She sat in the big chair. \"This chair is too hard!\"\n👧 Goldilocks：She sat in the medium chair. \"This chair is too soft.\"\n👧 Goldilocks：Then she sat in Baby Bear's tiny chair. \"This chair is just right!\" But as she sat, CRACK! The chair broke into pieces.","textEn":"👧 Goldilocks：She sat in the big chair.\n\"This chair is too hard!\"\n👧 Goldilocks：She sat in the medium chair.\n\"This chair is too soft.\"","images":["../../local/generated-visuals/english-story-06-goldilocks-and-the-three-bears/page-1.webp"],"imageAlt":"The Three Chairs主题插图"},{"title":"The Three Beds","scene":"star","detailsText":"A little sleepy now, Goldilocks went upstairs. She saw three beds. She lay down on the big bed. \"This bed is too long!\" She tried the medium bed. \"This bed is too wide!\" Then she snuggled into Baby Bear's little bed. \"This bed is just right.\" She fell fast asleep.","textEn":"A little sleepy now, Goldilocks went upstairs.\nShe saw three beds.\nShe lay down on the big bed.\n\"This bed is too long!\" She tried the medium bed.","images":["../../local/generated-visuals/english-story-06-goldilocks-and-the-three-bears/page-1.webp"],"imageAlt":"The Three Beds主题插图"},{"title":"The Bears Return","scene":"meadow","detailsText":"🐻 Papa Bear：\"Someone's been eating my porridge!\" boomed Papa Bear in his deep voice.\n🐻 Mama Bear：\"Someone's been eating my porridge too!\" said Mama Bear.\n🐻 Baby Bear：\"Someone's eaten ALL my porridge!\" cried Baby Bear in a tiny voice.","textEn":"🐻 Papa Bear：\"Someone's been eating my porridge!\" boomed Papa Bear in his deep voice.","images":["../../local/generated-visuals/english-story-06-goldilocks-and-the-three-bears/page-1.webp"],"imageAlt":"The Bears Return主题插图"},{"title":"Beds and Chairs","scene":"picnic","detailsText":"🐻 Papa Bear：\"Someone's been sitting in my chair!\" grumbled Papa Bear.\n🐻 Baby Bear：\"Someone's sat in my chair and BROKEN it!\" wailed Baby Bear.\n🐻 Papa Bear：\"Someone's been sleeping in my bed!\" said Papa Bear.\n🐻 Baby Bear：\"Someone's sleeping in MY bed right now!\" gasped Baby Bear.","textEn":"🐻 Papa Bear：\"Someone's been sitting in my chair!\" grumbled Papa Bear.\n🐻 Baby Bear：\"Someone's sat in my chair and BROKEN it!\" wailed Baby Bear.","images":["../../local/generated-visuals/english-story-06-goldilocks-and-the-three-bears/page-1.webp"],"imageAlt":"Beds and Chairs主题插图"},{"title":"Goldilocks Wakes Up","scene":"wind","detailsText":"Goldilocks woke up with a start. She saw three pairs of wide eyes staring at her. \"Yikes!\" she yelped, jumping out of the tiny bed. \"I'm so sorry! I didn't mean to cause trouble. I was just very curious.\"","textEn":"Goldilocks woke up with a start.\nShe saw three pairs of wide eyes staring at her.\n\"Yikes!\" she yelped, jumping out of the tiny bed.\n\"I'm so sorry!","images":["../../local/generated-visuals/english-story-06-goldilocks-and-the-three-bears/page-1.webp"],"imageAlt":"Goldilocks Wakes Up主题插图"},{"title":"Making It Right","scene":"listening","detailsText":"The bears saw she was scared and not mean. Papa Bear's voice was gentle. \"Curiosity is fine,\" he said, \"but we don't take things that aren't ours without asking.\" Goldilocks felt very sorry. \"I will help fix your chair,\" she promised, \"and I'll make you new porridge.\" And she did.\nThe moral of the story is: It's important to respect other people's homes and belongings. Always ask before taking something that isn't yours, and if you make a mistake, be brave enough to say you're sorry and help fix it.","textEn":"The bears saw she was scared and not mean.\nPapa Bear's voice was gentle.","images":["../../local/generated-visuals/english-story-06-goldilocks-and-the-three-bears/page-1.webp"],"imageAlt":"Making It Right主题插图"}]};</script>
