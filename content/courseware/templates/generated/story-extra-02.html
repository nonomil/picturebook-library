    <script>window.COURSEWARE_CONFIG = {"id":"story-extra-02","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"story_extra_02_会唱歌的石头.html","steps":[{"title":"会唱歌的石头","scene":"meadow","detailsText":"在溪水村外的小山坡上，住着一块名叫\"咚咚\"的石头。他长得圆滚滚的，身上有彩虹一样的花纹，看起来和普通的石头没什么两样。\n可咚咚有一个秘密——他会唱歌。每天清晨，当第一缕阳光亲吻山坡时，咚咚就会轻轻震动身体，唱出清脆的歌声。\n🎵 咚咚：叮咚叮咚，太阳公公早上好！\n🌳 大树爷爷：咚咚啊，你的歌声比小鸟还好听呢！","textZh":"在溪水村外的小山坡上，住着一块名叫\"咚咚\"的石头。他长得圆滚滚的，身上有彩虹一样的花纹，看起来和普通的石头没什么两样。\n可咚咚有一个秘密——他会唱歌。每天清晨，当第一缕阳光亲吻山坡时，咚咚就会轻轻震动身体，唱出清脆的歌声。\n🎵 咚咚：叮咚叮咚，太阳公公早上好！","images":["../../local/generated-visuals/story-extra-02/page-1.webp"],"imageAlt":"会唱歌的石头主题插图"},{"title":"咚咚的烦恼","scene":"picnic","detailsText":"可是咚咚并不开心。\n🎵 咚咚：可是……我只会唱这一首歌。小鸟能唱一百首不同的歌，百灵鸟会转音，连小蟋蟀都能用翅膀弹琴。而我，只是一块只会重复\"叮咚\"的石头。","textZh":"可是咚咚并不开心。\n🎵 咚咚：可是……我只会唱这一首歌。小鸟能唱一百首不同的歌，百灵鸟会转音，连小蟋蟀都能用翅膀弹琴。而我，只是一块只会重复\"叮咚\"的石头。","images":["../../local/generated-visuals/story-extra-02/page-1.webp"],"imageAlt":"咚咚的烦恼主题插图"},{"title":"小兔子来了","scene":"wind","detailsText":"春天来了，小兔子白白蹦蹦跳跳地来到山坡上采野花。她不小心摔了一跤，篮子飞了出去，刚采的蒲公英撒了一地。白白坐在地上，\"呜呜\"地哭起来。\n咚咚很想安慰她，可他只是一块石头呀，连手都没有。他急得身子微微发颤——\n🎵 咚咚：叮咚！\n🐰 白白：是谁在唱歌？\n🎵 咚咚：是我……我只是想让你别难过。","textZh":"春天来了，小兔子白白蹦蹦跳跳地来到山坡上采野花。她不小心摔了一跤，篮子飞了出去，刚采的蒲公英撒了一地。白白坐在地上，\"呜呜\"地哭起来。\n咚咚很想安慰她，可他只是一块石头呀，连手都没有。他急得身子微微发颤——\n🎵 咚咚：叮咚！\n🐰 白白：是谁在唱歌？\n🎵 咚咚：是我……我只是想让你别难过。","images":["../../local/generated-visuals/story-extra-02/page-1.webp"],"imageAlt":"小兔子来了主题插图"},{"title":"第一次被夸\"可爱\"","scene":"listening","detailsText":"白白顺着声音找到咚咚，好奇地戳了戳他身上的花纹。\n🐰 白白：哇，你真特别！没关系呀，我教你别的歌！\n白白清了清嗓子，唱起山羊奶奶教她的歌谣。咚咚认真地听，努力模仿。可他发出来的还是\"叮咚叮咚\"，只不过这次快了一些，像蹦跳的音符。\n🐰 白白：哈哈，你唱得真可爱！虽然词不一样，但听起来就像小河在说\"好呀好呀\"！","textZh":"白白顺着声音找到咚咚，好奇地戳了戳他身上的花纹。\n🐰 白白：哇，你真特别！没关系呀，我教你别的歌！\n白白清了清嗓子，唱起山羊奶奶教她的歌谣。咚咚认真地听，努力模仿。可他发出来的还是\"叮咚叮咚\"，只不过这次快了一些，像蹦跳的音符。","images":["../../local/generated-visuals/story-extra-02/page-1.webp"],"imageAlt":"第一次被夸\"可爱\"主题插图"},{"title":"雷雨中的奇迹","scene":"meadow","detailsText":"夏天到了，雷雨说来就来。小蚂蚁们的家在低洼的土坡上，雨水很快灌进了他们的小房子。\n🐜 黑黑：救命啊！\n咚咚看见了这一幕，鼓起勇气，用尽全身力气唱出不同的节奏。\n🎵 咚咚：咚！咚咚！咚——咚咚！\n声音沉闷而有力，像一面小鼓。山坡上松动的泥土，竟然随着他的歌声慢慢移动，在旁边形成一个小小的土坡，像一把撑开的伞。蚂蚁们赶紧躲到土坡下，雨水顺着坡度流走了。\n🐜 黑黑：谢谢你，会唱歌的石头！你救了我们整个家族！","textZh":"夏天到了，雷雨说来就来。小蚂蚁们的家在低洼的土坡上，雨水很快灌进了他们的小房子。\n🐜 黑黑：救命啊！\n咚咚看见了这一幕，鼓起勇气，用尽全身力气唱出不同的节奏。\n🎵 咚咚：咚！咚咚！咚——咚咚！","images":["../../local/generated-visuals/story-extra-02/page-1.webp"],"imageAlt":"雷雨中的奇迹主题插图"},{"title":"苹果山坡","scene":"picnic","detailsText":"秋天来了，一只小刺猬背着苹果路过，苹果顺着山坡往下滚。\n🦔 小刺猬：我的苹果！\n咚咚再次唱出有节奏的歌声。山坡上的落叶、小树枝，甚至小石子们，都随着他的歌声轻轻滚动，在苹果们经过的路上筑起小小的堤坝。苹果们被拦住了。\n🦔 小刺猬：太神奇了！你是怎么做到的？\n🎵 咚咚：我只是……唱我喜欢的节奏。","textZh":"秋天来了，一只小刺猬背着苹果路过，苹果顺着山坡往下滚。\n🦔 小刺猬：我的苹果！\n咚咚再次唱出有节奏的歌声。山坡上的落叶、小树枝，甚至小石子们，都随着他的歌声轻轻滚动，在苹果们经过的路上筑起小小的堤坝。苹果们被拦住了。\n🦔 小刺猬：太神奇了！你是怎么做到的？\n🎵 咚咚：我只是……唱我喜欢的节奏。","images":["../../local/generated-visuals/story-extra-02/page-1.webp"],"imageAlt":"苹果山坡主题插图"},{"title":"山坡的交响曲","scene":"wind","detailsText":"第二天清晨，咚咚唱起了他的\"叮咚\"歌。但这一次，歌声里有了森林的心跳，有了溪水的旋律，有了风穿过树叶的沙沙声。\n小兔子白白带着歌谣加入，小蚂蚁们用触角打拍子，小刺猬抱着苹果轻轻敲击。咚咚终于明白——\n他不需要成为百灵鸟，不需要唱别人的歌。他只需要用自己的方式，唱属于石头的歌，唱属于山坡的歌。而这歌声，因为有了对朋友的爱，就变成了世界上最独特的旋律。\n📖 寓意：每个人都有自己独特的才能和价值。用自己的方式去帮助他人，普通的\"歌声\"也能变成最美的旋律。","textZh":"第二天清晨，咚咚唱起了他的\"叮咚\"歌。但这一次，歌声里有了森林的心跳，有了溪水的旋律，有了风穿过树叶的沙沙声。\n小兔子白白带着歌谣加入，小蚂蚁们用触角打拍子，小刺猬抱着苹果轻轻敲击。咚咚终于明白——","images":["../../local/generated-visuals/story-extra-02/page-1.webp"],"imageAlt":"山坡的交响曲主题插图"}]};</script>
