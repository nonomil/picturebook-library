    <script>window.COURSEWARE_CONFIG = {"id":"story-extra-05","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"story_extra_05_时间的魔法.html","steps":[{"title":"嘀嗒嘀嗒的秘密","scene":"meadow","detailsText":"小女孩苗苗今年六岁，她最喜欢做的事情，就是盯着厨房墙上那个老式挂钟看。挂钟有一张圆圆的脸，两根细细的针像腿一样一刻不停地走着，发出\"嘀嗒嘀嗒\"的声音。\n今天，当苗苗又像往常一样趴在窗台上看挂钟时，奇怪的事情发生了。\n✨ 滴答：因为时间是要往前走的呀！\n👧 苗苗：你……你是谁？\n✨ 滴答：我是时间精灵，名叫滴答。你一直这么关心我们时间家族，所以我想让你看看时间的魔法。","textZh":"小女孩苗苗今年六岁，她最喜欢做的事情，就是盯着厨房墙上那个老式挂钟看。挂钟有一张圆圆的脸，两根细细的针像腿一样一刻不停地走着，发出\"嘀嗒嘀嗒\"的声音。\n今天，当苗苗又像往常一样趴在窗台上看挂钟时，奇怪的事情发生了。\n✨ 滴答：因为时间是要往前走的呀！\n👧 苗苗：你……你是谁？","images":["../../local/generated-visuals/story-extra-05/page-1.webp"],"imageAlt":"嘀嗒嘀嗒的秘密主题插图"},{"title":"三种颜色的时间","scene":"picnic","detailsText":"滴答挥了挥手，苗苗眼前出现了三团漂浮的光。\n✨ 滴答：这是金色的时间——当你和喜欢的人在一起时，时间就会变成金色。\n✨ 滴答：这是蓝色的时间——当你耐心等待、认真做事的时候，时间会变成蓝色。\n✨ 滴答：这是彩虹色的时间——当你希望时间快点或慢点时，它就会变成彩虹色。但魔法时间有自己的节奏。","textZh":"滴答挥了挥手，苗苗眼前出现了三团漂浮的光。\n✨ 滴答：这是金色的时间——当你和喜欢的人在一起时，时间就会变成金色。\n✨ 滴答：这是蓝色的时间——当你耐心等待、认真做事的时候，时间会变成蓝色。\n✨ 滴答：这是彩虹色的时间——当你希望时间快点或慢点时，它就会变成彩虹色。但魔法时间有自己的节奏。","images":["../../local/generated-visuals/story-extra-05/page-1.webp"],"imageAlt":"三种颜色的时间主题插图"},{"title":"老奶奶的回忆钟","scene":"wind","detailsText":"滴答带着苗苗飞到公园。一位白发老奶奶正孤独地坐着，手里摩挲着一块老怀表。奶奶的时间，现在是灰色的。\n✨ 滴答：用你的时间魔法。去陪陪奶奶，和她聊聊天，这就是最强大的时间魔法。\n👧 苗苗：奶奶，我能听您讲讲这块怀表的故事吗？\n老奶奶开始讲述孙女小时候的故事。渐渐地，老奶奶周围的灰色变成了温暖的金色。\n👵 老奶奶：谢谢你，小姑娘，我的时间又变得温暖了。","textZh":"滴答带着苗苗飞到公园。一位白发老奶奶正孤独地坐着，手里摩挲着一块老怀表。奶奶的时间，现在是灰色的。\n✨ 滴答：用你的时间魔法。去陪陪奶奶，和她聊聊天，这就是最强大的时间魔法。\n👧 苗苗：奶奶，我能听您讲讲这块怀表的故事吗？\n老奶奶开始讲述孙女小时候的故事。渐渐地，老奶奶周围的灰色变成了温暖的金色。","images":["../../local/generated-visuals/story-extra-05/page-1.webp"],"imageAlt":"老奶奶的回忆钟主题插图"},{"title":"小弟弟的等待","scene":"listening","detailsText":"他们来到幼儿园门口，一个三四岁的小男孩正焦急地跺着脚。妈妈还没来接他，他周围是闪烁不定的彩虹色。\n👧 苗苗：小弟弟，我们一起来玩\"时间探险\"游戏好不好？我们数从这里到那棵树有多少步……\n他们数了47步到大树，发现那片叶子有23条纹路，还找到3颗圆圆的小石子。当小男孩数完最后一样东西时，妈妈终于出现了。\n✨ 滴答：你教会了他如何让等待的时间变得有意义。","textZh":"他们来到幼儿园门口，一个三四岁的小男孩正焦急地跺着脚。妈妈还没来接他，他周围是闪烁不定的彩虹色。\n👧 苗苗：小弟弟，我们一起来玩\"时间探险\"游戏好不好？我们数从这里到那棵树有多少步……\n他们数了47步到大树，发现那片叶子有23条纹路，还找到3颗圆圆的小石子。当小男孩数完最后一样东西时，妈妈终于出现了。","images":["../../local/generated-visuals/story-extra-05/page-1.webp"],"imageAlt":"小弟弟的等待主题插图"},{"title":"爷爷的工作室","scene":"meadow","detailsText":"他们来到一个小木屋前。一位老爷爷正对着未完成的木雕发呆，觉得自己没时间完成送给孙辈们的礼物了。\n👧 苗苗：爷爷，您能教我怎么打磨这块木头吗？我想学。\n他们一起工作了整整一个下午，木雕在两人手中渐渐成形——那是一只展翅的小鸟。\n👴 老爷爷：奇怪，我感觉时间好像变多了。\n✨ 滴答：不是时间变多了，是你们共享的时间有了魔法。一个人需要一小时的事情，两个人分享，感觉像只有半小时。","textZh":"他们来到一个小木屋前。一位老爷爷正对着未完成的木雕发呆，觉得自己没时间完成送给孙辈们的礼物了。\n👧 苗苗：爷爷，您能教我怎么打磨这块木头吗？我想学。\n他们一起工作了整整一个下午，木雕在两人手中渐渐成形——那是一只展翅的小鸟。\n👴 老爷爷：奇怪，我感觉时间好像变多了。","images":["../../local/generated-visuals/story-extra-05/page-1.webp"],"imageAlt":"爷爷的工作室主题插图"},{"title":"时间的真谛","scene":"picnic","detailsText":"太阳快要落山了，滴答准备离开。\n✨ 滴答：记住三个魔法咒语：用\"金色魔法\"珍惜和爱的人在一起的时光；用\"蓝色魔法\"让等待变得有意义；用\"彩虹魔法\"接纳所有时间本来的样子。\n✨ 滴答：当你全心投入当下这一刻时，你就创造了属于自己的时间魔法。\n挂钟依旧\"嘀嗒嘀嗒\"地走着，但苗苗现在觉得，那声音不再单调了。那是时间在唱歌，唱着一首关于珍惜、耐心和分享的歌。\n📖 寓意：时间不是敌人，也不是主人，它是可以分享的礼物。每一刻，都是施展爱的魔法的好时机。","textZh":"太阳快要落山了，滴答准备离开。\n✨ 滴答：记住三个魔法咒语：用\"金色魔法\"珍惜和爱的人在一起的时光；用\"蓝色魔法\"让等待变得有意义；用\"彩虹魔法\"接纳所有时间本来的样子。\n✨ 滴答：当你全心投入当下这一刻时，你就创造了属于自己的时间魔法。","images":["../../local/generated-visuals/story-extra-05/page-1.webp"],"imageAlt":"时间的真谛主题插图"}]};</script>
