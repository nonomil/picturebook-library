    <script>window.COURSEWARE_CONFIG = {"id":"rainforest-adventure","template":"activity-studio","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"动手活动","requiredInteractions":["quiz:0"],"sourcePath":"childrens-library/courseware/science/rainforest-adventure.html","steps":[{"title":"雨林大冒险","scene":"bubbles","textZh":"🏠 首页\n下一个 ▶","detailsText":"🏠 首页\n下一个 ▶\n🌴 雨林大冒险\n👆 点击雨林里的动物植物，探索它们的秘密！\n🧠 雨林小测验\n大树\n树懒\n鹦鹉\n猴子\n花朵\n大嘴鸟\n🌳 大树\n🔊 朗读\n← 返回\n雨林里的大树可以长到 30层楼 那么高！\n一棵大树就像一座小城市，很多动物住在上面。\n树叶的秘密\n谁住在树上？\n🌿 树叶工厂\n树叶像小工厂！它们用阳光、水和空气制造食物，这叫光合作用。大树的叶子越多，食物就越多！\n✅ 知道了\n🏠 大树公寓\n树上住着好多动物：猴子在树枝间荡来荡去，鹦鹉在树洞里做窝，树懒挂在树枝上睡大觉！\n✅ 知道了\n🦥 树懒\n🔊 朗读\n← 返回\n树懒是雨林里最慢的动物！每天睡 15-20小时。\n毛上长绿藻帮助躲起来，大部分时间挂在树上。\n树懒吃什么？\n为什么这么慢？\n🍃 树懒的菜单\n只吃树叶和嫩芽。消化一顿饭要花一个月！所以不需要吃很多，也不用动很快。\n✅ 知道了\n🐢 慢是超能力\n树懒慢是节省能量。慢慢移动不会被老鹰和蛇发现！慢也是一种活下来的好办法。\n✅ 知道了\n🦜 鹦鹉\n🔊 朗读\n← 返回\n鹦鹉是雨林里最colorful的鸟！羽毛有红、蓝、黄、绿…\n弯弯嘴巴可以咬开硬果壳，非常聪明能学说话！\n为什么这么鲜艳？\n真的会说话吗？\n🎨 彩色羽毛的用处\n鲜艳羽毛帮鹦鹉在树叶中找到同伴、吸引异性。还能伪装成彩色花朵和果实！\n✅ 知道了\n🗣️ 会说话的鸟\n鹦鹉有特别的大脑能模仿声音！不是真的\"说话\"，而是模仿。有些能学会上百个单词！\n✅ 知道了\n🐒 猴子\n🔊 朗读\n← 返回\n猴子是雨林里最活泼的动物！整天在树上跳来跳去。\n群居动物，一群叫\"族群\"。互相梳毛、一起找食物。\n猴子吃什么？\n猴子有多聪明？\n🍌 猴子大厨\n爱吃水果、坚果、种子和小虫子。会用石头砸开硬果壳！有些还会把食物洗干净再吃。\n✅ 知道了\n🧠 聪明的小机灵\n会用树枝当工具钓白蚁，记住哪有好吃的果树，用叫声传递不同信息——像有自己的\"语言\"！\n✅ 知道了\n👄 大嘴鸟\n🔊 朗读\n← 返回\n大嘴鸟有雨林里最夸张的嘴巴！占身体三分之一长。\n嘴巴虽大但很轻——里面是空心的。摘水果吃也能吓跑敌人。\n嘴巴的秘密\n大嘴鸟吃什么？\n👄 轻飘飘的大嘴巴\n大嘴巴是空心的！里面有很多小气囊，非常轻。用来摘水果、打招呼、吓跑老鹰！\n✅ 知道了\n🍉 水果爱好者\n最爱吃水果！用大嘴巴夹住水果头一仰就吞下去。也吃小蜥蜴和鸟蛋补充营养。\n✅ 知道了\n🌺 花朵\n🔊 朗读\n← 返回\n雨林里有世界上最多、最漂亮的花！五颜六色千奇百怪。\n有些花比盘子还大！大王花直径可以长到1米！\n谁给花传粉？\n最大的花\n🐝 花的快递员\n花需要传粉。蜜蜂、蝴蝶、蜂鸟来帮忙！喝花蜜时沾上花粉，飞到下一朵花就传粉啦。\n✅ 知道了\n🌺 大王花\n世界上最大的花，1米宽、7公斤重！但闻起来像腐烂的肉——吸引苍蝇来传粉。\n✅ 知道了\n🧠 雨林小测验","question":"选一选，看看你发现了什么。","options":[{"label":"5层楼","correct":true,"hint":"再看一看图片和题目中的线索。"},{"label":"30层楼","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"100层楼","correct":false,"hint":"再看一看图片和题目中的线索。"}],"audio":{"src":"../../local/audio/rainforest-adventure/page-1.mp3","lang":"zh-CN"},"images":["../../local/generated-visuals/shared-science/page-1.webp"],"imageAlt":"雨林大冒险主题插图"}]};</script>
