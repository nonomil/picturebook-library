    <script>window.COURSEWARE_CONFIG = {"id":"nature-lesson-4","template":"activity-studio","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"动手活动","requiredInteractions":[],"sourcePath":"childrens-library/courseware/science/nature-lesson-4.html","steps":[{"title":"大自然","scene":"bubbles","textZh":"🏠 首页\n下一个 ▶","detailsText":"🏠 首页\n下一个 ▶\n📖 第4课\n🌿 大自然\n和Steve、Alex一起认识大自然\n⛏️ Minecraft方块世界\n☁️🌧️🌬️❄️⭐🌸🌿🐛🐦\n认识9个新字：云雨风雪星花草虫鸟\n开始学习 🚀\nSteve和Alex在村庄安顿下来。\n第二天一早出门干活——\n天空怎么在变？\n天空在变脸\n刚才还是蓝蓝的天，突然飘来一团团白色的东西。\n看，那是 云！\n云\nyún · 4画\n\"二\"字上面加个\"厶\"——天上的棉花糖\n云字教学\n白云\nbái yún\n云朵\nyún duǒ\n📖 白云在天上。\n云越来越黑。\n\"啪！\"一滴水掉在Steve头上。\n哗啦啦——大雨来了！\n下雨了\n这是 雨！快躲起来！\n雨\nyǔ · 8画\n像一扇窗，里面有雨滴\n雨字教学\n下雨\nxià yǔ\n雨水\nyǔ shuǐ\n📖 下雨了，天上有很多云。\n雨停了。呼呼——\n突然来了一阵大风，\n把Alex的帽子吹飞了！\n起风了\n好大的 风！追我的帽子！\n风\nfēng · 4画\n大风\ndà fēng\n📖 大风来了，云跑了。\n雪\nxuě · 11画\n雪花\nxuě huā\n📖 下雪了，大地是白的。\n风雪场景\n天冷了，\"阿嚏！\"\n天空飘下白白的小东西——雪！\n傍晚来临，风雪停了。\nSteve和Alex坐在山坡上，\n仰头看天。\n满天星星\n天上好多小灯！\n那是 星星！一颗、两颗、三颗……\n星\nxīng · 9画\n上面\"日\"是太阳，下面\"生\"是出生——太阳生的小光点\n星字教学\n星星\nxīng xīng\n星空\nxīng kōng\n📖 天上有很多星星。\n太阳出来了！\n昨天的雨水让大地长出很多新生命。\n花和草\n看！开了好多 花！\n旁边一大片是 草。\n花\nhuā · 7画\n花朵\nhuā duǒ\n📖 草地上开了三朵花。\n草\ncǎo · 9画\n小草\nxiǎo cǎo\n📖 小草是绿色的。\n花草教学\n草丛里有动静！\n\"叽叽叽——\"\n一只小虫爬出来。\n虫和鸟\n虫在地上爬，\n鸟在天上飞！\n虫\nchóng · 6画\n小虫\nxiǎo chóng\n📖 小虫在草里走。\n鸟\nniǎo · 5画\n小鸟\nxiǎo niǎo\n📖 小鸟在天上飞。\n虫鸟教学\n🌟 大自然的宝藏 🌟\n故事总结\n云带来雨，雨后有大风。\n冬天有雪，夜晚有星。\n春天花开，满山是草。\n虫儿爬，鸟儿飞。\n🎯 字卡复习\n字卡汇总\n云\nyún 🔊\n雨\nyǔ 🔊\n风\nfēng 🔊\n雪\nxuě 🔊\n星\nxīng 🔊\n花\nhuā 🔊\n草\ncǎo 🔊\n虫\nchóng 🔊\n鸟\nniǎo 🔊\n👆 点击卡片听发音\n🎯 小测验\n📜 古诗角 · 《风》\n唐·李峤\n解落三秋叶\n风吹落秋天的叶子 🍂\n能开二月花\n风吹开春天的花 🌸\n过江千尺浪\n风过江面掀起波浪 🌊\n入竹万竿斜\n风吹进竹林，竹竿弯腰 🎋\n风看不见，但诗里处处都有风～\n◀ 上一页\n🔊\n下一页 ▶","images":["../../local/images/nature-lesson-4/webp/page-01.webp","../../local/images/nature-lesson-4/webp/page-02.webp","../../local/images/nature-lesson-4/webp/page-03.webp","../../local/images/nature-lesson-4/webp/page-04.webp","../../local/images/nature-lesson-4/webp/page-05.webp","../../local/images/nature-lesson-4/webp/page-06.webp","../../local/images/nature-lesson-4/webp/page-07.webp","../../local/images/nature-lesson-4/webp/page-08.webp","../../local/images/nature-lesson-4/webp/page-09.webp","../../local/images/nature-lesson-4/webp/page-10.webp","../../local/images/nature-lesson-4/webp/page-11.webp","../../local/images/nature-lesson-4/webp/page-12.webp","../../local/images/nature-lesson-4/webp/page-13.webp","../../local/images/nature-lesson-4/webp/page-14.webp"],"imageAlt":"大自然","audio":{"src":"../../local/audio/nature-lesson-4/page-1.mp3","lang":"zh-CN"}}]};</script>
