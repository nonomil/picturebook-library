    <script>window.COURSEWARE_CONFIG = {"id":"english-story-07-the-ant-and-the-grasshopper","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"english_story_07_The_Ant_and_the_Grasshopper.html","steps":[{"title":"Sunny Meadow","scene":"meadow","detailsText":"In Sunny Meadow, where the grass was soft and the sun was warm, lived two little friends. Andy Ant was very busy. He worked all day, carrying crumbs of cookie and seeds of dandelion back to his little hill.\n\"Hurry, hurry!\" he would say to himself. \"Winter is coming. I must be ready!\"","textEn":"In Sunny Meadow, where the grass was soft and the sun was warm, lived two little friends.\nAndy Ant was very busy.","images":["../../local/generated-visuals/english-story-07-the-ant-and-the-grasshopper/page-1.webp"],"imageAlt":"Sunny Meadow主题插图"},{"title":"Gracie's Song","scene":"picnic","detailsText":"Gracie Grasshopper loved to dance. She would leap from blade to blade of grass, singing, \"Tra-la-la! What a beautiful day!\"\n\"Hello, Andy!\" Gracie sang one sunny afternoon. \"Stop working and dance with me! The sun is shining!\"","textEn":"Gracie Grasshopper loved to dance.\nShe would leap from blade to blade of grass, singing, \"Tra-la-la!\nWhat a beautiful day!\"","images":["../../local/generated-visuals/english-story-07-the-ant-and-the-grasshopper/page-1.webp"],"imageAlt":"Gracie's Song主题插图"},{"title":"Andy's Warning","scene":"wind","detailsText":"🐜 Andy Ant：Andy wiped his forehead with his tiny leg. \"I can't, Gracie. I need to gather food for the cold winter.\"\n🦗 Gracie Grasshopper：Gracie laughed. \"Winter is far away! There is plenty of time. Play with me today!\"\n🐜 Andy Ant：Andy shook his head. \"No, thank you. Work first, then play.\"","textEn":"🐜 Andy Ant：Andy wiped his forehead with his tiny leg.\n\"I can't, Gracie.\nI need to gather food for the cold winter.\"","images":["../../local/generated-visuals/english-story-07-the-ant-and-the-grasshopper/page-1.webp"],"imageAlt":"Andy's Warning主题插图"},{"title":"The Seasons Change","scene":"listening","detailsText":"Every day was the same. Andy worked and worked. He gathered grains of wheat and sweet apple seeds. His storage room under the hill got fuller and fuller.\nGracie played and played. She made flower-chain necklaces and sang with the crickets. She didn't think about winter at all.","textEn":"Every day was the same.\nAndy worked and worked.\nHe gathered grains of wheat and sweet apple seeds.\nHis storage room under the hill got fuller and fuller.","images":["../../local/generated-visuals/english-story-07-the-ant-and-the-grasshopper/page-1.webp"],"imageAlt":"The Seasons Change主题插图"},{"title":"Winter Arrives","scene":"bubbles","detailsText":"The leaves turned red and yellow. The air grew cool. Gracie still danced. \"Winter is still far away!\" she said.\nThen one morning, frost glittered on the grass. The trees were almost bare. Gracie looked for something to eat. But all the seeds and berries were gone. Her tummy rumbled. \"Oh dear,\" she said. \"I am very hungry.\"","textEn":"The leaves turned red and yellow.\nThe air grew cool.\nGracie still danced.\n\"Winter is still far away!\" she said.","images":["../../local/generated-visuals/english-story-07-the-ant-and-the-grasshopper/page-1.webp"],"imageAlt":"Winter Arrives主题插图"},{"title":"Gracie's Request","scene":"star","detailsText":"🦗 Gracie Grasshopper：She saw Andy's little hill. A warm, yummy smell came from inside. Gracie knocked on Andy's door with a shaky leaf. Knock, knock.\n🦗 Gracie Grasshopper：\"Andy,\" Gracie whispered. \"I have no food. Winter came too fast. Could you... could you please share some?\"\n🐜 Andy Ant：Andy looked at Gracie's thin legs and sad eyes. He felt a little sorry for her. \"Come in, Gracie,\" he said kindly.","textEn":"🦗 Gracie Grasshopper：She saw Andy's little hill.\nA warm, yummy smell came from inside.\nGracie knocked on Andy's door with a shaky leaf.\nKnock, knock.","images":["../../local/generated-visuals/english-story-07-the-ant-and-the-grasshopper/page-1.webp"],"imageAlt":"Gracie's Request主题插图"},{"title":"Andy's Kindness","scene":"meadow","detailsText":"Inside, Andy's home was warm. His storage room was full of yummy food. He made Gracie a tiny soup from seeds and a piece of dried apple.\n\"Thank you, Andy,\" Gracie said quietly. \"You were so wise to get ready.\"","textEn":"Inside, Andy's home was warm.\nHis storage room was full of yummy food.\nHe made Gracie a tiny soup from seeds and a piece of dried apple.","images":["../../local/generated-visuals/english-story-07-the-ant-and-the-grasshopper/page-1.webp"],"imageAlt":"Andy's Kindness主题插图"},{"title":"A New Agreement","scene":"picnic","detailsText":"🐜 Andy Ant：Andy smiled. \"I worked hard because I knew winter would come. Next year, maybe we can prepare together? We could gather food in the morning, and then dance in the afternoon.\"\n🦗 Gracie Grasshopper：Gracie's eyes lit up. \"Yes! That would be perfect. I learned my lesson.\"","textEn":"🐜 Andy Ant：Andy smiled.\n\"I worked hard because I knew winter would come.\nNext year, maybe we can prepare together?","images":["../../local/generated-visuals/english-story-07-the-ant-and-the-grasshopper/page-1.webp"],"imageAlt":"A New Agreement主题插图"},{"title":"Together in Harmony","scene":"wind","detailsText":"That winter, Gracie helped Andy by telling him funny stories while he worked. When spring came, they worked together every morning. And every afternoon? They danced together in the warm sun, and Gracie's songs were the happiest in all of Sunny Meadow.\nThe Moral: It is wise to prepare for tomorrow while enjoying today. Work and play can go together, but a little planning keeps us safe and happy.","textEn":"That winter, Gracie helped Andy by telling him funny stories while he worked.\nWhen spring came, they worked together every morning.\nAnd every afternoon?","images":["../../local/generated-visuals/english-story-07-the-ant-and-the-grasshopper/page-1.webp"],"imageAlt":"Together in Harmony主题插图"}]};</script>
