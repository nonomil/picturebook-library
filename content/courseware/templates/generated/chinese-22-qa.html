    <script>window.COURSEWARE_CONFIG = {"id":"chinese-22-qa","template":"interactive-classroom","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"互动学习","requiredInteractions":["practice:9:match","practice:9:0","practice:9:1","practice:9:2","practice:9:3","practice:9:4","practice:9:5","practice:9:6","quiz:10","record:13"],"sourcePath":"childrens-library/courseware/chinese/chinese-22-qa.html","steps":[{"title":"我会问答 · Question Words","textZh":"认识7个常用问词，学会把问题问清楚。","textEn":"Learn seven question words and ask clear questions.","audio":{"src":"../../local/audio/chinese-22-qa/page-1.mp3","lang":"zh-CN"},"images":["../../local/generated-visuals/shared-chinese/page-1.webp"],"imageAlt":"我会问答 · Question Words主题插图"},{"title":"问答广场","textZh":"谁在问“谁是这里最快乐的人”？什么娃娃问“什么东西最好吃”？哪里、为什么、怎么、几、多少，都会帮助我们找到答案。","images":["../../local/images/chinese-22/webp/page-01.webp"],"imageAlt":"问答广场","audio":{"src":"../../local/audio/chinese-22-qa/page-2.mp3","lang":"zh-CN"}},{"title":"第1个问词 · 谁","textZh":"谁（shuí）表示“who”。\n问题：你是谁？\n回答：我是小明。","textEn":"谁 means “who”.","detailsText":"先读问词，再读问题和回答，注意问题和答案要互相对应。","vocab":[{"text":"谁","en":"who"},{"text":"你是谁？","en":""}],"audio":{"src":"../../local/audio/chinese-22-qa/page-3.mp3","lang":"zh-CN"},"images":["../../local/generated-visuals/shared-chinese/page-1.webp"],"imageAlt":"第1个问词 · 谁主题插图"},{"title":"第2个问词 · 什","textZh":"什（shén）表示“what”。\n问题：这是什么？\n回答：这是一本书。","textEn":"什 means “what”.","detailsText":"先读问词，再读问题和回答，注意问题和答案要互相对应。","vocab":[{"text":"什","en":"what"},{"text":"这是什么？","en":""}],"audio":{"src":"../../local/audio/chinese-22-qa/page-4.mp3","lang":"zh-CN"},"images":["../../local/generated-visuals/shared-chinese/page-1.webp"],"imageAlt":"第2个问词 · 什主题插图"},{"title":"第3个问词 · 哪","textZh":"哪（nǎ）表示“where”。\n问题：你在哪里？\n回答：我在学校。","textEn":"哪 means “where”.","detailsText":"先读问词，再读问题和回答，注意问题和答案要互相对应。","vocab":[{"text":"哪","en":"where"},{"text":"你在哪里？","en":""}],"audio":{"src":"../../local/audio/chinese-22-qa/page-5.mp3","lang":"zh-CN"}
