    <script>window.COURSEWARE_CONFIG = {"id":"chinese-02-strokes","template":"interactive-classroom","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"互动学习","requiredInteractions":["quiz:10"],"sourcePath":"childrens-library/courseware/chinese/chinese-02-strokes.html","steps":[{"title":"学习目标","scene":"meadow","textZh":"📋 学习目标\n认识横（一）、竖（丨）、撇（丿）、捺（㇏）、点（丶）、提（㇀）","detailsText":"📋 学习目标\n认识横（一）、竖（丨）、撇（丿）、捺（㇏）、点（丶）、提（㇀）\n笔画组成简单字：一、十、人、大\n新学汉字：一 十 人 大 天 太 个 八 入（9个字）\n一丨丿㇏丶㇀\n6种基本笔画 → 搭出千千万万个汉字\n🧱\n笔画就是汉字的积木 — 就像 Minecraft 的方块一样，不同的笔画组合出不同的汉字！","images":["../../local/images/chinese-02-strokes/webp/page-02.webp"],"imageAlt":"学习目标","audio":{"src":"../../local/audio/chinese-02-strokes/page-1.mp3","lang":"zh-CN"}},{"title":"一横成桥","scene":"picnic","textZh":"🎬 一横成桥\nSteve 和 Alex 走到一条河边，水太深过不去。","detailsText":"🎬 一横成桥\nSteve 和 Alex 走到一条河边，水太深过不去。\n\"糟了，桥坏了！我们怎么过去？\"\nAlex 看着河对岸的木头，又看看岸边的一块石碑——上面刻着一条横线：\n把石头连在一起……就是……一座桥！\n🌉\n一（横）＝ 一座桥\nSteve 恍然大悟：\"就这么简单？一横就是桥？\"\n对！横是最简单的笔画，从左到右写。就像搭桥一样！\n一\n横（一）\n从左到右 ──→ 像一座桥\n➡️ 从左到右","images":["../../local/images/chinese-02-strokes/webp/page-03.webp"],"imageAlt":"一横成桥","audio":{"src":"../../local/audio/chinese-02-strokes/page-2.mp3","lang":"zh-CN"}},{"title":"横的写法","scene":"wind","textZh":"✏️ 横的写法\n写横的时候，从左到右，平平的，像一条路。","detailsText":"✏️ 横的写法\n写横的时候，从左到右，平平的，像一条路。\n一\n横\n从左到右 · 拉平 · 不要太长\n━━━━━━━━━━ ➡️\n🔍 找一找：下面哪些是\"横\"？\n一块桥板 🪵 → 是横 ✅\n一根柱子 🏛️ → 不是 ❌\n一排栏杆 → 是横 ✅\n📝\n跟我写：从左到右，拉平，不要太长。\n一个\"一\"字 = 一条横线 = 一座桥","images":["../../local/images/chinese-02-strokes/webp/page-04.webp"],"imageAlt":"横的写法","audio":{"src":"../../local/audio/chinese-02-strokes/page-3.mp3","lang":"zh-CN"}},{"title":"竖——柱子","scene":"listening","textZh":"🤔 竖——柱子\n过了桥，他们来到一个倒塌的房子前，几根柱子还立着。","detailsText":"🤔 竖——柱子\n过了桥，他们来到一个倒塌的房子前，几根柱子还立着。\n\"这些柱子真高！\"\n石碑上新刻的字——一条竖线：\n🏛️\n丨（竖）＝ 一根柱子\n竖是从上到下的笔画，像柱子一样直直的！\n丨\n竖（丨）\n从上到下 ↓\n⬇️ 从上到下\n✨\n十 = 横 + 竖 = 桥 + 柱子","images":["../../local/images/chinese-02-strokes/webp/page-05.webp"],"imageAlt":"竖——柱子","audio":{"src":"../../local/audio/chinese-02-strokes/page-4.mp3","lang":"zh-CN"}},{"title":"撇和捺——走路的人","scene":"bubbles","textZh":"🤔 撇和捺——走路的人\n他们继续前进，看到一个村民正在快步走路。","detailsText":"🤔 撇和捺——走路的人\n他们继续前进，看到一个村民正在快步走路。\n\"看他的腿——左腿往前伸，右腿往后蹬！\"\n石碑上新出现了两条斜线：\n🦵\n丿（撇）＝ 往左伸的腿\n🦶\n㇏（捺）＝ 往右蹬的腿\n撇往左下方走，捺往右下方走。合在一起，就像一个人往前迈步！\n🚶\n人 ＝ 丿 + ㇏ = 一个人往前走\n丿\n撇\n↙️ 往左下方\n㇏\n捺\n↘️ 往右下方","images":["../../local/images/chinese-02-strokes/webp/page-06.webp"],"imageAlt":"撇和捺——走路的人","audio":{"src":"../../local/audio/chinese-02-strokes/page-5.mp3","lang":"zh-CN"}},{"title":"大——张开手臂的人","scene":"star","textZh":"🤔 大——张开手臂的人\n一个村民张开双臂欢迎他们：","detailsText":"🤔 大——张开手臂的人\n一个村民张开双臂欢迎他们：\n大！\n🙋\n人 + 一横(手臂) = 大\n\"一个人张开双臂，就是'大'。好大的拥抱！\"\n人\n人\n1\n2\n大\n大\n1\n2\n3\n🌟\n天 = 一 + 大：\"一\"在上，\"大\"在下\n太 = 大 + 丶：大字加一点，就是\"太大\"的\"太\"","images":["../../local/images/chinese-02-strokes/webp/page-07.webp"],"imageAlt":"大——张开手臂的人","audio":{"src":"../../local/audio/chinese-02-strokes/page-6.mp3","lang":"zh-CN"}},{"title":"八和入","scene":"meadow","textZh":"🤔 八和入\n路标上还有两个相似的符号：","detailsText":"🤔 八和入\n路标上还有两个相似的符号：\n八\n八\n1\n2\n丿+㇏ 两笔分开\n入\n入\n1\n2\n丿+㇏ 上面连起来\n🧠\n记忆技巧：\n八 → 两个人分开走 ← 八是分开的\n入 → 走进一个入口 ← 上面要合拢","images":["../../local/images/chinese-02-strokes/webp/page-08.webp"],"imageAlt":"八和入","audio":{"src":"../../local/audio/chinese-02-strokes/page-7.mp3","lang":"zh-CN"}},{"title":"个——做个记号","scene":"picnic","textZh":"✏️ 个——做个记号\nSteve 想学会写\"个\"字，这样他可以在木头上做记号。","detailsText":"✏️ 个——做个记号\nSteve 想学会写\"个\"字，这样他可以在木头上做记号。\n\"个\"字怎么写？第一笔是撇……\n📌\n个 ＝ 丿 + 丨 + 丶 = 撇 + 竖 + 点\n个\n个\n1\n2\n3\n笔画顺序\n丿 → 丨 → 丶\n撇、竖、点","images":["../../local/images/chinese-02-strokes/webp/page-09.webp"],"imageAlt":"个——做个记号","audio":{"src":"../../local/audio/chinese-02-strokes/page-8.mp3","lang":"zh-CN"}},{"title":"小词典","scene":"wind","textZh":"📖 小词典\n汉字笔画数组成意思","detailsText":"📖 小词典\n汉字笔画数组成意思\n一1画横一条桥、数字1\n十2画横+竖十字路口\n人2画撇+捺一个人\n大3画人+横张手的人\n天4画一+大天空\n太4画大+丶太大\n个3画撇+竖+点一个\n八2画撇+捺分开八块\n入2画撇+捺合拢进入\n一\n十\n人\n大\n天\n太\n个\n八\n入","images":["../../local/images/chinese-02-strokes/webp/page-10.webp"],"imageAlt":"小词典","audio":{"src":"../../local/audio/chinese-02-strokes/page-9.mp3","lang":"zh-CN"}},{"title":"笔画配图","scene":"listening","textZh":"✏️ 笔画找一找\n在下面的字里，找出你认识的笔画！","detailsText":"✏️ 笔画找一找\n在下面的字里，找出你认识的笔画！\n个 → 找到 丿（撇）了吗？ → 第一个笔画就是撇 ✅\n大 → 找到 一（横）了吗？ → 中间的横 ✅\n八 → 找到 ㇏（捺）了吗？ → 第二个笔画 ✅\n十 → 哪两笔？ → 一横一竖 ✅\n🔗 连连看：把笔画和比喻连起来\n👇 点击右边的正确答案\n一（横）\n→\n一根柱子\n一座桥 ✅\n丨（竖）\n→\n一座桥\n一根柱子 ✅\n丿（撇）\n→\n往右蹬的腿\n往左伸的腿 ✅\n㇏（捺）\n→\n往左伸的腿\n往右蹬的腿 ✅","images":["../../local/images/chinese-02-strokes/webp/page-11.webp","../../local/images/chinese-02-strokes/webp/page-10.webp"],"imageAlt":"笔画配图","audio":{"src":"../../local/audio/chinese-02-strokes/page-10.mp3","lang":"zh-CN"}},{"title":"Steve 需要汉字砖块来修墙！","scene":"bubbles","textZh":"笔画配图\n🎯 挑战——修房子","detailsText":"笔画配图\n🎯 挑战——修房子\n🧱 Steve 需要汉字砖块来修墙！\n前面有一栋倒塌了一堵墙的房子！选择正确的笔画填入。\n1️⃣ 缺一笔 → 什么填入就成为\"十\"？\nA. 一 ✅\nB. 丨\nC. 丿\n2️⃣ 缺一笔 → 什么填入就成为\"人\"？\nA. 一\nB. 丨\nC. ㇏ ✅\n3️⃣ 缺两笔 → 什么填入就成为\"大\"？\nA. 一+丶\nB. 一+丿\nC. 一+㇏ ✅\n4️⃣ 缺一笔 → 什么填入就成为\"太\"？\nA. 一\nB. 丨\nC. 丶 ✅","images":["../../local/images/chinese-02-strokes/webp/page-12.webp","../../local/images/chinese-02-strokes/webp/page-11.webp"],"imageAlt":"Steve 需要汉字砖块来修墙！","question":"🧱 Steve 需要汉字砖块来修墙！","options":[{"label":"A. 一 ✅","correct":true,"hint":"再看一看图片和题目中的线索。"},{"label":"B. 丨","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"C. 丿","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"A. 一","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"C. ㇏ ✅","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"A. 一+丶","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"B. 一+丿","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"C. 一+㇏ ✅","correct":false,"hint":"再看一看图片和题目中的线索。"},{"label":"C. 丶 ✅","correct":false,"hint":"再看一看图片和题目中的线索。"}],"audio":{"src":"../../local/audio/chinese-02-strokes/page-11.mp3","lang":"zh-CN"}},{"title":"笔画配图","scene":"star","textZh":"📜 古诗角\n《一去二三里》","detailsText":"📜 古诗角\n《一去二三里》\n宋 · 邵雍\n一去二三里\n烟村四五家\n亭台六七座\n八九十枝花\n✨ 数一数：这首诗里藏了几个今天学的字？\n一 · 八 · 入（\"去\"里藏着）","images":["../../local/images/chinese-02-strokes/webp/page-13.webp","../../local/images/chinese-02-strokes/webp/page-12.webp"],"imageAlt":"笔画配图","audio":{"src":"../../local/audio/chinese-02-strokes/page-12.mp3","lang":"zh-CN"}},{"title":"获得「笔画大师」徽章！","scene":"meadow","textZh":"🏆\n🎉 笔画大师！","detailsText":"🏆\n🎉 笔画大师！\n\"我学会了6种基本笔画和9个汉字！\"\n\"不只是学会了字，你学会了汉字的积木。每个字都是由笔画搭成的，就像 Minecraft 的方块一样！\"\n🏅\n本课新学的字\n一\n十\n人\n大\n天\n太\n个\n八\n入\n🎊 撒花庆祝！","images":["../../local/images/chinese-02-strokes/webp/page-14.webp"],"imageAlt":"获得「笔画大师」徽章！","audio":{"src":"../../local/audio/chinese-02-strokes/page-13.mp3","lang":"zh-CN"}}]};</script>
