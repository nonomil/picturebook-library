    <script>window.COURSEWARE_CONFIG = {"id":"english-story-09-the-tortoise-and-the-hare","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"english_story_09_The_Tortoise_and_the_Hare.html","steps":[{"title":"The Speedy Hare","scene":"meadow","detailsText":"Once upon a time, in a sunny green meadow, lived a very fast hare named Harry. He had long, twitchy ears and could run like the wind. \"I'm the fastest creature in the whole forest!\" Harry would boast, zipping past the trees.","textEn":"Once upon a time, in a sunny green meadow, lived a very fast hare named Harry.\nHe had long, twitchy ears and could run like the wind.","images":["../../local/generated-visuals/english-story-09-the-tortoise-and-the-hare/page-1.webp"],"imageAlt":"The Speedy Hare主题插图"},{"title":"The Slow Tortoise","scene":"picnic","detailsText":"At the edge of the meadow lived a tortoise named Tara. She had a big, strong shell and moved very, very slowly. Thump... thump... thump went her feet on the ground.","textEn":"At the edge of the meadow lived a tortoise named Tara.\nShe had a big, strong shell and moved very, very slowly.\nThump...\nthump...","images":["../../local/generated-visuals/english-story-09-the-tortoise-and-the-hare/page-1.webp"],"imageAlt":"The Slow Tortoise主题插图"},{"title":"The Challenge","scene":"wind","detailsText":"🐇 Harry：One morning, Harry saw Tara slowly munching on a juicy leaf. \"Hello, slowpoke!\" he laughed. \"You are the slowest thing I have ever seen!\"\n🐢 Tara：Tara finished her leaf calmly. \"Fast or slow, we all have our own way of moving, Harry.\"\n🐇 Harry：Harry twitched his nose. \"I bet I could run to the Big Oak Tree and back before you even cross the flower patch! Want to have a race?\"","textEn":"🐇 Harry：One morning, Harry saw Tara slowly munching on a juicy leaf.\n\"Hello, slowpoke!\" he laughed.\n\"You are the slowest thing I have ever seen!\"","images":["../../local/generated-visuals/english-story-09-the-tortoise-and-the-hare/page-1.webp"],"imageAlt":"The Challenge主题插图"},{"title":"The Race Begins","scene":"listening","detailsText":"A small crowd gathered to watch. The squirrel, the birds, and even the busy ants stopped to cheer. \"Ready... set... GO!\" shouted the old owl.\nWHOOSH! Harry disappeared in a flash of brown fur. Tara took a deep breath and started her steady thump... thump... thump.","textEn":"A small crowd gathered to watch.\nThe squirrel, the birds, and even the busy ants stopped to cheer.\n\"Ready...\nset...\nGO!\" shouted the old owl.","images":["../../local/generated-visuals/english-story-09-the-tortoise-and-the-hare/page-1.webp"],"imageAlt":"The Race Begins主题插图"},{"title":"Harry's Mistake","scene":"bubbles","detailsText":"Harry was so far ahead, he could see the Big Oak Tree already. \"Ha! This is too easy!\" he said. He looked back. Tara was just a tiny speck. \"I have plenty of time for a nap.\"\nSo, under the warm sun, Harry curled up under a bush and fell fast asleep.","textEn":"Harry was so far ahead, he could see the Big Oak Tree already.\n\"Ha!\nThis is too easy!\" he said.\nHe looked back.\nTara was just a tiny speck.","images":["../../local/generated-visuals/english-story-09-the-tortoise-and-the-hare/page-1.webp"],"imageAlt":"Harry's Mistake主题插图"},{"title":"Tara Keeps Going","scene":"star","detailsText":"Meanwhile, Tara kept going. Her legs were tired, and her shell felt heavy, but she didn't stop. Thump... thump... thump. She passed the sleeping Harry without making a sound.","textEn":"Meanwhile, Tara kept going.\nHer legs were tired, and her shell felt heavy, but she didn't stop.\nThump...\nthump...\nthump.","images":["../../local/generated-visuals/english-story-09-the-tortoise-and-the-hare/page-1.webp"],"imageAlt":"Tara Keeps Going主题插图"},{"title":"The Finish Line","scene":"meadow","detailsText":"The sun began to set, painting the sky orange and pink. The little ant shouted, \"Go, Tara, go!\"\nHarry suddenly woke up. \"Oh no!\" he cried. He ran faster than ever, his legs a blur.\nBut when he arrived at the finish line under the Big Oak Tree, who was there? Tara, smiling and holding a little victory flower.","textEn":"The sun began to set, painting the sky orange and pink.\nThe little ant shouted, \"Go, Tara, go!\"\nHarry suddenly woke up.\n\"Oh no!\" he cried.","images":["../../local/generated-visuals/english-story-09-the-tortoise-and-the-hare/page-1.webp"],"imageAlt":"The Finish Line主题插图"},{"title":"Harry's Apology","scene":"picnic","detailsText":"🐇 Harry：The whole meadow cheered for the tortoise! Harry's ears drooped with shame. \"I'm sorry, Tara,\" he said quietly. \"I was too proud. I thought being fast was everything.\"\n🐢 Tara：Tara nodded kindly. \"It's not about how fast you go, Harry. It's about never giving up and keeping on going, step by step.\"","textEn":"🐇 Harry：The whole meadow cheered for the tortoise!\nHarry's ears drooped with shame.\n\"I'm sorry, Tara,\" he said quietly.\n\"I was too proud.","images":["../../local/generated-visuals/english-story-09-the-tortoise-and-the-hare/page-1.webp"],"imageAlt":"Harry's Apology主题插图"},{"title":"The End","scene":"wind","detailsText":"The Moral: Slow and steady wins the race. It's not about being the fastest, but about being determined and finishing what you start.","textEn":"The Moral: Slow and steady wins the race.\nIt's not about being the fastest, but about being determined and finishing what you start.","images":["../../local/generated-visuals/english-story-09-the-tortoise-and-the-hare/page-1.webp"],"imageAlt":"The End主题插图"}]};</script>
