h two words:\n👋 Hello = 你好\n👋 Goodbye = 再见\n👨 Bob\n\"Use Hello when you meet someone.\nUse Goodbye when you leave.\"\n🧑 Steve\n\"Hello! ... Goodbye! ... I got it!\" 💡\nHello 👋 你好 |\nGoodbye 👋 再见","textEn":"👋 Hello & Goodbye\nBob shows Steve a wooden sign with two words:\n👋 Hello = 你好\n👋 Goodbye = 再见\n👨 Bob","images":["../../local/images/english-01-hello/webp/page-03.webp"],"imageAlt":"Hello and Goodbye","audio":{"src":"../../local/audio/english-01-hello/page-4.mp3","lang":"zh-CN"}},{"title":"My Friend","scene":"bubbles","detailsText":"👋 My Friend\nAlex arrives and joins them.\n👩 Alex\n\"Hello, Steve! I see you've made a new friend!\" 🤝\n🧑 Steve\n\"Yes! Bob is my new friend.\"\n👨 Bob\n\"Good friends say Hello and Goodbye to each other!\"\nAlex teaches a new phrase:\n\"How are you?\" — 你好吗？\n\"I'm fine, thank you!\" — 我很好，谢谢！","textEn":"👋 My Friend\nAlex arrives and joins them.\n👩 Alex\n\"Hello, Steve!\nI see you've made a new friend!\" 🤝","images":["../../local/images/english-01-hello/webp/page-04.webp"],"imageAlt":"My Friend","audio":{"src":"../../local/audio/english-01-hello/page-5.mp3","lang":"zh-CN"}},{"title":"Mini Dictionary","scene":"star","detailsText":"📖 Mini Dictionary\nEnglish中文\nHello! 👋你好\nGoodbye! 👋再见\nName 📛名字\nFriend 🤝朋友\nHow are you? 🤗你好吗？\nI'm fine. 😊我很好\nThank you! 🙏谢谢\n👆 Click any word to hear pronunciation","textEn":"📖 Mini Dictionary\nEnglish中文\nHello!\n👋你好\nGoodbye!","images":["../../local/images/english-01-hello/webp/page-05.webp"],"imageAlt":"Mini Dictionary","audio":{"src":"../../local/audio/english-01-hello/page-6.mp3","lang":"zh-CN"}},{"title":"Practice","scene":"meadow","detailsText":"✏️ Practice\nMatch the words\n\"Hello!\" →\n\"Goodbye!\" →\nWhen you meet someone\nWhen you leave\nFill in the blank\n1. A: \"______\" (meeting someone)\nB: \"Hello!\"\n2. A: \"What's ______ name?\"\nB: \"My name is Steve.\"\n3. A: \"______\" (leaving)\nB: \"Goodbye!\"","textEn":"✏️ Practice\nMatch the words\n\"Hello!\" →\n\"Goodbye!\" →\nWhen you meet someone","images":["../../local/images/english-01-hello/webp/page-06.webp"],"imageAlt":"Practice","practice":{"type":"match","label":"问候语配对","prompt":"把问候语和使用场景配成一对。","leftLabel":"句子","rightLabel":"什么时候用","pairs":[{"left":"Hello!","right":"见面时"},{"left":"Goodbye!","right":"离开时"}]},"audio":{"src":"../../local/audio/english-01-hello/page-7.mp3","lang":"en-US"}},{"title":"Let's Sing!","scene":"picnic","detailsText":"🎤 Let's Sing!\nHello Song 🎵\n(Sing to the tune of \"Twinkle Twinkle Little Star\")\nHello, hello, how are you?\nI am fine, how are you?\nHello, my friend, what's your name?\nNice to meet you, play a game!\nHello, hello, how are you?\nI am fine, goodbye to you!\n🔊 Sing with me!","textEn":"🎤 Let's Sing!\nHello Song 🎵\n(Sing to the tune of \"Twinkle Twinkle Little Star\")\nHello, hello, how are you?\nI am fine, how are you?","images":["../../local/images/english-01-hello/webp/page-07.webp"],"imageAlt":"Let's Sing!","lyrics":["Hello, hello, how are you?","I am fine, how are you?","Hello, my friend, what's your name?","Nice to meet you, play a game!","Hello, hello, how are you?","I am fine, goodbye to you!"],"audio":{"src":"../../local/audio/english-01-hello/page-8.mp3","lang":"en-US"}},{"title":"Challenge","scene":"wind","detailsText":"🎯 Village Greetings\nSteve walks through the village. Each villager says something — choose the right reply!\n1 Villager: \"Hello!\"\nA) \"Goodbye!\"\nB) \"Hello!\" ✅\nC) \"I'm fine.\"\n2 Villager: \"What's your name?\"\nA) \"My name is Steve.\" ✅\nB) \"Hello!\"\nC) \"I'm fine.\"\n3 Villager: \"How are you?\"\nA) \"Goodbye.\"\nB) \"My name is Steve.\"\nC) \"I'm fine, thank you!\" ✅\n4 Villager: \"Goodbye!\"\nA) \"Goodbye!\" ✅\nB) \"Hello.\"\nC) \"How are you?\"","textEn":"🎯 Village Greetings\nSteve walks through the village.\nEach villager says something — choose the right reply!\n1 Villager: \"Hello!\"\nA) \"Goodbye!\"","images":["../../local/images/english-01-hello/webp/page-08.webp"],"imageAlt":"Challenge","question":"村民说 “Hello!”，
