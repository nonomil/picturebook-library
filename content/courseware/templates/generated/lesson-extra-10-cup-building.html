    <script>window.COURSEWARE_CONFIG = {"id":"lesson-extra-10-cup-building","template":"activity-studio","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"动手活动","requiredInteractions":["record:5"],"sourcePath":"lesson_extra_10_创意构建：纸杯搭建.html","steps":[{"title":"今天要学会什么？","scene":"bubbles","textZh":"我们要发现\n我们会发现：","detailsText":"我们要发现\n我们会发现：\n了解基本的建筑结构原理：稳定性、承重、对称与平衡\n认识纸杯的形状特点（圆锥、圆柱）及其在构建中的作用\n初步接触数量、高度、大小、排列等数学概念\n我们会练习：\n锻炼手眼协调、抓握和精细动作控制能力\n提升三维空间想象与规划能力\n在搭建中学习尝试、失败、调整与优化\n在小组活动中学习分工、协作与表达创意\n我们会感受到：\n通过独立或合作完成作品，获得成就感与自信心\n感受对称、色彩搭配带来的美感\n在搭建倒塌时学习耐心与坚持\n在共同创作中体验团队协作的乐趣","images":["../../local/generated-visuals/lesson-extra-10-cup-building/page-1.webp"],"imageAlt":"今天要学会什么？主题插图"},{"title":"准备材料","scene":"bubbles","textZh":"需要的东西\n基础材料：","detailsText":"需要的东西\n基础材料：\n纸杯：多种颜色、尺寸（50-100个）\n辅助连接工具：双面胶、透明胶带、橡皮筋、回形针\n小朋友安全剪刀\n少量橡皮泥或黏土（用于固定底部）\n装饰材料：\n彩纸、贴纸、马克笔、毛球、羽毛等\n环境准备：\n宽敞、平坦的桌面或地板区域\n分类摆放材料的工具台\n预留作品展示与拍照空间","images":["../../local/generated-visuals/lesson-extra-10-cup-building/page-2.webp"],"imageAlt":"准备材料主题插图"},{"title":"先来玩一玩","scene":"bubbles","textZh":"我们来试试\n📖 故事导入","detailsText":"我们来试试\n先来玩一玩\n📖 故事导入\n讲述简短故事：\"小纸杯要参加建筑比赛，想请小朋友帮忙搭建一个家/城堡/火箭\"。\n让小朋友自由触摸、堆叠纸杯，感受其形状与特性\n引导观察：纸杯倒扣与正放的不同？如何让纸杯站得更稳？\n🔨 示范演示\n单柱堆叠：杯口对杯口、杯底对杯底\n金字塔结构：下层多、上层少\n拱形连接：侧边对侧边形成弧形\n再探索\n分组设计（每组3-5人）：共同讨论主题，绘制简单设计草图\n初级挑战（5-6岁）：搭建高度超过30厘米的稳定纸杯塔\n中级挑战（7-8岁）：建造有\"房间\"或\"通道\"的结构\n高级挑战（9-10岁）：设计能承重（如放置小玩偶）的结构\n🧑‍🏫 大人可以做什么\n巡回观察，不直接干预，以提问引导思考：\"你觉得怎样才能让它更稳？\"\"如果这里加一个纸杯会怎样？\"鼓励尝试不同连接方式。\n动手试一试\n每组介绍作品名称、设计理念与难点\n互评与投票：\"最创意奖\"\"最稳固奖\"\"最美观奖\"\n反思讨论：\"搭建中最难的是什么？\"\"下次可以怎样改进？\"\n一起挑战\n共同整理材料，分类回收可重复使用的物品\n清洁场地，培养良好习惯","images":["../../local/generated-visuals/lesson-extra-10-cup-building/page-3.webp"],"imageAlt":"先来玩一玩主题插图"},{"title":"再试一试","scene":"bubbles","textZh":"还可以这样玩\n科学探索：","detailsText":"还可以这样玩\n科学探索：\n承重实验：比较不同结构的承重能力\n稳定性测试：用风扇轻吹，观察哪种结构不易倒塌\n斜面实验：将纸杯连接成滑道，让小球滚落\n艺术整合：\n色彩主题创作：按颜色分类搭建彩虹塔\n光影游戏：用手电筒照射纸杯结构，观察投影形状\n数学融入：\n数量统计：计算搭建用了多少纸杯\n测量高度：用尺子测量作品高度\n模式排列：按颜色或大小规律排列纸杯","images":["../../local/generated-visuals/lesson-extra-10-cup-building/page-4.webp"],"imageAlt":"再试一试主题插图"},{"title":"安全提醒","scene":"bubbles","textZh":"安全第一：确保低龄小朋友不将纸杯放入口中，剪刀需成人监护下使用\n材料管理：确保纸杯干净、无破损尖锐边缘，适量提供避免混乱","detailsText":"安全提醒\n安全第一：确保低龄小朋友不将纸杯放入口中，剪刀需成人监护下使用\n材料管理：确保纸杯干净、无破损尖锐边缘，适量提供避免混乱\n尊重创意：不否定孩子的设计，多用\"试试看\"代替\"应该这样\"\n过程重于结果：关注孩子在搭建中的思考与尝试，而非仅追求完美作品\n差异化支持：根据小朋友能力提供适当挑战，避免挫折感过强","images":["../../local/generated-visuals/lesson-extra-10-cup-building/page-5.webp"],"imageAlt":"安全提醒主题插图"},{"title":"老师小提示","scene":"bubbles","textZh":"通过此活动，孩子将在动手实践中自然发展多领域能力，同时体验创造的乐趣与合作的温暖。活动设计注重开放性，大人与家长可根据实际情况灵活调整，让每一次纸杯搭建都成为独特的学习旅程。","detailsText":"老师小提示\n通过此活动，孩子将在动手实践中自然发展多领域能力，同时体验创造的乐趣与合作的温暖。活动设计注重开放性，大人与家长可根据实际情况灵活调整，让每一次纸杯搭建都成为独特的学习旅程。","images":["../../local/generated-visuals/lesson-extra-10-cup-building/page-6.webp"],"imageAlt":"老师小提示主题插图","record":{"prompt":"这一课完成了吗？请勾选后保存学习记录。","label":"我完成了这一课"}}]};</script>
