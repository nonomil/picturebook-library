    <script>window.COURSEWARE_CONFIG = {"id":"story-extra-03","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"story_extra_03_森林里的圣诞节.html","steps":[{"title":"雪花飘落","scene":"meadow","detailsText":"雪花像羽毛一样轻轻飘落，给大森林披上了亮晶晶的白外套。松树们挺直了腰板，每一根针叶上都托着一小块阳光。\n🐿️ 奇奇：圣诞节就要到了！这是我们森林的第一个圣诞节呢！","textZh":"雪花像羽毛一样轻轻飘落，给大森林披上了亮晶晶的白外套。松树们挺直了腰板，每一根针叶上都托着一小块阳光。\n🐿️ 奇奇：圣诞节就要到了！这是我们森林的第一个圣诞节呢！","images":["../../local/generated-visuals/story-extra-03/page-1.webp"],"imageAlt":"雪花飘落主题插图"},{"title":"大家来商量","scene":"picnic","detailsText":"去年，鸟儿们从人类村庄衔回了一个圣诞节的故事。森林里的小动物们听得入了迷，决定今年也要过自己的圣诞节。\n🐻 笨笨：我们需要一棵圣诞树！我在山坡上见过最大的松树！\n🦔 球球：可是我们没有彩球，也没有小星星。\n🐇 跳跳：我们可以自己做呀！森林就是我们的宝库！","textZh":"去年，鸟儿们从人类村庄衔回了一个圣诞节的故事。森林里的小动物们听得入了迷，决定今年也要过自己的圣诞节。\n🐻 笨笨：我们需要一棵圣诞树！我在山坡上见过最大的松树！\n🦔 球球：可是我们没有彩球，也没有小星星。\n🐇 跳跳：我们可以自己做呀！森林就是我们的宝库！","images":["../../local/generated-visuals/story-extra-03/page-1.webp"],"imageAlt":"大家来商量主题插图"},{"title":"热火朝天的准备","scene":"wind","detailsText":"奇奇爬上白桦树，摘下被冬日镀上银边的松果，穿成串儿——\"叮铃铃——\"声音清脆得像冰凌碰撞。\n笨笨找到了最端正的云杉，小心翼翼地清理枝条，把树冠擦得干干净净。\n球球在雪地里发现红色的野果和光滑的白石头，用自己身上的刺串成了漂亮的项链。\n小鸟用彩色羽毛编蝴蝶结，小鹿用苔藓铺小路，小狐狸挂上亮晶晶的冰凌，蜜蜂贡献蜂蜡做了三支大蜡烛。","textZh":"奇奇爬上白桦树，摘下被冬日镀上银边的松果，穿成串儿——\"叮铃铃——\"声音清脆得像冰凌碰撞。\n笨笨找到了最端正的云杉，小心翼翼地清理枝条，把树冠擦得干干净净。\n球球在雪地里发现红色的野果和光滑的白石头，用自己身上的刺串成了漂亮的项链。","images":["../../local/generated-visuals/story-extra-03/page-1.webp"],"imageAlt":"热火朝天的准备主题插图"},{"title":"平安夜的烛光","scene":"listening","detailsText":"平安夜的晚上，所有小动物都围在圣诞树旁。松果铃铛、野果项链、白石珠子和冰凌挂饰在烛光中闪烁。\n🐻 笨笨：这就是圣诞节吗？\n🐿️ 奇奇：圣诞节不仅仅是漂亮的树和礼物。\n🦔 球球：是大家一起做一件事，就像我收集野果的时候，虽然很冷，但想到大家会开心，我就不觉得冷了。\n🦊 红红：是把自己的东西分享出来，我的冰凌平时只是水，但现在它能唱歌了。","textZh":"平安夜的晚上，所有小动物都围在圣诞树旁。松果铃铛、野果项链、白石珠子和冰凌挂饰在烛光中闪烁。\n🐻 笨笨：这就是圣诞节吗？\n🐿️ 奇奇：圣诞节不仅仅是漂亮的树和礼物。\n🦔 球球：是大家一起做一件事，就像我收集野果的时候，虽然很冷，但想到大家会开心，我就不觉得冷了。","images":["../../local/generated-visuals/story-extra-03/page-1.webp"],"imageAlt":"平安夜的烛光主题插图"},{"title":"白鸮爷爷的礼物","scene":"meadow","detailsText":"这时，天空中飘起了更大的雪花。一只年老的白鸮飞来，落在圣诞树最上面的枝桠，像个活的星星。\n🦉 白鸮爷爷：圣诞节真正的魔法，不是礼物有多贵重，而是大家愿意为彼此付出的心意。你们用友谊做丝线，用合作做针线，缝制出了这个森林里最美的圣诞节。\n🦉 白鸮爷爷：因为你们，圣诞节变成了森林的语言，一种关于给予和分享的语言。","textZh":"这时，天空中飘起了更大的雪花。一只年老的白鸮飞来，落在圣诞树最上面的枝桠，像个活的星星。\n🦉 白鸮爷爷：圣诞节真正的魔法，不是礼物有多贵重，而是大家愿意为彼此付出的心意。你们用友谊做丝线，用合作做针线，缝制出了这个森林里最美的圣诞节。","images":["../../local/generated-visuals/story-extra-03/page-1.webp"],"imageAlt":"白鸮爷爷的礼物主题插图"},{"title":"最美的圣诞节","scene":"picnic","detailsText":"那天晚上，所有的小动物都挤在圣诞树下睡觉。雪花温柔地盖在它们身上像一条银色的毯子。\n从那以后，每年的圣诞节，森林里的小动物们都会聚在一起，装饰一棵新的圣诞树，邀请每一只路过的小动物。\n因为它们明白了一个秘密：最好的圣诞礼物，原来就藏在彼此的身边，藏在那些一起劳动的汗水中，藏在每一句\"我们一起吧\"的温暖邀请中。\n📖 寓意：圣诞节的真正意义不在于礼物有多贵重，而在于人与人之间的关爱、分享与合作。","textZh":"那天晚上，所有的小动物都挤在圣诞树下睡觉。雪花温柔地盖在它们身上像一条银色的毯子。\n从那以后，每年的圣诞节，森林里的小动物们都会聚在一起，装饰一棵新的圣诞树，邀请每一只路过的小动物。","images":["../../local/generated-visuals/story-extra-03/page-1.webp"],"imageAlt":"最美的圣诞节主题插图"}]};</script>
