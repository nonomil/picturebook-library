    <script>window.COURSEWARE_CONFIG = {"id":"lesson-extra-07-jobs","template":"activity-studio","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"动手活动","requiredInteractions":["record:5"],"sourcePath":"lesson_extra_07_社会认知：认识职业.html","steps":[{"title":"今天要学会什么？","scene":"meadow","textZh":"我们要发现\n我们会发现：","detailsText":"我们要发现\n我们会发现：\n认识5种以上常见职业，了解其基本工作内容\n理解职业与社会的关系，感知\"分工合作\"的概念\n认识职业工具与标志，能说出典型工具或制服特征\n我们会练习：\n通过观察描述职业特征，用语言表达发现\n在模拟场景中模仿职业动作，发展创造性思维\n在小组活动中学习分工、合作与轮流\n我们会感受到：\n萌发对各行各业劳动者的尊重与感谢之情\n通过体验激发对不同职业的好奇心与探索欲\n初步建立\"我长大后也能为社会做贡献\"的积极自我概念","images":["../../local/generated-visuals/lesson-extra-07-jobs/page-1.webp"],"imageAlt":"今天要学会什么？主题插图"},{"title":"准备材料","scene":"picnic","textZh":"需要的东西\n教具材料：","detailsText":"需要的东西\n教具材料：\n职业图片卡：清晰展示不同职业的工作场景\n职业工具实物或模型：玩具听诊器、厨师帽、纸制警徽等\n职业服装/配角服：简易版医护服、消防服、厨师服等\n场景布置：\n职业体验角：划分\"小医院\"\"消防站\"\"美食厨房\"\"学校教室\"\n背景音乐：各职业相关的轻快音乐\n手工材料：\n白纸、彩笔、贴纸、安全剪刀、胶棒\n空白职业名牌、自制\"工具\"","images":["../../local/generated-visuals/lesson-extra-07-jobs/page-2.webp"],"imageAlt":"准备材料主题插图"},{"title":"猜一猜职业","scene":"wind","textZh":"我们来试试\n第一环节：职业猜猜看（10分钟）","detailsText":"我们来试试\n第一环节：职业猜猜看（10分钟）\n🎤 情景引入\n大人提问：\"你们知道爸爸妈妈每天出门是去做什么吗？\"播放混合职业声音的音频，让孩子猜测是什么职业。\n🖼️ 图片揭秘\n出示职业图片卡，引导孩子观察并讨论：\"这个人穿着什么？手里拿着什么？可能在做什么？\"\n第二环节：职业工具探秘（10分钟）\n🔧 实物观察\n分组传递职业工具实物（听诊器、计算器、打蛋器），让孩子触摸、观察并猜测用途。\n🧩 工具配对游戏\n将工具图片与职业图片混放，请孩子进行配对，并说明理由。\n第三环节：职业小镇体验（20分钟）\n医院区：用玩具器械为布娃娃\"看病\"，学习说\"请躺下，我帮你检查一下\"\n消防站区：穿戴简易消防服，模拟接警、滑杆、灭火动作\n餐厅区：用橡皮泥制作\"食物\"，学习\"欢迎光临\"\"请问需要点什么\"\n第四环节：我的职业画（10分钟）\n请孩子画出自己最喜欢的职业，并画出该职业的典型工具或场景\n每位孩子用1-2句话介绍自己的画\n第五环节：总结与感恩（5分钟）\n集体讨论：\"如果没有这些职业，我们的生活会变成什么样？\"\n带领孩子对\"虚拟职业角色\"说谢谢\n颁发\"职业小勋章\"贴纸奖励","images":["../../local/generated-visuals/lesson-extra-07-jobs/page-3.webp"],"imageAlt":"猜一猜职业主题插图"},{"title":"和家人一起做","scene":"listening","textZh":"还可以这样玩\n家庭任务：","detailsText":"还可以这样玩\n家庭任务：\n职业采访：让孩子回家采访一位家人或邻居的职业\n职业日记：用图画记录一周内观察到的职业\n主题区角延伸：\n美工区：制作职业工具手工\n阅读区：投放职业相关绘本\n建构区：搭建\"职业小镇\"\n跨领域融合：\n数学区：职业相关分类游戏\n音乐区：学唱职业儿歌（如《我是一个粉刷匠》）","images":["../../local/generated-visuals/lesson-extra-07-jobs/page-4.webp"],"imageAlt":"和家人一起做主题插图"},{"title":"安全提醒","scene":"meadow","textZh":"安全管理：确保所有道具无尖锐边缘，避免使用细小零件\n小朋友差异：尊重内向孩子的参与方式，可通过小组合作减少压力","detailsText":"安全提醒\n安全管理：确保所有道具无尖锐边缘，避免使用细小零件\n小朋友差异：尊重内向孩子的参与方式，可通过小组合作减少压力\n价值观引导：避免职业性别刻板印象，强调\"所有职业都值得尊重\"\n活动弹性：若孩子对某一职业特别感兴趣，可延长体验时间\n评价方式：以过程性评价为主，关注参与度和合作行为","images":["../../local/generated-visuals/lesson-extra-07-jobs/page-5.webp"],"imageAlt":"安全提醒主题插图"},{"title":"老师小提示","scene":"picnic","textZh":"本方案以\"体验式学习\"为核心，通过多感官参与、情景模拟和社会互动，帮助小朋友在具象化场景中建构对职业的认知，同时滋养社会情感与自我成长。活动设计注重游戏化、生活化与渐进性，适应小朋友的认知发展特点。","detailsText":"老师小提示\n本方案以\"体验式学习\"为核心，通过多感官参与、情景模拟和社会互动，帮助小朋友在具象化场景中建构对职业的认知，同时滋养社会情感与自我成长。活动设计注重游戏化、生活化与渐进性，适应小朋友的认知发展特点。","images":["../../local/generated-visuals/lesson-extra-07-jobs/page-6.webp"],"imageAlt":"老师小提示主题插图","record":{"prompt":"这一课完成了吗？请勾选后保存学习记录。","label":"我完成了这一课"}}]};</script>
