    <script>window.COURSEWARE_CONFIG = {"id":"math-19-statistics","template":"interactive-classroom","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"互动学习","requiredInteractions":["record:6"],"sourcePath":"childrens-library/courseware/math/math-19-statistics.html","steps":[{"title":"Minecraft 村庄普查","scene":"meadow","textZh":"⛏️ Minecraft 村庄普查\n小明的 Minecraft 村庄今天要统计村民人数啦！每个村民都有不同的职业。村长需要知道：","detailsText":"⛏️ Minecraft 村庄普查\n小明的 Minecraft 村庄今天要统计村民人数啦！每个村民都有不同的职业。村长需要知道：\n🧑‍🌾 有多少个农民？\n⚔️ 有多少个铁傀儡？\n📖 有多少个图书管理员？\n👆 点击下面的村民来统计人数吧！ 每点一次就记录一个～\n🧑‍🌾\n农民\n0\n📖\n图书管理员\n0\n⚒️\n铁匠\n0\n🥩\n屠夫\n0\n🤖\n铁傀儡\n0\n✅ 统计完成！\n🔄 重置\n📋 村民统计结果：","audio":{"src":"../../local/audio/math-19-statistics/page-1.mp3","lang":"zh-CN"},"images":["../../local/generated-visuals/math-19-statistics/page-1.webp"],"imageAlt":"Minecraft 村庄普查主题插图"},{"title":"核心概念","scene":"picnic","textZh":"💡 核心概念\n统计的四个步骤：","detailsText":"💡 核心概念\n统计的四个步骤：\n🔀\n分类\n把东西分成不同的组\n🔢\n计数\n数一数每组有多少个\n⭕\n画○记录\n用○表示数量\n📊\n柱状图\n用柱子长短比多少\n🌰 例子： 小明有 3 个🍎、2 个🍊、4 个🍌。\n➡️ 分类：🍎 / 🍊 / 🍌\n➡️ 计数：3、2、4\n➡️ 画○记录：🍎 ○○○ 🍊 ○○ 🍌 ○○○○\n➡️ 柱状图：🍌最高（最多）🍊最矮（最少）","audio":{"src":"../../local/audio/math-19-statistics/page-2.mp3","lang":"zh-CN"},"images":["../../local/generated-visuals/math-19-statistics/page-2.webp"],"imageAlt":"核心概念主题插图"},{"title":"动手练习 · 分一分，画一画","scene":"wind","textZh":"✋ 动手练习 · 分一分，画一画\n把下面的动物分类，然后用○记录数量。","detailsText":"✋ 动手练习 · 分一分，画一画\n把下面的动物分类，然后用○记录数量。\n🐶 🐱 🐰 🐶 🐱 🐶 🐰 🐱 🐶 🐰 🐱 🐶\n👆 共12只小动物\n🐶\n小狗\n0\n+🐶\n🐱\n小猫\n0\n+🐱\n🐰\n兔子\n0\n+🐰\n✅ 我分好了！\n🔄 重置\n📊 比一比\n点击「我分好了！」看看哪种动物最多，哪种最少 👆","audio":{"src":"../../local/audio/math-19-statistics/page-3.mp3","lang":"zh-CN"},"images":["../../local/generated-visuals/math-19-statistics/page-3.webp"],"imageAlt":"动手练习 · 分一分，画一画主题插图"},{"title":"常见误解","scene":"listening","textZh":"⚠️ 常见误解\n❌ 没有分类就开始数","detailsText":"⚠️ 常见误解\n❌ 没有分类就开始数\n把所有东西混在一起数，就不知道每样有多少了。\n✅ 先分类，再计数！\n❌ 画○时漏画了或少画了\n数了3个却只画了2个○，记录就不准确了。\n✅ 数一个画一个○，一一对应！\n❌ 柱子越高 = 最少\n以为最高的柱子代表最少，搞反了！\n✅ 柱子越高 = 数量越多！就像叠积木，叠得越高东西越多。\n❌ 看错类别\n把🍎的柱子看成🍊的，比较错了。\n✅ 先看柱子下面的标签是什么，再比较！","audio":{"src":"../../local/audio/math-19-statistics/page-4.mp3","lang":"zh-CN"},"images":["../../local/generated-visuals/math-19-statistics/page-4.webp"],"imageAlt":"常见误解主题插图"},{"title":"练习 · 画○记录 + 读柱状图","scene":"bubbles","textZh":"📝 练习 · 画○记录 + 读柱状图\n🍎 水果摊统计","detailsText":"📝 练习 · 画○记录 + 读柱状图\n🍎 水果摊统计\n水果店有这些水果，请你用○记录：\n🍎🍎🍎🍊🍊🍊🍊🍌🍌🍇🍇🍇🍇🍇\n🍎 苹果\n○○○\n3\n🍊 橙子\n?\n⭕ 画○\n🍌 香蕉\n?\n⭕ 画○\n🍇 葡萄\n?\n⭕ 画○\n✅ 检查答案\n📊 读柱状图：班级宠物调查\n下面是一（2）班同学养的宠物统计图，看图回答问题：\n班级宠物统计\n2\n🐶\n4\n🐱\n6\n🐰\n8\n🐟\n2\n🐹\n❓ 哪种宠物养的人最多？\n🐶 小狗 (2人)\n🐱 小猫 (4人)\n🐰 兔子 (6人)\n🐟 金鱼 (8人) ✅\n🐹 仓鼠 (2人)\n❓ 哪种宠物养的人最少？（选2个）\n🐟 金鱼 (8人)\n🐱 小猫 (4人)\n🐶 小狗 和 🐹 仓鼠 (都是2人) ✅","audio":{"src":"../../local/audio/math-19-statistics/page-5.mp3","lang":"zh-CN"},"images":["../../local/generated-visuals/math-19-statistics/page-5.webp"],"imageAlt":"练习 · 画○记录 + 读柱状图主题插图"},{"title":"闯关挑战","scene":"star","textZh":"🏆 闯关挑战\n一共3关，全部通过就能获得统计小达人徽章！","detailsText":"🏆 闯关挑战\n一共3关，全部通过就能获得统计小达人徽章！\n🏁 第 1 / 3 关\n🏁 第1关 · 分一分\n把下面的图形拖到对应的类别框里：\n🔴 🔵 🟡 🔴 🟡 🔵 🔴 🟡\n🔴\n🔵\n🟡\n🔴\n🟡\n🔵\n🔴\n🟡\n🔴 红色\n🔵 蓝色\n🟡 黄色\n✅ 检查分类\n🏁 第2关 · 画○记录\n统计下面每种水果的数量，用○记录下来：\n🍓🍓🍓🍓🍋🍋🍋🍋🍋🥝🥝🥝\n🍓 草莓\n⭕ +1\n−1\n🍋 柠檬\n⭕ +1\n−1\n🥝 猕猴桃\n⭕ +1\n−1\n✅ 检查记录\n🏁 第3关 · 读柱状图\n下面是小明一周吃水果的统计图，回答问题：\n一周水果统计\n3\n🍎\n5\n🍐\n7\n🍇\n4\n🍊\n🍇 葡萄 (7个) ✅\n🍐 梨 (5个)\n🍎 苹果 (3个)\n🎉 恭喜通关！\n🏅\n统计小达人 🏆\n你学会了分类、计数、画○记录和看柱状图！","audio":{"src":"../../local/audio/math-19-statistics/page-6.mp3","lang":"zh-CN"},"images":["../../local/generated-visuals/math-19-statistics/page-6.webp"],"imageAlt":"闯关挑战主题插图"},{"title":"庆祝 · 小结","scene":"meadow","textZh":"🎉 庆祝 · 小结\n📊✨","detailsText":"🎉 庆祝 · 小结\n📊✨\n太棒了！你完成了第19课！\n📌 本节课我们学了：\n✅ 分类 — 把东西按类别分开\n✅ 计数 — 数一数每类有多少个\n✅ 用○记录 — 数一个画一个○\n✅ 看柱状图 — 柱子越高数量越多\n✅ 比较最多最少 — 找最高和最短的柱子\n▶ 下一课：方向与位置","audio":{"src":"../../local/audio/math-19-statistics/page-7.mp3","lang":"zh-CN"},"images":["../../local/generated-visuals/math-19-statistics/page-7.webp"],"imageAlt":"庆祝 · 小结主题插图","record":{"prompt":"这一课完成了吗？请勾选后保存学习记录。","label":"我完成了这一课"}}]};</script>
