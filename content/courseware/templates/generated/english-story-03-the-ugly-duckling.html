    <script>window.COURSEWARE_CONFIG = {"id":"english-story-03-the-ugly-duckling","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"english_story_03_The_Ugly_Duckling.html","steps":[{"title":"A Special Egg","scene":"meadow","detailsText":"Once upon a time, on a big farm near a green meadow, a mother duck was sitting on her eggs. They were warm and safe under her. \"Soon,\" she quacked softly, \"my little ones will hatch.\"","textZh":"Once upon a time, on a big farm near a green meadow, a mother duck was sitting on her eggs.\nThey were warm and safe under her.","images":["../../local/generated-visuals/english-story-03-the-ugly-duckling/page-1.webp"],"imageAlt":"A Special Egg主题插图"},{"title":"The Hatching","scene":"picnic","detailsText":"One sunny morning, the eggs began to crack. One by one, fluffy yellow ducklings popped out. They looked around with bright, curious eyes. The mother duck was very happy. But one egg was different. It was big and grey. Crak! Finally, a very large, fluffy grey bird tumbled out. He had a long neck and big feet. He did not look like the other little yellow ducklings at all.","textZh":"One sunny morning, the eggs began to crack.\nOne by one, fluffy yellow ducklings popped out.\nThey looked around with bright, curious eyes.","images":["../../local/generated-visuals/english-story-03-the-ugly-duckling/page-1.webp"],"imageAlt":"The Hatching主题插图"},{"title":"Rejected by Others","scene":"wind","detailsText":"Mother Duck 🦆：Oh my. You are... different.\nCows 🐄：He is not a duck.\nChickens 🐔：He is too big and grey!\nOther Ducklings 🐥：He is ugly. He cannot be one of us.","textZh":"Mother Duck 🦆：Oh my.\nYou are...\ndifferent.\nCows 🐄：He is not a duck.\nChickens 🐔：He is too big and grey!","images":["../../local/generated-visuals/english-story-03-the-ugly-duckling/page-1.webp"],"imageAlt":"Rejected by Others主题插图"},{"title":"Leaving Home","scene":"listening","detailsText":"The little grey bird felt sad. He tried to play with the other ducklings, but they swam away from him. \"Go away, ugly duckling!\" they said. So the ugly duckling flew over the farm fence, all by himself. His heart was heavy.","textZh":"The little grey bird felt sad.\nHe tried to play with the other ducklings, but they swam away from him.\n\"Go away, ugly duckling!\" they said.","images":["../../local/generated-visuals/english-story-03-the-ugly-duckling/page-1.webp"],"imageAlt":"Leaving Home主题插图"},{"title":"The Wild Ducks","scene":"bubbles","detailsText":"Ugly Duckling 🐥：Can I play with you?\nWild Ducks：You are very strange. But if you can swim fast, you may stay.","textZh":"Ugly Duckling 🐥：Can I play with you?\nWild Ducks：You are very strange.\nBut if you can swim fast, you may stay.","images":["../../local/generated-visuals/english-story-03-the-ugly-duckling/page-1.webp"],"imageAlt":"The Wild Ducks主题插图"},{"title":"Danger!","scene":"star","detailsText":"The ugly duckling swam as fast as he could with his big feet. But suddenly—BANG! BANG! Hunters were coming! The wild ducks flew away. The poor ugly duckling hid in the tall reeds. He was very scared and very lonely.","textZh":"The ugly duckling swam as fast as he could with his big feet.\nBut suddenly—BANG!\nBANG!\nHunters were coming!\nThe wild ducks flew away.","images":["../../local/generated-visuals/english-story-03-the-ugly-duckling/page-1.webp"],"imageAlt":"Danger!主题插图"},{"title":"More Rejection","scene":"meadow","detailsText":"He wandered for many days. He slept in a barn, but a kind woman and her cat and hen chased him away. \"You cannot lay eggs like the hen, and you cannot purr like the cat,\" said the woman. \"You are useless.\" The ugly duckling felt his heart would break. \"I am just ugly,\" he whispered to himself. \"Nobody wants me.\"","textZh":"He wandered for many days.\nHe slept in a barn, but a kind woman and her cat and hen chased him away.","images":["../../local/generated-visuals/english-story-03-the-ugly-duckling/page-1.webp"],"imageAlt":"More Rejection主题插图"},{"title":"A Cold Winter","scene":"picnic","detailsText":"Winter came. The pond froze. The ugly duckling was cold and hungry. He almost froze in the ice, but a farmer saved him and took him home to his children. The children wanted to play with him, but they were too rough. They chased him, and he fell out of a box. He flew out the door as fast as he could, back into the cold snow. He thought, \"Maybe I will never have a friend.\"","textZh":"Winter came.\nThe pond froze.\nThe ugly duckling was cold and hungry.\nHe almost froze in the ice, but a farmer saved him and took him home to his children.","images":["../../local/generated-visuals/english-story-03-the-ugly-duckling/page-1.webp"],"imageAlt":"A Cold Winter主题插图"},{"title":"Spring Arrives","scene":"wind","detailsText":"But then, spring arrived. The ice melted. Flowers bloomed. The ugly duckling felt a warmth in his heart. He saw three beautiful swans swimming in a lake. They were so graceful and kind. \"I want to be like them,\" he thought. \"Even if they chase me away, it is better to be chased by such beautiful creatures.\"","textZh":"But then, spring arrived.\nThe ice melted.\nFlowers bloomed.\nThe ugly duckling felt a warmth in his heart.\nHe saw three beautiful swans swimming in a lake.","images":["../../local/generated-visuals/english-story-03-the-ugly-duckling/page-1.webp"],"imageAlt":"Spring Arrives主题插图"},{"title":"The Beautiful Swan","scene":"listening","detailsText":"Ugly Duckling 🐥：*swims towards them, bowing his head*\nSwans 🦢：Hello, friend!\nThe ugly duckling looked down at the water. He saw his reflection. But it was not a grey, ugly bird he saw. He saw a magnificent white swan with a long, graceful neck!","textZh":"Ugly Duckling 🐥：*swims towards them, bowing his head*\nSwans 🦢：Hello, friend!\nThe ugly duckling looked down at the water.\nHe saw his reflection.","images":["../../local/generated-visuals/english-story-03-the-ugly-duckling/page-1.webp"],"imageAlt":"The Beautiful Swan主题插图"},{"title":"True Identity","scene":"bubbles","detailsText":"He was not an ugly duckling at all. He had always been a swan, just like the others. He just needed time to grow. The other swans welcomed him with gentle pecks. From that day on, he swam with his new friends. He was beautiful, and more importantly, he was happy and loved.","textZh":"He was not an ugly duckling at all.\nHe had always been a swan, just like the others.\nHe just needed time to grow.","images":["../../local/generated-visuals/english-story-03-the-ugly-duckling/page-1.webp"],"imageAlt":"True Identity主题插图"},{"title":"Moral of the Story","scene":"star","detailsText":"You are special and wonderful just as you are. Sometimes, you have to grow into your true self. Be patient and kind to yourself and others, because true beauty comes from within.\n你本身就是特别而美好的。有时候，你需要成长才能成为真正的自己。对自己和他人要有耐心和善意，因为真正的美来自内心。","textZh":"You are special and wonderful just as you are.\nSometimes, you have to grow into your true self.","images":["../../local/generated-visuals/english-story-03-the-ugly-duckling/page-1.webp"],"imageAlt":"Moral of the Story主题插图"}]};</script>
