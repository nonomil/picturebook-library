    <script>window.COURSEWARE_CONFIG = {"id":"story-extra-01","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"story_extra_01_小蜗牛慢慢游历记.html","steps":[{"title":"清晨出发","scene":"meadow","detailsText":"清晨，阳光透过树叶洒下金色的斑点。一只小小的蜗牛从壳里探出脑袋，揉了揉眼睛。他的名字叫慢慢，背上有一个像小房子一样的壳，壳上有浅棕色的螺旋花纹。\n🐌 慢慢：今天，我要去看看外面的世界！\n他慢慢地、一步一步地爬出了花园的栅栏。","textZh":"清晨，阳光透过树叶洒下金色的斑点。一只小小的蜗牛从壳里探出脑袋，揉了揉眼睛。他的名字叫慢慢，背上有一个像小房子一样的壳，壳上有浅棕色的螺旋花纹。\n🐌 慢慢：今天，我要去看看外面的世界！\n他慢慢地、一步一步地爬出了花园的栅栏。","images":["../../local/generated-visuals/story-extra-01/page-1.webp"],"imageAlt":"清晨出发主题插图"},{"title":"第一站：蘑菇小伞的森林","scene":"picnic","detailsText":"慢慢爬呀爬，来到了一片蘑菇森林。那些蘑菇有的像红色的小伞，有的像白色的柱子。\n🍄 小蘑菇：小蜗牛，你爬得太慢啦！你看，蝴蝶一下子就飞过去了。\n🐌 慢慢：可是，我每爬一步，都能看清泥土里小种子的笑脸，还能闻到青草的味道。飞得快，也许会错过这些呢。\n小蘑菇想了想，觉得慢慢说得有道理。","textZh":"慢慢爬呀爬，来到了一片蘑菇森林。那些蘑菇有的像红色的小伞，有的像白色的柱子。\n🍄 小蘑菇：小蜗牛，你爬得太慢啦！你看，蝴蝶一下子就飞过去了。\n🐌 慢慢：可是，我每爬一步，都能看清泥土里小种子的笑脸，还能闻到青草的味道。飞得快，也许会错过这些呢。\n小蘑菇想了想，觉得慢慢说得有道理。","images":["../../local/generated-visuals/story-extra-01/page-1.webp"],"imageAlt":"第一站：蘑菇小伞的森林主题插图"},{"title":"第二站：蝴蝶的花园","scene":"wind","detailsText":"花园里开满了鲜花。一只蓝蝴蝶扇动翅膀飞过来，她的翅膀像两片蓝宝石。\n🦋 蝴蝶姐姐：小蜗牛，我带你飞去远处的彩虹湖吧！只要一分钟！\n🐌 慢慢：谢谢你，蝴蝶姐姐。可是，如果我飞过去，就没办法认识从家到湖边路上的朋友们啦。而且，我的小壳是我的家，它不能飞呀。\n蝴蝶点点头，陪着慢慢爬了一小段路，给他讲了每朵花的名字。","textZh":"花园里开满了鲜花。一只蓝蝴蝶扇动翅膀飞过来，她的翅膀像两片蓝宝石。\n🦋 蝴蝶姐姐：小蜗牛，我带你飞去远处的彩虹湖吧！只要一分钟！\n🐌 慢慢：谢谢你，蝴蝶姐姐。可是，如果我飞过去，就没办法认识从家到湖边路上的朋友们啦。而且，我的小壳是我的家，它不能飞呀。","images":["../../local/generated-visuals/story-extra-01/page-1.webp"],"imageAlt":"第二站：蝴蝶的花园主题插图"},{"title":"第三站：小蚂蚁的搬家队","scene":"listening","detailsText":"一条小路上，一群小蚂蚁正忙着搬面包屑。\n🐜 蚂蚁队长：小蜗牛，你的壳真漂亮，能借我们当小仓库吗？\n🐌 慢慢：这个壳是我的家，不能借走。但是，如果你们需要歇一歇，可以来我的壳底下乘凉哦！\n小蚂蚁们高兴地轮流去慢慢壳下的阴影里休息，还给慢慢送来了甜甜的蜂蜜作为感谢。","textZh":"一条小路上，一群小蚂蚁正忙着搬面包屑。\n🐜 蚂蚁队长：小蜗牛，你的壳真漂亮，能借我们当小仓库吗？\n🐌 慢慢：这个壳是我的家，不能借走。但是，如果你们需要歇一歇，可以来我的壳底下乘凉哦！\n小蚂蚁们高兴地轮流去慢慢壳下的阴影里休息，还给慢慢送来了甜甜的蜂蜜作为感谢。","images":["../../local/generated-visuals/story-extra-01/page-1.webp"],"imageAlt":"第三站：小蚂蚁的搬家队主题插图"},{"title":"第四站：雨后的彩虹","scene":"meadow","detailsText":"傍晚，天空突然下起了小雨。慢慢赶紧缩进壳里，等雨停了再出来。这时，他看见蚯蚓伯伯在松土，雨后的空气特别清新。\n一道彩虹慢慢爬上了天空，像一座七彩的桥。\n🐌 慢慢：真美啊！\n虽然他爬得慢，可是他看到了雨滴怎样洗亮每一片叶子，看到了彩虹怎样一点点从云里钻出来。","textZh":"傍晚，天空突然下起了小雨。慢慢赶紧缩进壳里，等雨停了再出来。这时，他看见蚯蚓伯伯在松土，雨后的空气特别清新。\n一道彩虹慢慢爬上了天空，像一座七彩的桥。\n🐌 慢慢：真美啊！\n虽然他爬得慢，可是他看到了雨滴怎样洗亮每一片叶子，看到了彩虹怎样一点点从云里钻出来。","images":["../../local/generated-visuals/story-extra-01/page-1.webp"],"imageAlt":"第四站：雨后的彩虹主题插图"},{"title":"回家","scene":"picnic","detailsText":"月亮升起来了，像一只弯弯的小船。慢慢沿着原路慢慢爬回了家。他有点累，心里却满满的都是今天的故事。\n🐌 妈妈：慢慢，今天玩得开心吗？\n🐌 慢慢：开心！我看到了蘑菇森林、蝴蝶花园，还帮助了小蚂蚁，看到了彩虹！妈妈，原来只要慢慢走，也能看到很多美好的东西呢。\n🐌 妈妈：是呀，慢慢。每个人都有自己的节奏。快有快的精彩，慢有慢的风景。重要的是，你在用心感受每一步的旅程。","textZh":"月亮升起来了，像一只弯弯的小船。慢慢沿着原路慢慢爬回了家。他有点累，心里却满满的都是今天的故事。\n🐌 妈妈：慢慢，今天玩得开心吗？\n🐌 慢慢：开心！我看到了蘑菇森林、蝴蝶花园，还帮助了小蚂蚁，看到了彩虹！妈妈，原来只要慢慢走，也能看到很多美好的东西呢。","images":["../../local/generated-visuals/story-extra-01/page-1.webp"],"imageAlt":"回家主题插图"},{"title":"晚安，慢慢","scene":"wind","detailsText":"那天晚上，慢慢做了一个梦。梦里他还是爬得慢慢的，但每一步都开出了小小的花朵。他知道，明天的太阳升起时，他又会背上小壳，慢慢地、快乐地，去发现世界里新的温柔。\n（完）","textZh":"那天晚上，慢慢做了一个梦。梦里他还是爬得慢慢的，但每一步都开出了小小的花朵。他知道，明天的太阳升起时，他又会背上小壳，慢慢地、快乐地，去发现世界里新的温柔。\n（完）","images":["../../local/generated-visuals/story-extra-01/page-1.webp"],"imageAlt":"晚安，慢慢主题插图"}]};</script>
