    <script>window.COURSEWARE_CONFIG = {"id":"english-story-08-little-red-riding-hood","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"english_story_08_Little_Red_Riding_Hood.html","steps":[{"title":"The Special Cape","scene":"meadow","detailsText":"Once upon a time, there was a sweet little girl who always wore a bright red hooded cape. Everyone called her Little Red Riding Hood. She lived in a cozy cottage with her mother.","textEn":"Once upon a time, there was a sweet little girl who always wore a bright red hooded cape.\nEveryone called her Little Red Riding Hood.","images":["../../local/generated-visuals/english-story-08-little-red-riding-hood/page-1.webp"],"imageAlt":"The Special Cape主题插图"},{"title":"Mother's Request","scene":"picnic","detailsText":"👩 Mother：One sunny morning, her mother said, \"Little Red, your grandmother is feeling a bit lonely. Could you take her this basket of fresh bread and jam? Walk straight to her house, and don't dawdle in the forest.\"\n👧 Little Red：Little Red nodded. \"I promise, Mama!\"","textEn":"👩 Mother：One sunny morning, her mother said, \"Little Red, your grandmother is feeling a bit lonely.","images":["../../local/generated-visuals/english-story-08-little-red-riding-hood/page-1.webp"],"imageAlt":"Mother's Request主题插图"},{"title":"The Forest Path","scene":"wind","detailsText":"The forest was full of chirping birds and tall, friendly trees. As she skipped along the path, she saw a patch of beautiful wildflowers. \"Grandma would love these!\" she thought. She stopped to pick a small bouquet, forgetting all about going straight to Grandma's house.","textEn":"The forest was full of chirping birds and tall, friendly trees.\nAs she skipped along the path, she saw a patch of beautiful wildflowers.","images":["../../local/generated-visuals/english-story-08-little-red-riding-hood/page-1.webp"],"imageAlt":"The Forest Path主题插图"},{"title":"The Sly Wolf","scene":"listening","detailsText":"🐺 The Wolf：While she was picking flowers, a sly wolf stepped onto the path. \"Good morning, little girl,\" he said with a toothy grin. \"Where are you going all alone?\"\n👧 Little Red：Little Red, who was taught to be polite, said, \"I'm going to my grandmother's house. She lives in the little cottage with the red roof, just beyond the big oak tree.\"","textEn":"🐺 The Wolf：While she was picking flowers, a sly wolf stepped onto the path.\n\"Good morning, little girl,\" he said with a toothy grin.","images":["../../local/generated-visuals/english-story-08-little-red-riding-hood/page-1.webp"],"imageAlt":"The Sly Wolf主题插图"},{"title":"The Wolf's Trick","scene":"bubbles","detailsText":"The wolf's eyes twinkled with a naughty idea. He hurried away to the cottage and knocked on the door. \"Grandma, it's me, Little Red!\" he called in a high, squeaky voice.\nGrandma, who was not feeling well, said, \"Come in, dear. The door is unlocked.\"","textEn":"The wolf's eyes twinkled with a naughty idea.\nHe hurried away to the cottage and knocked on the door.","images":["../../local/generated-visuals/english-story-08-little-red-riding-hood/page-1.webp"],"imageAlt":"The Wolf's Trick主题插图"},{"title":"Grandma in Trouble","scene":"star","detailsText":"When the wolf tiptoed inside, Grandma got a big fright! The wolf quickly locked her in a cupboard and then put on her nightgown and cap. He hopped into her bed and pulled the quilt up to his nose.","textEn":"When the wolf tiptoed inside, Grandma got a big fright!\nThe wolf quickly locked her in a cupboard and then put on her nightgown and cap.","images":["../../local/generated-visuals/english-story-08-little-red-riding-hood/page-1.webp"],"imageAlt":"Grandma in Trouble主题插图"},{"title":"Little Red Arrives","scene":"meadow","detailsText":"👧 Little Red：Soon, Little Red arrived at the cottage. She noticed the door was open. \"Hello, Grandma?\" she said as she walked in.\n👧 Little Red：\"My, what big eyes you have!\" said Little Red.\n🐺 The Wolf：\"All the better to see you with, my dear,\" the wolf replied in a shaky voice.\n👧 Little Red：\"My, what big ears you have!\"\n🐺 The Wolf：\"All the better to hear you with, my dear.\"\n👧 Little Red：\"My... what big teeth you have!\" Little Red said, suddenly feeling a little nervous.\n🐺 The Wolf：\"All the better to EAT you with!\" roared the wolf, jumping out of bed.","textEn":"👧 Little Red：Soon, Little Red arrived at the cottage.\nShe noticed the door was open.\n\"Hello, Grandma?\" she said as she walked in.","images":["../../local/generated-visuals/english-story-08-little-red-riding-hood/page-1.webp"],"imageAlt":"Little Red Arrives主题插图"},{"title":"The Rescue","scene":"picnic","detailsText":"Just then, a kind huntsman was walking by. He heard the commotion and rushed inside. With a brave shout, he surprised the wolf so much that the wolf ran away, all the way back to the deep, dark forest. He never returned to the cottage again.","textEn":"Just then, a kind huntsman was walking by.\nHe heard the commotion and rushed inside.","images":["../../local/generated-visuals/english-story-08-little-red-riding-hood/page-1.webp"],"imageAlt":"The Rescue主题插图"},{"title":"Safe at Last","scene":"wind","detailsText":"The huntsman gently opened the cupboard and freed Grandma. She was a little shaken but perfectly safe. Little Red gave her grandmother a huge hug and a basket of bread and jam.\n\"I'm so sorry I didn't walk straight here,\" Little Red said. \"I learned a very important lesson today.\"\nFrom that day on, Little Red always listened to her mother and never stopped to talk to strangers in the forest.\nMoral: Always listen to your parents and be careful of strangers. It's important to stay on the path and be aware of who you are talking to.","textEn":"The huntsman gently opened the cupboard and freed Grandma.\nShe was a little shaken but perfectly safe.","images":["../../local/generated-visuals/english-story-08-little-red-riding-hood/page-1.webp"],"imageAlt":"Safe at Last主题插图"}]};</script>
