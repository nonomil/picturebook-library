    <script>window.COURSEWARE_CONFIG = {"id":"story-steve-wither","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"childrens-library/courseware/stories/story-steve-wither.html","steps":[{"title":"故事开始","scene":"meadow","detailsText":"史蒂夫大战凋零 — 天空骑士","textZh":"史蒂夫大战凋零 — 天空骑士","images":["../../local/images/minecraft/items/netherite-sword.png"],"imageAlt":"故事开始","audio":{"src":"../../local/audio/story-steve-wither/page-1.mp3","lang":"zh-CN"}},{"title":"准备行动","scene":"picnic","detailsText":"史蒂夫大战凋零 — 天空骑士\n🛩️ Steve vs The Wither — Sky Knight","textZh":"史蒂夫大战凋零 — 天空骑士","textEn":"🛩️ Steve vs The Wither — Sky Knight","images":["../../local/images/minecraft/items/netherite-sword.png"],"imageAlt":"准备行动","audio":{"src":"../../local/audio/story-steve-wither/page-2.mp3","lang":"zh-CN"}},{"title":"史蒂夫住在一个安静的村庄里","scene":"wind","detailsText":"史蒂夫住在一个安静的村庄里。他是一个建造者，一个矿工，也是一个梦想家。\nSteve lived in a quiet village. He was a builder, a miner, and a dreamer.","textZh":"史蒂夫住在一个安静的村庄里。他是一个建造者，一个矿工，也是一个梦想家。","textEn":"Steve lived in a quiet village.\nHe was a builder, a miner, …","images":["../../local/images/minecraft/blocks/tnt.png"],"imageAlt":"史蒂夫住在一个安静的村庄里","audio":{"src":"../../local/audio/story-steve-wither/page-3.mp3","lang":"zh-CN"}},{"title":"有一天，天空变暗了","scene":"listening","detailsText":"有一天，天空变暗了。可怕的咆哮震动了大地。凋零来了。\nOne day, the sky turned dark. A terrible roar shook the ground. The Wither was coming.","textZh":"有一天，天空变暗了。可怕的咆哮震动了大地。凋零来了。","textEn":"One day, the sky turned dark.\nA terrible roar shook the gro…","images":["../../local/images/minecraft/mobs/iron-golem.png"],"imageAlt":"有一天，天空变暗了"},{"title":"我需要从天空战斗它，\"史蒂夫说","scene":"meadow","detailsText":"\"我需要从天空战斗它，\"史蒂夫说。他开始建造一个从来没有人见过的东西——一架飞机。\nSteve said he needed to fight from the sky. He began to build an airplane.","textZh":"\"我需要从天空战斗它，\"史蒂夫说。他开始建造一个从来没有人见过的东西——一架飞机。","textEn":"Steve said he needed to fight from the sky.\nHe began to bui…","images":["../../local/images/minecraft/items/diamond-sword.png"],"imageAlt":"我需要从天空战斗它，\"史蒂夫说"},{"title":"日日夜夜，史蒂夫在他的飞机上工作","scene":"picnic","detailsText":"日日夜夜，史蒂夫在他的飞机上工作。他锤打铁器，弯曲木材，安装巨大的螺旋桨。\nDay and night, Steve worked on his airplane. He hammered iron and attached big propellers.","textZh":"日日夜夜，史蒂夫在他的飞机上工作。他锤打铁器，弯曲木材，安装巨大的螺旋桨。","textEn":"Day and night, Steve worked on his airplane.\nHe hammered ir…","images":["../../local/images/minecraft/enderman.png"],"imageAlt":"日日夜夜，史蒂夫在他的飞机上工作"},{"title":"终于，它完成了","scene":"wind","detailsText":"终于，它完成了。一架美丽的红色双翼飞机，在阳光下闪闪发光。史蒂夫叫它\"天空骑士\"。\nFinally it was done. A beautiful red biplane, shining in the sunlight. Steve called it Sky Knight.","textZh":"终于，它完成了。一架美丽的红色双翼飞机，在阳光下闪闪发光。史蒂夫叫它\"天空骑士\"。","textEn":"Finally it was done.\nA beautiful red biplane, shining in th…","images":["../../local/images/minecraft/items/shield.png"],"imageAlt":"终于，它完成了"},{"title":"村民们聚在一起观看","scene":"listening","detailsText":"村民们聚在一起观看。史蒂夫戴上护目镜，爬进驾驶舱。\nThe villagers gathered to watch. Steve put on his goggles and climbed into the cockpit.","textZh":"村民们聚在一起观看。史蒂夫戴上护目镜，爬进驾驶舱。","textEn":"The villagers gathered to watch.\nSteve put on his goggles a…","images":["../../local/images/minecraft/steve.png"],"imageAlt":"村民们聚在一起观看"},{"title":"引擎轰鸣","scene":"meadow","detailsText":"引擎轰鸣。螺旋桨越转越快。然后，史蒂夫飞起来了！\nThe engine roared. The propeller spun faster and faster. Then Steve was flying!","textZh":"引擎轰鸣。螺旋桨越转越快。然后，史蒂夫飞起来了！","textEn":"The engine roared.\nThe propeller spun faster and faster.\nTh…","images":["../../local/images/minecraft/mobs/wither.png"],"imageAlt":"引擎轰鸣"},{"title":"在天空中，一切看起来都不一样了","scene":"picnic","detailsText":"在天空中，一切看起来都不一样了。世界很大很美。史蒂夫感觉像鸟一样自由。\nUp in the sky, everything looked different. The world was big and beautiful.","textZh":"在天空中，一切看起来都不一样了。世界很大很美。史蒂夫感觉像鸟一样自由。","textEn":"Up in the sky, everything looked different.\nThe world was b…","images":["../../local/images/minecraft/items/netherite-sword.png"],"imageAlt":"在天空中，一切看起来都不一样了"},{"title":"但很快，天空又变暗了","scene":"wind","detailsText":"但很快，天空又变暗了。紫色的云在前方旋转。史蒂夫紧紧握住操纵杆。\nBut soon the sky grew dark again. Purple clouds swirled ahead. Steve gripped the controls tightly.","textZh":"但很快，天空又变暗了。紫色的云在前方旋转。史蒂夫紧紧握住操纵杆。","textEn":"But soon the sky grew dark again.\nPurple clouds swirled ahe…","images":["../../local/images/minecraft/blocks/tnt.png"],"imageAlt":"但很快，天空又变暗了"},{"title":"然后他看到了——凋零","scene":"listening","detailsText":"然后他看到了——凋零。一个巨大的生物，有三个头，发出蓝色光芒的眼睛，黑暗的力量在它周围旋转。\nThen he saw it - the Wither. A giant creature with three heads and glowing blue eyes.","textZh":"然后他看到了——凋零。一个巨大的生物，有三个头，发出蓝色光芒的眼睛，黑暗的力量在它周围旋转。","textEn":"Then he saw it - the Wither.\nA giant creature with three he…","images":["../../local/images/minecraft/mobs/iron-golem.png"],"imageAlt":"然后他看到了——凋零"},{"title":"凋零向史蒂夫射出爆炸骷髅头","scene":"meadow","detailsText":"凋零向史蒂夫射出爆炸骷髅头！他向左转，然后向右转。轰！轰！天空中满是爆炸。\nThe Wither shot explosive skulls at Steve! He swerved left, then right. BOOM! BOOM!","textZh":"凋零向史蒂夫射出爆炸骷髅头！他向左转，然后向右转。轰！轰！天空中满是爆炸。","textEn":"The Wither shot explosive skulls at Steve!\nHe swerved left,…","images":["../../local/images/minecraft/items/diamond-sword.png"],"imageAlt":"凋零向史蒂夫射出爆炸骷髅头"},{"title":"一个骷髅头直冲他而来","scene":"picnic","detailsText":"一个骷髅头直冲他而来！史蒂夫把飞机翻了过来，从它旁边飞过。好险！\nOne skull came straight at him! Steve flipped his plane upside down and zoomed past it.","textZh":"一个骷髅头直冲他而来！史蒂夫把飞机翻了过来，从它旁边飞过。好险！","textEn":"One skull came straight at him!\nSteve flipped his plane ups…","images":["../../local/images/minecraft/enderman.png"],"imageAlt":"一个骷髅头直冲他而来"},{"title":"我需要反击","scene":"wind","detailsText":"\"我需要反击！\"史蒂夫拿起他的附魔弓。他有特殊的箭——光之箭。\nI need to fight back! Steve grabbed his enchanted bow with special arrows of light.","textZh":"\"我需要反击！\"史蒂夫拿起他的附魔弓。他有特殊的箭——光之箭。","textEn":"I need to fight back!\nSteve grabbed his enchanted bow with …","images":["../../local/images/minecraft/items/shield.png"],"imageAlt":"我需要反击"},{"title":"史蒂夫仔细瞄准","scene":"listening","detailsText":"史蒂夫仔细瞄准。他射箭了！金色的箭像流星一样划过黑暗的天空。\nSteve aimed carefully. He fired! Golden arrows streaked through the dark sky like shooting stars.","textZh":"史蒂夫仔细瞄准。他射箭了！金色的箭像流星一样划过黑暗的天空。","textEn":"Steve aimed carefully.\nHe fired!\nGolden arrows streaked thr…","images":["../../local/images/minecraft/steve.png"],"imageAlt":"史蒂夫仔细瞄准"},{"title":"命中","scene":"meadow","detailsText":"命中！箭射中了凋零的第一个头。它痛苦地尖叫！蓝色火花四处飞溅。\nHIT! The arrow struck the Wither head. It screamed in pain! Blue sparks flew everywhere.","textZh":"命中！箭射中了凋零的第一个头。它痛苦地尖叫！蓝色火花四处飞溅。","textEn":"HIT!\nThe arrow struck the Wither head.\nIt screamed in pain!","images":["../../local/images/minecraft/mobs/wither.png"],"imageAlt":"命中"},{"title":"凋零暴怒了","scene":"picnic","detailsText":"凋零暴怒了！它变得更大，向四面八方射出骷髅头。天空变成了战场。\nThe Wither was furious! It grew bigger and shot skulls in every direction.","textZh":"凋零暴怒了！它变得更大，向四面八方射出骷髅头。天空变成了战场。","textEn":"The Wither was furious!\nIt grew bigger and shot skulls in e…","images":["../../local/images/minecraft/items/netherite-sword.png"],"imageAlt":"凋零暴怒了"},{"title":"砰","scene":"wind","detailsText":"砰！一个骷髅头击中了史蒂夫的机翼。烟冒了出来。飞机摇晃着。但史蒂夫没有放弃。\nCRASH! A skull hit Steve wing. Smoke poured out. But Steve did not give up.","textZh":"砰！一个骷髅头击中了史蒂夫的机翼。烟冒了出来。飞机摇晃着。但史蒂夫没有放弃。","textEn":"CRASH!\nA skull hit Steve wing.\nSmoke poured out.","images":["../../local/images/minecraft/blocks/tnt.png"],"imageAlt":"砰"},{"title":"史蒂夫在驾驶舱里站起来","scene":"listening","detailsText":"史蒂夫在驾驶舱里站起来。他只剩一支箭了——他最强的一支。\"这是为了我的村庄！\"\nSteve stood up in his cockpit. He had one arrow left - his strongest one.","textZh":"史蒂夫在驾驶舱里站起来。他只剩一支箭了——他最强的一支。\"这是为了我的村庄！\"","textEn":"Steve stood up in his cockpit.\nHe had one arrow left - his …","images":["../../local/images/minecraft/mobs/iron-golem.png"],"imageAlt":"史蒂夫在驾驶舱里站起来"},{"title":"他射箭了","scene":"meadow","detailsText":"他射箭了！金色的箭笔直飞去。它分裂成三束光，同时击中了三个头！\nHe fired! The golden arrow split into three beams and hit all three heads at once!","textZh":"他射箭了！金色的箭笔直飞去。它分裂成三束光，同时击中了三个头！","textEn":"He fired
