    <script>window.COURSEWARE_CONFIG = {"id":"story-extra-04","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"story_extra_04_小鱼的美人鱼梦.html","steps":[{"title":"闪闪的小秘密","scene":"meadow","detailsText":"在蓝宝石海湾的珊瑚丛里，住着一条名叫闪闪的小鱼。她有一身橘红色的鳞片，在阳光下游动时，就像一团燃烧的小火焰。\n闪闪每天和其他小鱼一起玩耍，但她心里藏着一个特别的秘密——她梦想成为一名美人鱼。\n🐡 阿圆：可是美人鱼都有腿，我们只有尾巴。\n🐠 闪闪：但美人鱼也生活在海里呀！我觉得我也可以！","textZh":"在蓝宝石海湾的珊瑚丛里，住着一条名叫闪闪的小鱼。她有一身橘红色的鳞片，在阳光下游动时，就像一团燃烧的小火焰。\n闪闪每天和其他小鱼一起玩耍，但她心里藏着一个特别的秘密——她梦想成为一名美人鱼。\n🐡 阿圆：可是美人鱼都有腿，我们只有尾巴。\n🐠 闪闪：但美人鱼也生活在海里呀！我觉得我也可以！","images":["../../local/generated-visuals/story-extra-04/page-1.webp"],"imageAlt":"闪闪的小秘密主题插图"},{"title":"奇怪的练习","scene":"picnic","detailsText":"从那天起，闪闪开始了奇怪的练习。每天早晨，她都躲在摇曳的海草后面，努力练习\"站立\"。她把尾巴紧紧蜷缩起来，试图用尾鳍尖触碰海底——当然，每次都会摔倒。\n更难的是学唱歌。美人鱼的歌声要像海浪轻轻拍打礁石，可闪闪一唱歌，总会吓跑附近的小虾米。\n🐠 闪闪：也许……也许我根本不是当美人鱼的料。","textZh":"从那天起，闪闪开始了奇怪的练习。每天早晨，她都躲在摇曳的海草后面，努力练习\"站立\"。她把尾巴紧紧蜷缩起来，试图用尾鳍尖触碰海底——当然，每次都会摔倒。\n更难的是学唱歌。美人鱼的歌声要像海浪轻轻拍打礁石，可闪闪一唱歌，总会吓跑附近的小虾米。\n🐠 闪闪：也许……也许我根本不是当美人鱼的料。","images":["../../local/generated-visuals/story-extra-04/page-1.webp"],"imageAlt":"奇怪的练习主题插图"},{"title":"月光下的相遇","scene":"wind","detailsText":"那天晚上，月光像银色的纱巾铺在海面上。闪闪独自浮到海面下层，看着月亮发呆。\n突然，一阵空灵的歌声随海浪传来。闪闪看见一位美人鱼——她有着月光般的银色长发，鱼尾闪烁着珍珠般的光芒。\n🐠 闪闪：你……你是美人鱼公主吗？\n🧜‍♀️ 海月：我叫海月。而你，是那条在练习\"站立\"的小鱼吧？","textZh":"那天晚上，月光像银色的纱巾铺在海面上。闪闪独自浮到海面下层，看着月亮发呆。\n突然，一阵空灵的歌声随海浪传来。闪闪看见一位美人鱼——她有着月光般的银色长发，鱼尾闪烁着珍珠般的光芒。\n🐠 闪闪：你……你是美人鱼公主吗？\n🧜‍♀️ 海月：我叫海月。而你，是那条在练习\"站立\"的小鱼吧？","images":["../../local/generated-visuals/story-extra-04/page-1.webp"],"imageAlt":"月光下的相遇主题插图"},{"title":"美人鱼的礼物","scene":"listening","detailsText":"🧜‍♀️ 海月：为什么想成为美人鱼呢？\n🐠 闪闪：因为想用歌声帮助别人。就像你以前治愈珊瑚礁那样。\n🧜‍♀️ 海月：我治愈珊瑚礁，不是因为我有美人鱼的外表，而是因为我用心感受了珊瑚礁的痛苦。\n🧜‍♀️ 海月：你知道吗？你每天练习时，尾巴拍打水波的声音，其实一直在安慰那些被海浪吓到的小贝壳。","textZh":"🧜‍♀️ 海月：为什么想成为美人鱼呢？\n🐠 闪闪：因为想用歌声帮助别人。就像你以前治愈珊瑚礁那样。\n🧜‍♀️ 海月：我治愈珊瑚礁，不是因为我有美人鱼的外表，而是因为我用心感受了珊瑚礁的痛苦。\n🧜‍♀️ 海月：你知道吗？你每天练习时，尾巴拍打水波的声音，其实一直在安慰那些被海浪吓到的小贝壳。","images":["../../local/generated-visuals/story-extra-04/page-1.webp"],"imageAlt":"美人鱼的礼物主题插图"},{"title":"小鱼的新发现","scene":"meadow","detailsText":"第二天，闪闪不再练习站立了。她游向生病的珊瑚礁，用尾巴轻轻扇动，把干净的海水带到珊瑚身边。\n她发现自己的尾鳍摆动得特别有节奏——那是她练习时自然形成的节奏。\n🐠 闪闪：原来我的尾巴有这样的力量！\n她唱起妈妈教她的《海洋摇篮曲》。奇妙的是，那些小贝壳真的随着她的歌声慢慢舒展开来。","textZh":"第二天，闪闪不再练习站立了。她游向生病的珊瑚礁，用尾巴轻轻扇动，把干净的海水带到珊瑚身边。\n她发现自己的尾鳍摆动得特别有节奏——那是她练习时自然形成的节奏。\n🐠 闪闪：原来我的尾巴有这样的力量！\n她唱起妈妈教她的《海洋摇篮曲》。奇妙的是，那些小贝壳真的随着她的歌声慢慢舒展开来。","images":["../../local/generated-visuals/story-extra-04/page-1.webp"],"imageAlt":"小鱼的新发现主题插图"},{"title":"真正的美人鱼","scene":"picnic","detailsText":"一个月后，生病的珊瑚礁重新焕发了色彩。闪闪成了海底最受欢迎的小鱼。\n🧜‍♀️ 海月：你现在还想成为美人鱼吗？\n🐠 闪闪：我想……我已经知道美人鱼的秘密了。美人鱼不是一种外表，而是一种心意。\n🧜‍♀️ 海月：那么，你已经是真正的美人鱼了——用你自己的方式。\n从那天起，蓝宝石海湾多了一条特别的小鱼。她不再羡慕别人，因为她明白了：每条鱼都有自己的闪光方式，而最闪亮的鳞片，是善良的心。\n📖 寓意：真正的美丽来自内心的善良与坚持。用自己独特的方式去帮助别人，就是最了不起的\"魔法\"。","textZh":"一个月后，生病的珊瑚礁重新焕发了色彩。闪闪成了海底最受欢迎的小鱼。\n🧜‍♀️ 海月：你现在还想成为美人鱼吗？\n🐠 闪闪：我想……我已经知道美人鱼的秘密了。美人鱼不是一种外表，而是一种心意。\n🧜‍♀️ 海月：那么，你已经是真正的美人鱼了——用你自己的方式。","images":["../../local/generated-visuals/story-extra-04/page-1.webp"],"imageAlt":"真正的美人鱼主题插图"}]};</script>
