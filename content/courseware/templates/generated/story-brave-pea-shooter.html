    <script>window.COURSEWARE_CONFIG = {"id":"story-brave-pea-shooter","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"childrens-library/courseware/stories/story-brave-pea-shooter.html","steps":[{"title":"故事开始","scene":"meadow","detailsText":"在一个明亮、阳光灿烂的花园里，住着一只绿色的小豌豆射手，名叫皮皮。他有一双圆圆的大眼睛，一个开心的笑容，头顶上还有一片小叶子。皮皮爱他的花园家园胜过世界上的一切。","textZh":"在一个明亮、阳光灿烂的花园里，住着一只绿色的小豌豆射手，名叫皮皮。他有一双圆圆的大眼睛，一个开心的笑容，头顶上还有一片小叶子。皮皮爱他的花园家园胜过世界上的一切。","images":["../../local/images/minecraft/zombie.png"],"imageAlt":"故事开始","audio":{"src":"../../local/audio/story-brave-pea-shooter/page-1.mp3","lang":"zh-CN"}},{"title":"准备行动","scene":"picnic","detailsText":"在一个明亮、阳光灿烂的花园里，住着一只绿色的小豌豆射手，名叫皮皮。他有一双圆圆的大眼睛，一个开心的笑容，头顶上还有一片小叶子。皮皮爱他的花园家园胜过世界上的一切。\nIn a bright, sunny garden lived a tiny green Pea Shooter named Pip. He had big round eyes, a cheerful smile, and a little leaf on his head. Pip loved his garden home more than anything in the world.","textZh":"在一个明亮、阳光灿烂的花园里，住着一只绿色的小豌豆射手，名叫皮皮。他有一双圆圆的大眼睛，一个开心的笑容，头顶上还有一片小叶子。皮皮爱他的花园家园胜过世界上的一切。","textEn":"In a bright, sunny garden lived a tiny green Pea Shooter na…","images":["../../local/images/minecraft/zombie.png"],"imageAlt":"准备行动","audio":{"src":"../../local/audio/story-brave-pea-shooter/page-2.mp3","lang":"zh-CN"}},{"title":"一个阳光明媚的早晨，皮皮决定沿…","scene":"wind","detailsText":"一个阳光明媚的早晨，皮皮决定沿着鹅卵石小路散步。花朵们在他经过时向他挥手，蝴蝶在他头顶翩翩起舞。\nOne sunny morning, Pip decided to take a walk along the cobblestone path. The flowers waved at him as he passed. Butterflies danced around his head.","textZh":"一个阳光明媚的早晨，皮皮决定沿着鹅卵石小路散步。花朵们在他经过时向他挥手，蝴蝶在他头顶翩翩起舞。","textEn":"One sunny morning, Pip decided to take a walk along the cob…","images":["../../local/images/minecraft/skeleton.png"],"imageAlt":"一个阳光明媚的早晨，皮皮决定沿…","audio":{"src":"../../local/audio/story-brave-pea-shooter/page-3.mp3","lang":"zh-CN"}},{"title":"皮皮走过花园中最美丽的地方","scene":"listening","detailsText":"皮皮走过花园中最美丽的地方。高高的向日葵像卫兵一样站着，五颜六色的蘑菇点缀着地面，蜜 happened.\nThe peas bounced right off…","images":["../../local/images/minecraft/mobs/iron-golem.png"],"imageAlt":"但可怕的事情发生了"},{"title":"皮皮转身拼命地跑","scene":"meadow","detailsText":"皮皮转身拼命地跑。他飞速经过樱桃炸弹和土豆地雷，到处寻找帮助。\nPip turned and ran as fast as his little legs could carry him. He zoomed past Cherry Bombs and Potato Mines, looking for help.","textZh":"皮皮转身拼命地跑。他飞速经过樱桃炸弹和土豆地雷，到处寻找帮助。","textEn":"Pip turned and ran as fast as his little legs could carry h…","images":["../../local/images/minecraft/crafting-table.png"],"imageAlt":"皮皮转身拼命地跑"},{"title":"然后皮皮找到了他最好的朋友——…","scene":"picnic","detailsText":"然后皮皮找到了他最好的朋友——向日葵小阳！小阳有明亮金色的花瓣和温暖善良的笑容，她总是让每个人感觉好起来。\nThen Pip found his best friend — Sunny the Sunflower! Sunny had bright golden petals and a warm, kind smile. She always made everyone feel better.","textZh":"然后皮皮找到了他最好的朋友——向日葵小阳！小阳有明亮金色的花瓣和温暖善良的笑容，她总是让每个人感觉好起来。","textEn":"Then Pip found his best friend — Sunny the Sunflower!\nSunny…","images":["../../local/images/minecraft/zombie.png"],"imageAlt":"然后皮皮找到了他最好的朋友——…"},{"title":"小阳仔细听着，点了点头","scene":"wind","detailsText":"小阳仔细听着，点了点头。“别担心，皮皮。我完全知道该怎么办。我们需要叫一个非常特别的人——一个非常火热的人！”\nSunny listened carefully and nodded. \"Don't worry, Pip. I know exactly what to do. We need to call someone very special — someone very HOT!\"","textZh":"小阳仔细听着，点了点头。“别担心，皮皮。我完全知道该怎么办。我们需要叫一个非常特别的人——一个非常火热的人！”","textEn":"Sunny listened carefully and nodded.\n\"Don't worry, Pip.\nI k…","images":["../../local/images/minecraft/skeleton.png"],"imageAlt":"小阳仔细听着，点了点头"},{"title":"小阳闭上眼睛，把脸朝向天空","scene":"listening","detailsText":"小阳闭上眼睛，把脸朝向天空。她金色的花瓣开始越来越亮地发光，神奇的金色火花围绕着她旋转。\nSunny closed her eyes and lifted her face to the sky. Her golden petals began to glow brighter and brighter. Magical golden sparkles swirled around her.","textZh":"小阳闭上眼睛，把脸朝向天空。她金色的花瓣开始越来越亮地发光，神奇的金色火花围绕着她旋转。","textEn":"Sunny closed her eyes and lifted her face to the sky.\nHer g…","images":["../../local/images/minecraft/creeper.png"],"imageAlt":"小阳闭上眼睛，把脸朝向天空"},{"title":"一颗又一颗美丽的金色阳光球从小…","scene":"meadow","detailsText":"一颗又一颗美丽的金色阳光球从小阳的花瓣中飘出。它们像小太阳一样闪耀，让空气中充满了温暖。\nOne by one, beautiful golden orbs of sunlight floated from Sunny's petals. They sparkled like tiny suns, filling the air with warmth.","textZh":"一颗又一颗美丽的金色阳光球从小阳的花瓣中飘出。它们像小太阳一样闪耀，让空气中充满了温暖。","textEn":"One by one, beautiful golden orbs of sunlight floated from …","images":["../../local/images/minecraft/items/crossbow.png"],"imageAlt":"一颗又一颗美丽的金色阳光球从小…"},{"title":"但僵尸越来越近了","scene":"picnic","detailsText":"但僵尸越来越近了！它现在已经到了花园的边缘。小阳发出更亮的光，产生越来越多的阳光。\nBut the zombie was getting closer! It was now at the edge of the garden. Sunny glowed even brighter, producing more and more sunlight.","textZh":"但僵尸越来越近了！它现在已经到了花园的边缘。小阳发出更亮的光，产生越来越多的阳光。","textEn":"But the zombie was getting closer!\nIt was now at the edge o…","images":["../../local/images/minecraft/spider.png"],"imageAlt":"但僵尸越来越近了"},{"title":"终于，一大堆金色阳光球聚集在地面上","scene":"wind","detailsText":"终于，一大堆金色阳光球聚集在地面上。皮皮和小阳欢呼起来！他们现在有足够的能量了。\nFinally, a big pile of golden sunlight orbs gathered on the ground. Pip and Sunny cheered! They had enough energy now.","textZh":"终于，一大堆金色阳光球聚集在地面上。皮皮和小阳欢呼起来！他们现在有足够的能量了。","textEn":"Finally, a big pile of golden sunlight orbs gathered on the…","images":["../../local/images/minecraft/blocks/tnt.png"],"imageAlt":"终于，一大堆金色阳光球聚集在地面上"},{"title":"小阳把所有金色的光聚在一起，她…","scene":"listening","detailsText":"小阳把所有金色的光聚在一起，她低声念着魔法咒语，让地面发出隆隆声。大地开始震动和裂开。\nSunny gathered all the golden light together. She whispered magical words that made the ground rumble. The earth began to shake and crack.","textZh":"小阳把所有金色的光聚在一起，她低声念着魔法咒语，让地面发出隆隆声。大地开始震动和裂开。","textEn":"Sunny gathered all the golden light together.\nShe whispered…","images":["../../local/images/minecraft/mobs/iron-golem.png"],"imageAlt":"小阳把所有金色的光聚在一起，她…"},{"title":"裂开","scene":"meadow","detailsText":"裂开！轰！一个巨大的红色火爆辣椒从土壤中冲了出来！他巨大、凶猛，而且全身着火！火焰像火山一样从他的身体喷射出来。\nCRACK! BOOM! A GIANT red Jalapeno burst from the soil! He was enormous, fierce, and ON FIRE! Flames shot from his body like a volcano.","textZh":"裂开！轰！一个巨大的红色火爆辣椒从土壤中冲了出来！他巨大、凶猛，而且全身着火！火焰像火山一样从他的身体喷射出来。","textEn":"CRACK!\nBOOM!\nA GIANT red Jalapeno burst from the soil!","images":["../../local/images/minecraft/crafting-table.png"],"imageAlt":"裂开"},{"title":"火爆辣椒看到了僵尸，他的眼睛因…","scene":"picnic","detailsText":"火爆辣椒看到了僵尸，他的眼睛因愤怒而燃烧。红色和橙色的火焰到处喷发！整个花园被火热的颜色照亮了。\nJalapeno saw the zombie and his eyes blazed with anger. Red and orange flames erupted everywhere! The entire garden lit up in fiery colors.","textZh":"火爆辣椒看到了僵尸，他的眼睛因愤怒而燃烧。红色和橙色的火焰到处喷发！整个花园被火热的颜色照亮了。","textEn":"Jalapeno saw the zombie and his eyes blazed with anger.\nRed…","images":["../../local/images/minecraft/zombie.png"],"imageAlt":"火爆辣椒看到了僵尸，他的眼睛因…"},{"title":"火爆辣椒深吸一口气，呼——巨大…","scene":"wind","detailsText":"火爆辣椒深吸一口气，呼——巨大的火焰波击中了路障僵尸！路障像黄油一样融化了。僵尸尖叫一声，在一缕烟雾中消失了。\nJalapeno took a deep breath and WHOOSH — a massive wave of fire hit the Conehead Zombie! The traffic cone melted like butter. The zombie screamed and disappeared in a puff of smoke.","textZh":"火爆辣椒深吸一口气，呼——巨大的火焰波击中了路障僵尸！路障像黄油一样融化了。僵尸尖叫一声，在一缕烟雾中消失了。","textEn":"Jalapeno took a deep breath and WHOOSH — a massive wave of …","images":["../../local/images/minecraft/skeleton.png"],"imageAlt":"火爆辣椒深吸一口气，呼——巨大…"},{"title":"皮皮和小阳开心地欢呼","scene":"listening","detailsText":"皮皮和小阳开心地欢呼！僵尸原来在的地方，只剩下一个小小的烟雾。花园再次安全了。\nPip and Sunny cheered happily! Where the zombie had been, there was only a small puff of smoke. The garden was safe once more.","textZh":"皮皮和小阳开心地欢呼！僵尸原来在的地方，只剩下一个小小的烟雾。花园再次安全了。","textEn":"Pip and Sunny cheered happily!\nWhere the zombie had been, t…","images":["../../local/images/minecraft/creeper.png"],"imageAlt":"皮皮和小阳开心地欢呼"},{"title":"读完啦！","scene":"meadow","detailsText":"\\u592a\\u68d2\\u4e86\\uff01\\u4f60\\u8bfb\\u5b8c\\u4e86\\u300a勇敢的豌豆射手\\u300b\\uff01","textZh":"\\u592a\\u68d2\\u4e86\\uff01\\u4f60\\u8bfb\\u5b8c\\u4e86\\u300a勇敢的豌豆射手\\u300b\\uff01","images":["../../local/generated-visuals/shared-stories/page-1.webp"],"imageAlt":"读完啦！主题插图"}]};</script>
