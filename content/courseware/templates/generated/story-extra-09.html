    <script>window.COURSEWARE_CONFIG = {"id":"story-extra-09","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"story_extra_09_图书馆里的龙.html","steps":[{"title":"从书里钻出来的小龙","scene":"meadow","detailsText":"在一个下雨的星期六，七岁的朵朵踮着脚尖，从图书馆最高的书架上取下一本厚厚的旧书。封面上画着一只喷火的龙，书名是《失落的龙之书》。\n突然，书页里飘出一阵银色的光点，像小小的星星落在地板上。光点越聚越多，慢慢变成一个毛茸茸的轮廓——一只巴掌大的小龙从书里钻了出来！\n🐉 阿云：对不起，我叫阿云。我在这本书里睡了一百年，听到你翻书的声音就醒了。\n👧 朵朵：一百年？那你一定知道很多古老的故事！","textZh":"在一个下雨的星期六，七岁的朵朵踮着脚尖，从图书馆最高的书架上取下一本厚厚的旧书。封面上画着一只喷火的龙，书名是《失落的龙之书》。\n突然，书页里飘出一阵银色的光点，像小小的星星落在地板上。光点越聚越多，慢慢变成一个毛茸茸的轮廓——一只巴掌大的小龙从书里钻了出来！","images":["../../local/generated-visuals/story-extra-09/page-1.webp"],"imageAlt":"从书里钻出来的小龙主题插图"},{"title":"秘密游戏","scene":"picnic","detailsText":"从那天起，朵朵每天放学后都来图书馆，阿云躲在她的书包里。她们发明了一个秘密游戏：阿云会悄悄飞到儿童阅览区的角落，等朵朵找到一本故事书，阿云就用心倾听。\n有时候，当故事讲到龙喷火时，阿云兴奋得尾巴都翘起来，差点喷出小火苗。\n👩‍🏫 王老师：朵朵，最近《恐龙百科》的书页总是莫名其妙粘在一起，还有几本童话书的插图上多了些亮晶晶的鳞粉……你知道是怎么回事吗？","textZh":"从那天起，朵朵每天放学后都来图书馆，阿云躲在她的书包里。她们发明了一个秘密游戏：阿云会悄悄飞到儿童阅览区的角落，等朵朵找到一本故事书，阿云就用心倾听。\n有时候，当故事讲到龙喷火时，阿云兴奋得尾巴都翘起来，差点喷出小火苗。","images":["../../local/generated-visuals/story-extra-09/page-1.webp"],"imageAlt":"秘密游戏主题插图"},{"title":"阿云的难过","scene":"wind","detailsText":"那天晚上，阿云第一次难过得吐出了一颗小火球。火球落在空花盆里，把干土烤得发红。\n🐉 阿云：对不起，我太想和大家交朋友了，但我总是控制不住自己。也许……也许我应该回到那本书里去。\n👧 朵朵：别难过！我们想想办法，好吗？","textZh":"那天晚上，阿云第一次难过得吐出了一颗小火球。火球落在空花盆里，把干土烤得发红。\n🐉 阿云：对不起，我太想和大家交朋友了，但我总是控制不住自己。也许……也许我应该回到那本书里去。\n👧 朵朵：别难过！我们想想办法，好吗？","images":["../../local/generated-visuals/story-extra-09/page-1.webp"],"imageAlt":"阿云的难过主题插图"},{"title":"图书馆的新\"修复师\"","scene":"listening","detailsText":"朵朵鼓起勇气向王老师坦白了一切。王老师看了看书包里探出脑袋的阿云，沉思了很久。\n👩‍🏫 王老师：图书馆的规则是保护书籍，但规则背后是对知识和故事的珍视。阿云，你愿意用你的能力来帮助我们吗？\n从那天起，图书馆里多了一个特别的\"修复师\"。阿云学会控制自己的小火苗，它能用温暖干燥的气息让受潮的旧书恢复平整；它吐出的淡淡银烟，能让模糊的字迹重新清晰。","textZh":"朵朵鼓起勇气向王老师坦白了一切。王老师看了看书包里探出脑袋的阿云，沉思了很久。\n👩‍🏫 王老师：图书馆的规则是保护书籍，但规则背后是对知识和故事的珍视。阿云，你愿意用你的能力来帮助我们吗？","images":["../../local/generated-visuals/story-extra-09/page-1.webp"],"imageAlt":"图书馆的新\"修复师\"主题插图"},{"title":"神奇的故事时间","scene":"meadow","detailsText":"但最神奇的是每个周三的故事时间。阿云会蜷缩在故事角的软垫上，当讲到《喷火龙》时，它就轻轻喷出一小团七彩的烟雾；讲到《海底王国》时，烟雾会变成小鱼的样子；讲到《太空探险》时，烟雾里会闪烁星星的光芒。\n孩子们最喜欢听阿云补充的\"龙之传说\"：\"很久很久以前，有一条老龙把云朵当作枕头，把月光当作小夜灯，它守护着世界上所有的故事，直到每个故事都找到爱它的人……\"\n（完）","textZh":"但最神奇的是每个周三的故事时间。阿云会蜷缩在故事角的软垫上，当讲到《喷火龙》时，它就轻轻喷出一小团七彩的烟雾；讲到《海底王国》时，烟雾会变成小鱼的样子；讲到《太空探险》时，烟雾里会闪烁星星的光芒。","images":["../../local/generated-visuals/story-extra-09/page-1.webp"],"imageAlt":"神奇的故事时间主题插图"}]};</script>
