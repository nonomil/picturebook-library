    <script>window.COURSEWARE_CONFIG = {"id":"story-extra-08","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"story_extra_08_会变色的兔子.html","steps":[{"title":"会变色的棉棉","scene":"meadow","detailsText":"春天来了，森林里嫩芽点点，像撒了一地绿色的小星星。在森林边的一个小土坡上，住着一只特别的兔子，名叫棉棉。棉棉有一身雪白雪白的毛，就像天上的云朵掉下来一样。但最特别的是——棉棉的毛会变色！\n当春天的花儿盛开时，棉棉跑过郁金香花丛，白色的毛就变成了橙红色；夏天躺在草地上晒太阳，毛又变成了清新的嫩绿色；秋天踩过铺满金黄落叶的小路，毛就染上了温暖的橘黄色；冬天雪花飘落，棉棉又变回了雪白的模样，和白雪融为一体。\n🐰 棉棉：你们看，我会变色！森林里就我一个有这么棒的本领！","textZh":"春天来了，森林里嫩芽点点，像撒了一地绿色的小星星。在森林边的一个小土坡上，住着一只特别的兔子，名叫棉棉。棉棉有一身雪白雪白的毛，就像天上的云朵掉下来一样。但最特别的是——棉棉的毛会变色！","images":["../../local/generated-visuals/story-extra-08/page-1.webp"],"imageAlt":"会变色的棉棉主题插图"},{"title":"变色的烦恼","scene":"picnic","detailsText":"可是渐渐地，棉棉发现了一个问题。一天，朋友们约好一起去采草莓。棉棉兴冲冲地答应了，可当他来到草莓地时，他突然变成了草莓的红色，完全融进了红色的草莓丛中。\n🐿️ 小松鼠点点：棉棉？棉棉，你在哪里呀？\n🐰 棉棉：我在这里呀！我就在你们面前！\n可朋友们就是看不见他。因为一只红色的兔子躺在红色的草莓中间，实在太难分辨了！还有一次更尴尬——朋友们举办森林舞会，棉棉穿上蓝色小衬衫，可他的毛立刻变成了天蓝色，朋友们以为他没穿衣服。","textZh":"可是渐渐地，棉棉发现了一个问题。一天，朋友们约好一起去采草莓。棉棉兴冲冲地答应了，可当他来到草莓地时，他突然变成了草莓的红色，完全融进了红色的草莓丛中。\n🐿️ 小松鼠点点：棉棉？棉棉，你在哪里呀？\n🐰 棉棉：我在这里呀！我就在你们面前！","images":["../../local/generated-visuals/story-extra-08/page-1.webp"],"imageAlt":"变色的烦恼主题插图"},{"title":"妈妈的智慧","scene":"wind","detailsText":"回到家，棉棉趴在妈妈身边，闷闷不乐。\n🐰 棉棉：妈妈，变色一点都不好。朋友们都看不见我真正的样子。\n🐰 兔妈妈：孩子，任何能力都有它的好处和烦恼。重要的是你怎么用它。你的变色能力不是为了让你看起来与众不同，而是可以用来帮助别人呀。\n棉棉的眼睛慢慢亮了起来。","textZh":"回到家，棉棉趴在妈妈身边，闷闷不乐。\n🐰 棉棉：妈妈，变色一点都不好。朋友们都看不见我真正的样子。\n🐰 兔妈妈：孩子，任何能力都有它的好处和烦恼。重要的是你怎么用它。你的变色能力不是为了让你看起来与众不同，而是可以用来帮助别人呀。\n棉棉的眼睛慢慢亮了起来。","images":["../../local/generated-visuals/story-extra-08/page-1.webp"],"imageAlt":"妈妈的智慧主题插图"},{"title":"帮助朋友","scene":"listening","detailsText":"第二天，棉棉决定试试妈妈的方法。森林里有一只小刺猬叫球球，他总是很害羞，因为害怕自己的刺会扎到朋友。棉棉悄悄靠近球球，变出了温暖的土黄色，就像一小块阳光照在球球身边。\n🦔 球球：咦？好暖和呀。棉棉，你怎么……\n🐰 棉棉：嘘，我只是想陪你坐一会儿，不会扎到你的。\n球球感动极了，第一次和朋友靠得这么近。","textZh":"第二天，棉棉决定试试妈妈的方法。森林里有一只小刺猬叫球球，他总是很害羞，因为害怕自己的刺会扎到朋友。棉棉悄悄靠近球球，变出了温暖的土黄色，就像一小块阳光照在球球身边。\n🦔 球球：咦？好暖和呀。棉棉，你怎么……\n🐰 棉棉：嘘，我只是想陪你坐一会儿，不会扎到你的。\n球球感动极了，第一次和朋友靠得这么近。","images":["../../local/generated-visuals/story-extra-08/page-1.webp"],"imageAlt":"帮助朋友主题插图"},{"title":"守护大家","scene":"meadow","detailsText":"又过了一周，森林里传来消息：狐狸阿灰在傍晚时总会悄悄靠近小兔子们玩耍的地方。大家都很害怕，傍晚都不敢出门玩了。\n🐰 棉棉：我能帮忙！\n傍晚时分，棉棉躺在草地上，毛慢慢变成了和暮色一样的灰蓝色。狐狸阿灰仔细看了又看，只看到一块灰蓝色的草地，没看到任何小兔子。一连三天，棉棉都用变色能力保护了小兔子们。","textZh":"又过了一周，森林里传来消息：狐狸阿灰在傍晚时总会悄悄靠近小兔子们玩耍的地方。大家都很害怕，傍晚都不敢出门玩了。\n🐰 棉棉：我能帮忙！\n傍晚时分，棉棉躺在草地上，毛慢慢变成了和暮色一样的灰蓝色。狐狸阿灰仔细看了又看，只看到一块灰蓝色的草地，没看到任何小兔子。一连三天，棉棉都用变色能力保护了小兔子们。","images":["../../local/generated-visuals/story-extra-08/page-1.webp"],"imageAlt":"守护大家主题插图"},{"title":"最美的秘密","scene":"picnic","detailsText":"从那以后，棉棉明白了：特别的能力不是为了让自己看起来了不起，而是为了能帮助需要帮助的人。\n现在，棉棉还是会变色，但他不再急着告诉每个人\"我会变色\"。他只是静静地用这份能力，在朋友需要时提供帮助，在森林需要时默默守护。\n而真正的朋友，不管棉棉是什么颜色，都依然喜欢他，因为他们知道，最重要的不是毛的颜色，而是那颗温暖善良的心。\n（完）","textZh":"从那以后，棉棉明白了：特别的能力不是为了让自己看起来了不起，而是为了能帮助需要帮助的人。\n现在，棉棉还是会变色，但他不再急着告诉每个人\"我会变色\"。他只是静静地用这份能力，在朋友需要时提供帮助，在森林需要时默默守护。","images":["../../local/generated-visuals/story-extra-08/page-1.webp"],"imageAlt":"最美的秘密主题插图"}]};</script>
