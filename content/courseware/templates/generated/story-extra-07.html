    <script>window.COURSEWARE_CONFIG = {"id":"story-extra-07","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"story_extra_07_小象的超级长鼻子.html","steps":[{"title":"草原上的小象","scene":"meadow","detailsText":"在阳光灿烂的非洲草原上，住着一头名叫朵朵的小象。她有一双圆溜溜的大眼睛，四条粗粗的小短腿，还有——一条长得不可思议的超级长鼻子。\n🐘 朵朵：为什么我的鼻子这么长呀？\n她的鼻子比其他小象长出好大一截，像一根永远收不回去的跳绳。当她低头喝水时，长鼻子总会绊到自己的小短腿；当她想和蝴蝶玩耍时，长鼻子又会不小心扫到花丛。","textZh":"在阳光灿烂的非洲草原上，住着一头名叫朵朵的小象。她有一双圆溜溜的大眼睛，四条粗粗的小短腿，还有——一条长得不可思议的超级长鼻子。\n🐘 朵朵：为什么我的鼻子这么长呀？","images":["../../local/generated-visuals/story-extra-07/page-1.webp"],"imageAlt":"草原上的小象主题插图"},{"title":"被嘲笑的朵朵","scene":"picnic","detailsText":"🐒 小猴皮皮：嘻嘻，朵朵的鼻子像个大滑梯！\n🦌 小斑点鹿：是呀，跑起来会不会拖到地上呀？\n朵朵难过极了。她用长鼻子卷起一片大荷叶，做成小伞遮住自己，悄悄躲进象群最后面。","textZh":"🐒 小猴皮皮：嘻嘻，朵朵的鼻子像个大滑梯！\n🦌 小斑点鹿：是呀，跑起来会不会拖到地上呀？\n朵朵难过极了。她用长鼻子卷起一片大荷叶，做成小伞遮住自己，悄悄躲进象群最后面。","images":["../../local/generated-visuals/story-extra-07/page-1.webp"],"imageAlt":"被嘲笑的朵朵主题插图"},{"title":"暴雨中的意外","scene":"wind","detailsText":"一天下午，草原突然下起了暴雨。豆大的雨点砸下来，小动物们慌张地跑向各自的家。朵朵也急急忙忙往回跑，可她的长鼻子却在这时不停使唤——左摇右晃，像条不听话的绳子。\n🐘 朵朵：哎哟！\n她被自己的鼻子绊倒了，摔进一个深深的泥坑。雨越下越大，泥坑渐渐变成小水塘。朵朵害怕地哭起来，泪水和雨水混在一起。","textZh":"一天下午，草原突然下起了暴雨。豆大的雨点砸下来，小动物们慌张地跑向各自的家。朵朵也急急忙忙往回跑，可她的长鼻子却在这时不停使唤——左摇右晃，像条不听话的绳子。\n🐘 朵朵：哎哟！\n她被自己的鼻子绊倒了，摔进一个深深的泥坑。雨越下越大，泥坑渐渐变成小水塘。朵朵害怕地哭起来，泪水和雨水混在一起。","images":["../../local/generated-visuals/story-extra-07/page-1.webp"],"imageAlt":"暴雨中的意外主题插图"},{"title":"勇敢的救援","scene":"listening","detailsText":"就在她最无助的时候，她听见微弱的呼救声。循着声音，朵朵跑到山谷边。呀！一场山洪冲垮了小路，小兔子、小松鼠和小刺猬都被困在对岸的岩石上，周围是汹涌的洪水。\n🐘 朵朵：别怕！我来帮你们！\n她深吸一口气，把长长的鼻子伸向对岸。在风雨中，长鼻子像一座灵活的拱桥，稳稳地搭在岩石上。小动物们一个接一个，抱着朵朵的鼻子滑了过来。长鼻子在这一刻变成了最安全的通道。","textZh":"就在她最无助的时候，她听见微弱的呼救声。循着声音，朵朵跑到山谷边。呀！一场山洪冲垮了小路，小兔子、小松鼠和小刺猬都被困在对岸的岩石上，周围是汹涌的洪水。\n🐘 朵朵：别怕！我来帮你们！","images":["../../local/generated-visuals/story-extra-07/page-1.webp"],"imageAlt":"勇敢的救援主题插图"},{"title":"长鼻子的真正价值","scene":"meadow","detailsText":"大象爷爷赶来了。他看到朵朵的长鼻子，惊讶又欣慰：\n🐘 大象爷爷：孩子，你的鼻子……是草原赐予的特殊礼物啊。\n🐒 皮皮：朵朵，你的鼻子好厉害！\n🐰 小兔子：谢谢你救了我们！\n朵朵害羞地卷起长鼻子，这次，它没有绊到任何东西，反而轻轻拂过朋友们的脸颊，像一个温柔的拥抱。","textZh":"大象爷爷赶来了。他看到朵朵的长鼻子，惊讶又欣慰：\n🐘 大象爷爷：孩子，你的鼻子……是草原赐予的特殊礼物啊。\n🐒 皮皮：朵朵，你的鼻子好厉害！\n🐰 小兔子：谢谢你救了我们！\n朵朵害羞地卷起长鼻子，这次，它没有绊到任何东西，反而轻轻拂过朋友们的脸颊，像一个温柔的拥抱。","images":["../../local/generated-visuals/story-extra-07/page-1.webp"],"imageAlt":"长鼻子的真正价值主题插图"},{"title":"最棒的礼物","scene":"picnic","detailsText":"从那天起，朵朵不再讨厌自己的长鼻子了。她用它帮河马大叔喷水浇花，用它帮鸟妈妈够到高高的树枝上的巢，还用它卷起最甜的香蕉分给森林里的朋友们。\n\"每个人的特别之处，都可能是最棒的礼物。\"大象爷爷常常这样对朵朵说。\n朵朵终于明白了：那条长长的鼻子不是累赘，而是上天给她的、帮助别人的独特方式。当她用这份特别去爱别人时，她自己也收获了最温暖的爱和友谊。\n（完）","textZh":"从那天起，朵朵不再讨厌自己的长鼻子了。她用它帮河马大叔喷水浇花，用它帮鸟妈妈够到高高的树枝上的巢，还用它卷起最甜的香蕉分给森林里的朋友们。\n\"每个人的特别之处，都可能是最棒的礼物。\"大象爷爷常常这样对朵朵说。","images":["../../local/generated-visuals/story-extra-07/page-1.webp"],"imageAlt":"最棒的礼物主题插图"}]};</script>
