    <script>window.COURSEWARE_CONFIG = {"id":"english-story-01-the-talkative-tortoise","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"english_story_01_The_Talkative_Tortoise.html","steps":[{"title":"🐢 The Talkative Tortoise","scene":"meadow","detailsText":"Tilly the tortoise lived in a sunny meadow with her friends: the wise Owl, the busy Squirrel, and the gentle Rabbit. Tilly loved her friends, but she loved one thing more—her own voice. She talked all day long.","textEn":"Tilly the tortoise lived in a sunny meadow with her friends: the wise Owl, the busy Squirrel, and the gentle Rabbit. Tilly loved her friends, but she loved one thing more—her own voice. She talked all day long.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-1.webp"],"imageAlt":"🐢 The Talkative Tortoise主题插图"},{"title":"💬 Tilly's Endless Chatter","scene":"picnic","detailsText":"Tilly 🐢：Good morning, Owl! Did you see the dewdrops? I counted thirty-seven on one leaf. Well, maybe thirty-eight. One was very tiny. Do you think dewdrops have dreams? I dreamt I was a cloud once. It was very floaty...\nOwl 🦉：*nods politely, eyelids growing heavy*","textEn":"Tilly 🐢：Good morning, Owl! Did you see the dewdrops? I counted thirty-seven on one leaf. Well, maybe thirty-eight. One was very tiny. Do you think dewdrops have dreams? I dreamt I was a cloud once. It was very floaty...","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-2.webp"],"imageAlt":"💬 Tilly's Endless Chatter主题插图"},{"title":"🧺 The Picnic","scene":"wind","detailsText":"One day, the animals decided to have a picnic by the sparkling pond. Everyone brought something to share. Rabbit brought clover buns, Squirrel brought acorn pie, and Owl brought a jar of honey. Tilly brought herself, and she brought plenty of stories.","textEn":"One day, the animals decided to have a picnic by the sparkling pond. Everyone brought something to share. Rabbit brought clover buns, Squirrel brought acorn pie, and Owl brought a jar of honey. Tilly brought herself, and she brought plenty of stories.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-3.webp"],"imageAlt":"🧺 The Picnic主题插图"},{"title":"🗣️ The Talking Goes On","scene":"listening","detailsText":"Tilly 🐢：Did I ever tell you about the time I raced a turtle? Well, it was actually a snail. He was very slow. Or was it me who was slow? Let me think...\nTilly 🐢：And then the wind blew the flower petals all over. They were pink, but also a bit purple. Purple is an interesting color, isn't it? My cousin's shell has a purple speck...","textEn":"Tilly 🐢：Did I ever tell you about the time I raced a turtle? Well, it was actually a snail. He was very slow. Or was it me who was slow? Let me think...","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-4.webp"],"imageAlt":"🗣️ The Talking Goes On主题插图"},{"title":"😫 Friends Grow Tired","scene":"bubbles","detailsText":"Her friends tried to listen, but their ears were tired. They were hungry too. The delicious smells from the picnic made their tummies rumble. Finally, Squirrel couldn't wait anymore. He reached for a clover bun.","textEn":"Her friends tried to listen, but their ears were tired. They were hungry too. The delicious smells from the picnic made their tummies rumble. Finally, Squirrel couldn't wait anymore. He reached for a clover bun.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-5.webp"],"imageAlt":"😫 Friends Grow Tired主题插图"},{"title":"😤 Tilly Gets Upset","scene":"star","detailsText":"Tilly 🐢：Squirrel! I'm not finished with my story! It's not polite to eat when someone is talking.\nSquirrel pulled his paw back. The picnic was not fun anymore. Rabbit looked at the ground. Owl stared at the clouds. Tilly was so busy talking, she hadn't noticed how quiet her friends were.","textEn":"Tilly 🐢：Squirrel! I'm not finished with my story! It's not polite to eat when someone is talking.","images":["../../local/generated-visuals/english-story-01-the-talkative-tortoise/page-6.webp"],"imageAlt":"😤 Tilly Gets Upset主题插图"},{"title":"🌬️ The Wind Comes!","scene":"meadow","detailsText":"Just then, a loud WHOOOOSH swept through the meadow. A gust of wind grabbed the picnic blanket! It flipped it over, scattering buns, pie, and the honey jar high into the air! The food landed with a splish-splash right in the middle of the pond.","textEn":"Just then, a loud WHOOOOSH swept through the meadow. A gust of wind grabbed the picnic blanket! It flipped it over, scattering buns, pie, and the honey jar high into the air! The food landed with a splish-splash right in the middle of the pond.","artSvg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 420\" role=\"img\" aria-label=\"🌬️ The Wind Comes!画面\">\u003crect width=\"640\" height=\"420\" rx=\"32\" fill=\"#e6f5d8\"/>\u003ccircle cx=\"535\" cy=\"78\" r=\"48\" fill=\"#73523e\" opacity=\".8\"/>\u003cpath d=\"M0 286c118-58 186 18 304-33 102-44 185 16 336-48v215H0Z\" fill=\"#83b86b\" opacity=\".78\"/>\u003cpath d=\"M0 352c142-24 235 2 351-34 105-33 193 3 289-22v124H0Z\" fill=\"#83b86b\"/>\u003cg transform=\"translate(180 206)\">\u003ccircle r=\"88\" fill=\"#fff\" opacity=\".9\"/>\u003ctext y=\"28\" text-anchor=\"middle\" font-size=\"82\" font-family=\"Arial, Microsoft YaHei, sans-serif\" fill=\"#73523e\">🐢\u003c/text>\u003c/g>\u003ctext x=\"320\" y=\"377\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" font-family=\"Microsoft YaHei, sans-serif\" fill=\"#26364a\">森林里的朋友\u003c/text>\u003c/svg>"},{"title":"😢 A Ruined Picnic","scene":"picnic","detailsText":"The four friends stood at the edge of the pond, very sad. The picnic was ruined, and nobody had gotten to eat a single bite. Tilly looked at her sad friends. For the first time all day, her mouth was closed.","textEn":"The four friends stood at the edge of the pond, very sad. The picnic was ruined, and nobody had gotten to eat a single bite. Tilly looked at her sad friends. For the first time all day, her mouth was closed.","artSvg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 420\" role=\"img\" aria-label=\"😢 A Ruined Picnic画面\">\u003crect width=\"640\" height=\"420\" rx=\"32\" fill=\"#e6f5d8\"/>\u003ccircle cx=\"535\" cy=\"78\" r=\"48\" fill=\"#73523e\" opacity=\".8\"/>\u003cpath d=\"M0 286c118-58 186 18 304-33 102-44 185 16 336-48v215H0Z\" fill=\"#83b86b\" opacity=\".78\"/>\u003cpath d=\"M0 352c142-24 235 2 351-34 105-33 193 3 289-22v124H0Z\" fill=\"#83b86b\"/>\u003cg transform=\"translate(300 206)\">\u003ccircle r=\"88\" fill=\"#fff\" opacity=\".9\"/>\u003ctext y=\"28\" text-anchor=\"middle\" font-size=\"82\" font-family=\"Arial, Microsoft YaHei, sans-serif\" fill=\"#73523e\">🐢\u003c/text>\u003c/g>\u003ctext x=\"320\" y=\"377\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" font-family=\"Microsoft YaHei, sans-serif\" fill=\"#26364a\">森林里的朋友\u003c/text>\u003c/svg>"},{"title":"💭 Tilly's Realization","scene":"wind","detailsText":"Tilly 🐢：I'm sorry. I was so busy talking that I forgot to listen. And I forgot to let you eat. A picnic isn't just about talking. It's about sharing.\nOwl 🦉：We love hearing your stories, Tilly. But sharing means everyone gets a turn to speak. And to eat.","textEn":"Tilly 🐢：I'm sorry. I was so busy talking that I forgot to listen. And I forgot to let you eat. A picnic isn't just about talking. It's about sharing.","artSvg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 420\" role=\"img\" aria-label=\"💭 Tilly&#39;s Realization画面\">\u003crect width=\"640\" height=\"420\" rx=\"32\" fill=\"#e6f5d8\"/>\u003ccircle cx=\"535\" cy=\"78\" r=\"48\" fill=\"#73523e\" opacity=\".8\"/>\u003cpath d=\"M0 286c118-58 186 18 304-33 102-44 185 16 336-48v215H0Z\" fill=\"#83b86b\" opacity=\".78\"/>\u003cpath d=\"M0 352c142-24 235 2 351-34 105-33 193 3 289-22v124H0Z\" fill=\"#83b86b\"/>\u003cg transform=\"translate(420 206)\">\u003ccircle r=\"88\" fill=\"#fff\" opacity=\".9\"/>\u003ctext y=\"28\" text-anchor=\"middle\" font-size=\"82\" font-family=\"Arial, Microsoft YaHei, sans-serif\" fill=\"#73523e\">🐢\u003c/text>\u003c/g>\u003ctext x=\"320\" y=\"377\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" font-family=\"Microsoft YaHei, sans-serif\" fill=\"#26364a\">森林里的朋友\u003c/text>\u003c/svg>"},{"title":"🔨 Building Together","scene":"listening","detailsText":"The next day, Tilly invited her friends back to the meadow. This time, she was quiet at first. She had spent the morning thinking of a plan. \"Let's build a new picnic table, right here under this big oak tree. Then, the wind can't take our blanket away!\" Tilly didn't talk while they worked. She listened to Rabbit's ideas, and Squirrel's, and Owl's. They found smooth stones for legs and a wide, flat board for the top.","textEn":"The next day, Tilly invited her friends back to the meadow. This time, she was quiet at first. She had spent the morning thinking of a plan. \"Let's build a new picnic table, right here under this big oak tree. Then, the wind can't take our blanket away!\" Tilly didn't talk while they worked. She listened to Rabbit's ideas, and Squirrel's, and Owl's. They found smooth stones for legs and a wide, flat board for the top.","artSvg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 420\" role=\"img\" aria-label=\"🔨 Building Together画面\">\u003crect width=\"640\" height=\"420\" rx=\"32\" fill=\"#e6f5d8\"/>\u003ccircle cx=\"535\" cy=\"78\" r=\"48\" fill=\"#73523e\" opacity=\".8\"/>\u003cpath d=\"M0 286c118-58 186 18 304-33 102-44 185 16 336-48v215H0Z\" fill=\"#83b86b\" opacity=\".78\"/>\u003cpath d=\"M0 352c142-24 235 2 351-34 105-33 193 3 289-22v124H0Z\" fill=\"#83b86b\"/>\u003cg transform=\"translate(180 206)\">\u003ccircle r=\"88\" fill=\"#fff\" opacity=\".9\"/>\u003ctext y=\"28\" text-anchor=\"middle\" font-size=\"82\" font-family=\"Arial, Microsoft YaHei, sans-serif\" fill=\"#73523e\">🐢\u003c/text>\u003c/g>\u003ctext x=\"320\" y=\"377\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" font-family=\"Microsoft YaHei, sans-serif\" fill=\"#26364a\">森林里的朋友\u003c/text>\u003c/svg>"},{"title":"🎉 A Better Picnic","scene":"bubbles","detailsText":"When they were done, they had a wonderful, sturdy table. They sat down, and Tilly passed the food around first. \"Now,\" she said with a smile, \"I will tell you a new story. It's about a tortoise who learned how to listen. But first, does anyone want more clover buns?\" Her friends laughed. They shared the food, and then they shared stories, each animal taking a turn. Tilly talked, but she also listened. And she found that the stories from her friends were just as wonderful as her own.","textEn":"When they were done, they had a wonderful, sturdy table. They sat down, and Tilly passed the food around first. \"Now,\" she said with a smile, \"I will tell you a new story. It's about a tortoise who learned how to listen. But first, does anyone want more clover buns?\" Her friends laughed. They shared the food, and then they shared stories, each animal taking a turn. Tilly talked, but she also listened. And she found that the stories from her friends were just as wonderful as her own.","artSvg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 420\" role=\"img\" aria-label=\"🎉 A Better Picnic画面\">\u003crect width=\"640\" height=\"420\" rx=\"32\" fill=\"#e6f5d8\"/>\u003ccircle cx=\"535\" cy=\"78\" r=\"48\" fill=\"#73523e\" opacity=\".8\"/>\u003cpath d=\"M0 286c118-58 186 18 304-33 102-44 185 16 336-48v215H0Z\" fill=\"#83b86b\" opacity=\".78\"/>\u003cpath d=\"M0 352c142-24 235 2 351-34 105-33 193 3 289-22v124H0Z\" fill=\"#83b86b\"/>\u003cg transform=\"translate(300 206)\">\u003ccircle r=\"88\" fill=\"#fff\" opacity=\".9\"/>\u003ctext y=\"28\" text-anchor=\"middle\" font-size=\"82\" font-family=\"Arial, Microsoft YaHei, sans-serif\" fill=\"#73523e\">🐢\u003c/text>\u003c/g>\u003ctext x=\"320\" y=\"377\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" font-family=\"Microsoft YaHei, sans-serif\" fill=\"#26364a\">森林里的朋友\u003c/text>\u003c/svg>"},{"title":"💚 Moral of the Story","scene":"star","textEn":"Talking is wonderful, but listening is a gift. When we share our voices and our time, everyone feels happy and heard.\n说话是美好的，但倾听是一份礼物。当我们分享自己的声音和时间时，每个人都会感到快乐和被倾听。","artSvg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 420\" role=\"img\" aria-label=\"💚 Moral of the Story画面\">\u003crect width=\"640\" height=\"420\" rx=\"32\" fill=\"#e6f5d8\"/>\u003ccircle cx=\"535\" cy=\"78\" r=\"48\" fill=\"#73523e\" opacity=\".8\"/>\u003cpath d=\"M0 286c118-58 186 18 304-33 102-44 185 16 336-48v215H0Z\" fill=\"#83b86b\" opacity=\".78\"/>\u003cpath d=\"M0 352c142-24 235 2 351-34 105-33 193 3 289-22v124H0Z\" fill=\"#83b86b\"/>\u003cg transform=\"translate(420 206)\">\u003ccircle r=\"88\" fill=\"#fff\" opacity=\".9\"/>\u003ctext y=\"28\" text-anchor=\"middle\" font-size=\"82\" font-family=\"Arial, Microsoft YaHei, sans-serif\" fill=\"#73523e\">🐢\u003c/text>\u003c/g>\u003ctext x=\"320\" y=\"377\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" font-family=\"Microsoft YaHei, sans-serif\" fill=\"#26364a\">森林里的朋友\u003c/text>\u003c/svg>"}]};</script>
