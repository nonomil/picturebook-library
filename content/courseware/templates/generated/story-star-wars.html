    <script>window.COURSEWARE_CONFIG = {"id":"story-star-wars","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"childrens-library/courseware/stories/story-star-wars.html","steps":[{"title":"故事开始","scene":"star","detailsText":"在一个遥远的星系里，勇敢的小宇航员小星驾驶着他闪亮的蓝色飞船穿越星空。今天，他即将迎来人生中最伟大的冒险！","textZh":"在一个遥远的星系里，勇敢的小宇航员小星驾驶着他闪亮的蓝色飞船穿越星空。今天，他即将迎来人生中最伟大的冒险！","images":["../../local/images/minecraft/items/netherite-sword.png"],"imageAlt":"故事开始","audio":{"src":"../../local/audio/story-star-wars/page-1.mp3","lang":"zh-CN"}},{"title":"准备行动","scene":"star","detailsText":"在一个遥远的星系里，勇敢的小宇航员小星驾驶着他闪亮的蓝色飞船穿越星空。今天，他即将迎来人生中最伟大的冒险！\nIn a faraway galaxy, a brave little astronaut named Little Star flew his shiny blue spaceship through the stars. Today, he was about to have the greatest adventure of his life!","textZh":"在一个遥远的星系里，勇敢的小宇航员小星驾驶着他闪亮的蓝色飞船穿越星空。今天，他即将迎来人生中最伟大的冒险！","textEn":"In a faraway galaxy, a brave little astronaut named Little …","images":["../../local/images/minecraft/items/netherite-sword.png"],"imageAlt":"准备行动","audio":{"src":"../../local/audio/story-star-wars/page-2.mp3","lang":"zh-CN"}},{"title":"小星飞过一闪一闪的小星星","scene":"star","detailsText":"小星飞过一闪一闪的小星星。它们像撒落在黑暗天空中的小钻石一样闪烁。他看着周围美丽的星球，想该往哪边走。\nLittle Star flew past twinkling little stars. They sparkled like tiny diamonds scattered across the dark sky. He looked at the beautiful planets around him, wondering which way to go.","textZh":"小星飞过一闪一闪的小星星。它们像撒落在黑暗天空中的小钻石一样闪烁。他看着周围美丽的星球，想该往哪边走。","textEn":"Little Star flew past twinkling little stars.\nThey sparkled…","images":["../../local/images/minecraft/zombie.png"],"imageAlt":"小星飞过一闪一闪的小星星","audio":{"src":"../../local/audio/story-star-wars/page-3.mp3","lang":"zh-CN"}},{"title":"突然，一个圆滚滚的小机器人飘了过来","scene":"star","detailsText":"突然，一个圆滚滚的小机器人飘了过来！他叫豆豆，有着发光的眼睛和弹弹的身体。他微笑着问小星想不想一起玩星球大战。\nSuddenly, a round little robot floated over! His name was Doudou, with glowing eyes and a bouncy body. He smiled and asked Little Star if he wanted to play Star Wars together.","textZh":"突然，一个圆滚滚的小机器人飘了过来！他叫豆豆，有着发光的眼睛和弹弹的身体。他微笑着问小星想不想一起玩星球大战。","textEn":"Suddenly, a round little robot floated over!\nHis name was D…","images":["../../local/images/minecraft/skeleton.png"],"imageAlt":"突然，一个圆滚滚的小机器人飘了过来"},{"title":"好呀","scene":"star","detailsText":"好呀！我们来玩！小星说。豆豆开始设计他自己的星球，这将是最棒的星球！小星也准备好了他的特殊武器。大战即将开始！\nSure! Let's play! said Little Star. Doudou started designing his own planet, and it would be the best planet ever! Little Star got his special weapons ready too. The big battle was about to begin!","textZh":"好呀！我们来玩！小星说。豆豆开始设计他自己的星球，这将是最棒的星球！小星也准备好了他的特殊武器。大战即将开始！","textEn":"Sure!\nLet's play!\nsaid Little Star.","images":["../../local/images/minecraft/blocks/tnt.png"],"imageAlt":"好呀"},{"title":"豆豆创造了一颗壮观的水晶能量星球","scene":"star","detailsText":"豆豆创造了一颗壮观的水晶能量星球！它的外壳是透明的水晶，能吸收恒星的能量。他骄傲地说这是他的水晶星球，能发射超强激光炮！\nDoudou created a magnificent crystal energy planet! Its shell was made of transparent crystal that could absorb star energy. He proudly said it was his Crystal Planet, and it could fire super laser beams!","textZh":"豆豆创造了一颗壮观的水晶能量星球！它的外壳是透明的水晶，能吸收恒星的能量。他骄傲地说这是他的水晶星球，能发射超强激光炮！","textEn":"Doudou created a magnificent crystal energy planet!\nIts she…","images":["../../local/images/minecraft/mobs/iron-golem.png"],"imageAlt":"豆豆创造了一颗壮观的水晶能量星球"},{"title":"嗖","scene":"star","detailsText":"嗖！水晶星球发射出一道明亮的激光！激光太强了，照亮了整个星系。豆豆开心地大笑，叫小星躲开试试！\nWhoosh! The Crystal Planet fired a bright laser beam! It was so powerful that it lit up the whole galaxy. Doudou laughed happily and told Little Star to try dodging it!","textZh":"嗖！水晶星球发射出一道明亮的激光！激光太强了，照亮了整个星系。豆豆开心地大笑，叫小星躲开试试！","textEn":"Whoosh!\nThe Crystal Planet fired a bright laser beam!\nIt wa…","images":["../../local/images/minecraft/enderman.png"],"imageAlt":"嗖"},{"title":"但是小星非常聪明","scene":"star","detailsText":"但是小星非常聪明！他朝水晶星球扔出一颗小小的水晶炸弹。轰！炸弹击中了星球表面，在水晶外壳上炸出了一道大裂纹！\nBut Little Star was very clever! He threw a tiny crystal bomb at the Crystal Planet. BOOM! The bomb hit the surface and cracked the crystal shell right open!","textZh":"但是小星非常聪明！他朝水晶星球扔出一颗小小的水晶炸弹。轰！炸弹击中了星球表面，在水晶外壳上炸出了一道大裂纹！","textEn":"But Little Star was very clever!\nHe threw a tiny crystal bo…","images":["../../local/images/minecraft/items/diamond-sword.png"],"imageAlt":"但是小星非常聪明"},{"title":"裂纹像蜘蛛网一样在水晶星球上蔓延","scene":"star","detailsText":"裂纹像蜘蛛网一样在水晶星球上蔓延。豆豆大吃一惊！他大喊他美丽的星球要碎了。水晶外壳一点一点地开始碎裂。\nThe crack spread across the Crystal Planet like a spider web. Doudou was shocked! He cried that his beautiful planet was breaking apart. The crystal shell began to shatter piece by piece.","textZh":"裂纹像蜘蛛网一样在水晶星球上蔓延。豆豆大吃一惊！他大喊他美丽的星球要碎了。水晶外壳一点一点地开始碎裂。","textEn":"The crack spread across the Crystal Planet like a spider we…","images":["../../local/images/minecraft/crafting-table.png"],"imageAlt":"裂纹像蜘蛛网一样在水晶星球上蔓延"},{"title":"但是豆豆有办法","scene":"star","detailsText":"但是豆豆有办法！他派出成百上千个小小的修复无人机。嗡嗡嗡！它们飞到裂缝处开始修复星球。豆豆骄傲地说他的无人机会修好一切！\nBut Doudou had a plan! He sent out hundreds of tiny repair drones. Bzzz! They flew to the cracks and started fixing the planet. Doudou proudly said his drones would fix everything!","textZh":"但是豆豆有办法！他派出成百上千个小小的修复无人机。嗡嗡嗡！它们飞到裂缝处开始修复星球。豆豆骄傲地说他的无人机会修好一切！","textEn":"But Doudou had a plan!\nHe sent out hundreds of tiny repair …","images":["../../local/images/minecraft/items/netherite-sword.png"],"imageAlt":"但是豆豆有办法"},{"title":"现在豆豆有一个超级惊喜","scene":"star","detailsText":"现在豆豆有一个超级惊喜！水晶星球变形成为一只巨大的星际巨鲸！它又大又闪亮，有着水晶鱼鳍和巨大的嘴巴。豆豆大笑着说他的星球可以变形！\nNow Doudou had a super surprise! The Crystal Planet transformed into a giant Space Whale! It was huge and shiny, with crystal fins and an enormous mouth. Doudou laughed and said his planet could transform!","textZh":"现在豆豆有一个超级惊喜！水晶星球变形成为一只巨大的星际巨鲸！它又大又闪亮，有着水晶鱼鳍和巨大的嘴巴。豆豆大笑着说他的星球可以变形！","textEn":"Now Doudou had a super surprise!\nThe Crystal Planet transfo…","images":["../../local/images/minecraft/zombie.png"],"imageAlt":"现在豆豆有一个超级惊喜"},{"title":"星际巨鲸张开超级大的嘴巴，要把…","scene":"star","detailsText":"星际巨鲸张开超级大的嘴巴，要把小星的小星星吸进来！呼！星星们开始飞向巨鲸的嘴巴。豆豆喊着让星星进入他的能量熔炉！\nThe Space Whale opened its super big mouth, trying to suck in Little Star's stars! Whoosh! The stars started flying toward the whale's mouth. Doudou cheered for the stars to enter his energy furnace!","textZh":"星际巨鲸张开超级大的嘴巴，要把小星的小星星吸进来！呼！星星们开始飞向巨鲸的嘴巴。豆豆喊着让星星进入他的能量熔炉！","textEn":"The Space Whale opened its super big mouth, trying to suck …","images":["../../local/images/minecraft/skeleton.png"],"imageAlt":"星际巨鲸张开超级大的嘴巴，要把…"},{"title":"小星有了最棒的主意","scene":"star","detailsText":"小星有了最棒的主意！他抓起一瓶银河系沐浴露，塞进炸药，用一个迷你打火机点燃。他把满是泡泡的炸弹扔向星际巨鲸！\nLittle Star had the best idea ever! He grabbed a bottle of Galaxy Bubble Bath, stuffed it with explosives, and lit it with a mini lighter. He threw the bubbly bomb right at the Space Whale!","textZh":"小星有了最棒的主意！他抓起一瓶银河系沐浴露，塞进炸药，用一个迷你打火机点燃。他把满是泡泡的炸弹扔向星际巨鲸！","textEn":"Little Star had the best idea ever!\nHe grabbed a bottle of …","images":["../../local/images/minecraft/blocks/tnt.png"],"imageAlt":"小星有了最棒的主意"},{"title":"轰","scene":"star","detailsText":"轰！银河系沐浴露炸弹爆炸了！星际巨鲸现在满身都是泡泡！噗噗噗！黑烟从它的水晶身体上升起。豆豆大叫他全身都是泡沫！\nBOOM! The Galaxy Bubble Bath bomb exploded! The Space Whale was covered in bubbles! Pop, pop, pop! Black smoke rose from its crystal body. Doudou cried that he was full of foam!","textZh":"轰！银河系沐浴露炸弹爆炸了！星际巨鲸现在满身都是泡泡！噗噗噗！黑烟从它的水晶身体上升起。豆豆大叫他全身都是泡沫！","textEn":"BOOM!\nThe Galaxy Bubble Bath bomb exploded!\nThe Space Whale…","images":["../../local/images/minecraft/mobs/iron-golem.png"],"imageAlt":"轰"},{"title":"别担心","scene":"star","detailsText":"别担心！豆豆也有秘密武器，超小的纳米修复机器人！它们小到根本看不见。它们在星际巨鲸周围飞速修复。豆豆说他的纳米机器人会救他！\nDon't worry! Doudou had a secret weapon too — super tiny nano repair robots! They were so small you couldn't even see them. They zoomed around the Space Whale fixing it fast. Doudou said his nano robots would save it!","textZh":"别担心！豆豆也有秘密武器，超小的纳米修复机器人！它们小到根本看不见。它们在星际巨鲸周围飞速修复。豆豆说他的纳米机器人会救他！","textEn":"Don't worry!\nDoudou had a secret weapon too — super tiny na…","images":["../../local/images/minecraft/enderman.png"],"imageAlt":"别担心"},{"title":"但是小星没有停下","scene":"star","detailsText":"但是小星没有停下！他制作了终极炸弹，整个宇宙中最大最强的炸弹！它发出明亮的红光，连周围的星星都在震动。他喊着这是他的最后一击！\nBut Little Star didn't stop! He built the ultimate bomb — the biggest and strongest bomb in the whole universe! It glowed bright red and made all the nearby stars shake. He shouted it was his final strike!","textZh":"但是小星没有停下！他制作了终极炸弹，整个宇宙中最大最强的炸弹！它发出明亮的红光，连周围的星星都在震动。他喊着这是他的最后一击！","textEn":"But Little Star didn't stop!\nHe built the ultimate bomb — t…","images":["../../local/images/minecraft/items/diamond-sword.png"],"imageAlt":"但是小星没有停下"},{"title":"轰隆","scene":"star","detailsText":"轰隆！终极炸弹击中了星际巨鲸，噗！什么都不剩了！连一小块碎片都没有。豆豆的星球完全消失了。豆豆小声说太厉害了。\nKA-BOOM! The ultimate bomb hit the Space Whale. Poof! Nothing was left! Not even a tiny piece. Doudou's planet had completely vanished. Doudou whispered that it was incredible.","textZh":"轰隆！终极炸弹击中了星际巨鲸，噗！什么都不剩了！连一小块碎片都没有。豆豆的星球完全消失了。豆豆小声说太厉害了。","textEn":"KA-BOOM!\nThe ultimate bomb hit the Space Whale.\nPoof!","images":["../../local/images/minecraft/crafting-table.png"],"imageAlt":"轰隆"},{"title":"但是豆豆是个坚强的小机器人","scene":"star","detailsText":"但是豆豆是个坚强的小机器人！他收集太空中漂浮的所有废铁，建造了一个全新的星球！虽然没有以前那么闪亮，但它是用爱和决心建造的。\nBut Doudou was a tough little robot! He collected all the scrap metal floating in space and built a brand new planet! It wasn't as shiny as before, but it was built with love and determination.","textZh":"但是豆豆是个坚强的小机器人！他收集太空中漂浮的所有废铁，建造了一个全新的星球！虽然没有以前那么闪亮，但它是用爱和决心建造的。","textEn":"But Doudou was a tough little robot!\nHe collected all the s…","images":["../../local/images/minecraft/items/netherite-sword.png"],"imageAlt":"但是豆豆是个坚强的小机器人"},{"title":"小星拿起一个保护盾想送给豆豆","scene":"star","detailsText":"小星拿起一个保护盾想送给豆豆。但是哎呀！他扔得太用力，盾牌直接飞向了豆豆！然后他赶紧又来了一个报废攻击！\nLittle Star picked up a shield to give to Doudou. But oh no! He threw it too hard, and the shield flew straight at Doudou! Then he quickly followed with another attack!","textZh":"小星拿起一个保护盾想送给豆豆。但是哎呀！他扔得太用力，盾牌直接飞向了豆豆！然后他赶紧又来了一个报废攻击！","textEn":"Little Star picked up a shield to give to Doudou.\nBut oh no…","images":["../../local/images/minecraft/zombie.png"],"imageAlt":"小星拿起一个保护盾想送给豆豆"},{"title":"咔嚓","scene":"star","detailsText":"咔嚓！盾牌碎成碎片，新星球变成了一堆废铁。豆豆举起他的小机器人手臂投降了！他说小星的炸弹太厉害了，他认输！\nCRACK! The shield shattered into pieces, and the new planet turned into a pile of scrap metal. Doudou raised his little robot arm and surrendered! He said Little Star's bombs were too powerful — he gave up!","textZh":"咔嚓！盾牌碎成碎片，新星球变成了一堆废铁。豆豆举起他的小机器人手臂投降了！他说小星的炸弹太厉害了，他认输！","textEn":"CRACK!\nThe shield shattered into pieces, and the new planet…","images":["../../local/images/minecraft/skeleton.png"],"imageAlt":"咔嚓"},{"title":"虽然他们打了一场史诗级的大战，…","scene":"star","detailsText":"虽然他们打了一场史诗级的大战，但小星和豆豆还是最好的朋友！他们互相击掌，一起大笑，喊着这是最好玩的星球大战游戏！\nEven though they had an epic battle, Little Star and Doudou were still the best of friends! They high-fived, laughed together, and shouted that this was the most fun Star Wars game ever!","textZh":"虽然他们打了一场史诗级的大战，但小星和豆豆还是最好的朋友！他们互相击掌，一起大笑，喊着这是最好玩的星球大战游戏！","textEn":"Even though they had an epic battle, Little Star and Doudou…","images":["../../local/images/minecraft/blocks/tnt.png"],"imageAlt":"虽然他们打了一场史诗级的大战，…"},{"title":"小星看着星星，有了新主意","scene":"star","detailsText":"小星看着星星，有了新主意。他跟豆豆说下次去火星吧！豆豆的眼睛兴奋地发亮，喊着火星我们来了！\nLittle Star looked at the stars and had a new idea. He told Doudou they should go to Mars next time! Doudou's eyes lit up with excitement as he shouted — Mars, here we come!","textZh":"小星看着星星，有了新主意。他跟豆豆说下次去火星吧！豆豆的眼睛兴奋地发亮，喊着火星我们来了！","textEn":"Little Star looked at the stars and had a new idea.\nHe told…","images":["../../local/images/minecraft/mobs/iron-golem.png"],"imageAlt":"小星看着星星，有了新主意"},{"title":"读完啦！","scene":"star","detailsText":"\\u592a\\u68d2\\u4e86\\uff01\\u4f60\\u8bfb\\u5b8c\\u4e86\\u300a星球大战\\u300b\\uff01","textZh":"\\u592a\\u68d2\\u4e86\\uff01\\u4f60\\u8bfb\\u5b8c\\u4e86\\u300a星球大战\\u300b\\uff01","images":["../../local/generated-visuals/shared-stories/page-1.webp"],"imageAlt":"读完啦！主题插图"}]};</script>
