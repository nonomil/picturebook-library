    <script>window.COURSEWARE_CONFIG = {"id":"story-extra-10","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"story_extra_10_太空小探险家.html","steps":[{"title":"仰望星空的小圆圆","scene":"meadow","detailsText":"五岁的小圆圆最喜欢仰头看星星。每天晚上，她都会爬上阳台的小板凳，指着天空数呀数：\"一颗、两颗、三颗……\"可是星星太多了，数也数不完。\n👧 小圆圆：妈妈，星星上面有什么呀？\n👩 妈妈：有闪亮的星尘，有安静的陨石，还有好多好多等待探索的秘密呢。\n那天晚上，小圆圆做了一个梦。她梦见自己穿上了一件银光闪闪的太空服，戴上了透明的头盔，背上喷着蓝色火焰的小背包。她变成了一名真正的太空小探险家！","textZh":"五岁的小圆圆最喜欢仰头看星星。每天晚上，她都会爬上阳台的小板凳，指着天空数呀数：\"一颗、两颗、三颗……\"可是星星太多了，数也数不完。\n👧 小圆圆：妈妈，星星上面有什么呀？\n👩 妈妈：有闪亮的星尘，有安静的陨石，还有好多好多等待探索的秘密呢。","images":["../../local/generated-visuals/story-extra-10/page-1.webp"],"imageAlt":"仰望星空的小圆圆主题插图"},{"title":"起飞！星星号飞船","scene":"picnic","detailsText":"🤖 小咕噜：小圆圆探险家，请就位！你好呀！我叫小咕噜，是你的飞行伙伴！\n飞船的名字叫\"星星号\"。小圆圆坐进驾驶舱，按下了金色的启动按钮。\"嗡——\"星星号轻轻颤动起来，穿过云层，穿过大气层，眼前忽然变得又黑又亮。\n🤖 小咕噜：那是木星！它是太阳系里最大的行星，可以装下一千多个地球呢。","textZh":"🤖 小咕噜：小圆圆探险家，请就位！你好呀！我叫小咕噜，是你的飞行伙伴！\n飞船的名字叫\"星星号\"。小圆圆坐进驾驶舱，按下了金色的启动按钮。\"嗡——\"星星号轻轻颤动起来，穿过云层，穿过大气层，眼前忽然变得又黑又亮。\n🤖 小咕噜：那是木星！它是太阳系里最大的行星，可以装下一千多个地球呢。","images":["../../local/generated-visuals/story-extra-10/page-1.webp"],"imageAlt":"起飞！星星号飞船主题插图"},{"title":"穿越小行星带","scene":"wind","detailsText":"星星号继续向前飞。突然，警报响了起来。\"叮叮叮！前方发现大量小石块，正在高速靠近！\"\n🤖 小咕噜：不要慌张！这是小行星带。记住，遇到危险的时候，越是冷静，越能找到出路。\n小圆圆深吸一口气，学着深呼吸——吸气，呼气，吸气，呼气。心跳慢慢平复下来。她轻轻推动操控杆，向左，再向下，再向右……星星号像一条灵活的小鱼，在石块之间穿梭。终于，她们安全地穿过了小行星带！\n🤖 小咕噜：你真棒！冷静和勇敢，是探险家最重要的品质。","textZh":"星星号继续向前飞。突然，警报响了起来。\"叮叮叮！前方发现大量小石块，正在高速靠近！\"\n🤖 小咕噜：不要慌张！这是小行星带。记住，遇到危险的时候，越是冷静，越能找到出路。","images":["../../local/generated-visuals/story-extra-10/page-1.webp"],"imageAlt":"穿越小行星带主题插图"},{"title":"月光石的秘密","scene":"listening","detailsText":"穿过小行星带，她们来到了一颗安静的小星球。这颗星球灰扑扑的，表面布满了大大小小的坑。\n🤖 小咕噜：这些坑叫陨石坑，是很久很久以前，石头从天上掉下来砸出来的。\n忽然，她发现陨石坑旁边有一个小小的洞，洞口闪着淡淡的蓝光。洞里躺着一颗圆圆的小石头，正在发光。\n🤖 小咕噜：是……月光石！这是一种非常非常稀有的宝石，只有在很久很久以前的星球上才能找到。它可以储存光线，在黑暗的时候发亮！\n👧 小圆圆：我要把它带回去，送给妈妈！这样妈妈晚上看书的时候，就不用总开着大灯啦。","textZh":"穿过小行星带，她们来到了一颗安静的小星球。这颗星球灰扑扑的，表面布满了大大小小的坑。\n🤖 小咕噜：这些坑叫陨石坑，是很久很久以前，石头从天上掉下来砸出来的。\n忽然，她发现陨石坑旁边有一个小小的洞，洞口闪着淡淡的蓝光。洞里躺着一颗圆圆的小石头，正在发光。","images":["../../local/generated-visuals/story-extra-10/page-1.webp"],"imageAlt":"月光石的秘密主题插图"},{"title":"最美的星球——地球","scene":"meadow","detailsText":"返程的路上，星星号经过了一颗蔚蓝色的星球。小圆圆望着那颗美丽的星球，眼睛亮晶晶的。\n🤖 小咕噜：那就是——地球呀，我们的家。\n小圆圆趴在窗户上看了好久好久。她看见蓝色的海洋、白色的云朵、绿色的森林和棕色的山脉。地球那么美，那么温柔，像一颗发光的弹珠，安安静静地挂在太空里。\n👧 小圆圆：太空虽然很大很美，但是地球才是我最想回去的地方。因为这里有妈妈，有小花，有小狗，还有我最爱的热牛奶。\n🤖 小咕噜：说得对，每一颗星球都有自己的故事，而最珍贵的星球，就是有爱你的人在等你回去的那一颗。","textZh":"返程的路上，星星号经过了一颗蔚蓝色的星球。小圆圆望着那颗美丽的星球，眼睛亮晶晶的。\n🤖 小咕噜：那就是——地球呀，我们的家。\n小圆圆趴在窗户上看了好久好久。她看见蓝色的海洋、白色的云朵、绿色的森林和棕色的山脉。地球那么美，那么温柔，像一颗发光的弹珠，安安静静地挂在太空里。","images":["../../local/generated-visuals/story-extra-10/page-1.webp"],"imageAlt":"最美的星球——地球主题插图"},{"title":"醒来后的秘密","scene":"picnic","detailsText":"\"圆圆，起床啦！太阳晒屁股啦！\"\n小圆圆睁开眼睛，发现自己躺在床上，窗外的阳光暖暖地照着她的脸。原来是一场梦呀。\n她摸了摸枕头底下——咦，有一颗圆圆的、亮亮的小石头，正闪着淡淡的蓝光。\n小圆圆笑了。她把小石头紧紧攥在手心里，跑到阳台，对着天空大声说：\n\"太空等着我，我一定会去的！\"\n然后她跑回屋里，抱住了妈妈，说：\"妈妈，我最喜欢地球，因为地球上有你。\"\n🌟 小圆圆学到了什么？\n• 遇到困难不要慌，冷静才能想到好办法。\n• 冒险的意义不只是发现宝贝，更是学会珍惜身边的人。\n• 宇宙那么大，我们要爱护我们唯一的地球。\n（完）","textZh":"\"圆圆，起床啦！太阳晒屁股啦！\"\n小圆圆睁开眼睛，发现自己躺在床上，窗外的阳光暖暖地照着她的脸。原来是一场梦呀。\n她摸了摸枕头底下——咦，有一颗圆圆的、亮亮的小石头，正闪着淡淡的蓝光。\n小圆圆笑了。她把小石头紧紧攥在手心里，跑到阳台，对着天空大声说：\n\"太空等着我，我一定会去的！\"","images":["../../local/generated-visuals/story-extra-10/page-1.webp"],"imageAlt":"醒来后的秘密主题插图"}]};</script>
