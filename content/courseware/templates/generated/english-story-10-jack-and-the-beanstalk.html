    <script>window.COURSEWARE_CONFIG = {"id":"english-story-10-jack-and-the-beanstalk","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"english_story_10_Jack_and_the_Beanstalk.html","steps":[{"title":"Jack's Home","scene":"meadow","detailsText":"Once upon a time, in a little blue house on a green hill, lived a boy named Jack. Jack lived with his kind mother and a cow named Daisy.","textEn":"Once upon a time, in a little blue house on a green hill, lived a boy named Jack.\nJack lived with his kind mother and a cow named Daisy.","images":["../../local/generated-visuals/english-story-10-jack-and-the-beanstalk/page-1.webp"],"imageAlt":"Jack's Home主题插图"},{"title":"No Milk Today","scene":"picnic","detailsText":"One sunny morning, Daisy gave no milk at all.\n\"Oh dear,\" said Jack's mother. \"We must sell Daisy at the market. Please take her today.\"\nJack sighed. He loved Daisy. But he knew they needed the money for food.","textEn":"One sunny morning, Daisy gave no milk at all.\n\"Oh dear,\" said Jack's mother.\n\"We must sell Daisy at the market.\nPlease take her today.\"\nJack sighed.","images":["../../local/generated-visuals/english-story-10-jack-and-the-beanstalk/page-1.webp"],"imageAlt":"No Milk Today主题插图"},{"title":"The Magic Beans","scene":"wind","detailsText":"👴 Old Man：On the path to the market, an old man with a twinkly smile stopped them. \"I'll give you five magic beans for your cow!\" he said.\n👦 Jack：\"Magic beans?\" Jack's eyes went wide.\n👴 Old Man：\"They will bring you a great surprise,\" the man chuckled.","textEn":"👴 Old Man：On the path to the market, an old man with a twinkly smile stopped them.\n\"I'll give you five magic beans for your cow!\" he said.","images":["../../local/generated-visuals/english-story-10-jack-and-the-beanstalk/page-1.webp"],"imageAlt":"The Magic Beans主题插图"},{"title":"Mother's Anger","scene":"listening","detailsText":"Jack traded Daisy for the beans and ran home, very excited.\n\"Oh Jack!\" his mother said. \"We needed food, not silly beans!\" She tossed them out the window and sent Jack to bed with no supper.","textEn":"Jack traded Daisy for the beans and ran home, very excited.\n\"Oh Jack!\" his mother said.","images":["../../local/generated-visuals/english-story-10-jack-and-the-beanstalk/page-1.webp"],"imageAlt":"Mother's Anger主题插图"},{"title":"The Giant Beanstalk","scene":"bubbles","detailsText":"The next morning, Jack woke up to a strange sight. Where the beans were thrown, a GIANT BEANSTALK had grown! It was tall, tall, TALL, reaching right up into the clouds.\n\"Well,\" said Jack, \"I must see where this goes.\"","textEn":"The next morning, Jack woke up to a strange sight.\nWhere the beans were thrown, a GIANT BEANSTALK had grown!","images":["../../local/generated-visuals/english-story-10-jack-and-the-beanstalk/page-1.webp"],"imageAlt":"The Giant Beanstalk主题插图"},{"title":"Climbing Up","scene":"star","detailsText":"He climbed up, up, up the beanstalk. He went past birds' nests and fluffy clouds until he reached a land in the sky.\nThere was a huge castle! Jack tiptoed inside. In the kitchen, he saw a giant woman making porridge.","textEn":"He climbed up, up, up the beanstalk.\nHe went past birds' nests and fluffy clouds until he reached a land in the sky.\nThere was a huge castle!","images":["../../local/generated-visuals/english-story-10-jack-and-the-beanstalk/page-1.webp"],"imageAlt":"Climbing Up主题插图"},{"title":"The Giant's Return","scene":"meadow","detailsText":"👦 Jack：\"Please, may I have some breakfast?\" asked Jack politely.\n👩 Giant Woman：The giant woman smiled and gave him a bowl. But then—BOOM! BOOM! BOOM!—her giant husband came home.\n👹 Giant：\"I smell a little boy!\" the giant roared. \"Fee-fi-fo-fum!\"","textEn":"👦 Jack：\"Please, may I have some breakfast?\" asked Jack politely.\n👩 Giant Woman：The giant woman smiled and gave him a bowl.\nBut then—BOOM!\nBOOM!","images":["../../local/generated-visuals/english-story-10-jack-and-the-beanstalk/page-1.webp"],"imageAlt":"The Giant's Return主题插图"},{"title":"The Golden Hen","scene":"picnic","detailsText":"The giant woman hid Jack under a pot. The giant had a sack with a golden hen. He made the hen lay a golden egg, then fell fast asleep, snoring like thunder.\nJack saw his chance! He quietly took the golden hen and tiptoed back to the beanstalk.\nDown, down, down he climbed, home to his mother. The hen laid golden eggs! Now they could buy all the food they needed.","textEn":"The giant woman hid Jack under a pot.\nThe giant had a sack with a golden hen.","images":["../../local/generated-visuals/english-story-10-jack-and-the-beanstalk/page-1.webp"],"imageAlt":"The Golden Hen主题插图"},{"title":"The Singing Harp","scene":"wind","detailsText":"A few days later, Jack climbed the beanstalk again. This time, he found a magical harp that played beautiful music all by itself.\n\"Let me sing you a lullaby,\" the harp sang sweetly.","textEn":"A few days later, Jack climbed the beanstalk again.\nThis time, he found a magical harp that played beautiful music all by itself.","images":["../../local/generated-visuals/english-story-10-jack-and-the-beanstalk/page-1.webp"],"imageAlt":"The Singing Harp主题插图"},{"title":"The Giant Chases","scene":"listening","detailsText":"The giant woke up again! \"Fee-fi-fo-fum!\" he bellowed.\nJack grabbed the singing harp and ran. The giant chased him! Jack scrambled down the beanstalk as fast as he could. He shouted, \"Mother! Bring the axe!\"\nWHACK-WHACK-WHACK! Jack's mother chopped the beanstalk. The giant tumbled down and landed—SPLAT—in a big patch of soft mud.","textEn":"The giant woke up again!\n\"Fee-fi-fo-fum!\" he bellowed.\nJack grabbed the singing harp and ran.\nThe giant chased him!","images":["../../local/generated-visuals/english-story-10-jack-and-the-beanstalk/page-1.webp"],"imageAlt":"The Giant Chases主题插图"},{"title":"Making Peace","scene":"bubbles","detailsText":"👹 Giant：\"You stole my treasures!\" the giant grumbled, covered in mud.\n👦 Jack：\"You stole our cow!\" Jack said bravely. \"It wasn't fair.\"\n👹 Giant：\"Perhaps... I was hungry, and I didn't think,\" he said slowly.","textEn":"👹 Giant：\"You stole my treasures!\" the giant grumbled, covered in mud.\n👦 Jack：\"You stole our cow!\" Jack said bravely.\n\"It wasn't fair.\"","images":["../../local/generated-visuals/english-story-10-jack-and-the-beanstalk/page-1.webp"],"imageAlt":"Making Peace主题插图"},{"title":"The End","scene":"star","detailsText":"Jack's mother gave the giant some hot porridge. The giant smiled. \"Thank you.\"\nFrom that day on, the giant was kind. Sometimes, he even sent down golden eggs from the clouds, just to share.\nAnd what did Jack learn?\nJack learned that being brave can lead to big adventures. But he also learned that sometimes, the best treasures aren't gold or singing harps. The best treasures are kindness, sharing, and doing the right thing—even when it's hard.\nThe End.","textEn":"Jack's mother gave the giant some hot porridge.\nThe giant smiled.\n\"Thank you.\"\nFrom that day on, the giant was kind.","images":["../../local/generated-visuals/english-story-10-jack-and-the-beanstalk/page-1.webp"],"imageAlt":"The End主题插图"}]};</script>
