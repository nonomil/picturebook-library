    <script>window.COURSEWARE_CONFIG = {"id":"chinese-14-colors","template":"interactive-classroom","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"互动学习","requiredInteractions":["practice:5:match","practice:5:0","practice:5:1","practice:5:2","record:8"],"sourcePath":"childrens-library/courseware/chinese/chinese-14-colors.html","steps":[{"title":"彩虹矿洞","textZh":"Steve 和 Alex 在深山里发现了一个矿洞。入口写着“彩虹矿洞”，里面藏着数字字和颜色字。","detailsText":"数字字：一、二、三、四、五、十、百、千、万。颜色字：红、黄、蓝、绿、白、黑。","images":["../../local/images/chinese-14-colors/webp/page-01.webp"],"imageAlt":"彩虹矿洞入口和数字颜色字","audio":{"src":"../../local/audio/chinese-14-colors/page-1.mp3","lang":"zh-CN"}},{"title":"浅层矿洞 · 一到五","textZh":"一、二、三像一条、两条、三条横线。四和五的笔画更多，先看清顺序，再跟着写一写。","textEn":"一 yī · 二 èr · 三 sān · 四 sì · 五 wǔ","detailsText":"一（1画）、二（2画）、三（3画）、四（5画）、五（4画）。记忆：三横就是三，一个方框里面两个人是四。","images":["../../local/images/chinese-14-colors/webp/page-02.webp"],"imageAlt":"一到五的汉字和笔画","audio":{"src":"../../local/audio/chinese-14-colors/page-2.mp3","lang":"zh-CN"}},{"title":"深层矿洞 · 十百千","textZh":"十、百、千表示越来越大的数量。百里面有“白”，千里面有“十”，读一读它们的词语。","textEn":"十 shí = 10 · 百 bǎi = 100 · 千 qiān = 1000","detailsText":"组词：十分、十足；一百、百姓；一千、千万。Steve 挖到十块铁矿石，Alex 数到十，正好一块不多一块不少。","images":["../../local/images/chinese-14-colors/webp/page-03.webp"],"imageAlt":"十百千和十块铁矿石"},{"title":"最深层 · 万和颜色矿石","textZh":"万是很大的数字。一万等于十个一千。水晶大厅里还藏着红、黄、蓝、绿四种颜色的矿石。","textEn":"万 wàn = 10,000 · 红 hóng · 黄 huáng · 蓝 lán · 绿 lǜ","detailsText":"组词：万一、千万；红色、红花；黄色、黄金；蓝色、蓝天；绿色、绿叶。","images":["../../local/images/chinese-14-colors/webp/page-04.webp"],"imageAlt":"万字和红黄蓝绿颜色矿石"},{"title":"白与黑 · 认识特殊颜色","textZh":"白和黑是两种特别的颜色。白天有白云，天黑以后可以看见黑色的夜空。","textEn":"白 bái · 黑 hēi","detailsText":"白（5画）：白色、白天、白云。黑（12画）：黑色、天黑、黑板。请比较白和黑的明暗变化。","images":["../../local/images/chinese-14-colors/webp/page-05.webp"],"imageAlt":"白和黑两种颜色字"},{"title":"数字和颜色的魔法","textZh":"数字和颜色可以一起组成短语。先把词语配对，再试着说一句完整的话。","detailsText":"例：一朵红花、两个黄太阳、三座蓝山、四片绿叶、五只白鸟、六块黑石头。","practice":{"type":"match","label":"词语配对","prompt":"把数字和颜色短语配成一对。","leftLabel":"数字","rightLabel":"颜色短语","pairs":[{"left":"一朵","right":"红花"},{"left":"两座","right":"蓝山"},{"left":"五只","right":"白鸟"}]},"images":["../../local/images/chinese-14-colors/webp/page-06.webp"],"imageAlt":"数字和颜色组成的词语"},{"title":"古诗角 · 望庐山瀑布","textZh":"唐代诗人李白把庐山瀑布写得像从天上落下的银河。读一读全诗，再想象瀑布的声音和颜色。","detailsText":"日照香炉生紫烟\n遥看瀑布挂前川\n飞流直下三千尺\n疑是银河落九天","images":["../../local/images/chinese-14-colors/webp/page-07.webp"],"imageAlt":"望庐山瀑布诗意画面"},{"title":"逐句赏诗 · 看见瀑布的变化","textZh":"“紫烟”是阳光下的雾气，“挂前川”写远处看见的瀑布，“飞流直下”让我们感到水流很快。","detailsText":"日照香炉生紫烟：阳光照在山峰上，雾气像紫色的烟。\n遥看瀑布挂前川：远远看去，瀑布挂在山前。\n飞流直下三千尺：水流从高处飞快落下。","images":["../../local/images/chinese-14-colors/webp/poem-line-2.webp","../../local/images/chinese-14-colors/webp/poem-line-3.webp"],"imageAlt":"诗句中的山峰和瀑布"},{"title":"完成回顾 · 数字颜色小达人","textZh":"你已经认识数字字和颜色字，还读了《望庐山瀑布》。请说出一个“数字 + 颜色”的短语，再勾选完成。","detailsText":"最后一句“疑是银河落九天”是诗人的想象：瀑布好像银河从九重天落下来。","images":["../../local/images/chinese-14-colors/webp/page-09.webp"],"imageAlt":"瀑布像银河落下的诗意画面","record":{"prompt":"我能读出一组数字字、颜色字和一句诗。","label":"我完成了这一课"}}]};</script>
