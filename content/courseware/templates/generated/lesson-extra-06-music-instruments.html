    <script>window.COURSEWARE_CONFIG = {"id":"lesson-extra-06-music-instruments","template":"activity-studio","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"动手活动","requiredInteractions":["record:5"],"sourcePath":"lesson_extra_06_音乐活动：打击乐器.html","steps":[{"title":"今天要学会什么？","scene":"star","textZh":"我们要发现\n我们会发现：","detailsText":"我们要发现\n我们会发现：\n认识常见打击乐器（铃鼓、沙锤、三角铁、双响筒、响板）\n初步了解不同乐器的音色特点（清脆/低沉/摇晃/敲击声）\n理解简单节奏型（如两拍子、四拍子的交替）\n我们会练习：\n手眼协调能力：能正确握持乐器并准确敲击/摇晃\n节奏感知能力：能跟随音乐节拍进行简单的合奏\n音乐表现能力：能根据音乐情绪变化调整演奏力度\n合作能力：能在集体演奏中保持自己的声部\n我们会感受到：\n体验音乐创作的乐趣，建立自信心\n培养对音乐活动的兴趣和热情\n在集体演奏中感受合作的快乐与成就感","images":["../../local/generated-visuals/lesson-extra-06-music-instruments/page-1.webp"],"imageAlt":"今天要学会什么？主题插图"},{"title":"准备材料","scene":"star","textZh":"需要的东西\n需要的东西：","detailsText":"需要的东西\n需要的东西：\n🥁 铃鼓 —— 适合摇晃与拍击\nmaracas 沙锤 —— 摇晃产生沙沙声\n🔔 三角铁 —— 清脆的金属声\n🎵 双响筒 —— 双音高对比\n👏 响板 —— 节奏感强\n辅助材料：\n节奏图谱（大号、彩色）\n动物图片/水果图片（用于节奏游戏）\n3-4首不同风格的背景音乐\n软垫或地毯（减少噪音）","images":["../../local/generated-visuals/lesson-extra-06-music-instruments/page-2.webp"],"imageAlt":"准备材料主题插图"},{"title":"先来玩一玩","scene":"star","textZh":"我们来试试\n🎁 神秘音乐箱","detailsText":"我们来试试\n先来玩一玩\n🎁 神秘音乐箱\n大人出示装饰精美的\"音乐箱\"，摇晃箱子发出声音，让孩子猜测：\"箱子里有什么声音朋友？\"\n👋 乐器见面会\n逐一介绍乐器：\"大家好，我是三角铁丁丁，我的声音像小铃铛\"，让每个孩子触摸、观察乐器。\n第二部分：乐器探索（15分钟）\n自由探索时间：分发乐器，给孩子3分钟自由探索\n声音魔法课：大人示范不同演奏方式——轻摇沙锤像下雨，重敲三角铁像打雷\n模仿游戏：大人做动作，孩子模仿\n第三部分：节奏学习（20分钟）\n身体节奏先行：先用身体拍打节奏——拍手、拍腿、跺脚\n乐器跟练：将身体节奏转移到乐器上\n简单合奏：播放《小星星》，分声部进入\n节奏接龙：大人拍4拍节奏，最后一拍指定孩子接龙\n第四部分：创意演奏（15分钟）\n🌧️ 故事音乐剧：下雨天的故事\n开始下雨（沙锤轻轻摇）→ 雨变大（所有乐器一起演奏）→ 雷声（三角铁重敲）→ 雨停了（乐器渐弱停止）\n🐾 动物音乐会\n小鸟组（三角铁）：叮叮叮\n小兔组（沙锤）：沙沙沙\n大象组（低音鼓）：咚—咚—\n第五部分：分享与总结（10分钟）\n每组表演1分钟自创节奏\n引导孩子分类整理乐器：\"三角铁回家睡觉啦\"\n为每个孩子颁发\"小小节奏师\"贴纸证书","images":["../../local/generated-visuals/lesson-extra-06-music-instruments/page-3.webp"],"imageAlt":"先来玩一玩主题插图"},{"title":"和家人一起做","scene":"star","textZh":"还可以这样玩\n家庭音乐角：提供简易乐器制作指南（如米粒沙锤、瓶盖响板）","detailsText":"还可以这样玩\n家庭音乐角：提供简易乐器制作指南（如米粒沙锤、瓶盖响板）\n跨学科连接：用乐器演奏节奏型来认识1+1=2\n创作升级：用颜色代表不同乐器，创作可视化乐谱\n文化探索：简单介绍中国传统打击乐器（锣、钹、木鱼）","images":["../../local/generated-visuals/lesson-extra-06-music-instruments/page-4.webp"],"imageAlt":"和家人一起做主题插图"},{"title":"安全提醒","scene":"star","textZh":"安全第一：所有乐器需无尖锐边角，演奏时保持座位间距\n正向引导：不说\"不要吵\"，而说\"让我们听听三角铁的声音\"","detailsText":"安全提醒\n安全第一：所有乐器需无尖锐边角，演奏时保持座位间距\n正向引导：不说\"不要吵\"，而说\"让我们听听三角铁的声音\"\n差异化教学：为能力不同的孩子设计不同任务\n使用音量控制，保护听力（单次演奏不超过20分钟）","images":["../../local/generated-visuals/lesson-extra-06-music-instruments/page-5.webp"],"imageAlt":"安全提醒主题插图"},{"title":"老师小提示","scene":"star","textZh":"音乐活动的核心是享受过程而非追求完美。让孩子在探索中发现自己的音乐表达方式，每一次敲击都是独特的创作！","detailsText":"老师小提示\n音乐活动的核心是享受过程而非追求完美。让孩子在探索中发现自己的音乐表达方式，每一次敲击都是独特的创作！","images":["../../local/generated-visuals/lesson-extra-06-music-instruments/page-6.webp"],"imageAlt":"老师小提示主题插图","record":{"prompt":"这一课完成了吗？请勾选后保存学习记录。","label":"我完成了这一课"}}]};</script>
