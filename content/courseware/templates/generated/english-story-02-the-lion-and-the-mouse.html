    <script>window.COURSEWARE_CONFIG = {"id":"english-story-02-the-lion-and-the-mouse","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"english_story_02_The_Lion_and_the_Mouse.html","steps":[{"title":"The Lion and the Mouse","scene":"meadow","detailsText":"Deep in the heart of the Great Green Forest lived a big, golden lion named Leo. His roar was so loud, it made the leaves on the tallest trees shake. Leo was very proud of his strong, sharp teeth and his mighty claws. He was the king of the forest, and everyone knew it.","textZh":"Deep in the heart of the Great Green Forest lived a big, golden lion named Leo.\nHis roar was so loud, it made the leaves on the tallest trees shake.","images":["../../local/generated-visuals/english-story-02-the-lion-and-the-mouse/page-1.webp"],"imageAlt":"The Lion and the Mouse主题插图"},{"title":"A Little Disturbance","scene":"picnic","detailsText":"One warm afternoon, Leo was taking a nap under a giant acacia tree. He was sleeping soundly, dreaming of chasing zebras, when a little mouse named Milly scurried across his paw.","textZh":"One warm afternoon, Leo was taking a nap under a giant acacia tree.","images":["../../local/generated-visuals/english-story-02-the-lion-and-the-mouse/page-1.webp"],"imageAlt":"A Little Disturbance主题插图"},{"title":"Caught by the Lion","scene":"wind","detailsText":"Leo 🦁：Mmmph! What's this?\nMilly 🐭：Oh, Mr. Lion! I am so sorry! Please don't eat me!\nLeo 🦁：You should be sorry. Disturbing the king of the forest! I ought to teach you a lesson.","textZh":"Leo 🦁：Mmmph!\nWhat's this?\nMilly 🐭：Oh, Mr.\nLion!\nI am so sorry!","images":["../../local/generated-visuals/english-story-02-the-lion-and-the-mouse/page-1.webp"],"imageAlt":"Caught by the Lion主题插图"},{"title":"Milly's Promise","scene":"listening","detailsText":"Milly 🐭：Please! Don't eat me, please! If you let me go, I promise to help you someday. I know I am small, but even small creatures can be a big help!\nLeo 🦁：You? Help me? That is very funny. Alright then, little one. I am in a good mood. You may go. But don't let me catch you near my nap again!","textZh":"Milly 🐭：Please!\nDon't eat me, please!\nIf you let me go, I promise to help you someday.\nI know I am small, but even small creatures can be a big help!","images":["../../local/generated-visuals/english-story-02-the-lion-and-the-mouse/page-1.webp"],"imageAlt":"Milly's Promise主题插图"},{"title":"Leo Gets Trapped","scene":"bubbles","detailsText":"A few days later, something bad happened. Some hunters came to the forest. They set up a strong net and placed tasty fruit as a trap. Leo, following the scent of mangoes, walked right into it! The net fell over him—whump! He roared and struggled, but the more he moved, the tighter the ropes pulled. He was trapped!","textZh":"A few days later, something bad happened.\nSome hunters came to the forest.\nThey set up a strong net and placed tasty fruit as a trap.","images":["../../local/generated-visuals/english-story-02-the-lion-and-the-mouse/page-1.webp"],"imageAlt":"Leo Gets Trapped主题插图"},{"title":"The Mighty Roar","scene":"star","detailsText":"Leo 🦁：Help! Someone, help! *roars until hoarse*\nHiding in a bush, Milly heard the mighty roars of pain and frustration. She knew that voice. It was the lion from under the tree!","textZh":"Leo 🦁：Help!\nSomeone, help!\n*roars until hoarse*\nHiding in a bush, Milly heard the mighty roars of pain and frustration.\nShe knew that voice.","images":["../../local/generated-visuals/english-story-02-the-lion-and-the-mouse/page-1.webp"],"imageAlt":"The Mighty Roar主题插图"},{"title":"Milly to the Rescue","scene":"meadow","detailsText":"Milly 🐭：Mr. Leo! Is that you?\nLeo 🦁：Oh, it's you, little mouse. Well, you see my trouble. I am caught in a hunter's net. This is the end.\nMilly 🐭：Not the end! You let me go when I thought all was lost. Now, it is my turn to help you.","textZh":"Milly 🐭：Mr.\nLeo!\nIs that you?\nLeo 🦁：Oh, it's you, little mouse.\nWell, you see my trouble.","images":["../../local/generated-visuals/english-story-02-the-lion-and-the-mouse/page-1.webp"],"imageAlt":"Milly to the Rescue主题插图"},{"title":"Gnaw, Gnaw, Gnaw","scene":"picnic","detailsText":"Milly didn't say a word. She put her sharp little teeth to work on one of the thick ropes. Gnaw, gnaw, gnaw. It was hard work, and her jaws got tired, but she didn't stop. Leo watched in amazement. For hours, the little mouse chewed and chewed, one strand at a time. Finally, with a loud SNAP, the biggest rope broke. The net loosened enough for Leo to push his way out. He was free!","textZh":"Milly didn't say a word.\nShe put her sharp little teeth to work on one of the thick ropes.\nGnaw, gnaw, gnaw.","images":["../../local/generated-visuals/english-story-02-the-lion-and-the-mouse/page-1.webp"],"imageAlt":"Gnaw, Gnaw, Gnaw主题插图"},{"title":"A New Friendship","scene":"wind","detailsText":"Leo 🦁：Thank you, Milly. I am sorry I laughed at you. You saved my life. You are a very brave and clever friend.\nMilly 🐭：You are welcome, Leo. I told you, even small creatures can help.","textZh":"Leo 🦁：Thank you, Milly.\nI am sorry I laughed at you.\nYou saved my life.\nYou are a very brave and clever friend.\nMilly 🐭：You are welcome, Leo.","images":["../../local/generated-visuals/english-story-02-the-lion-and-the-mouse/page-1.webp"],"imageAlt":"A New Friendship主题插图"},{"title":"Moral of the Story","scene":"listening","detailsText":"No one is too small or too mighty to help another. Kindness is never wasted.\n没有人太渺小或太强大而不能帮助他人。善良永远不会被浪费。","textZh":"No one is too small or too mighty to help another.\nKindness is never wasted.\n没有人太渺小或太强大而不能帮助他人。善良永远不会被浪费。","images":["../../local/generated-visuals/english-story-02-the-lion-and-the-mouse/page-1.webp"],"imageAlt":"Moral of the Story主题插图"}]};</script>
