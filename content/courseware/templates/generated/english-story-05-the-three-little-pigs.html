    <script>window.COURSEWARE_CONFIG = {"id":"english-story-05-the-three-little-pigs","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"english_story_05_The_Three_Little_Pigs.html","steps":[{"title":"The Beginning","scene":"meadow","detailsText":"Once upon a time, in a bright green meadow, three little pigs left their mother's cozy home to build houses of their own.","textEn":"Once upon a time, in a bright green meadow, three little pigs left their mother's cozy home to build houses of their own.","images":["../../local/generated-visuals/english-story-05-the-three-little-pigs/page-1.webp"],"imageAlt":"The Beginning主题插图"},{"title":"The First Little Pig","scene":"picnic","detailsText":"\"I will build my house today!\" said the first little pig. He found some soft, yellow straw. Whoosh, whoosh! He built a little house in just one hour. \"Now I can play all day!\" he laughed, dancing around his straw house.","textEn":"\"I will build my house today!\" said the first little pig.\nHe found some soft, yellow straw.\nWhoosh, whoosh!\nHe built a little house in just one hour.","images":["../../local/generated-visuals/english-story-05-the-three-little-pigs/page-1.webp"],"imageAlt":"The First Little Pig主题插图"},{"title":"The Second Little Pig","scene":"wind","detailsText":"\"I will build my house this week,\" said the second little pig. He gathered long, thin sticks. Tap, tap, tap! He built a house with a wobbly door. It took him three days. \"Good enough!\" he said, and went to play with his brother.","textEn":"\"I will build my house this week,\" said the second little pig.\nHe gathered long, thin sticks.\nTap, tap, tap!\nHe built a house with a wobbly door.","images":["../../local/generated-visuals/english-story-05-the-three-little-pigs/page-1.webp"],"imageAlt":"The Second Little Pig主题插图"},{"title":"The Third Little Pig","scene":"listening","detailsText":"But the third little pig was different. \"I will build a house that lasts,\" he said wisely. He found red, hard bricks and gray, sticky mortar. Clank, scrape, clank. Every day he worked from sunrise to sunset. It took him a whole month! But finally, he had a strong, solid brick house with a sturdy chimney.","textEn":"But the third little pig was different.\n\"I will build a house that lasts,\" he said wisely.\nHe found red, hard bricks and gray, sticky mortar.","images":["../../local/generated-visuals/english-story-05-the-three-little-pigs/page-1.webp"],"imageAlt":"The Third Little Pig主题插图"},{"title":"The Wolf Arrives","scene":"bubbles","detailsText":"One day, a big, bad wolf came trotting from the dark woods. He saw the first pig's straw house. Knock, knock! \"Little pig, little pig, let me come in!\" he howled.","textEn":"One day, a big, bad wolf came trotting from the dark woods.\nHe saw the first pig's straw house.\nKnock, knock!","images":["../../local/generated-visuals/english-story-05-the-three-little-pigs/page-1.webp"],"imageAlt":"The Wolf Arrives主题插图"},{"title":"The First House Falls","scene":"star","detailsText":"🐷 First Little Pig：\"Not by the hair on my chinny-chin-chin!\" squeaked the little pig.\n🐺 The Wolf：The wolf took a deep breath. \"Then I'll huff, and I'll puff, and I'll blow your house in!\" And he did! The straw house flew away like dandelion seeds.","textEn":"🐷 First Little Pig：\"Not by the hair on my chinny-chin-chin!\" squeaked the little pig.\n🐺 The Wolf：The wolf took a deep breath.","images":["../../local/generated-visuals/english-story-05-the-three-little-pigs/page-1.webp"],"imageAlt":"The First House Falls主题插图"},{"title":"The Second House Falls","scene":"meadow","detailsText":"🐷🐷 The Two Pigs：\"Not by the hair on our chinny-chin-chins!\" they cried together.\n🐺 The Wolf：\"Then I'll huff, and I'll puff, and I'll blow your house in!\" He huffed and puffed until the sticks fell down like pick-up sticks.","textEn":"🐷🐷 The Two Pigs：\"Not by the hair on our chinny-chin-chins!\" they cried together.","images":["../../local/generated-visuals/english-story-05-the-three-little-pigs/page-1.webp"],"imageAlt":"The Second House Falls主题插图"},{"title":"The Brick House Stands Strong","scene":"picnic","detailsText":"🐷🐷🐷 The Three Pigs：\"NOT BY THE HAIR ON OUR CHINNY-CHIN-CHINS!\" they shouted, huddled together.\n🐺 The Wolf：The wolf was angry. \"Then I'll huff, and I'll PUFF, and I'll BLOW YOUR HOUSE IN!\" He blew with all his might. But the brick house didn't move. Not even a little.","textEn":"🐷🐷🐷 The Three Pigs：\"NOT BY THE HAIR ON OUR CHINNY-CHIN-CHINS!\" they shouted, huddled together.\n🐺 The Wolf：The wolf was angry.","images":["../../local/generated-visuals/english-story-05-the-three-little-pigs/page-1.webp"],"imageAlt":"The Brick House Stands Strong主题插图"},{"title":"The Clever Plan","scene":"wind","detailsText":"Then the wolf saw the chimney. \"Aha!\" he thought. He climbed onto the roof and started to slide down. But the clever third little pig had been ready. He put a big pot of water on the fire. Gurgle, gurgle, bubble! When the wolf slid down, he landed right in the hot water!","textEn":"Then the wolf saw the chimney.\n\"Aha!\" he thought.\nHe climbed onto the roof and started to slide down.\nBut the clever third little pig had been ready.","images":["../../local/generated-visuals/english-story-05-the-three-little-pigs/page-1.webp"],"imageAlt":"The Clever Plan主题插图"},{"title":"The End","scene":"listening","detailsText":"\"Yowch!\" yelled the wolf. He jumped up and ran away as fast as he could, all the way back to the dark woods, and never bothered the pigs again.\nThe three little pigs danced with joy in their safe, strong house. They had learned that taking time to do things right was the best way to be safe and happy.\nMoral: Hard work and careful planning protect us and help us build a safe, happy home.","textEn":"\"Yowch!\" yelled the wolf.\nHe jumped up and ran away as fast as he could, all the way back to the dark woods, and never bothered the pigs again.","images":["../../local/generated-visuals/english-story-05-the-three-little-pigs/page-1.webp"],"imageAlt":"The End主题插图"}]};</script>
