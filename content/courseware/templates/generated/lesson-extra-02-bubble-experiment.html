    <script>window.COURSEWARE_CONFIG = {"id":"lesson-extra-02-bubble-experiment","template":"activity-studio","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"动手活动","requiredInteractions":["record:5"],"sourcePath":"lesson_extra_02_科学实验：吹泡泡.html","steps":[{"title":"知识目标：","scene":"bubbles","textZh":"🎯 活动目标\n初步感知泡泡的形成原理（水的表面张力与空气的相互作用）\n认识泡泡的基本特征：形状（球形/圆形）、色彩（彩虹色）、轻盈易破等\n了解不同工具吹出的泡泡可能呈现不同效果\n能力目标：","detailsText":"🎯 活动目标\n初步感知泡泡的形成原理（水的表面张力与空气的相互作用）\n认识泡泡的基本特征：形状（球形/圆形）、色彩（彩虹色）、轻盈易破等\n了解不同工具吹出的泡泡可能呈现不同效果\n能力目标：\n动手能力：学习调配泡泡水、操作泡泡器，锻炼手部精细动作与手眼协调\n观察与探索能力：通过对比实验，观察泡泡的变化并简单描述现象\n语言表达能力：在活动中分享发现，用简单语言描述泡泡的特点\n合作能力：小组活动中学会轮流操作、互助吹泡泡\n情感目标：\n在游戏化实验中感受科学探究的乐趣，激发好奇心与探究欲\n体验创造与发现的成就感，增强自信心\n培养珍惜水资源、使用环保材料的环保意识","images":["../../local/generated-visuals/lesson-extra-02-bubble-experiment/page-1.webp"],"imageAlt":"知识目标：主题插图"},{"title":"泡泡水配方：","scene":"bubbles","textZh":"📦 材料准备\n水500ml + 洗洁精50ml + 甘油10ml\n甘油可增加泡泡韧性，也可用白糖替代\n泡泡工具：\n商业泡泡棒（圆形、星星形、心形）","detailsText":"📦 材料准备\n水500ml + 洗洁精50ml + 甘油10ml\n甘油可增加泡泡韧性，也可用白糖替代\n泡泡工具：\n商业泡泡棒（圆形、星星形、心形）\nDIY工具：铁丝弯成不同形状、塑料瓶底、叉子、吸管等\n辅助材料：\n大托盘/浅盆（盛泡泡水，防洒）\n放大镜（观察泡泡表面的彩虹色）\n风扇或扇子（研究风速对泡泡的影响）\n记录纸、蜡笔（简单记录泡泡形状）","images":["../../local/generated-visuals/lesson-extra-02-bubble-experiment/page-2.webp"],"imageAlt":"泡泡水配方：主题插图"},{"title":"第一阶段：引入与探索（15分钟）","scene":"bubbles","textZh":"📋 详细步骤\n🫧 趣味导入\n教师吹出一串泡泡，提问：\"泡泡从哪里来？它是什么形状的？\"引发幼儿兴趣。\n🔬 自由探索\n每人领取一个泡泡棒，尝试自由吹泡泡。引导观察：泡泡在空中是什么形状？轻轻吹和用力吹有什么不同？","detailsText":"📋 详细步骤\n🫧 趣味导入\n教师吹出一串泡泡，提问：\"泡泡从哪里来？它是什么形状的？\"引发幼儿兴趣。\n🔬 自由探索\n每人领取一个泡泡棒，尝试自由吹泡泡。引导观察：泡泡在空中是什么形状？轻轻吹和用力吹有什么不同？\n第二阶段：小组实验与发现（20分钟）\n实验1：不同吹法——尝试\"轻轻吹\"与\"快速吹\"，观察泡泡大小与数量\n实验2：不同工具——用圆形、星形泡泡器吹泡泡，对比泡泡形状\n实验3：泡泡彩虹——在泡泡水中加入食用色素，观察彩色泡泡\n🤝 合作游戏\n两人一组，一人吹泡泡，另一人尝试用扇子轻轻扇动，看泡泡能飞多远。\n第三阶段：总结与分享（10分钟）\n💬 集体讨论\n教师用提问引导总结：\"泡泡为什么是圆的？为什么有彩色？\"幼儿分享最喜欢的实验环节。","images":["../../local/generated-visuals/lesson-extra-02-bubble-experiment/page-3.webp"],"imageAlt":"第一阶段：引入与探索（15分钟）主题插图"},{"title":"艺术创作：","scene":"bubbles","textZh":"🌟 延伸活动\n艺术创作： 用吸管将泡泡吹到纸上，喷上水彩颜料，制作\"泡泡画\"\n科学探究： 在不同天气下吹泡泡，记录泡泡飘动的方向\n语言与数学： 数一数吹出的泡泡数量，尝试简单分类（大/小、彩色/透明）","images":["../../local/generated-visuals/lesson-extra-02-bubble-experiment/page-4.webp"],"imageAlt":"艺术创作：主题插图"},{"title":"安全第一：","scene":"bubbles","textZh":"⚠️ 注意事项\n安全第一： 确保洗洁精无刺激性，避免接触眼睛；使用后洗手\n防误食： 明确告知泡泡水不可饮用\n场地选择： 在空旷、通风的室内或户外进行\n防滑措施： 地面及时擦干，避免踩到泡泡水滑倒","images":["../../local/generated-visuals/lesson-extra-02-bubble-experiment/page-5.webp"],"imageAlt":"安全第一：主题插图"},{"title":"💡 核心理念","scene":"bubbles","textZh":"通过这场融合科学探索与游戏精神的活动，孩子们将在斑斓的泡泡世界中，收获知识、能力与快乐的多重成长！","images":["../../local/generated-visuals/lesson-extra-02-bubble-experiment/page-6.webp"],"imageAlt":"💡 核心理念主题插图","record":{"prompt":"这一课完成了吗？请勾选后保存学习记录。","label":"我完成了这一课"}}]};</script>
