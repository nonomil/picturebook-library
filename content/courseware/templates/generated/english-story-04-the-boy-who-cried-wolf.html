    <script>window.COURSEWARE_CONFIG = {"id":"english-story-04-the-boy-who-cried-wolf","template":"adventure-story","contentType":"","categoryLabel":"","author":"","dynasty":"","activityLabel":"故事阅读","requiredInteractions":[],"sourcePath":"english_story_04_The_Boy_Who_Cried_Wolf.html","steps":[{"title":"The Shepherd Boy","scene":"meadow","detailsText":"Once upon a time, in a sunny green valley, there lived a young shepherd boy named Eli. His job was to watch over the fluffy white sheep on the hillside every day. It was a very important job. The sheep were soft and gentle, and they trusted Eli to keep them safe. Most days, Eli sat on his favorite rock, counting the sheep and watching the clouds drift by.","textZh":"Once upon a time, in a sunny green valley, there lived a young shepherd boy named Eli.","images":["../../local/generated-visuals/english-story-04-the-boy-who-cried-wolf/page-1.webp"],"imageAlt":"The Shepherd Boy主题插图"},{"title":"A Boring Day","scene":"picnic","detailsText":"But some days, Eli felt bored. There was no one to talk to, only the sheep who would say, \"Baa!\" One day, Eli had a mischievous idea. He stood up and shouted as loud as he could, his voice echoing across the valley.","textZh":"But some days, Eli felt bored.\nThere was no one to talk to, only the sheep who would say, \"Baa!\" One day, Eli had a mischievous idea.","images":["../../local/generated-visuals/english-story-04-the-boy-who-cried-wolf/page-1.webp"],"imageAlt":"A Boring Day主题插图"},{"title":"The First Lie","scene":"wind","detailsText":"Eli 👦：Wolf! A big gray wolf is chasing the sheep! Help!\nDown in the village, the farmers heard the shout. They dropped their tools and ran up the hill as fast as they could.\nOld Man Miller 👴：Where is the wolf, Eli?\nEli 👦：There is no wolf! I was just pretending!","textZh":"Eli 👦：Wolf!\nA big gray wolf is chasing the sheep!\nHelp!\nDown in the village, the farmers heard the shout.","images":["../../local/generated-visuals/english-story-04-the-boy-who-cried-wolf/page-1.webp"],"imageAlt":"The First Lie主题插图"},{"title":"Farmers Are Not Happy","scene":"listening","detailsText":"Farmers：That was not a funny joke, Eli.\nThe next week, Eli was bored again. The sheep were just chewing grass, and the sun was too warm.","textZh":"Farmers：That was not a funny joke, Eli.\nThe next week, Eli was bored again.\nThe sheep were just chewing grass, and the sun was too warm.","images":["../../local/generated-visuals/english-story-04-the-boy-who-cried-wolf/page-1.webp"],"imageAlt":"Farmers Are Not Happy主题插图"},{"title":"The Second Lie","scene":"bubbles","detailsText":"Eli 👦：Wolf! Help! A wolf is here!\nBaker 🍞：You tricked us again! This is not kind.\nEli just smiled. He liked making people run.","textZh":"Eli 👦：Wolf!\nHelp!\nA wolf is here!\nBaker 🍞：You tricked us again!\nThis is not kind.","images":["../../local/generated-visuals/english-story-04-the-boy-who-cried-wolf/page-1.webp"],"imageAlt":"The Second Lie主题插图"},{"title":"The Real Wolf Appears","scene":"star","detailsText":"Then, one evening, as the sun began to set, Eli saw a shadow move in the trees. A pair of yellow eyes glowed in the twilight. A real wolf, large and quiet, stepped out from the forest. Eli's heart began to beat very fast. He jumped to his feet and shouted, \"Wolf! A real wolf! Help! Please help!\" His voice was scared this time. It cracked with fear.","textZh":"Then, one evening, as the sun began to set, Eli saw a shadow move in the trees.\nA pair of yellow eyes glowed in the twilight.","images":["../../local/generated-visuals/english-story-04-the-boy-who-cried-wolf/page-1.webp"],"imageAlt":"The Real Wolf Appears主题插图"},{"title":"No One Comes","scene":"meadow","detailsText":"Farmers：Oh, Eli is playing his trick again. He has fooled us twice. He won't fool us a third time.\nThey did not come. The wolf stepped closer to the sheep. Eli was so scared. He tried to scare the wolf away himself, throwing sticks and shouting, but the wolf just growled.","textZh":"Farmers：Oh, Eli is playing his trick again.\nHe has fooled us twice.\nHe won't fool us a third time.\nThey did not come.","images":["../../local/generated-visuals/english-story-04-the-boy-who-cried-wolf/page-1.webp"],"imageAlt":"No One Comes主题插图"},{"title":"A Real Rescue","scene":"picnic","detailsText":"Then, just as the wolf was about to step into the field, old Mr. Finn from the far end of the valley heard the real fear in Eli's cries. He came running with his big dog and a lantern. The wolf saw the light and the dog, and it turned and ran back into the dark forest. The sheep were safe.","textZh":"Then, just as the wolf was about to step into the field, old Mr.\nFinn from the far end of the valley heard the real fear in Eli's cries.","images":["../../local/generated-visuals/english-story-04-the-boy-who-cried-wolf/page-1.webp"],"imageAlt":"A Real Rescue主题插图"},{"title":"Eli's Apology","scene":"wind","detailsText":"Eli 👦：I am so sorry. I lied, and then when I needed help, you did not come. I understand why.\nOld Man Miller 👴：It is good you are safe, Eli. But words are very important. When you lie, you break trust. And trust is like a glass vase—once broken, it is hard to put back together.","textZh":"Eli 👦：I am so sorry.\nI lied, and then when I needed help, you did not come.\nI understand why.\nOld Man Miller 👴：It is good you are safe, Eli.","images":["../../local/generated-visuals/english-story-04-the-boy-who-cried-wolf/page-1.webp"],"imageAlt":"Eli's Apology主题插图"},{"title":"A Changed Boy","scene":"listening","detailsText":"Eli nodded. He promised to never cry wolf again unless it was real. And from that day on, Eli was an honest boy. And whenever he felt bored on the hill, he would just sing songs to the sheep, who would listen and say, \"Baa!\" And everyone believed him when he spoke.","textZh":"Eli nodded.\nHe promised to never cry wolf again unless it was real.\nAnd from that day on, Eli was an honest boy.","images":["../../local/generated-visuals/english-story-04-the-boy-who-cried-wolf/page-1.webp"],"imageAlt":"A Changed Boy主题插图"},{"title":"Moral of the Story","scene":"bubbles","detailsText":"When you tell lies, people will not believe you, even when you are telling the truth. It is always best to be honest, so people know they can trust your words.\n当你撒谎时，人们不会相信你，即使你说的是真话。最好始终保持诚实，这样人们才会相信你的话。","textZh":"When you tell lies, people will not believe you, even when you are telling the truth.","images":["../../local/generated-visuals/english-story-04-the-boy-who-cried-wolf/page-1.webp"],"imageAlt":"Moral of the Story主题插图"}]};</script>
