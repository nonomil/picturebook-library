\n🏠 Home · School · Morning\nOn Monday morning, Lily wakes up at home. She is happy! But she feels a little hungry.\n\"Time for school!\" says Mom. Lily walks to the kitchen. She sits down to eat breakfast. Then she stands up and gets her bag.\nShe walks to school with a big smile. It's going to be a great week!\nhome\nschool\nmorning\nhappy\nhungry\nwalk\nsit\nstand","images":["../../local/images/english-18/webp/page-01.webp"],"imageAlt":"Monday Morning ☀️","audio":{"src":"../../local/audio/english-18-review/page-3.mp3","lang":"en-US"}},{"title":"Tuesday – Park & Shop 🌳","scene":"listening","textZh":"4\nTuesday Park and Shop","detailsText":"4\nTuesday Park and Shop\n📍 Park · Shop · Afternoon\nOn Tuesday afternoon, Lily goes to the park. She loves to run and jump on the grass!\n\"I'm getting tired,\" she says after playing. So she sits on a bench to rest.\nThen Mom takes her to the shop to buy some fruit. Lily picks apples and oranges. What a fun day!\npark\nshop\nafternoon\nrun\njump\ntired","images":["../../local/images/english-18/webp/page-02.webp"],"imageAlt":"Tuesday – Park & Shop 🌳","audio":{"src":"../../local/audio/english-18-review/page-4.mp3","lang":"en-US"}},{"title":"Wednesday – Farm 🐄","scene":"bubbles","textZh":"5\nWednesday Farm","detailsText":"5\nWednesday Farm\n🚜 Farm · Time Words · Sight Words\nOn Wednesday, the class goes to the farm! Today is a special day. Lily sees cows, sheep, and chickens.\n\"What will we see tomorrow?\" she asks. \"Maybe we can come back at night to see the stars.\"\nThey ride the bus back to school. Lily ate an apple on the bus. She feels so brave after petting a big horse!\nfarm\ntoday\ntomorrow\nnight\nbus\nate\nbrave","images":["../../local/images/english-18/webp/page-03.webp"],"imageAlt":"Wednesday – Farm 🐄","audio":{"src":"../../local/audio/english-18-review/page-5.mp3","lang":"en-US"}},{"title":"Thursday – Zoo 🐯","scene":"star","textZh":"6\nThursday Zoo","detailsText":"6\nThursday Zoo\n🐾 Zoo · Train · Feelings\nOn Thursday, everyone takes the train to the zoo! Lily is a little scared of the lions, but she is excited too.\nShe sees monkeys jump and birds dance. \"I saw a penguin swim!\" she shouts. \"I did it — I touched a snake!\"\nWhen Dad came to pick her up, Lily says, \"This was the best day!\"\nzoo\ntrain\nscared\njump\ndance\nsaw\ndid\ncame","images":["../../local/images/english-18/webp/page-04.webp"],"imageAlt":"Thursday – Zoo 🐯","audio":{"src":"../../local/audio/english-18-review/page-6.mp3","lang":"en-US"}},{"title":"Friday – Sports Day 🏅","scene":"meadow","textZh":"7\nFriday Sports Day","detailsText":"7\nFriday Sports Day\n🏃 Running · Swimming · Winning\nOn Friday morning, Sports Day begins! Lily ran faster than ever. She can swim so fast in the pool.\n\"I want to win!\" she thinks. She runs and jumps. In the afternoon, the race is over.\nLily ran her best race. She didn't win first place, but she did her best and that made her happy!\nmorning\nafternoon\nran\nswim\nfast\nwin","images":["../../local/images/english-18/webp/page-05.webp"],"imageAlt":"Friday – Sports Day 🏅","audio":{"src":"../../local/audio/english-18-review/page-7.mp3","lang":"en-US"}},{"title":"The Weekend 🌈","scene":"picnic","textZh":"8\nThe Weekend","detailsText":"8\nThe Weekend\n🚲 Bike · Boat · Plane · Love\nOn the weekend, Lily's family goes on an adventure! Dad rides his bike. Mom takes the boat across the lake.\nLily looks at the sky and sees a plane flying high. She looks at the water and sees fish.\n\"I love my family!\" Lily says. She rides her bike along the path with the wind in her hair. What a perfect weekend!\nbike\nboat\nplane\nsky\nwater\nride\nlove","images":["../../local/images/english-18/webp/page-06.webp"],"imageAlt":"The Weekend 🌈","audio":{"src":"../../local/audio/english-18-review/page-8.mp3","lang":"en-US"}},{"title":"The Big Story Complete 🎉","scene":"wind","textZh":"9\nThe Big Story Complete","detailsText":"9\nThe Big Story Complete\n📖 Phase 3 Complete!\nYou have learned all 42
