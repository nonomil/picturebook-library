  font-weight: bold;

  box-shadow: 0 3px 0 #DDD;

}
.word-choice:hover {
  border-color: #FFB347;
  background: #FFF8E7;
  transform: translateY(-2px);
  box-shadow: 0 5px 0 #DDD;
}
.word-choice:active {
  transform: translateY(2px);
  box-shadow: 0 0 0 #DDD;
  cursor: grabbing;
}
.word-choice.correct {
  border-color: #4caf50;
  background: #e8f5e9;
  animation: bounce 0.4s ease;
  box-shadow: 0 3px 0 #388E3C;
}
.word-choice.wrong {
  border-color: #f44336;
  background: #ffebee;
  animation: shake 0.3s;
  box-shadow: 0 3px 0 #C62828;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
@keyframes bounce {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

.drop-zone {

.drop-zone.drag-over {

}
.word-choice.dragging { opacity: 0.5; transform: scale(1.05); }

let currentPage = 0;
let gameDone = new Array(pages.length).fill(false);

// ===== Speech Bubble =====
function showSpeechBubble(text, duration) {
  const bubble = document.getElementById('speechBubble');
  const textEl = document.getElementById('speechText');
  if (!textEl) return;
  
  textEl.textContent = text;
  bubble.style.display = 'flex';
  
  // Audio is played by the caller (playAudio or speakText)

  // Auto-hide
  clearTimeout(bubble._hideTimer);
  const dur = duration || Math.max(2500, text.length * 120);
  bubble._hideTimer = setTimeout(function() {
    bubble.style.display = 'none';
  }, dur);
  
}

function hideSpeechBubble() {
  const bubble = document.getElementById('speechBubble');
  bubble.style.display = 'none';
}

// ===== Rendering =====
function renderPage(idx) {
  const area = document.getElementById('pageArea');
  const p = pages[idx];

  let extraClasses = p.cover ? 'cover-page' : '';
  let content = '';

  if (p.cover) {
    content = `
      <div class="page active ${extraClasses}" id="${p.id}">
        <div class="page-title">${p.title}</div>
        <div class="cover-emoji illustration">${p.svg()}</div>
        <div class="cover-tagline">Sight Word Tales · Book 1</div>
        <div class="word-pills">
          <span class="word-pill" onclick="speakWord('can')">can</span>
          <span class="word-pill" onclick="speakWord('we')">we</span>
        </div>
        <div class="sentence">${p.sentence}</div>
        ${p.game ? renderGame(idx, p.game) : ''}
      </div>
    `;
  } else {
    let gameHtml = '';
    if (p.game) {
      gameHtml = renderGame(idx, p.game);
    } else {
      gameHtml = '<div class="game-area game-done"><h3>🎉 Story Complete!</h3><p style="color:#2e7d32;font-size:40px;margin-top:8px">★ ★ ★</p><p style="color:#555;font-size:16px">You read the whole story!</p></div>';
    }
    content = `
      <div class="page active ${extraClasses}" id="${p.id}">
        <div class="page-title">${p.title}</div>
        <div class="illustration">${p.svg()}</div>
        <div class="sentence">${p.sentence}</div>
        ${gameHtml}
      </div>
    `;
  }

  area.innerHTML = content;
  updateUI(idx);
  document.getElementById('prevBtn').disabled = idx === 0;
  
  // Add click handlers for highlights
  setTimeout(function() {
    document.querySelectorAll('.sentence .highlight').forEach(function(el) {
      el.addEventListener('click', function() {
        var word = this.textContent.trim();
        speakWord(word);
      });
      el.style.cursor = 'pointer';
    });
  }, 50);
}

function renderGame(idx, game) {
  if (gameDone[idx]) {
    return '<div class="game-area game-done"><h3>✅ Great job!</h3><p style="color:#2e7d32;font-size:30px;margin-top:4px">★</p></div>';
  }
  var qSpeak = game.question.replace(/[??⚙️]/g, '').replace(/[""]/g, '').trim();
  var opts = game.options.map(function(w) {
    return '<div class="word-choice" draggable="true" ondragstart="onWordChoiceDragStart(event,' + idx + ",'" + game.word + "','" + w + "')" + '" ondragend="onWordChoiceDragEnd(event)" onclick="checkWord(' + idx + ",'" + game.word + "','" + w + "',this);speakText('" + w + "')" + '">' + w + ' <button class="quiz-opt-speak" onclick="event.stopPropagation();speakText(\'' + w + '\')">🔊</button></div>';
  }).join('');
  
  return `
    <div class="game-area" id="game-${idx}">
      <h3>${game.question} <button class="speak-btn" onclick="event.stopPropagation();speakText('${qSpeak.replace(/'/g, "\\'")}')">🔊</button></h3>
      <div class="drop-zone" id="dropzone-${idx}" ondragover="onDropZoneDragOver(event)" ondrop="onDropZoneDrop(event,${idx})" ondragleave="onDropZoneDragLeave(event)">⬇️ 把正确的词拖到这里</div>
      <div class="word-choices">
        ${opts}
      </div>
    </div>
  `;
}

let dragWordData = null;
function onWordChoiceDragStart(e, idx, target, chosen) {
  dragWordData = { idx, target, chosen, el: e.currentTarget };
  e.dataTransfer.setData('text/plain', chosen);
  e.currentTarget.classList.add('dragging');
}
function onWordChoiceDragEnd(e) {
  dragWordData = null;
  e.currentTarget.classList.remove('dragging');
}
function onDropZoneDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function onDropZoneDrop(e, idx) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (dragWordData && dragWordData.idx === idx) {
    checkWord(dragWordData.idx, dragWordData.target, dragWordData.chosen, dragWordData.el);
  }
}
function onDropZoneDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function checkWord(idx, target, chosen, el) {
  if (gameDone[idx]) return;
  
  // Speak the chosen word
  speakWord(chosen);
  
  if (chosen === target) {
    el.classList.add('correct');
    gameDone[idx] = true;
    launchConfetti();
    setTimeout(function() { renderPage(idx); }, 800);
  } else {
    el.classList.add('wrong');
    setTimeout(function() { el.classList.remove('wrong'); }, 500);
  }
}

function speakText(text) {
    if (typeof ttsPlay === 'function') { ttsPlay(text); }
    else if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
      var clean = text.replace(/[\uD800-\uDFFF]./g,'');
      var utter = new SpeechSynthesisUtterance(clean);
      utter.lang = /[\u4e00-\u9fff]/.test(clean) ? 'zh-CN' : 'en-US';
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
    }
  }

function speakWord(word) {
  showSpeechBubble('🔊 ' + word, 2000);
}

// ===== Read Aloud =====
let currentAudio = null;
function playAudio(src, showText) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (showText) showSpeechBubble(showText, showText.length * 150);
  if (!src) return;
  try {
    const a = new Audio(src);
    a.play();
    currentAudio = a;
    a.onended = function() { currentAudio = null; };
    a.onerror = function() { currentAudio = null; if(showText) speakText(showText); };
  } catch(e) { console.log('Audio error:', e); if(showText) speakText(showText); }
}

function speakPage() {
  const AUDIO_MAP = ['pet-cover', 'pet-page1', 'pet-page2', 'pet-page3', 'pet-page4', 'pet-page5', 'pet-page6', 'pet-page7'];
  const TEXTS = [
    'Can We Get a Pet?',
    '"Can we get a dog?" said the kids.',
    '"Can we get a cat?" said the kids.',
    '"Can we get a bunny?" said the kids.',
    '"Can we get a hamster?" said the kids.',
    '"Can we get a fish?" said the kids.',
    '"Can we get a turtle?" said the kids.',
    '"Yes! We can get a pet!" said Mom and Dad.'
  ];
  const idx = currentPage;
  if (idx >= 0 && idx < AUDIO_MAP.length) {
    playAudio('../audio/' + AUDIO_MAP[idx] + '.mp3', TEXTS[idx]);
  }
}

// ===== Navigation =====
function nextPage() {
  if (!gameDone[currentPage] && pages[currentPage].game) return;
  if (currentPage < pages.length - 1) {
    currentPage++;
    hideSpeechBubble();
    renderPage(currentPage);
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    hideSpeechBubble();
    renderPage(currentPage);
  }
}

function updateUI(idx) {
  document.getElementById('pageCounter').textContent = '第' + (idx+1) + '页 / 共' + pages.length + '页';
  const dots = document.getElementById('progress');
  dots.innerHTML = pages.map(function(_, i) {
    var cls = 'dot';
    if (i === idx) cls += ' active';
    if (gameDone[i]) cls += ' done';
    return '<div class="' + cls + '" onclick="goToPage(' + i + ')"></div>';
  }).join('');
}

function goToPage(i) {
  hideSpeechBubble();
  currentPage = i;
  renderPage(currentPage);
}

// ===== Confetti =====
function launchConfetti() {
  const div = document.createElement('div');
  div.className = 'celebration';
  const colors = ['#FF6B6B','#FECA57','#48DBFB','#FF9FF3','#54A0FF','#FFB347','#6BCB77','#E8751A'];
  const shapes = ['circle','rect'];
  for (let i = 0; i < 45; i++) {
    const piece = document.createElement('div');
    const color = colors[Math.floor(Math.random() * colors.length)];
    const shape = shapes[Math.floor(Math.random() * shapes.length)];
    const size = 6 + Math.random() * 10;
    const isRect = shape === 'rect';
    piece.className = 'confetti-piece';
    piece.style.left = (5 + Math.random() * 90) + '%';
    piece.style.top = (10 + Math.random() * 20) + '%';
    piece.style.background = color;
    piece.style.width = isRect ? (size * 0.5) + 'px' : size + 'px';
    piece.style.height = isRect ? (size * 1.6) + 'px' : size + 'px';
    piece.style.borderRadius = isRect ? '2px' : '50%';
    piece.style.setProperty('--delay', (Math.random() * 0.8) + 's');
    piece.style.setProperty('--fall-duration', (1.8 + Math.random() * 1.2) + 's');
    piece.style.opacity = '0.8';
    div.appendChild(piece);
  }
  document.body.appendChild(div);
  setTimeout(function() { div.remove(); }, 3500);
}

// ===== Init =====
renderPage(0);
</script>
<script>document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')nextPage();if(e.key==='ArrowLeft')prevPage();if(e.key==='Home')goToPage(0);});</script>

<script>
(function(){
  var sx = 0, sy = 0, swiping = false;
  document.addEventListener('touchstart', function(e) {
    var t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; swiping = true;
  }, {passive:true});
  document.addEventListener('touchmove', function(e) {
    if (!swiping) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiping = false;
      // Find and click the appropriate nav button
      if (dx < 0) {
        // Swipe left → next
        var n = document.querySelector('[onclick*="next"], [onclick*="Next"], .nav-btn:last-of-type:not([disabled]), a[href*="next"], [class*="next"], #nextBtn');
        if (n) n.click();
        else { var a = document.querySelector('a[href]:not([href*="#"])'); if (a && !a.href.includes("#")) a.click(); }
      } else {
        // Swipe right → prev
        var p = document.querySelector('[onclick*="prev"], [onclick*="Prev"], .nav-btn:first-of-type:not([disabled]), [class*="prev"], #prevBtn');
        if (p) p.click();
      }
    }
  }, {passive:true});
  document.addEventListener('touchend', function() { swiping = false; }, {passive:true});
})();
</script>

<!-- ═══ Speak Page - MP3优先, TTS后备 ═══ -->
<script>
(function(){
  var btn = document.getElementById('speakBtn') || document.querySelector('.speak-btn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'speakBtn'; btn.className = 'speak-btn'; btn.title = '朗读本页';
    btn.textContent = '🔊';
    btn.style.cssText = 'position:fixed;bottom:90px;right:16px;z-index:9999;width:48px;height:48px;border-radius:50%;border:2px solid #42A5F5;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(66,165,245,.3);display:flex;align-items:center;justify-content:center';
    document.body.appendChild(btn);
  }
  var sp = false, audioEl = null;
  var courseName = (window.COURSE_NAME || (window.location.pathname.match(/\/(\w[\w-]*)\.html/) || [,''])[1] || '');
  var lang = (document.documentElement.lang || 'en-US').indexOf('zh')>=0?'zh-CN':'en-US';

  function getPageIdx(){
    var a=document.querySelector('.page.active,.slide.active');
    return a?Array.prototype.indexOf.call(a.parentNode.children,a):-1;
  }

  function speakPage(){
    if(sp){stopPage();return;}
    var idx=getPageIdx(); if(idx<0) return;
    var mp3='../audio/'+courseName+'/page-'+(idx+1)+'.mp3';
    if(audioEl){audioEl.pause();audioEl=null;}
    audioEl=new Audio(mp3);
    audioEl.onerror=function(){
      var flat=new Audio('../audio/'+courseName+'.mp3');
      flat.onerror=function(){speakTTS();};
      flat.oncanplaythrough=function(){
        if(audioEl)audioEl.pause(); audioEl=flat;
        audioEl.play().catch(function(){speakTTS();});
        btn.textContent='⏹';btn.classList.add('speaking');
      };
      flat.load();
    };
    audioEl.oncanplaythrough=function(){
      audioEl.play(); btn.textContent='⏹';btn.classList.add('speaking');
      sp=true; audioEl.onended=function(){stopPage();};
    };
    audioEl.load();
  }

  function speakTTS(){
    if(!window.speechSynthesis)return;
    var a=document.querySelector('.page.active,.slide.active');
    if(!a)return;
    var t=(a.innerText||a.textContent||'').replace(/\s+/g,' ').trim();
    if(!t||t.length<2)return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang=lang;u.rate=0.85;
    u.onstart=function(){sp=true;btn.classList.add('speaking');btn.textContent='⏹';};
    u.onend=u.onerror=function(){stopPage();};
    window.speechSynthesis.speak(u);
  }

  function stopPage(){
    if(audioEl){audioEl.pause();audioEl=null;}
    if(window.speechSynthesis)window.speechSynthesis.cancel();
    sp=false;btn.classList.remove('speaking');btn.textContent='🔊';
  }

  btn.addEventListener('click',function(e){e.stopPropagation();speakPage();});
  if(btn.textContent.trim()===''||btn.textContent.trim()==='▶')btn.textContent='🔊';
})();
