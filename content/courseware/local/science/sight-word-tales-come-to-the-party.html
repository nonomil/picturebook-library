<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

    align-items: center; padding: 20px;

  .book {flex-shrink:0;
    max-width: 800px; width: 100%; background: #FFFCF5;
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 4px #FFF, 0 0 0 8px #FFB347;
    padding: 24px 20px;
    position: relative;
  }
  .page-area { min-height: 380px; }
  .page {
    display: none; flex-direction: column; align-items: center;
    animation: fadeIn 0.4s ease;
  }
  .page.active { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .page-title {
    font-size: 34px;
    color: #E8751A;
    text-align: center;
    margin-bottom: 16px;
    font-weight: bold;
  }
  .page-subtitle {
    font-size: 16px;
    color: #B07D44;
    text-align: center;
    margin-bottom: 10px;
  }

  /* SVG illustration container */
  .illustration {
    width: 200px; height: 180px; border-radius: 24px;
    background: linear-gradient(135deg, #FFF3E0 0%, #FFE0B2 100%);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(255,179,71,0.2);
    overflow: hidden;
    flex-shrink: 0;
  }
  .illustration svg {
    width: 100%; height: 100%;
    display: block;
  }

  .sentence {
    font-size: 26px; line-height: 1.6; text-align: center;
    padding: 15px 20px; background: #FFF8F0; border-radius: 20px;
    width: 100%; margin-bottom: 10px;
    border: 2px solid #FFE0B2;
  }
  .sentence .highlight {
    color: #E8751A; font-weight: bold;
    text-decoration: underline; text-decoration-color: #FFB347;
    text-underline-offset: 4px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    padding: 2px 6px;
    border-radius: 10px;
    display: inline-block;
  }
  .sentence .highlight:hover {
    background: #FFF3E0;
    transform: scale(1.08);
  }
  .sentence .highlight:active {
    transform: scale(0.95);
  }

  /* Party vocabulary items row */
  .party-items {
    display: flex; gap: 8px; justify-content: center;
    flex-wrap: wrap; margin: 6px 0 10px; width: 100%;
  }
  .party-item {
    padding: 6px 14px; border-radius: 16px;
    background: #FFF8F0; border: 2px solid #FFE0B2;
    font-size: 20px; cursor: pointer;
    transition: all 0.2s; text-align: center;
    display: flex; align-items: center; gap: 4px;
  }
  .party-item:hover {
    border-color: #FFB347; background: #FFF3E0;
    transform: scale(1.1);
  }
  .party-item:active { transform: scale(0.92); }
  .party-item .en-word {
    font-size: 14px; color: #E8751A; font-weight: bold;
  }

  /* Game area - gears style */
  .game-area {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #FFF3E0 0%, #FFE8C8 100%);
    border-radius: 24px; text-align: center; margin-top: 6px;
    border: 3px solid #FFB347;
    box-shadow: 0 4px 15px rgba(255,179,71,0.15);
  }
  .game-area h3 {
    font-size: 16px; color: #E8751A; margin-bottom: 10px;
  }
  .game-area h3 .gear {
    display: inline-block;
    animation: spin 6s linear infinite;
    font-size: 20px;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .word-choices { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .word-choice {
    padding: 10px 24px; border-radius: 16px; border: 3px solid #E0D5C7;
    background: white; font-size: 22px; font-weight: bold; cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .word-choice:hover { border-color: #FFB347; transform: scale(1.08); box-shadow: 0 4px 16px rgba(255,179,71,0.3); }
  .word-choice.correct { border-color: #4caf50; background: #e8f5e9; transform: scale(1.05); box-shadow: 0 4px 16px rgba(76,175,80,0.3); }
  .word-choice.wrong { border-color: #f44336; background: #ffebee; animation: shake 0.4s; }

  /* Drag & Drop styles */
  .drop-zone {
    border: 3px dashed #FFB347; border-radius: 16px; padding: 16px;
    text-align: center; font-size: 16px; color: #AAA; margin-bottom: 10px;
    transition: all 0.2s; min-height: 50px;
    display: flex; align-items: center; justify-content: center;
  }
  .drop-zone.drag-over {
    border-color: #66BB6A; background: rgba(102,187,106,0.1); color: #4CAF50;
    transform: scale(1.02);
  }
  .word-choice { cursor: grab; }
  .word-choice:active { cursor: grabbing; }
  .word-choice.dragging { opacity: 0.5; transform: scale(1.05); }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  /* Speech bubble - fixed bottom, gear style */
  .speech-bubble {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #FFFCF5;
    border: 3px solid #FFB347;
    border-radius: 24px;
    padding: 18px 32px;
    font-size: 26px;
    font-weight: bold;
    color: #E8751A;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18), 0 0 0 3px rgba(255,179,71,0.1);
    z-index: 1000;
    max-width: 85%;
    text-align: center;
    animation: bubbleIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
    line-height: 1.4;
  }
  .speech-bubble::before {
    content: '🔊 ';
    font-size: 22px;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    border: 12px solid transparent;
    border-top-color: #FFB347;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.08));
  }
  @keyframes bubbleIn {
    0% { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.8); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }
  @keyframes bubbleOut {
    0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.8); }
  }

  /* Controls - gears nav style */
  .controls {
    display: flex; gap: 12px; justify-content: center; align-items: center;
    padding: 16px 0 8px;
  }
  .btn {
    border: none; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    font-weight: 600;
  }
  .btn:hover { transform: scale(1.08); }
  .btn:active { transform: scale(0.92); }

  .btn-nav {
    width: 50px; height: 50px; border-radius: 50%;
    background: #FFB347; color: white; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 15px rgba(255,179,71,0.5);
  }
  .btn-nav:disabled {
    opacity: 0.35; cursor: not-allowed; box-shadow: none;
  }
  .btn-nav:disabled:hover { transform: none; }

  .btn-sound {
    padding: 10px 24px; border-radius: 30px;
    background: #6BCB77; color: white; font-size: 16px;
    box-shadow: 0 4px 15px rgba(107,203,119,0.5);
    display: flex; align-items: center; gap: 6px;
  }

  .page-counter {
    font-size: 14px; color: #B07D44;
    text-align: center; font-weight: bold;
  }

  .progress { display: flex; gap: 8px; justify-content: center; padding: 4px 0 0; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #E0D5C7; cursor: pointer;
    transition: all 0.25s;
  }
  .dot.active { background: #FFB347; transform: scale(1.3); box-shadow: 0 0 8px rgba(255,179,71,0.5); }
  .dot.done { background: #6BCB77; }

  /* Cover page */
  .cover-page { text-align: center; padding: 20px 10px; }
  .cover-page .cover-svg {
    width: 240px; height: 180px; margin: 0 auto 16px;
  }
  .cover-page h2 { font-size: 34px; color: #E8751A; }
  .cover-page p { font-size: 16px; color: #B07D44; margin-top: 8px; }

  /* Animations */
  @keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
  }
  @keyframes confetti-fall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(600px) rotate(720deg) scale(0.3); }
  }

  .celebration {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
  }
  .confetti {
    position: absolute; width: 12px; height: 12px; border-radius: 2px;
    animation: confetti-fall 2.5s ease-out forwards;
  }

  .star { color: #FFB347; font-size: 28px; }

  .completed-badge {
    background: #E8F5E9; padding: 10px; border-radius: 16px;
    margin-top: 4px;
  }
  .completed-badge h3 { color: #2E7D32 !important; font-size: 18px !important; }
  .completed-badge p { font-size: 30px; }

  .speak-btn { background:#FFB347; border:none; color:#FFF; font-size:14px; width:32px; height:32px; border-radius:50%; cursor:pointer; transition:all 0.15s; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 2px 6px rgba(255,179,71,0.3); }
  .speak-btn:hover { transform:scale(1.15); background:#FF9F1C; }
  .quiz-opt-speak { background:#E8D5C4; border:none; color:#FFF; font-size:12px; width:24px; height:24px; border-radius:50%; cursor:pointer; transition:all 0.15s; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; margin-left:6px; vertical-align:middle; }
  .quiz-opt-speak:hover { transform:scale(1.2); background:#D4B89C; }

  @media (max-width: 500px) {
    .illustration { width: 150px; height: 140px; }
    .sentence { font-size: 20px; }

    .speech-bubble { font-size: 20px; padding: 14px 24px; max-width: 90%; bottom: 80px; }
    .party-item { font-size: 16px; padding: 4px 10px; }
  }
/* Top navigation buttons */
.top-nav-btn {

.top-nav-btn.home { left:10px; top:10px; }

          帮小朋友完成派对邀请吧！选 "<strong>${p.game.word}</strong>"
        </p>
        <div class="drop-zone" id="drop-zone-${idx}" ondragover="onDropZoneDragOver(event)" ondrop="onDropZoneDrop(event, ${idx})" ondragleave="onDropZoneDragLeave(event)">
          📥 拖拽单词到这里
        </div>
        <div class="word-choices">
          ${p.game.options.map((w, i) => `<div class="word-choice" draggable="true" ondragstart="onWordChoiceDragStart(event, ${idx}, '${p.game.word}', '${w}')" ondragend="onWordChoiceDragEnd(event)" onclick="checkWord(${idx}, '${p.game.word}', '${w}', this);speakText('${w}')">${w} <button class="quiz-opt-speak" onclick="event.stopPropagation();speakText('${w}')">🔊</button></div>`).join('')}
        </div>
      </div>
    `;
  } else if (isDone && p.game) {
    gameHTML = `<div class="game-area completed-badge"><h3>✅ 派对准备完成！</h3><p>🎉 ⭐ 🎉</p></div>`;
  } else {
    gameHTML = `<div class="game-area" style="background:linear-gradient(135deg,#E8F5E9,#C8E6C9);border-color:#4caf50"><h3 style="color:#2E7D32">🎉 派对开始啦！🎊</h3><p style="font-size:36px">🎈 🎂 🎁</p></div>`;
  }

  // Party items row
  let partyItemsHTML = '';
  if (p.partyItems && p.partyItems.length > 0) {
    partyItemsHTML = `<div class="party-items">${p.partyItems.map(item =>
      `<div class="party-item" onclick="speakPartyItem('${item.word}')" title="${item.label}">
        ${item.icon} <span class="en-word">${item.word}</span>
      </div>`
    ).join('')}</div>`;
  }

  area.innerHTML = `
    <div class="page active" id="${p.id || 'page-' + idx}">
      <div class="illustration">${svgFn()}</div>
      <div class="sentence">${p.sentence}</div>
      ${partyItemsHTML}
      ${gameHTML}
    </div>
  `;

  // Add click handlers for highlighted sight words
  document.querySelectorAll('.sentence .highlight').forEach(el => {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      const word = this.textContent.trim();
      showSpeechBubble('🔊 ' + word);
      speakText(word);
    });
  });

  updateUI(idx);
  document.getElementById('prevBtn').disabled = idx === 0;
}

/* ========== SPEECH BUBBLE ========== */

function showSpeechBubble(text) {
  // Remove existing bubble
  const existing = document.querySelector('.speech-bubble');
  if (existing) existing.remove();

  // Clear any pending timeout
  if (speechTimeout) {
    clearTimeout(speechTimeout);
    speechTimeout = null;
  }

  // Create bubble
  const bubble = document.createElement('div');
  bubble.className = 'speech-bubble';
  bubble.textContent = text;
  document.body.appendChild(bubble);

  // Auto-remove after 4 seconds
  speechTimeout = setTimeout(() => {
    const bub = document.querySelector('.speech-bubble');
    if (bub) {
      bub.style.animation = 'bubbleOut 0.3s ease forwards';
      setTimeout(() => {
        if (bub.parentNode) bub.remove();
      }, 300);
    }
    speechTimeout = null;
  }, 4000);
}

/* ========== SPEECH SYNTHESIS ========== */

let currentAudio = null;
function playAudio(src, showText) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (showText) showSpeechBubble(showText);
  if (!src) return;
  try {
    const a = new Audio(src);
    a.play();
    currentAudio = a;
    a.onended = function() { currentAudio = null; };
    a.onerror = function() { currentAudio = null; if(showText) speakText(showText); };
  } catch(e) { console.log('Audio error:', e); if(showText) speakText(showText); }
}

function speakPage() {
  const AUDIO_MAP = ['party-cover', 'party-page1', 'party-page2', 'party-page3', 'party-page4', 'party-page5', 'party-page6', 'party-page7'];
  const TEXTS = [
    'Come to the Party! Sight words come and to.',
    '"Come to my party!" said the girl.',
    '"I will come to the party!" said the dog.',
    '"I will come to the party!" said the cat.',
    '"We will all come to the party!" said the bunny.',
    '"I come to the party with a bear hug!" said the bear.',
    'Everyone says: We come to have fun! Hooray!',
    '"Thank you for coming to my party! Come again!" said the girl.'
  ];
  const idx = currentPage;
  if (idx >= 0 && idx < AUDIO_MAP.length) {
    playAudio('../audio/' + AUDIO_MAP[idx] + '.mp3', TEXTS[idx]);
  }
}

function speakText(text) {
    if (typeof ttsPlay === 'function') { ttsPlay(text); }
    else if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
      var clean = text.replace(/[\uD800-\uDFFF]./g,'');
      var utter = new SpeechSynthesisUtterance(clean);
      utter.lang = /[\u4e00-\u9fff]/.test(clean) ? 'zh-CN' : 'en-US';
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
    }
  }

function speakPartyItem(word) {
  showSpeechBubble(word);
  speakText(word);
}

/* ========== GAME ========== */

function checkWord(idx, target, chosen, el) {
  if (gameDone[idx]) return;
  if (chosen === target) {
    el.classList.add('correct');
    gameDone[idx] = true;
    showSpeechBubble('✅ 太棒了！ ' + target + '!');
    speakText('Correct! ' + target);
    launchConfetti();
    setTimeout(() => { renderPage(idx); }, 800);
  } else {
    el.classList.add('wrong');
    showSpeechBubble('❌ 再试试！');
    setTimeout(() => el.classList.remove('wrong'), 500);
  }
}

/* ========== DRAG & DROP ========== */

let dragWordData = null;

function onWordChoiceDragStart(e, idx, target, chosen) {
  dragWordData = { idx, target, chosen };
  e.dataTransfer.setData('text/plain', chosen);
  e.dataTransfer.effectAllowed = 'move';
  e.target.classList.add('dragging');
}

function onWordChoiceDragEnd(e) {
  e.target.classList.remove('dragging');
}

function onDropZoneDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const dropZone = e.currentTarget;
  if (!dropZone.classList.contains('drag-over')) {
    dropZone.classList.add('drag-over');
    dropZone.textContent = '🎯 松开鼠标投放！';
  }
}

function onDropZoneDrop(e, idx) {
  e.preventDefault();
  const dropZone = e.currentTarget;
  dropZone.classList.remove('drag-over');

  if (!dragWordData) {
    dropZone.textContent = '📥 拖拽单词到这里';
    return;
  }

  // Use the stored drag data or fall back to dataTransfer
  const { target, chosen } = dragWordData;
  dropZone.textContent = chosen === target ? '✅ 正确！' : '❌ 错误！再试试';
  dragWordData = null;

  // Trigger same logic as click handler
  const wordChoices = dropZone.parentElement.querySelector('.word-choices');
  if (wordChoices) {
    const choiceEls = wordChoices.querySelectorAll('.word-choice');
    // Find the element for the chosen word
    for (const el of choiceEls) {
      if (el.textContent.trim().startsWith(chosen)) {
        checkWord(idx, target, chosen, el);
        break;
      }
    }
  }

  // Reset drop zone text after a short delay if not correct
  setTimeout(() => {
    if (!document.querySelector('#drop-zone-' + idx + '.drag-over')) {
      dropZone.textContent = '📥 拖拽单词到这里';
    }
  }, 1500);
}

function onDropZoneDragLeave(e) {
  const dropZone = e.currentTarget;
  dropZone.classList.remove('drag-over');
  dropZone.textContent = '📥 拖拽单词到这里';
}

/* ========== NAVIGATION ========== */

function nextPage() {
  if (!gameDone[currentPage] && pages[currentPage].game) return;
  if (currentPage < pages.length - 1) {
    currentPage++;
    renderPage(currentPage);
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    renderPage(currentPage);
  }
}

/* ========== CONFETTI ========== */

function launchConfetti() {
  const div = document.createElement('div');
  div.className = 'celebration';
  const colors = ['#FFB347','#6BCB77','#7B1FA2','#E8751A','#F3E5F5','#FF6B6B','#48DBFB','#FFD93D'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.top = '-10%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (6 + Math.random() * 10) + 'px';
    c.style.height = (6 + Math.random() * 10) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.animationDelay = Math.random() * 1.2 + 's';
    c.style.animationDuration = (1.8 + Math.random() * 1.2) + 's';
    div.appendChild(c);
  }
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

/* ========== UI UPDATE ========== */

function updateUI(idx) {
  document.getElementById('pageCounter').textContent = `第${idx+1}页 / 共${pages.length}页`;
  const dots = document.getElementById('progress');
  dots.innerHTML = pages.map((_, i) =>
    `<div class="dot ${i === idx ? 'active' : ''} ${gameDone[i] || i === 0 ? 'done' : ''}" onclick="currentPage=${i};renderPage(${i})"></div>`
  ).join('');
}

/* ========== INIT ========== */

renderPage(0);
</script>
<script>document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')nextPage();if(e.key==='ArrowLeft')prevPage();});</script>

<script>
(function(){
  var sx = 0, sy = 0, swiping = false;
  document.addEventListener('touchstart', function(e) {
    var t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; swiping = true;
  }, {passive:true});
  document.addEventListener('touchmove', function(e) {
    if (!swiping) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiping = false;
      // Find and click the appropriate nav button
      if (dx < 0) {
        // Swipe left → next
        var n = document.querySelector('[onclick*="next"], [onclick*="Next"], .nav-btn:last-of-type:not([disabled]), a[href*="next"], [class*="next"], #nextBtn');
        if (n) n.click();
        else { var a = document.querySelector('a[href]:not([href*="#"])'); if (a && !a.href.includes("#")) a.click(); }
      } else {
        // Swipe right → prev
        var p = document.querySelector('[onclick*="prev"], [onclick*="Prev"], .nav-btn:first-of-type:not([disabled]), [class*="prev"], #prevBtn');
        if (p) p.click();
      }
    }
  }, {passive:true});
  document.addEventListener('touchend', function() { swiping = false; }, {passive:true});
})();
</script>

<!-- ═══ Speak Page - MP3优先, TTS后备 ═══ -->
<script>
(function(){
  var btn = document.getElementById('speakBtn') || document.querySelector('.speak-btn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'speakBtn'; btn.className = 'speak-btn'; btn.title = '朗读本页';
    btn.textContent = '🔊';
    btn.style.cssText = 'position:fixed;bottom:90px;right:16px;z-index:9999;width:48px;height:48px;border-radius:50%;border:2px solid #42A5F5;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(66,165,245,.3);display:flex;align-items:center;justify-content:center';
    document.body.appendChild(btn);
  }
  var sp = false, audioEl = null;
  var courseName = (window.COURSE_NAME || (window.location.pathname.match(/\/(\w[\w-]*)\.html/) || [,''])[1] || '');
  var lang = (document.documentElement.lang || 'en-US').indexOf('zh')>=0?'zh-CN':'en-US';

  function getPageIdx(){
    var a=document.querySelector('.page.active,.slide.active');
    return a?Array.prototype.indexOf.call(a.parentNode.children,a):-1;
  }

  function speakPage(){
    if(sp){stopPage();return;}
    var idx=getPageIdx(); if(idx<0) return;
    var mp3='../audio/'+courseName+'/page-'+(idx+1)+'.mp3';
    if(audioEl){audioEl.pause();audioEl=null;}
    audioEl=new Audio(mp3);
    audioEl.onerror=function(){
      var flat=new Audio('../audio/'+courseName+'.mp3');
      flat.onerror=function(){speakTTS();};
      flat.oncanplaythrough=function(){
        if(audioEl)audioEl.pause(); audioEl=flat;
        audioEl.play().catch(function(){speakTTS();});
        btn.textContent='⏹';btn.classList.add('speaking');
      };
      flat.load();
    };
    audioEl.oncanplaythrough=function(){
      audioEl.play(); btn.textContent='⏹';btn.classList.add('speaking');
      sp=true; audioEl.onended=function(){stopPage();};
    };
    audioEl.load();
  }

  function speakTTS(){
    if(!window.speechSynthesis)return;
    var a=document.querySelector('.page.active,.slide.active');
    if(!a)return;
    var t=(a.innerText||a.textContent||'').replace(/\s+/g,' ').trim();
    if(!t||t.length<2)return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang=lang;u.rate=0.85;
    u.onstart=function(){sp=true;btn.classList.add('speaking');btn.textContent='⏹';};
    u.onend=u.onerror=function(){stopPage();};
    window.speechSynthesis.speak(u);
  }

  function stopPage(){
    if(audioEl){audioEl.pause();audioEl=null;}
    if(window.speechSynthesis)window.speechSynthesis.cancel();
    sp=false;btn.classList.remove('speaking');btn.textContent='🔊';
  }

  btn.addEventListener('click',function(e){e.stopPropagation();speakPage();});
  if(btn.textContent.trim()===''||btn.textContent.trim()==='▶')btn.textContent='🔊';
})();
