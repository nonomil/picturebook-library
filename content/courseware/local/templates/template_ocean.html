<!DOCTYPE html>
<html lang="zh-CN">
<head><link rel="icon" href="../../../../favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{{TITLE}}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#0A1628 0%,#1565C0 50%,#0A1628 100%);min-height:100vh;padding:16px;color:#fff}
.container{max-width:480px;margin:0 auto}
.cover{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:24px;padding:32px;text-align:center;box-shadow:0 8px 40px rgba(77,182,172,0.2);margin-bottom:16px;border:1px solid rgba(77,182,172,0.3)}
.cover-title{font-size:28px;font-weight:800;color:#4DD4AC;margin-bottom:8px;text-shadow:0 2px 10px rgba(77,182,172,0.5)}
.cover-subtitle{color:#80DEEA;margin-bottom:20px}
.section{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,0.3);margin-bottom:16px;border:1px solid rgba(255,255,255,0.1)}
.section-title{font-size:18px;font-weight:700;color:#4DD4AC;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.interact-area{background:rgba(77,182,172,0.1);border-radius:12px;padding:20px;text-align:center;margin-bottom:12px;border:2px solid rgba(77,182,172,0.3)}
.btn{background:linear-gradient(135deg,#4DD4AC,#00897B);color:#0A1628;border:none;padding:12px 24px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(77,182,172,0.4)}
.btn-secondary{background:linear-gradient(135deg,#4FC3F7,#0277BD);color:#fff}
.story-text{line-height:1.8;font-size:16px;color:#E0E0E0;cursor:pointer;transition:background 0.2s,border-radius 0.2s;padding:4px 8px;border-radius:8px}
.story-text:active{background:rgba(77,182,172,0.1)}
.story-text.speaking{background:rgba(77,182,172,0.15);animation:pulse 1.2s ease-in-out infinite}
.dialogue{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid #4DD4AC;cursor:pointer;transition:background 0.2s}
.dialogue:active{background:rgba(255,255,255,0.15)}
.dialogue.speaking{animation:pulse 1.2s ease-in-out infinite;border-left-color:#00897B}
.dialogue-name{font-weight:700;color:#4DD4AC;margin-bottom:4px}
.quiz-option{background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;transition:all 0.3s;text-align:left}
.quiz-option:hover{border-color:#4DD4AC;background:rgba(77,182,172,0.1)}
.quiz-option.correct{border-color:#4CAF50;background:rgba(76,175,80,0.2)}
.quiz-option.wrong{border-color:#F44336;background:rgba(244,67,54,0.2)}
.poem-line{font-size:20px;text-align:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1);color:#4DD4AC}
.poem-explain{font-size:14px;color:#80DEEA;padding:8px 0}
.bubble{position:fixed;pointer-events:none;animation:rise 3s ease-in infinite}
@keyframes rise{0%{transform:translateY(100%) scale(1);opacity:0.7}100%{transform:translateY(-100%) scale(0.5);opacity:0}}

/* ===== PAGE NAV ===== */
.page-nav{display:flex;justify-content:center;align-items:center;gap:16px;padding:16px 0;position:sticky;bottom:0;background:linear-gradient(transparent,#0A1628);z-index:10}
.page-nav .btn{min-width:48px;padding:12px 20px}

/* ===== SPEECH PULSE ===== */
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(77,182,172,0.4)}
  50%{box-shadow:0 0 0 8px rgba(77,182,172,0)}
}

/* ===== SWIPE TRANSITION ===== */
.page-section{transition:opacity 0.35s ease,transform 0.35s ease}
.page-section.swipe-out-left{opacity:0;transform:translateX(-30px)}
.page-section.swipe-out-right{opacity:0;transform:translateX(30px)}
.page-section.swipe-in-left{opacity:0;transform:translateX(30px)}
.page-section.swipe-in-right{opacity:0;transform:translateX(-30px)}
.page-section.swipe-active{opacity:1;transform:translateX(0)}

/* ===== CONFETTI ===== */
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:999}
.confetti-piece{position:absolute;top:-20px;border-radius:2px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}100%{transform:translateY(110vh) rotate(720deg) scale(0.4);opacity:0}}

/* ===== SMALL SCREEN ===== */
@media (max-width:360px){
  body{padding:8px}
  .cover{padding:20px 16px;border-radius:18px}
  .cover-title{font-size:22px}
  .section{padding:16px;border-radius:16px}
  .section-title{font-size:16px}
  .story-text{font-size:14px;line-height:1.6}
  .dialogue{padding:10px 12px;font-size:14px}
  .quiz-option{padding:10px;font-size:14px}
  .poem-line{font-size:17px;padding:8px 0}
  .btn{padding:10px 18px;font-size:13px}
  .cover-subtitle{font-size:13px}
}

/* ===== TABLET ===== */
@media (min-width:768px){
  .container{max-width:720px}
  .cover{padding:48px 40px}
  .cover-title{font-size:36px}
  .cover-subtitle{font-size:18px}
  .section{padding:36px 40px}
  .section-title{font-size:22px}
  .story-text{font-size:18px;line-height:2}
  .dialogue{padding:16px 20px;font-size:17px}
  .quiz-option{padding:16px 20px;font-size:17px}
  .poem-line{font-size:26px;padding:16px 0}
  .poem-explain{font-size:16px}
  .btn{padding:14px 32px;font-size:16px}
}
</style>
</head>
<body>
<div class="container" id="app">
  <div class="cover">
    <div style="font-size:64px;margin-bottom:12px">{{COVER_EMOJI}}</div>
    <h1 class="cover-title">{{TITLE}}</h1>
    <p class="cover-subtitle">{{SUBTITLE}}</p>
    <button class="btn" onclick="document.getElementById('content').scrollIntoView()">开始探险</button>
  </div>
  <div id="content" class="page-section swipe-active">
    {{CONTENT_SECTIONS}}
  </div>
</div>

<script>
// TEMPLATE_CONFIG - 配置区
const TEMPLATE_CONFIG = {
  theme: 'ocean',
  title: '{{TITLE}}',
  subtitle: '{{SUBTITLE}}',
  colors: {
    primary: '#0A1628',
    secondary: '#1565C0',
    accent: '#4DD4AC',
    text: '#FFFFFF',
    card: 'rgba(255,255,255,0.1)'
  },
  decorations: ['🐟', '🐚', '🐠', '🐙', '🪸', '🫧']
};

// ===== SPEECH SYNTHESIS =====
const Speech = {
  _speaking: false,
  detectLang(text) {
    const cjk = /[\u4e00-\u9fff\u3400-\u4dbf]/;
    const latin = /[a-zA-Z]/;
    let cn = 0, en = 0;
    for (let i = 0; i < text.length; i++) {
      if (cjk.test(text[i])) cn++;
      else if (latin.test(text[i])) en++;
    }
    return cn > en ? 'zh-CN' : 'en-US';
  },
  speak(text, lang) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    if (!text || !text.trim()) return;
    const u = new SpeechSynthesisUtterance(text.trim());
    u.lang = lang || this.detectLang(text);
    u.rate = 0.9;
    u.pitch = 1.05;
    this._speaking = true;
    u.onend = () => { this._speaking = false; };
    u.onerror = () => { this._speaking = false; };
    window.speechSynthesis.speak(u);
  },
  stop() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    this._speaking = false;
  }
};

// ===== CLICK-TO-SPEAK =====
function initClickToSpeak() {
  const speakable = document.querySelectorAll('.story-text, .dialogue');
  speakable.forEach(el => {
    el.style.cursor = 'pointer';
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      const prev = document.querySelector('.story-text.speaking, .dialogue.speaking');
      if (prev && prev !== this) prev.classList.remove('speaking');
      if (this.classList.contains('speaking')) {
        Speech.stop();
        this.classList.remove('speaking');
        return;
      }
      document.querySelectorAll('.story-text.speaking, .dialogue.speaking').forEach(x => x.classList.remove('speaking'));
      this.classList.add('speaking');
      const txt = this.textContent || this.innerText;
      Speech.speak(txt);
      const self = this;
      const check = setInterval(() => {
        if (!Speech._speaking) {
          self.classList.remove('speaking');
          clearInterval(check);
        }
      }, 300);
    });
  });
}

// ===== TOUCH SWIPE NAVIGATION =====
let touchStartX = 0, touchStartY = 0;
const contentEl = document.getElementById('content');
let currentPage = 0;
const totalPages = 1;

function getSections() { return contentEl.querySelectorAll('.section'); }

function initSwipe() {
  contentEl.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  contentEl.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
    const sections = getSections();
    if (sections.length < 2) return;
    if (dx < 0 && currentPage < sections.length - 1) {
      swipePage(currentPage, currentPage + 1);
    } else if (dx > 0 && currentPage > 0) {
      swipePage(currentPage, currentPage - 1);
    }
  }, { passive: true });
}

function swipePage(from, to) {
  const sections = getSections();
  if (!sections[from] || !sections[to] || from === to) return;
  const dir = to > from ? 'left' : 'right';
  const outClass = dir === 'left' ? 'swipe-out-left' : 'swipe-out-right';
  const inClass = dir === 'left' ? 'swipe-in-right' : 'swipe-in-left';

  sections[from].classList.remove('swipe-active');
  sections[from].classList.add(outClass);

  sections[to].classList.remove('swipe-out-left', 'swipe-out-right', 'swipe-in-left', 'swipe-in-right');
  sections[to].classList.add(inClass);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      sections[to].classList.remove(inClass);
      sections[to].classList.add('swipe-active');
      currentPage = to;
    });
  });
  setTimeout(() => { sections[from].classList.remove(outClass); }, 400);
}

// ===== CONFETTI =====
function launchConfetti() {
  let box = document.querySelector('.confetti-container');
  if (!box) {
    box = document.createElement('div');
    box.className = 'confetti-container';
    document.body.appendChild(box);
  }
  box.innerHTML = '';
  const colors = ['#4DD4AC','#4FC3F7','#FF5722','#4CAF50','#E91E63','#9C27B0','#FF9800','#00BCD4'];
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 6 + Math.random() * 10;
    piece.style.left = Math.random() * 100 + '%';
    piece.style.width = size + 'px';
    piece.style.height = size + 'px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.animationDelay = Math.random() * 2 + 's';
    piece.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    box.appendChild(piece);
  }
  setTimeout(() => {
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      const s = 6 + Math.random() * 10;
      p.style.left = Math.random() * 100 + '%';
      p.style.width = s + 'px';
      p.style.height = s + 'px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      p.style.animationDelay = Math.random() * 2 + 's';
      p.style.animationDuration = (2 + Math.random() * 2.5) + 's';
      box.appendChild(p);
    }
  }, 2500);
}

// CanvasRenderer - 可复用渲染器
class CanvasRenderer {
  constructor(canvasId) {
    this.canvas = document.getElementById(canvasId);
    this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
    this.animationId = null;
  }
  init() { if (this.canvas) this.ctx = this.canvas.getContext('2d'); }
  mount() { this.init(); }
  unmount() { if (this.animationId) cancelAnimationFrame(this.animationId); }
  resize(w, h) { if (this.canvas) { this.canvas.width = w; this.canvas.height = h; } }
  clear() { if (this.ctx) this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }
  drawBubble(x, y, r, color) {
    if (!this.ctx) return;
    this.ctx.beginPath();
    this.ctx.arc(x, y, r, 0, Math.PI * 2);
    this.ctx.fillStyle = color || 'rgba(77,182,172,0.3)';
    this.ctx.fill();
    this.ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    this.ctx.stroke();
    this.ctx.beginPath();
    this.ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.2, 0, Math.PI * 2);
    this.ctx.fillStyle = 'rgba(255,255,255,0.6)';
    this.ctx.fill();
  }
  animate(drawFn) {
    const loop = () => {
      this.clear();
      drawFn(this.ctx, this.canvas);
      this.animationId = requestAnimationFrame(loop);
    };
    loop();
  }
}

// QuizEngine - 测验引擎
class QuizEngine {
  constructor(containerId) {
    this.container = document.getElementById(containerId);
    this.questions = [];
    this.current = 0;
    this.score = 0;
  }
  init(questions) {
    this.questions = questions;
    this.current = 0;
    this.score = 0;
  }
  mount() { this.render(); }
  unmount() { if (this.container) this.container.innerHTML = ''; }
  render() {
    if (!this.container || !this.questions[this.current]) return;
    const q = this.questions[this.current];
    this.container.innerHTML = `
      <div class="section-title">🐚 第${this.current + 1}题</div>
      <p style="margin-bottom:16px">${q.question}</p>
      ${q.options.map((opt, i) => `
        <div class="quiz-option" data-index="${i}" onclick="quizEngine.check(${i})">${opt}</div>
      `).join('')}
      <p style="margin-top:12px;color:#80DEEA">得分: ${this.score}/${this.questions.length}</p>
    `;
  }
  check(index) {
    const q = this.questions[this.current];
    const options = this.container.querySelectorAll('.quiz-option');
    options.forEach((opt, i) => {
      opt.style.pointerEvents = 'none';
      if (i === q.answer) opt.classList.add('correct');
      else if (i === index && i !== q.answer) opt.classList.add('wrong');
    });
    if (index === q.answer) this.score++;
    setTimeout(() => {
      this.current++;
      if (this.current < this.questions.length) this.render();
      else {
        this.container.innerHTML = `
          <div class="section-title">🎉 完成!</div>
          <p>最终得分: ${this.score}/${this.questions.length}</p>
        `;
        launchConfetti();
      }
    }, 1000);
  }
}

// StoryEngine - 故事引擎（支持三种类型）
class StoryEngine {
  constructor(containerId) {
    this.container = document.getElementById(containerId);
    this.type = 'chinese';
    this.sections = [];
    this.current = 0;
  }
  init(type, sections) {
    this.type = type;
    this.sections = sections;
    this.current = 0;
  }
  mount() { this.render(); }
  unmount() { if (this.container) this.container.innerHTML = ''; }
  render() {
    if (!this.container || !this.sections[this.current]) return;
    const s = this.sections[this.current];
    let html = `<div class="section-title">${s.emoji || '📖'} ${s.title}</div>`;
    if (s.type === 'text') {
      html += `<div class="story-text">${s.content}</div>`;
    } else if (s.type === 'dialogue') {
      s.lines.forEach(line => {
        html += `<div class="dialogue"><div class="dialogue-name">${line.name}</div><div>${line.text}</div></div>`;
      });
    } else if (s.type === 'poem') {
      s.lines.forEach(line => {
        html += `<div class="poem-line">${line}</div>`;
      });
      if (s.explain) html += `<div class="poem-explain">${s.explain}</div>`;
    }
    html += `<button class="btn" style="margin-top:16px" onclick="storyEngine.next()">下一页</button>`;
    this.container.innerHTML = html;
    initClickToSpeak();
    resetSwipeIndex();
  }
  next() {
    this.current++;
    if (this.current < this.sections.length) this.render();
    else launchConfetti();
  }
}

// 装饰气泡动画
function createBubbles() {
  const container = document.querySelector('.container');
  for (let i = 0; i < 15; i++) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '○';
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.animationDelay = Math.random() * 3 + 's';
    bubble.style.fontSize = (Math.random() * 20 + 10) + 'px';
    bubble.style.color = 'rgba(77,182,172,0.5)';
    container.appendChild(bubble);
  }
}

function resetSwipeIndex() { currentPage = 0; }

// 初始化
const storyEngine = new StoryEngine('content');
const quizEngine = new QuizEngine('quiz-container');

document.addEventListener('DOMContentLoaded', () => {
  createBubbles();
  initClickToSpeak();
  initSwipe();
  // storyEngine.init('chinese', [...]);
  // quizEngine.init([{question: '...', options: [...], answer: 0}]);
});
</script>
</body>
</html>
