<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;background:#FFF8F8;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.wrap{width:100vw;height:100vh;overflow:hidden;position:relative}

/* TOP BAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;background:#EF5350;display:flex;align-items:center;padding:0 12px;color:#fff;box-shadow:0 2px 8px rgba(239,83,80,.3)}
.topbar a{color:#fff;text-decoration:none;font-size:22px;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;transition:background .2s}
.topbar a:active{background:rgba(255,255,255,.2)}
.topbar .title{flex:1;text-align:center;font-size:18px;font-weight:600;letter-spacing:2px}
.topbar .nav-right{display:flex;gap:4px}
.topbar .nav-right a{font-size:14px;font-weight:500;padding:4px 12px}

/* PAGES */
.pages{width:100vw;height:100vh;position:relative;overflow:hidden}
.page{position:absolute;top:56px;left:0;right:0;bottom:0;width:100vw;height:calc(100vh - 56px);overflow-y:auto;overflow-x:hidden;padding:20px 24px 40px;display:none;background:#FFF8F8;-webkit-overflow-scrolling:touch;transition:opacity .4s,transform .4s}
.page.active{display:block;animation:fadeIn .4s ease-out}
.page.slide-in{display:block;animation:slideIn .4s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}

/* PAGE INDICATOR */
.page-indicator{display:flex;justify-content:center;gap:8px;padding:8px 0;position:fixed;bottom:8px;left:0;right:0;z-index:50}
.page-indicator .dot{width:10px;height:10px;border-radius:50%;background:#ddd;border:2px solid #ccc;transition:all .3s;cursor:pointer}
.page-indicator .dot.active{background:#EF5350;border-color:#EF5350;transform:scale(1.2)}
.page-indicator .dot:active{transform:scale(.9)}

/* SECTION TITLES */
.section-title{font-size:20px;font-weight:700;color:#EF5350;text-align:center;margin:14px 0 16px;letter-spacing:3px;position:relative}
.section-title::after{content:'';display:block;width:48px;height:3px;background:#EF5350;border-radius:2px;margin:6px auto 0}

/* CARD */
.card{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid #f0e0e0}

/* HERO IMAGE */
.hero-img{width:100%;border-radius:14px;margin-bottom:12px;display:block;object-fit:cover;max-height:260px}
.hero-img-sm{width:100%;border-radius:12px;margin-bottom:10px;display:block;max-height:200px;object-fit:contain}

/* CHARACTER GRID */
.char-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.char-card{background:#fff;border-radius:14px;padding:14px 12px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid #f5e6e6;transition:transform .2s}
.char-card:active{transform:scale(.96)}
.char-card .char{font-size:52px;line-height:1.2;color:#333;margin-bottom:2px}
.char-card .pinyin{font-size:15px;color:#EF5350;font-weight:500;margin-bottom:2px}
.char-card .info{font-size:12px;color:#888;margin-bottom:4px;line-height:1.5}
.char-card .stroke-list{font-size:13px;color:#666;margin:4px 0;line-height:1.6;word-break:break-all}
.char-card .example{font-size:13px;color:#555;background:#FFF5F5;padding:5px 8px;border-radius:8px;margin-top:4px;border:1px solid #fde8e8}
.char-card .speak-btn{display:inline-block;margin-top:6px;padding:3px 12px;font-size:12px;background:#EF5350;color:#fff;border:none;border-radius:20px;cursor:pointer;touch-action:manipulation}

/* SENTENCE BUILDING */
.drag-zone{min-height:56px;background:#FFF5F5;border:2px dashed #EF5350;border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:12px;transition:background .3s}
.drag-zone.drag-over{background:#FFEBEE;border-color:#C62828}
.drag-word{display:inline-block;padding:8px 18px;background:#fff;border:2px solid #EF5350;border-radius:22px;font-size:18px;color:#333;font-weight:500;cursor:grab;touch-action:none;transition:box-shadow .2s,transform .1s;user-select:none;-webkit-user-select:none;position:relative;z-index:10}
.drag-word:active,.drag-word.dragging{transform:scale(1.08);box-shadow:0 4px 16px rgba(239,83,80,.3);z-index:20;cursor:grabbing}
.drag-word.placed{border-color:#4CAF50;background:#E8F5E9;cursor:default}
.drag-word.in-zone{background:#FFEBEE;border-color:#C62828}
.word-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px;min-height:44px}

/* FILL IN BLANK */
.fill-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid #f0e0e0}
.fill-sentence{font-size:20px;color:#333;line-height:1.8;text-align:center;margin-bottom:10px}
.fill-blank{display:inline-block;min-width:40px;border-bottom:3px solid #EF5350;margin:0 2px;padding:0 6px;height:32px;vertical-align:bottom;text-align:center;font-size:20px;color:#EF5350;font-weight:600;transition:all .3s}
.fill-blank.filled{border-color:#4CAF50;color:#4CAF50}
.fill-options{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fill-option{padding:6px 20px;background:#fff;border:2px solid #EF5350;border-radius:20px;font-size:18px;color:#333;cursor:pointer;touch-action:manipulation;transition:all .2s}
.fill-option:active{transform:scale(.92)}
.fill-option.used{opacity:.35;pointer-events:none}
.fill-option.correct{border-color:#4CAF50;background:#E8F5E9}
.fill-option.wrong{border-color:#F44336;background:#FFEBEE;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fill-result{text-align:center;font-size:14px;color:#888;margin-top:6px;min-height:20px}

/* POEM */
.poem-container{text-align:center;padding:16px 0}
.poem-title{font-size:24px;font-weight:700;color:#333;margin-bottom:2px}
.poem-author{font-size:14px;color:#888;margin-bottom:16px}
.poem-line{font-size:28px;color:#333;line-height:2.2;letter-spacing:4px;cursor:pointer;transition:color .3s;touch-action:manipulation}
.poem-line:active{color:#EF5350}
.poem-line .highlight{color:#EF5350;font-weight:600}
.poem-img{width:100%;max-width:960px;border-radius:12px;margin:6px auto;display:block;object-fit:contain}

/* SUMMARY */
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.summary-char{text-align:center;background:#fff;border-radius:12px;padding:10px 4px;border:1px solid #f0e0e0;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.summary-char .big{font-size:34px;color:#333;display:block}
.summary-char .sub{font-size:12px;color:#888;margin-top:2px}

/* BUTTONS */
.btn-primary{display:inline-flex;align-items:center;gap:6px;padding:10px 28px;background:#EF5350;color:#fff;border:none;border-radius:24px;font-size:16px;font-weight:600;cursor:pointer;touch-action:manipulation;transition:transform .2s,box-shadow .2s;margin:4px}
.btn-primary:active{transform:scale(.94);box-shadow:0 2px 8px rgba(239,83,80,.3)}
.btn-secondary{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;background:#fff;color:#EF5350;border:2px solid #EF5350;border-radius:24px;font-size:15px;font-weight:500;cursor:pointer;touch-action:manipulation;transition:transform .2s;margin:4px}
.btn-secondary:active{transform:scale(.94)}

/* SCROLLBAR */
.page::-webkit-scrollbar{width:4px}
.page::-webkit-scrollbar-thumb{background:#EF5350;border-radius:4px}
.page::-webkit-scrollbar-track{background:transparent}

/* RESPONSIVE */
@media(min-width:768px){
  .char-grid{grid-template-columns:repeat(4,1fr)}
  .page{padding:24px 40px 40px}
  .poem-line{font-size:32px}

@media(max-width:480px){

  .fill-sentence{font-size:17px}
  .poem-line{font-size:24px}
}

/* UTILITY */
.text-center{text-align:center}
.mt-8{margin-top:8px}
.mb-8{margin-bottom:8px}
.mt-16{margin-top:16px}
.mb-16{margin-bottom:16px}
.flex-center{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.hidden{display:none!important}

.red{color:#EF5350}

.bold{font-weight:600}

  @keyframes speakPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,.5); transform: scale(1); }

/* ===== RESPONSIVE ===== */

  .slide { padding: 12px 10px 70px; }
  .mc-box { padding: 12px 10px; }
  .mc-title { font-size: 15px; }
}

const CHAR_DATA = [

/* ============================================================
   STATE
   ============================================================ */
let currentPage = 0;
const totalPages = 8;

// Drag state

// Fill state
const fillState = {};

/* ============================================================
   PAGE NAV
   ============================================================ */
function goPage(n){
  if(n<0||n>=totalPages) return;
  const old = document.querySelector('.page.active');
  if(old){old.classList.remove('active','slide-in');old.style.display='none';}
  const next = document.getElementById('page'+n);
  if(!next) return;
  next.style.display='block';
  next.classList.add('active','slide-in');
  currentPage=n;
  updateDots();
  // Animate cards
  gsap.fromTo(next.querySelectorAll('.card,.char-card,.fill-card,.drag-zone,.poem-line'),
    {y:20,opacity:0},
    {y:0,opacity:1,duration:.4,stagger:.06,ease:'power2.out'}
  );
  // Scroll to top
  next.scrollTop=0;
}

/* ============================================================
   DOTS
   ============================================================ */
function renderDots(){
  const c=document.getElementById('dots');
  c.innerHTML='';
  for(let i=0;i<totalPages;i++){
    const d=document.createElement('div');
    d.className='dot';
    d.onclick=()=>goPage(i);
    c.appendChild(d);
  }
}
function updateDots(){
  document.querySelectorAll('.dot').forEach((d,i)=>{d.classList.toggle('active',i===currentPage);});
}

/* ============================================================
   RENDER: FILL EXERCISES
   ============================================================ */
function renderFillExercises(){
  const c=document.getElementById('fill-container');
  if(!c) return;
  c.innerHTML='';
  FILL_EXERCISES.forEach((ex,i)=>{
    const card=document.createElement('div');
    card.className='fill-card';
    card.id='fillCard'+i;
    // Build display sentence with blank
    const parts=ex.sentence.split('___');
    const displayZh=parts[0]+'<span class="fill-blank" id="fillBlank'+i+'">___</span>'+parts[1];
    card.innerHTML=`
      <div class="fill-sentence">${displayZh}</div>
      <div class="fill-options" id="fillOpts${i}">
        ${ex.options.map((o,j)=>`<span class="fill-option" data-idx="${i}" data-val="${o}" data-optidx="${j}" onclick="pickFill(this)">${o}</span>`).join('')}
      </div>
      <div class="fill-result" id="fillResult${i}"></div>
    `;
    c.appendChild(card);
    fillState[i]=false;
  });
}

/* ============================================================
   FILL: PICK
   ============================================================ */
function pickFill(el){
  const idx=parseInt(el.dataset.idx);
  const val=el.dataset.val;
  if(fillState[idx]) return;
  if(el.classList.contains('used')) return;
  // Mark all options as used for this exercise
  const opts=document.querySelectorAll('#fillOpts'+idx+' .fill-option');
  const ex=FILL_EXERCISES[idx];
  const blank=document.getElementById('fillBlank'+idx);
  opts.forEach(o=>o.classList.add('used'));
  blank.textContent=val;
  blank.classList.add('filled');
  // Check
  const result=document.getElementById('fillResult'+idx);
  if(val===ex.answer){
    result.innerHTML='✅ 正确！';
    result.style.color='#4CAF50';
    fillState[idx]=true;
    el.classList.add('correct');
    // speak
    speakText(ex.sentence.replace('___',ex.answer));
    // GSAP celebrate
    gsap.fromTo(blank,{scale:1.2},{scale:1,duration:.3,ease:'back.out(2)'});
  } else {
    result.innerHTML='❌ 再想想… 正确答案是：'+ex.answer;
    result.style.color='#F44336';
    el.classList.add('wrong');
    // Reset after 1.2s
    setTimeout(()=>{
      blank.textContent='___';
      blank.classList.remove('filled');
      opts.forEach(o=>o.classList.remove('used','correct','wrong'));
      result.innerHTML='';
      fillState[idx]=false;
    },1400);
  }
}

/* ============================================================
   DRAG & DROP SENTENCE BUILDER
   ============================================================ */
function initSentences(){
  const sentences=[['我','是','学生'],['我','在','学校'],['我','有','一只','猫']];
  [1,2,3].forEach(i=>{
    const words=sentences[i-1];
    shuffleArray(words);
    const bank=document.getElementById('bank'+i);
    bank.innerHTML='';
    words.forEach((w,j)=>{
      const span=document.createElement('span');
      span.className='drag-word';
      span.textContent=w;
      span.dataset.word=w;
      span.dataset.sentence=i;
      span.dataset.bankIdx=j;
      span.draggable=false;
      // Pointer events for drag
      span.addEventListener('pointerdown',onWordPointerDown);
      bank.appendChild(span);
    });
    dragState[i]={placed:0};
  });
}

let dragData=null;

function onWordPointerDown(e){
  e.preventDefault();
  const el=e.currentTarget;
  if(el.classList.contains('placed')) return;
  el.setPointerCapture(e.pointerId);
  el.classList.add('dragging');
  dragData={el,offsetX:e.offsetX,offsetY:e.offsetY,startX:e.clientX,startY:e.clientY,sentence:parseInt(el.dataset.sentence)};

  const moveHandler=(ev)=>{
    ev.preventDefault();
    if(!dragData) return;
    dragData.el.style.position='fixed';
    dragData.el.style.left=(ev.clientX-dragData.offsetX)+'px';
    dragData.el.style.top=(ev.clientY-dragData.offsetY)+'px';
    dragData.el.style.zIndex=999;
    // Check if over zone
    const zone=document.getElementById('zone'+dragData.sentence);
    if(zone){
      const r=zone.getBoundingClientRect();
      if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){
        zone.classList.add('drag-over');
      } else {
        zone.classList.remove('drag-over');
      }
    }
  };

  const upHandler=(ev)=>{
    ev.preventDefault();
    if(!dragData) return;
    dragData.el.classList.remove('dragging');
    dragData.el.style.position='';
    dragData.el.style.left='';
    dragData.el.style.top='';
    dragData.el.style.zIndex='';
    const zone=document.getElementById('zone'+dragData.sentence);
    zone.classList.remove('drag-over');
    // Check drop
    if(zone){
      const r=zone.getBoundingClientRect();
      if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){
        // Place word in zone
        const word=dragData.el;
        if(!word.classList.contains('placed')){
          word.classList.add('placed','in-zone');
          word.style.position='';
          word.style.left='';
          word.style.top='';
          zone.appendChild(word);
          dragState[dragData.sentence].placed++;
          checkSentenceAuto(dragData.sentence);
        }
      }
    }
    dragData=null;
    document.removeEventListener('pointermove',moveHandler);
    document.removeEventListener('pointerup',upHandler);
  };

  document.addEventListener('pointermove',moveHandler);
  document.addEventListener('pointerup',upHandler);
}

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function resetSentence(n){
  const zone=document.getElementById('zone'+n);
  const bank=document.getElementById('bank'+n);
  // Return all placed words to bank
  const placed=zone.querySelectorAll('.drag-word');
  placed.forEach(w=>{
    w.classList.remove('placed','in-zone');
    bank.appendChild(w);
  });
  // Reset shuffle
  const words=Array.from(bank.children).map(w=>w.textContent);
  shuffleArray(words);
  bank.innerHTML='';
  words.forEach(w=>{
    const span=document.createElement('span');
    span.className='drag-word';
    span.textContent=w;
    span.dataset.word=w;
    span.dataset.sentence=n;
    span.addEventListener('pointerdown',onWordPointerDown);
    bank.appendChild(span);
  });
  dragState[n].placed=0;
  document.getElementById('result'+n).textContent='';
}

function checkSentence(n){
  const zone=document.getElementById('zone'+n);
  const answer=zone.dataset.answer;
  const placedWords=Array.from(zone.querySelectorAll('.drag-word')).map(w=>w.textContent).join('');
  const result=document.getElementById('result'+n);
  if(placedWords===answer){
    result.innerHTML='✅ 完全正确！🎉';
    result.style.color='#4CAF50';
    speakText(answer);
    gsap.fromTo(zone,{borderColor:'#4CAF50',backgroundColor:'#E8F5E9'},{duration:.3});
  } else {
    result.innerHTML='❌ 再试试！提示: '+answer;
    result.style.color='#F44336';
    gsap.fromTo(zone,{x:-4},{x:4,duration:.08,repeat:5,yoyo:true,ease:'power1.inOut'});
  }
}

function checkSentenceAuto(n){
  const zone=document.getElementById('zone'+n);
  const answer=zone.dataset.answer;
  const totalChars=answer.length;
  // Only auto-check if all words placed
  if(dragState[n].placed>=zone.querySelectorAll('.drag-word').length){
    checkSentence(n);
  }
}

/* ============================================================
   SPEECH
   ============================================================ */
function speakText(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';
  u.rate=0.85;
  u.pitch=1.1;
  window.speechSynthesis.speak(u);
}

function speakChar(ch,pinyin){
  speakText(ch);
}

function speakPoem(){
  const lines=['床前明月光','疑是地上霜','举头望明月','低头思故乡'];
  let i=0;
  function speakNext(){
    if(i>=lines.length) return;
    speakText(lines[i]);
    i++;
    if(i<lines.length) setTimeout(speakNext,1600);
  }
  speakNext();
}

function speakSummary(){
  speakText('我 在 有 是 的 很 和 也');
}

<!-- ═══ Speak Page - MP3优先, TTS后备 ═══ -->
<script>
(function(){
  var btn = document.getElementById('speakBtn') || document.querySelector('.speak-btn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'speakBtn'; btn.className = 'speak-btn'; btn.title = '朗读本页';
    btn.textContent = '🔊';
    btn.style.cssText = 'position:fixed;bottom:90px;right:16px;z-index:9999;width:48px;height:48px;border-radius:50%;border:2px solid #42A5F5;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(66,165,245,.3);display:flex;align-items:center;justify-content:center';
    document.body.appendChild(btn);
  }
  var sp = false, audioEl = null;
  var courseName = (window.COURSE_NAME || (window.location.pathname.match(/\/(\w[\w-]*)\.html/) || [,''])[1] || '');
  var uiv = document.documentElement.lang || 'en-US';
  var lang = uiv.indexOf('zh') >= 0 ? 'zh-CN' : 'en-US';

  function getPageIdx() {
    var active = document.querySelector('.page.active, .slide.active');
    if (!active) return -1;
    var parent = active.parentNode;
    return Array.prototype.indexOf.call(parent.children, active);
  }

  function speakPage() {
    if (sp) { stopPage(); return; }
    var idx = getPageIdx();
    if (idx < 0) return;

    // Try MP3 first: audio/COURSENAME/page-N.mp3
    var mp3Path = '../audio/' + courseName + '/page-' + (idx + 1) + '.mp3';
    if (audioEl) { audioEl.pause(); audioEl = null; }
    audioEl = new Audio(mp3Path);
    audioEl.onerror = function() {
      // MP3 failed → try flat MP3: audio/COURSENAME.mp3 or audio/songname.mp3
      var flatPath = '../audio/' + courseName + '.mp3';
      var flatAudio = new Audio(flatPath);
      flatAudio.onerror = function() {
        // Both MP3 failed → use speechSynthesis TTS
        speakTTS();
      };
      flatAudio.oncanplaythrough = function() {
        if (audioEl) audioEl.pause();
        audioEl = flatAudio;
        audioEl.play().catch(function(){ speakTTS(); });
        btn.textContent = '⏹'; btn.classList.add('speaking');
      };
      flatAudio.load();
    };
    audioEl.oncanplaythrough = function() {
      audioEl.play();
      btn.textContent = '⏹'; btn.classList.add('speaking');
      sp = true;
      audioEl.onended = function(){ stopPage(); };
    };
    audioEl.load();
  }

  function speakTTS() {
    if (!window.speechSynthesis) return;
    var active = document.querySelector('.page.active, .slide.active');
    if (!active) return;
    var txt = (active.innerText || active.textContent || '').replace(/\s+/g, ' ').trim();
    if (!txt || txt.length < 2) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = lang; u.rate = 0.85;
    u.onstart = function(){ sp = true; btn.classList.add('speaking'); btn.textContent = '⏹'; };
    u.onend = u.onerror = function(){ stopPage(); };
    window.speechSynthesis.speak(u);
  }

  function stopPage() {
    if (audioEl) { audioEl.pause(); audioEl = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    sp = false; btn.classList.remove('speaking'); btn.textContent = '🔊';
  }

  btn.addEventListener('click', function(e){ e.stopPropagation(); speakPage(); });
  if (btn.textContent.trim() === '' || btn.textContent.trim() === '▶') btn.textContent = '🔊';
})();
</script>

<script>
(function(){
  var sx = 0, sy = 0, swiping = false;
  document.addEventListener('touchstart', function(e) {
    var t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; swiping = true;
  }, {passive:true});
  document.addEventListener('touchmove', function(e) {
    if (!swiping) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiping = false;
      // Find and click the appropriate nav button
      if (dx < 0) {
        // Swipe left → next
        var n = document.querySelector('[onclick*="next"], [onclick*="Next"], .nav-btn:last-of-type:not([disabled]), a[href*="next"], [class*="next"], #nextBtn');
        if (n) n.click();
        else { var a = document.querySelector('a[href]:not([href*="#"])'); if (a && !a.href.includes("#")) a.click(); }
      } else {
        // Swipe right → prev
        var p = document.querySelector('[onclick*="prev"], [onclick*="Prev"], .nav-btn:first-of-type:not([disabled]), [class*="prev"], #prevBtn');
        if (p) p.click();
      }
    }
  }, {passive:true});
  document.addEventListener('touchend', function() { swiping = false; }, {passive:true});
})();
</script>
