<!DOCTYPE html>
<html lang="zh-CN">
<head><link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ugly Duckling - 森林英语故事</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#1A3A2A 0%,#2E7D32 50%,#1A3A2A 100%);min-height:100vh;padding:16px;color:#fff}
.container{max-width:480px;margin:0 auto}
.cover{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:24px;padding:32px;text-align:center;box-shadow:0 8px 40px rgba(139,195,74,0.2);margin-bottom:16px;border:1px solid rgba(139,195,74,0.3)}
.cover-title{font-size:28px;font-weight:800;color:#8BC34A;margin-bottom:8px;text-shadow:0 2px 10px rgba(139,195,74,0.5)}
.cover-subtitle{color:#A5D6A7;margin-bottom:20px}
.section{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,0.3);margin-bottom:16px;border:1px solid rgba(255,255,255,0.1)}
.section-title{font-size:18px;font-weight:700;color:#8BC34A;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.btn{background:linear-gradient(135deg,#8BC34A,#689F38);color:#1A3A2A;border:none;padding:12px 24px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(139,195,74,0.4)}
.btn-secondary{background:linear-gradient(135deg,#81C784,#388E3C);color:#fff}
.story-text{line-height:1.8;font-size:16px;color:#E0E0E0}
.dialogue{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid #8BC34A}
.dialogue-name{font-weight:700;color:#8BC34A;margin-bottom:4px}
.leaf{position:fixed;pointer-events:none;animation:fall 4s linear infinite}
@keyframes fall{0%{transform:translateY(-100%) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(360deg);opacity:0}}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.4)}
.story-text.speaking{background:rgba(255,215,0,0.15);animation:pulse 1.2s ease-in-out infinite}
.dialogue{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid #FFD700;cursor:pointer;transition:background 0.2s}
.dialogue:active{background:rgba(255,255,255,0.15)}
.dialogue.speaking{animation:pulse 1.2s ease-in-out infinite;border-left-color:#FFA500}
@media (max-width:360px){
  body{padding:8px}
  .cover{padding:20px 16px;border-radius:18px}
  .cover-title{font-size:22px}
  .section{padding:16px;border-radius:16px}
  .section-title{font-size:16px}
  .story-text{font-size:14px;line-height:1.6}
  .dialogue{padding:10px 12px;font-size:14px}
  .quiz-option{padding:10px;font-size:14px}
  .poem-line{font-size:17px;padding:8px 0}
  .btn{padding:10px 18px;font-size:13px}
  .cover-subtitle{font-size:13px}
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.4)}
  50%{box-shadow:0 0 0 8px rgba(255,215,0,0)}
}
.story-text.speaking{background:rgba(255,215,0,0.15);animation:pulse 1.2s ease-in-out infinite}
.dialogue{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid #FFD700;cursor:pointer;transition:background 0.2s}
.page-section.swipe-active{opacity:1;transform:translateX(0)}


</style>
</head>
<body>
<div class="container">
  <div class="cover">
    <div style="font-size:64px;margin-bottom:12px">🦢</div>
    <h1 class="cover-title">The Ugly Duckling</h1>
    <p class="cover-subtitle">丑小鸭 · 森林英语故事</p>
    <button class="btn" onclick="document.getElementById('content').scrollIntoView()">开始探险</button>
  </div>
  <div id="content"></div>
</div>

<script>
const TEMPLATE_CONFIG = {
  theme: 'forest',
  title: 'The Ugly Duckling',
  subtitle: '丑小鸭',
  colors: { primary: '#1A3A2A', secondary: '#2E7D32', accent: '#8BC34A', text: '#FFFFFF', card: 'rgba(255,255,255,0.1)' },
  decorations: ['🍄', '🦋', '🌿', '🌲', '🦊', '🐿️']
};

class StoryEngine {
  constructor(containerId) {
    this.container = document.getElementById(containerId);
    this.sections = [];
    this.current = 0;
  }
  init(sections) { this.sections = sections; this.current = 0; }
  mount() { this.render(); }
  render() {
    if (!this.container || !this.sections[this.current]) return;
    const s = this.sections[this.current];
    let html = `<div class="section-title">${s.emoji || '📖'} ${s.title}</div>`;
    if (s.type === 'text') {
      html += `<div class="story-text">${s.content}</div>`;
    } else if (s.type === 'dialogue') {
      s.lines.forEach(line => {
        html += `<div class="dialogue"><div class="dialogue-name">${line.name}</div><div>${line.text}</div></div>`;
      });
    } else if (s.type === 'moral') {
      html += `<div class="section" style="background:rgba(139,195,74,0.15);border:2px solid rgba(139,195,74,0.4)">
        <div class="story-text" style="text-align:center;font-style:italic;color:#C8E6C9">${s.content}</div>
      </div>`;
    }
    if (this.current < this.sections.length - 1) {
      html += `<button class="btn" style="margin-top:16px" onclick="storyEngine.next()">下一页 →</button>`;
    } else {
      html += `<button class="btn btn-secondary" style="margin-top:16px" onclick="storyEngine.restart()">🔄 重读故事</button>`;
    }
    this.container.innerHTML = html;
  }
  next() { this.current++; if (this.current < this.sections.length) this.render(); }
  restart() { this.current = 0; this.render(); window.scrollTo(0, 0); }
}

function createLeaves() {
  const container = document.querySelector('.container');
  const leafEmojis = ['🍃', '🍂', '🌿'];
  for (let i = 0; i < 10; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.innerHTML = leafEmojis[i % leafEmojis.length];
    leaf.style.left = Math.random() * 100 + '%';
    leaf.style.animationDelay = Math.random() * 4 + 's';
    leaf.style.fontSize = (Math.random() * 16 + 12) + 'px';
    container.appendChild(leaf);
  }
}

const storyEngine = new StoryEngine('content');

storyEngine.init([
  {
    emoji: '🥚',
    title: 'A Special Egg',
    type: 'text',
    content: `Once upon a time, on a big farm near a green meadow, a mother duck was sitting on her eggs. They were warm and safe under her. "Soon," she quacked softly, "my little ones will hatch."`
  },
  {
    emoji: '🐣',
    title: 'The Hatching',
    type: 'text',
    content: `One sunny morning, the eggs began to crack. One by one, fluffy yellow ducklings popped out. They looked around with bright, curious eyes. The mother duck was very happy. But one egg was different. It was big and grey. Crak! Finally, a very large, fluffy grey bird tumbled out. He had a long neck and big feet. He did not look like the other little yellow ducklings at all.`
  },
  {
    emoji: '😢',
    title: 'Rejected by Others',
    type: 'dialogue',
    lines: [
      { name: 'Mother Duck 🦆', text: 'Oh my. You are... different.' },
      { name: 'Cows 🐄', text: 'He is not a duck.' },
      { name: 'Chickens 🐔', text: 'He is too big and grey!' },
      { name: 'Other Ducklings 🐥', text: 'He is ugly. He cannot be one of us.' }
    ]
  },
  {
    emoji: '🏠',
    title: 'Leaving Home',
    type: 'text',
    content: `The little grey bird felt sad. He tried to play with the other ducklings, but they swam away from him. "Go away, ugly duckling!" they said. So the ugly duckling flew over the farm fence, all by himself. His heart was heavy.`
  },
  {
    emoji: '🦆',
    title: 'The Wild Ducks',
    type: 'dialogue',
    lines: [
      { name: 'Ugly Duckling 🐥', text: 'Can I play with you?' },
      { name: 'Wild Ducks', text: 'You are very strange. But if you can swim fast, you may stay.' }
    ]
  },
  {
    emoji: '🔫',
    title: 'Danger!',
    type: 'text',
    content: `The ugly duckling swam as fast as he could with his big feet. But suddenly—BANG! BANG! Hunters were coming! The wild ducks flew away. The poor ugly duckling hid in the tall reeds. He was very scared and very lonely.`
  },
  {
    emoji: '🏠',
    title: 'More Rejection',
    type: 'text',
    content: `He wandered for many days. He slept in a barn, but a kind woman and her cat and hen chased him away. "You cannot lay eggs like the hen, and you cannot purr like the cat," said the woman. "You are useless." The ugly duckling felt his heart would break. "I am just ugly," he whispered to himself. "Nobody wants me."`
  },
  {
    emoji: '❄️',
    title: 'A Cold Winter',
    type: 'text',
    content: `Winter came. The pond froze. The ugly duckling was cold and hungry. He almost froze in the ice, but a farmer saved him and took him home to his children. The children wanted to play with him, but they were too rough. They chased him, and he fell out of a box. He flew out the door as fast as he could, back into the cold snow. He thought, "Maybe I will never have a friend."`
  },
  {
    emoji: '🌸',
    title: 'Spring Arrives',
    type: 'text',
    content: `But then, spring arrived. The ice melted. Flowers bloomed. The ugly duckling felt a warmth in his heart. He saw three beautiful swans swimming in a lake. They were so graceful and kind. "I want to be like them," he thought. "Even if they chase me away, it is better to be chased by such beautiful creatures."`
  },
  {
    emoji: '🦢',
    title: 'The Beautiful Swan',
    type: 'dialogue',
    lines: [
      { name: 'Ugly Duckling 🐥', text: '*swims towards them, bowing his head*' },
      { name: 'Swans 🦢', text: 'Hello, friend!' },
      { name: '', text: 'The ugly duckling looked down at the water. He saw his reflection. But it was not a grey, ugly bird he saw. He saw a magnificent white swan with a long, graceful neck!' }
    ]
  },
  {
    emoji: '✨',
    title: 'True Identity',
    type: 'text',
    content: `He was not an ugly duckling at all. He had always been a swan, just like the others. He just needed time to grow. The other swans welcomed him with gentle pecks. From that day on, he swam with his new friends. He was beautiful, and more importantly, he was happy and loved.`
  },
  {
    emoji: '💚',
    title: 'Moral of the Story',
    type: 'moral',
    content: 'You are special and wonderful just as you are. Sometimes, you have to grow into your true self. Be patient and kind to yourself and others, because true beauty comes from within.<br><br>你本身就是特别而美好的。有时候，你需要成长才能成为真正的自己。对自己和他人要有耐心和善意，因为真正的美来自内心。'
  }
]);

document.addEventListener('DOMContentLoaded', () => {
  createLeaves();
  storyEngine.mount();
});
function launchConfetti() {
  let box = document.querySelector('.confetti-container');
  if (!box) {
    box = document.createElement('div');
    box.className = 'confetti-container';
    document.body.appendChild(box);
  }
  }
const Speech = {
  _speaking: false,
  detectLang(text) {
    const cjk = /[\u4e00-\u9fff\u3400-\u4dbf]/;
    const latin = /[a-zA-Z]/;
    let cn = 0, en = 0;
    for (let i = 0; i < text.length; i++) {
      if (cjk.test(text[i])) cn++;
      else if (latin.test(text[i])) en++;
    }
    return cn > en ? 'zh-CN' : 'en-US';
  },
  speak(text, lang) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    if (!text || !text.trim()) return;
    const u = new SpeechSynthesisUtterance(text.trim());
    u.lang = lang || this.detectLang(text);
    u.rate = 0.9;
    u.pitch = 1.05;
    this._speaking = true;
    u.onend = () => { this._speaking = false; };
    u.onerror = () => { this._speaking = false; };
    window.speechSynthesis.speak(u);
  },
  stop() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    this._speaking = false;
  }
};

function initSwipe() {
  contentEl.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  contentEl.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
    const sections = getSections();
    if (sections.length < 2) return;
    if (dx < 0 && currentPage < sections.length - 1) {
      swipePage(currentPage, currentPage + 1);
    } else if (dx > 0 && currentPage > 0) {
      swipePage(currentPage, currentPage - 1);
    }
  }, { passive: true });
}

</script>
</body>
</html>
