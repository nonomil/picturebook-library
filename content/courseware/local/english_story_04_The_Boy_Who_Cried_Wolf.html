<!DOCTYPE html>
<html lang="zh-CN">
<head><link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Boy Who Cried Wolf - 森林英语故事</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#1A3A2A 0%,#2E7D32 50%,#1A3A2A 100%);min-height:100vh;padding:16px;color:#fff}
.container{max-width:480px;margin:0 auto}
.cover{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:24px;padding:32px;text-align:center;box-shadow:0 8px 40px rgba(139,195,74,0.2);margin-bottom:16px;border:1px solid rgba(139,195,74,0.3)}
.cover-title{font-size:28px;font-weight:800;color:#8BC34A;margin-bottom:8px;text-shadow:0 2px 10px rgba(139,195,74,0.5)}
.cover-subtitle{color:#A5D6A7;margin-bottom:20px}
.section{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,0.3);margin-bottom:16px;border:1px solid rgba(255,255,255,0.1)}
.section-title{font-size:18px;font-weight:700;color:#8BC34A;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.btn{background:linear-gradient(135deg,#8BC34A,#689F38);color:#1A3A2A;border:none;padding:12px 24px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(139,195,74,0.4)}
.btn-secondary{background:linear-gradient(135deg,#81C784,#388E3C);color:#fff}
.story-text{line-height:1.8;font-size:16px;color:#E0E0E0}
.dialogue{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid #8BC34A}
.dialogue-name{font-weight:700;color:#8BC34A;margin-bottom:4px}
.leaf{position:fixed;pointer-events:none;animation:fall 4s linear infinite}
@keyframes fall{0%{transform:translateY(-100%) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(360deg);opacity:0}}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.4)}
.story-text.speaking{background:rgba(255,215,0,0.15);animation:pulse 1.2s ease-in-out infinite}
.dialogue{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid #FFD700;cursor:pointer;transition:background 0.2s}
.dialogue:active{background:rgba(255,255,255,0.15)}
.dialogue.speaking{animation:pulse 1.2s ease-in-out infinite;border-left-color:#FFA500}
@media (max-width:360px){
  body{padding:8px}
  .cover{padding:20px 16px;border-radius:18px}
  .cover-title{font-size:22px}
  .section{padding:16px;border-radius:16px}
  .section-title{font-size:16px}
  .story-text{font-size:14px;line-height:1.6}
  .dialogue{padding:10px 12px;font-size:14px}
  .quiz-option{padding:10px;font-size:14px}
  .poem-line{font-size:17px;padding:8px 0}
  .btn{padding:10px 18px;font-size:13px}
  .cover-subtitle{font-size:13px}
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.4)}
  50%{box-shadow:0 0 0 8px rgba(255,215,0,0)}
}
.story-text.speaking{background:rgba(255,215,0,0.15);animation:pulse 1.2s ease-in-out infinite}
.dialogue{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid #FFD700;cursor:pointer;transition:background 0.2s}
.page-section.swipe-active{opacity:1;transform:translateX(0)}


</style>
</head>
<body>
<div class="container">
  <div class="cover">
    <div style="font-size:64px;margin-bottom:12px">🐺</div>
    <h1 class="cover-title">The Boy Who Cried Wolf</h1>
    <p class="cover-subtitle">狼来了 · 森林英语故事</p>
    <button class="btn" onclick="document.getElementById('content').scrollIntoView()">开始探险</button>
  </div>
  <div id="content"></div>
</div>

<script>
const TEMPLATE_CONFIG = {
  theme: 'forest',
  title: 'The Boy Who Cried Wolf',
  subtitle: '狼来了',
  colors: { primary: '#1A3A2A', secondary: '#2E7D32', accent: '#8BC34A', text: '#FFFFFF', card: 'rgba(255,255,255,0.1)' },
  decorations: ['🍄', '🦋', '🌿', '🌲', '🦊', '🐿️']
};

class StoryEngine {
  constructor(containerId) {
    this.container = document.getElementById(containerId);
    this.sections = [];
    this.current = 0;
  }
  init(sections) { this.sections = sections; this.current = 0; }
  mount() { this.render(); }
  render() {
    if (!this.container || !this.sections[this.current]) return;
    const s = this.sections[this.current];
    let html = `<div class="section-title">${s.emoji || '📖'} ${s.title}</div>`;
    if (s.type === 'text') {
      html += `<div class="story-text">${s.content}</div>`;
    } else if (s.type === 'dialogue') {
      s.lines.forEach(line => {
        html += `<div class="dialogue"><div class="dialogue-name">${line.name}</div><div>${line.text}</div></div>`;
      });
    } else if (s.type === 'moral') {
      html += `<div class="section" style="background:rgba(139,195,74,0.15);border:2px solid rgba(139,195,74,0.4)">
        <div class="story-text" style="text-align:center;font-style:italic;color:#C8E6C9">${s.content}</div>
      </div>`;
    }
    if (this.current < this.sections.length - 1) {
      html += `<button class="btn" style="margin-top:16px" onclick="storyEngine.next()">下一页 →</button>`;
    } else {
      html += `<button class="btn btn-secondary" style="margin-top:16px" onclick="storyEngine.restart()">🔄 重读故事</button>`;
    }
    this.container.innerHTML = html;
  }
  next() { this.current++; if (this.current < this.sections.length) this.render(); }
  restart() { this.current = 0; this.render(); window.scrollTo(0, 0); }
}

function createLeaves() {
  const container = document.querySelector('.container');
  const leafEmojis = ['🍃', '🍂', '🌿'];
  for (let i = 0; i < 10; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.innerHTML = leafEmojis[i % leafEmojis.length];
    leaf.style.left = Math.random() * 100 + '%';
    leaf.style.animationDelay = Math.random() * 4 + 's';
    leaf.style.fontSize = (Math.random() * 16 + 12) + 'px';
    container.appendChild(leaf);
  }
}

const storyEngine = new StoryEngine('content');

storyEngine.init([
  {
    emoji: '👦',
    title: 'The Shepherd Boy',
    type: 'text',
    content: `Once upon a time, in a sunny green valley, there lived a young shepherd boy named Eli. His job was to watch over the fluffy white sheep on the hillside every day. It was a very important job. The sheep were soft and gentle, and they trusted Eli to keep them safe. Most days, Eli sat on his favorite rock, counting the sheep and watching the clouds drift by.`
  },
  {
    emoji: '😒',
    title: 'A Boring Day',
    type: 'text',
    content: `But some days, Eli felt bored. There was no one to talk to, only the sheep who would say, "Baa!" One day, Eli had a mischievous idea. He stood up and shouted as loud as he could, his voice echoing across the valley.`
  },
  {
    emoji: '🗣️',
    title: 'The First Lie',
    type: 'dialogue',
    lines: [
      { name: 'Eli 👦', text: 'Wolf! A big gray wolf is chasing the sheep! Help!' },
      { name: '', text: 'Down in the village, the farmers heard the shout. They dropped their tools and ran up the hill as fast as they could.' },
      { name: 'Old Man Miller 👴', text: 'Where is the wolf, Eli?' },
      { name: 'Eli 👦', text: 'There is no wolf! I was just pretending!' }
    ]
  },
  {
    emoji: '😠',
    title: 'Farmers Are Not Happy',
    type: 'dialogue',
    lines: [
      { name: 'Farmers', text: 'That was not a funny joke, Eli.' },
      { name: '', text: 'The next week, Eli was bored again. The sheep were just chewing grass, and the sun was too warm.' }
    ]
  },
  {
    emoji: '🗣️',
    title: 'The Second Lie',
    type: 'dialogue',
    lines: [
      { name: 'Eli 👦', text: 'Wolf! Help! A wolf is here!' },
      { name: 'Baker 🍞', text: 'You tricked us again! This is not kind.' },
      { name: '', text: 'Eli just smiled. He liked making people run.' }
    ]
  },
  {
    emoji: '🐺',
    title: 'The Real Wolf Appears',
    type: 'text',
    content: `Then, one evening, as the sun began to set, Eli saw a shadow move in the trees. A pair of yellow eyes glowed in the twilight. A real wolf, large and quiet, stepped out from the forest. Eli's heart began to beat very fast. He jumped to his feet and shouted, "Wolf! A real wolf! Help! Please help!" His voice was scared this time. It cracked with fear.`
  },
  {
    emoji: '🙅',
    title: 'No One Comes',
    type: 'dialogue',
    lines: [
      { name: 'Farmers', text: 'Oh, Eli is playing his trick again. He has fooled us twice. He won\'t fool us a third time.' },
      { name: '', text: 'They did not come. The wolf stepped closer to the sheep. Eli was so scared. He tried to scare the wolf away himself, throwing sticks and shouting, but the wolf just growled.' }
    ]
  },
  {
    emoji: '🐕',
    title: 'A Real Rescue',
    type: 'text',
    content: `Then, just as the wolf was about to step into the field, old Mr. Finn from the far end of the valley heard the real fear in Eli's cries. He came running with his big dog and a lantern. The wolf saw the light and the dog, and it turned and ran back into the dark forest. The sheep were safe.`
  },
  {
    emoji: '😢',
    title: 'Eli\'s Apology',
    type: 'dialogue',
    lines: [
      { name: 'Eli 👦', text: 'I am so sorry. I lied, and then when I needed help, you did not come. I understand why.' },
      { name: 'Old Man Miller 👴', text: 'It is good you are safe, Eli. But words are very important. When you lie, you break trust. And trust is like a glass vase—once broken, it is hard to put back together.' }
    ]
  },
  {
    emoji: '✅',
    title: 'A Changed Boy',
    type: 'text',
    content: `Eli nodded. He promised to never cry wolf again unless it was real. And from that day on, Eli was an honest boy. And whenever he felt bored on the hill, he would just sing songs to the sheep, who would listen and say, "Baa!" And everyone believed him when he spoke.`
  },
  {
    emoji: '💚',
    title: 'Moral of the Story',
    type: 'moral',
    content: 'When you tell lies, people will not believe you, even when you are telling the truth. It is always best to be honest, so people know they can trust your words.<br><br>当你撒谎时，人们不会相信你，即使你说的是真话。最好始终保持诚实，这样人们才会相信你的话。'
  }
]);

document.addEventListener('DOMContentLoaded', () => {
  createLeaves();
  storyEngine.mount();
});
function launchConfetti() {
  let box = document.querySelector('.confetti-container');
  if (!box) {
    box = document.createElement('div');
    box.className = 'confetti-container';
    document.body.appendChild(box);
  }
  }
const Speech = {
  _speaking: false,
  detectLang(text) {
    const cjk = /[\u4e00-\u9fff\u3400-\u4dbf]/;
    const latin = /[a-zA-Z]/;
    let cn = 0, en = 0;
    for (let i = 0; i < text.length; i++) {
      if (cjk.test(text[i])) cn++;
      else if (latin.test(text[i])) en++;
    }
    return cn > en ? 'zh-CN' : 'en-US';
  },
  speak(text, lang) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    if (!text || !text.trim()) return;
    const u = new SpeechSynthesisUtterance(text.trim());
    u.lang = lang || this.detectLang(text);
    u.rate = 0.9;
    u.pitch = 1.05;
    this._speaking = true;
    u.onend = () => { this._speaking = false; };
    u.onerror = () => { this._speaking = false; };
    window.speechSynthesis.speak(u);
  },
  stop() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    this._speaking = false;
  }
};

function initSwipe() {
  contentEl.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  contentEl.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
    const sections = getSections();
    if (sections.length < 2) return;
    if (dx < 0 && currentPage < sections.length - 1) {
      swipePage(currentPage, currentPage + 1);
    } else if (dx > 0 && currentPage > 0) {
      swipePage(currentPage, currentPage - 1);
    }
  }, { passive: true });
}

</script>
</body>
</html>
