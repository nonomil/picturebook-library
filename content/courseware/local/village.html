<!DOCTYPE html>
<html lang="zh-CN">
<head><link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>🏘️ 村庄学堂</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Press Start 2P',monospace}

/* ── VIEWPORT ── */
#vp{width:100%;height:100%;overflow:hidden;position:relative}

/* ── WORLD (GPU-translated) ── */
#world{
  position:absolute;
  width:1400px;height:1100px;
  background: url('assets/gpt-sprites/backgrounds/background_02.png') 61% 48%/152% 152% no-repeat;
  transform-origin:0 0;
  will-change:transform;image-rendering:pixelated;
  touch-action:none;
}
#world::before,
#world::after{
  content:'';
  position:absolute;
  top:0;bottom:0;
  width:88px;
  pointer-events:none;
  z-index:2;
  background:linear-gradient(180deg,#73C845 0%,#6FBE3E 45%,#6AB73A 100%);
}
#world::before{left:0}
#world::after{right:0}

/* ── PATHS ── */
.path{position:absolute;image-rendering:pixelated}
.stone{
  background:#888;
  background-image:repeating-linear-gradient(90deg,transparent 15px,rgba(0,0,0,.06) 16px),
    repeating-linear-gradient(0deg,transparent 15px,rgba(0,0,0,.06) 16px);
}
.dirt{
  background:#A07840;
  background-image:repeating-linear-gradient(90deg,transparent 11px,rgba(0,0,0,.05) 12px);
}

/* ── WATER ── */
.water{
  position:absolute;
  background:rgba(100,180,230,0.5);
  animation:wshim 3s ease-in-out infinite alternate;
}
.water::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,transparent 8px,rgba(255,255,255,.07) 8px,rgba(255,255,255,.07) 12px);
}
@keyframes wshim{to{background:rgba(120,200,245,0.6)}}

/* ── BUILDINGS ── */
.bld{position:absolute;cursor:pointer;z-index:5}
.bld:hover .bwall{filter:brightness(1.12)}

.bsign{
  position:absolute;top:-42px;left:50%;transform:translateX(-50%);
  background:#7B5020;border:3px solid #3D2000;padding:8px 14px;
  font-size:12px;color:#FFF;white-space:nowrap;
  text-shadow:1px 1px 0 #000;box-shadow:0 3px 0 #3D2000;z-index:10;
  line-height:1.6;text-align:center;
}

.broof{height:28px;border-bottom:4px solid rgba(0,0,0,.35)}
.bwall{
  height:96px;position:relative;display:flex;
  align-items:center;justify-content:space-around;padding:10px 18px;
  background-image:repeating-linear-gradient(0deg,transparent 9px,rgba(0,0,0,.12) 10px);
}
.bwin{width:28px;height:28px;background:#B0E8FF;border:4px solid rgba(0,0,0,.4)}
.bbot{height:60px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:0}
.bdoor{width:44px;height:54px;background:rgba(0,0,0,.65);border-radius:2px 2px 0 0}
.bentry{height:12px;background:#866043;width:56px;margin:0 auto}

/* ── PROXIMITY RING ── */
.pring{
  position:absolute;width:68px;height:68px;border-radius:50%;
  border:3px solid #F5C800;pointer-events:none;
  transform:translate(-50%,-50%);display:none;z-index:20;
  animation:rpulse 1s ease-in-out infinite;
}
@keyframes rpulse{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1;border-color:#F5C800}
  50%{transform:translate(-50%,-50%) scale(1.25);opacity:.5;border-color:#FFF}
}

/* ── TREES ── */
.tree{position:absolute;z-index:4}
.tree img{display:block;image-rendering:pixelated}

/* ── WELL ── */
#well{
  position:absolute;width:56px;height:56px;
  border-radius:50%;background:#555;border:6px solid #333;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;z-index:6;
  box-shadow:0 0 0 4px #666,0 4px 0 #222;
}
#well::after{
  content:'';position:absolute;top:-24px;left:50%;
  transform:translateX(-50%);width:4px;height:20px;background:#8B6340;
}

/* ── FLOWERS ── */
.fl{position:absolute;z-index:3}
.fl img{display:block;image-rendering:pixelated}

/* ── FENCE (world border) ── */
.fence{position:absolute;background:#8B6340;z-index:1}
.fence::before{
  content:'';position:absolute;top:0;bottom:0;left:0;right:0;
  background:repeating-linear-gradient(90deg,transparent 19px,rgba(0,0,0,.2) 20px);
}

/* ── ANIMALS ── */
.npc{
  position:absolute;z-index:6;cursor:pointer;
  animation:anpeck 2.5s ease-in-out infinite;
}
.npc svg{display:block;image-rendering:pixelated}
.npc img{display:block;image-rendering:pixelated}
.npc:hover{filter:brightness(1.2)}
@keyframes anpeck{
  0%,60%,100%{transform:translateY(0)}
  30%{transform:translateY(-6px)}
}
.npc.walk{animation:anwalk 1.8s ease-in-out infinite}
@keyframes anwalk{
  0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}
}

/* ── NPC BUBBLE ── */
.nbubble{
  position:absolute;bottom:calc(100% + 3px);left:50%;
  transform:translateX(-50%);background:#fff;border:3px solid #222;
  font-size:12px;color:#222;padding:6px 10px;white-space:nowrap;
  pointer-events:none;
  animation:bpop .15s ease;
}
.nbubble::after{
  content:'';position:absolute;top:100%;left:50%;
  transform:translateX(-50%);
  border:4px solid transparent;border-top-color:#222;
}
@keyframes bpop{from{opacity:0;transform:translateX(-50%) scale(0)}to{opacity:1;transform:translateX(-50%) scale(1)}}

/* ── STEVE ── */
#steve{
  position:absolute;width:48px;height:84px;z-index:15;pointer-events:none;
}
#steve img{width:auto;height:100%;max-width:none;display:block;position:absolute;bottom:0;left:50%;transform:translateX(-50%);image-rendering:pixelated}
#steve::before{
  content:'';position:absolute;bottom:-3px;left:50%;
  transform:translateX(-50%);width:32px;height:6px;
  background:rgba(0,0,0,.28);border-radius:50%;
}
#steve svg{display:block;image-rendering:pixelated}
#steve.walk{animation:swalk .28s steps(2) infinite}
@keyframes swalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ── HUD ── */
#hud{
  position:fixed;top:0;left:0;right:0;
  background:rgba(0,0,0,.85);border-bottom:3px solid #866043;
  padding:7px 14px;display:flex;align-items:center;gap:10px;
  z-index:100;flex-wrap:wrap;
}
.h-name{font-size:18px;color:#F5C800;text-shadow:2px 2px 0 #A88800}
.h-lv{background:#25D5E8;color:#000;font-size:16px;padding:4px 10px;border:2px solid #0099BB}
.h-xwrap{flex:1;min-width:80px}
.h-xlbl{font-size:12px;color:#888;margin-bottom:2px}
.h-bar{height:10px;background:#111;border:2px solid #333}
.h-xfill{height:100%;background:#66FF00;width:0%;transition:width .5s}
.h-coins{font-size:18px;color:#F5C800;display:flex;align-items:center;gap:5px}
.h-coin{width:18px;height:18px;background:#F5C800;border:2px solid #A88800;border-radius:50%;box-shadow:0 0 5px #F5C800}
.h-pet{font-size:16px;color:#12CC55;text-decoration:none}
.h-pet:hover{text-shadow:0 0 8px #12CC55}
.h-chest{position:relative}
.h-dot{
  position:absolute;top:-2px;right:-2px;width:8px;height:8px;
  background:#FF3B30;border-radius:50%;border:2px solid #000;display:none;
  animation:dpulse 1.2s ease-in-out infinite;
}
@keyframes dpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* ── D-PAD ── */
#dpad{
  position:fixed;bottom:16px;left:16px;z-index:100;
  display:grid;grid-template-columns:56px 56px 56px;
  grid-template-rows:56px 56px 56px;gap:4px;opacity:.85;
}
.dp{
  width:56px;height:56px;background:rgba(0,0,0,.72);
  border:2px solid #555;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;
}
.dp:active,.dp.on{background:rgba(255,255,255,.18)}
#dpu{grid-column:2;grid-row:1}
#dpl{grid-column:1;grid-row:2}
#dpc{grid-column:2;grid-row:2;background:rgba(245,200,0,.15);font-size:10px;color:#F5C800;border-color:#F5C80060}
#dpr{grid-column:3;grid-row:2}
#dpd{grid-column:2;grid-row:3}
#dpc.near{background:rgba(245,200,0,.4);animation:abtn .7s ease-in-out infinite}
@keyframes abtn{0%,100%{box-shadow:0 0 0 0 rgba(245,200,0,.4)}50%{box-shadow:0 0 0 8px rgba(245,200,0,0)}}

/* ── ENTER PROMPT ── */
#prompt{
  position:fixed;bottom:88px;left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.92);border:2px solid #F5C800;
  color:#F5C800;font-size:16px;padding:8px 16px;z-index:100;
  display:none;white-space:nowrap;pointer-events:none;
  animation:pbob .9s ease-in-out infinite alternate;
}
@keyframes pbob{
  from{transform:translateX(-50%) translateY(0)}
  to{transform:translateX(-50%) translateY(-5px)}
}

/* ── MINI MAP ── */
#mini{
  position:fixed;top:56px;right:12px;
  width:110px;height:86px;background:rgba(0,0,0,.7);
  border:2px solid #555;z-index:100;overflow:hidden;
  display:none;
}
#mini-bg{width:100%;height:100%;position:relative}
#mini-steve{
  position:absolute;width:5px;height:5px;
  background:#FFD700;border-radius:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 4px #FFD700;
}

/* ── SCREEN FADE ── */
#fade{
  position:fixed;inset:0;background:#000;
  opacity:0;pointer-events:none;z-index:999;
  transition:opacity .4s ease;
}
#fade.in{opacity:1;pointer-events:all}

/* ── ZONE PANEL (course list) ── */
.panel-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.panel-overlay.show{opacity:1;pointer-events:auto}
.zone-panel{
  position:fixed;bottom:0;left:0;right:0;
  max-height:75vh;background:rgba(15,15,20,.97);
  z-index:201;border-radius:16px 16px 0 0;
  transform:translateY(100%);transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  display:flex;flex-direction:column;overflow:hidden;
}
.zone-panel.open{transform:translateY(0)}
.panel-handle{display:flex;justify-content:center;padding:8px 0 4px}
.panel-handle-bar{width:36px;height:4px;background:rgba(255,255,255,.25);border-radius:2px}
.panel-header{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff}
.panel-icon{font-size:24px}
.panel-title{font-size:12px;font-weight:800;flex:1}
.panel-close{
  width:36px;height:36px;background:rgba(255,255,255,.1);
  border:2px solid rgba(255,255,255,.2);border-radius:8px;
  color:#fff;font-size:16px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;min-width:36px;
}
.panel-desc{font-size:18px;color:rgba(255,255,255,.6);padding:0 16px 8px}
.course-list{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:8px;padding:0 16px 16px;overflow-y:auto;flex:1;
  -webkit-overflow-scrolling:touch;
}
.course-card{
  background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);
  border-radius:8px;padding:10px 8px;cursor:pointer;
  transition:all .15s;text-align:center;
}
.course-card:hover{border-color:rgba(255,255,255,.3);transform:translateY(-2px)}
.course-card.completed{border-color:#5D9C3C}
.course-card .cc-emoji{font-size:22px;margin-bottom:4px}
.course-card .cc-name{font-size:14px;color:#fff;font-weight:700;line-height:1.3}
.course-card .cc-lesson{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}
.course-card .cc-stars{font-size:8px;margin-top:3px}

/* ── WELCOME OVERLAY ── */
#welcome{
  position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
}
#welcome.hidden{display:none}
.w-title{font-size:14px;color:#F5C800;text-shadow:2px 2px 0 #A88800;text-align:center;line-height:2}
.w-hint{font-size:14px;color:#888;margin-top:4px}
.w-btn{
  margin-top:12px;padding:12px 28px;background:#5D9C3C;border:3px solid #3E7228;
  color:#fff;font-family:inherit;font-size:18px;cursor:pointer;
  box-shadow:0 4px 0 #2E5C1A;transition:all .1s;
}
.w-btn:active{box-shadow:none;transform:translateY(4px)}

@media(max-width:480px){
  #dpad{grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;bottom:10px;left:10px}
  .dp{width:52px;height:52px;font-size:18px}
  #mini{width:80px;height:62px;top:50px;right:8px}
  #prompt{font-size:14px;bottom:76px}
}
</style>
</head>
<body>
<div id="fade"></div>

<!-- CHARACTER SELECT -->
<div id="charSelect" style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.88);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;">

    <div id="pickSteve" style="cursor:pointer;text-align:center;padding:20px;border:3px solid transparent;border-radius:12px;transition:all .2s;">

      <div style="display:none;width:96px;height:160px;background:#4A90E2;margin:0 auto;border-radius:4px;"></div>

      <p style="color:#AAA;font-size:8px;margin-top:4px;">经典像素风</p>

      <div style="display:none;width:96px;height:160px;background:#E24A4A;margin:0 auto;border-radius:4px;"></div>

</div>

<!-- WELCOME -->
<div id="welcome">
  <div class="w-title">🏘️ 欢迎来到<br>村庄学堂！</div>
  <div class="w-hint" id="welcomeHint">用方向键或 D-pad 移动角色<br>走近小屋按 ✕ 进入学习</div>

</div>

<!-- HUD -->
<div id="hud">

  <a href="pet-hub.html" class="h-pet">🐺 宠物</a>
  <a href="collection-hub.html" class="h-pet h-chest" style="position:relative">
    🎁<span class="h-dot" id="hChestDot"></span>
  </a>
</div>

<!-- MINI MAP -->
<div id="mini"><div id="mini-bg"><div id="mini-steve"></div></div></div>

<!-- WORLD -->
<div id="vp"><div id="world"></div></div>

<!-- D-PAD -->
<div id="dpad">
  <div class="dp" id="dpu">▲</div>
  <div class="dp" id="dpl">◀</div>
  <div class="dp" id="dpc">✕</div>
  <div class="dp" id="dpr">▶</div>
  <div class="dp" id="dpd">▼</div>
</div>

<!-- PROMPT -->
<div id="prompt">🏠 走进去看看！按 ✕ 进入</div>

<!-- ZONE PANEL (course list) -->
<div class="panel-overlay" id="panelOv" onclick="closePanel()"></div>
<div class="zone-panel" id="zonePanel">
  <div class="panel-handle"><div class="panel-handle-bar"></div></div>
  <div class="panel-header">
    <span class="panel-icon" id="pIcon">📚</span>
    <span class="panel-title" id="pTitle">课程列表</span>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-desc" id="pDesc"></div>
  <div class="course-list" id="courseList"></div>
</div>

// ─── TREES ───

// ─── FLOWERS ───

var STORAGE_KEY = 'village_state';
var VSTATE = null;

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    VSTATE = raw ? JSON.parse(raw) : {};
  } catch(e) { VSTATE = {}; }
  if (!VSTATE.zones) VSTATE.zones = {};
  if (typeof VSTATE.coins === 'undefined') VSTATE.coins = 0;
  if (typeof VSTATE.totalStars === 'undefined') VSTATE.totalStars = 0;
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(VSTATE)); } catch(e) {}
}

function updateHUD() {
  var stars = VSTATE.totalStars || 0;
  var level = Math.floor(stars / 10) + 1;
  var xpInLevel = stars % 10;
  var xpPct = (xpInLevel / 10) * 100;
  var xpNeed = 10;

  var charLabel = window.selectedChar === 'steve' ? 'Steve' : (window.selectedChar === 'max' ? 'Max' : '');
  document.getElementById('hName').textContent = '🗡️ ' + (charLabel || VSTATE.name || '小勇士');
  document.getElementById('hLv').textContent = 'LV.' + level;
  document.getElementById('hXp').textContent = 'EXP ' + xpInLevel + '/' + xpNeed;
  document.getElementById('hXpFill').style.width = xpPct + '%';
  document.getElementById('hCoins').textContent = VSTATE.coins || 0;

  // Chest dot
  var dot = document.getElementById('hChestDot');
  if (dot) dot.style.display = VSTATE.pendingReward ? 'block' : 'none';
}

    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 90) {
      enter(b);
    } else {
      // Walk towards building then enter
      var targetX = b.ex, targetY = b.ey + 30;
      var walkSteps = Math.ceil(dist / (SPD * 0.016));
      var stepIdx = 0;
      var walkTimer = setInterval(function(){
        if (stepIdx >= walkSteps) {
          clearInterval(walkTimer);
          steve.x = targetX; steve.y = targetY;
          enter(b);
          return;
        }
        var t = stepIdx / walkSteps;
        steve.x = steve.x + (targetX - steve.x) * 0.15;
        steve.y = steve.y + (targetY - steve.y) * 0.15;
        steve.dir = targetX < steve.x ? 'left' : (targetX > steve.x ? 'right' : 'down');
        steve.walk = true;
        stepIdx++;
      }, 30);
    }
  };
  world.append(d);

  // Proximity ring
  var r = el('div','pring','left:'+b.ex+'px;top:'+b.ey+'px');
  r.id='r-'+b.id;
  world.append(r);

(function(){

    if (cs) cs.style.display = 'none';

    setSteveSprite('down', false);
  }

  stevePick.addEventListener('click', function(){ pick('steve'); });
  maxPick.addEventListener('click', function(){ pick('max'); });
})();

function setSteveSprite(dir, walking) {
  var charType = window.selectedChar || 'max';

  if (charType === 'max') {
    // Max sprites
    var action = walking ? 'walk' : 'idle';
    var frames = maxSprites[action] || [];
    var frameIdx = (typeof steve !== 'undefined' && steve.walk && frames.length)
      ? Math.floor(steve.frame / 8) % frames.length
      : 0;
    var maxImg = frames[frameIdx];

    if (maxImg && maxImg.complete && maxImg.naturalWidth > 0) {
      var scaleX = dir === 'left' ? -1 : 1;
      steveEl.innerHTML = '<img src="'+maxImg.src+'" style="width:auto;height:100%;max-width:none;image-rendering:pixelated;display:block;position:absolute;bottom:0;left:50%;transform:translateX(-50%) scaleX('+scaleX+')">';
      return;
    }
  }

  if (charType === 'steve') {
    // Steve GPT sprites
    var steveSrc = walking ? steveWalkSprites[dir] : steveSprites[dir];
    if (steveSrc) {
      var scaleX = dir === 'left' ? -1 : 1;
      steveEl.innerHTML = '<img src="'+steveSrc+'" style="width:auto;height:100%;max-width:none;image-rendering:pixelated;display:block;position:absolute;bottom:0;left:50%;transform:translateX(-50%) scaleX('+scaleX+')">';
      return;
    }
  }

  // Sprite 不可用时暂时不渲染（等 sprite 加载完会自动刷新）
  return;
}
setSteveSprite('down', false);

var steve = {x:690, y:510, dir:'down', walk:false, frame:0};
var cam = {x:0, y:0};
var keys = {};
var dp = {u:false, d:false, l:false, r:false};
var nearBld = null;
var lastDir = 'down';
var lastTime = 0;
var gameStarted = false;
var worldScale = 1;

function updateWorldScale() {
  worldScale = Math.max(1, window.innerWidth / WW, window.innerHeight / WH);
}

function cameraTarget() {
  var viewW = window.innerWidth / worldScale;
  var viewH = window.innerHeight / worldScale;
  return {
    x: Math.max(0, Math.min(Math.max(0, WW - viewW), steve.x - viewW / 2)),
    y: Math.max(0, Math.min(Math.max(0, WH - viewH), steve.y - viewH / 2))
  };
}

function renderWorld() {
  var tx = -Math.round(cam.x * worldScale);
  var ty = -Math.round(cam.y * worldScale);
  world.style.transform = 'matrix(' + worldScale + ',0,0,' + worldScale + ',' + tx + ',' + ty + ')';
}

window.addEventListener('resize', function() {
  updateWorldScale();
  var target = cameraTarget();
  cam.x = target.x;
  cam.y = target.y;
  renderWorld();
});

// Collision
function blocked(nx, ny) {
  var sw=16, sh=8;
  for (var i=0; i<BLDS.length; i++) {
    var b=BLDS[i], m=8;
    if (nx+sw>b.x+m && nx-sw<b.x+b.w-m && ny>b.y+m && ny-sh<b.y+b.h-m) return true;
  }
  for (var k=0; k<TREES.length; k++) {
    var t=TREES[k];
    if (nx+sw>t.x+8 && nx-sw<t.x+44 && ny>t.y+38 && ny-sh<t.y+62) return true;
  }
  return false;
}

// ═══════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════
function loop(ts) {
  if (!gameStarted) { requestAnimationFrame(loop); return; }
  var dt = Math.min((ts - lastTime) / 1000, .05);
  lastTime = ts;

  // INPUT
  var dx=0, dy=0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A'] || dp.l) dx=-1;
  if (keys['ArrowRight']|| keys['d'] || keys['D'] || dp.r) dx= 1;
  if (keys['ArrowUp']   || keys['w'] || keys['W'] || dp.u) dy=-1;
  if (keys['ArrowDown'] || keys['s'] || keys['S'] || dp.d) dy= 1;
  if (dx && dy) { dx*=.707; dy*=.707; }

  steve.walk = !!(dx || dy);

  if (steve.walk) {
    var spd = SPD * dt;
    var nx = Math.max(30, Math.min(WW-30, steve.x + dx*spd));
    var ny = Math.max(60, Math.min(WH-20, steve.y + dy*spd));
    if (!blocked(nx, steve.y)) steve.x = nx;
    if (!blocked(steve.x, ny)) steve.y = ny;
    var newDir = Math.abs(dy) > Math.abs(dx) ? (dy<0?'up':'down') : (dx<0?'left':'right');
    if (newDir !== lastDir) { lastDir = newDir; steve.dir = newDir; }
    steve.frame++;
  } else {
    steve.frame = 0;
  }
  // Force render character if sprite just finished loading
  if (!steveEl.querySelector('img') && window.selectedChar === 'max') {
    var tryFrames = maxSprites.idle || [];
    if (tryFrames.length && tryFrames[0].complete && tryFrames[0].naturalWidth > 0) {
      setSteveSprite(steve.dir || 'down', false);
    }
  }
  // Update sprite every frame for walk animation, or on direction/state change
  var lastFrame = steve._lastFrame || 0;
  if (steve.dir !== steve._lastSpriteDir || steve.walk !== steve._lastSpriteWalk || steve.frame !== lastFrame) {
    setSteveSprite(steve.dir, steve.walk);
    steve._lastSpriteDir = steve.dir;
    steve._lastSpriteWalk = steve.walk;
    steve._lastFrame = steve.frame;
  }

  // CAMERA
  var target = cameraTarget();
  cam.x += (target.x - cam.x) * .13;
  cam.y += (target.y - cam.y) * .13;

  // RENDER
  renderWorld();
  steveEl.style.left = (steve.x - 24) + 'px';
  steveEl.style.top = (steve.y - 84) + 'px';
  steveEl.classList.toggle('walk', steve.walk);

  // Mini-map dot
  var ms = document.getElementById('mini-steve');
  ms.style.left = (steve.x / WW * 100) + '%';
  ms.style.top = (steve.y / WH * 100) + '%';

  // PROXIMITY
  nearBld = null;
  for (var bi=0; bi<BLDS.length; bi++) {
    var b2 = BLDS[bi];
    var dx2 = steve.x - b2.ex, dy2 = steve.y - b2.ey;
    if (Math.sqrt(dx2*dx2 + dy2*dy2) < PROX) { nearBld = b2; break; }
  }
  BLDS.forEach(function(b3){
    var r = document.getElementById('r-'+b3.id);
    if (r) r.style.display = (nearBld && nearBld.id===b3.id) ? 'block' : 'none';
  });
  var prompt = document.getElementById('prompt');
  prompt.style.display = nearBld ? 'block' : 'none';
  if (nearBld) prompt.textContent = nearBld.emoji + ' ' + nearBld.name + ' · 按 ✕ 进入';
  document.getElementById('dpc').classList.toggle('near', !!nearBld);

  // NPCs walking
  npcEls.forEach(function(d){
    var n = d._npc;
    if (!n.speed) return;
    d._t = (d._t||0) + dt;
    var px = d._ox + Math.sin(d._t * (n.speed/50)) * n.range/2;
    d.style.left = px + 'px';

    // Update NPC animation frame based on walk time
    if (n.type && n.type !== 'villager' && npcFrames[n.type]) {
      var fi = Math.floor((d._t * 1000) / 200) % npcFrames[n.type].length;
      var npcImg = npcFrames[n.type][fi];
      if (npcImg && npcImg.complete && npcImg.naturalWidth > 0) {
        var imgEl = d.querySelector('img');
        if (imgEl && imgEl.src !== npcImg.src) {
          imgEl.src = npcImg.src;
        }
      }
    }
  });

  requestAnimationFrame(loop);
}

function enter(b) {
  if (b.href) {

    var fade = document.getElementById('fade');

  el.querySelectorAll('.nbubble').forEach(function(b){ b.remove(); });
  var b = document.createElement('div');
  b.className = 'nbubble'; b.textContent = txt;
  el.appendChild(b);
  setTimeout(function(){ b.remove(); }, 1800);
}

function openPanel(zoneId) {
  var zone = ZONE_CONFIG[zoneId];
  if (!zone) return;

  document.getElementById('pIcon').textContent = zone.icon;
  document.getElementById('pTitle').textContent = zone.name;
  document.getElementById('pDesc').textContent = zone.desc;

  // Build course list from filesystem (via known prefixes)
  var completed = {};
  if (VSTATE.zones && VSTATE.zones[zoneId]) {
    (VSTATE.zones[zoneId].completed || []).forEach(function(f){ completed[f] = true; });
  }

  var listEl = document.getElementById('courseList');
  listEl.innerHTML = '';

  // Generate cards from known meta keys matching the zone
  var count = 0;
  Object.keys(COURSE_META).forEach(function(filename) {
    var match = false;
    if (zone.dir === 'stories/' && filename.indexOf('story-') === 0) match = true;
    else if (zone.dir === 'chinese/' && filename.indexOf('chinese-') === 0) match = true;
    else if (zone.dir === 'english/' && filename.indexOf('english-') === 0) match = true;
    else if (zone.dir === 'math/' && filename.indexOf('math-') === 0) match = true;
    if (!match) return;

    var meta = COURSE_META[filename];
    var isDone = completed[filename];
    var card = document.createElement('div');
    card.className = 'course-card' + (isDone ? ' completed' : '');
    card.innerHTML = '<div class="cc-emoji">'+meta.emoji+'</div>' +
      '<div class="cc-name">'+filename.replace('.html','').replace(/-/g,' ')+'</div>' +
      '<div class="cc-lesson">'+meta.lesson+'</div>' +
      (isDone ? '<div class="cc-stars">⭐</div>' : '');
    card.onclick = function(){
      closePanel();
      var fade = document.getElementById('fade');
      fade.classList.add('in');
      setTimeout(function(){ window.location.href = zone.dir + filename; }, 450);
    };
    listEl.appendChild(card);
    count++;
  });

  if (count === 0) {
    listEl.innerHTML = '<div style="color:#888;font-size:16px;padding:20px;text-align:center;grid-column:1/-1">课程加载中...</div>';
  }

  document.getElementById('panelOv').classList.add('show');
  document.getElementById('zonePanel').classList.add('open');
}

function closePanel() {
  document.getElementById('panelOv').classList.remove('show');
  document.getElementById('zonePanel').classList.remove('open');
}

window.addEventListener('keydown', function(e){
  keys[e.key] = true;
  if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  if ((e.key === 'Enter' || e.key === ' ') && nearBld) enter(nearBld);
  if (e.key === 'Escape') closePanel();
});
window.addEventListener('keyup', function(e){ keys[e.key] = false; });

function dpOn(dir) { dp[dir] = true; }
function dpOff(dir){ dp[dir] = false; }

[['dpu','u'],['dpd','d'],['dpl','l'],['dpr','r']].forEach(function(pair){
  var id=pair[0], dir=pair[1];
  var dpe = document.getElementById(id);
  dpe.addEventListener('pointerdown', function(e){ e.preventDefault(); dpOn(dir); dpe.classList.add('on'); });
  dpe.addEventListener('pointerup', function(){ dpOff(dir); dpe.classList.remove('on'); });
  dpe.addEventListener('pointerleave', function(){ dpOff(dir); dpe.classList.remove('on'); });
});

document.getElementById('dpc').addEventListener('pointerdown', function(e){
  e.preventDefault();
  if (nearBld) enter(nearBld);
});
