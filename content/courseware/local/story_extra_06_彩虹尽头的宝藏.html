<!DOCTYPE html>
<html lang="zh-CN">
<head><link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩虹尽头的宝藏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#0A1628 0%,#1565C0 50%,#0A1628 100%);min-height:100vh;padding:16px;color:#fff}
.container{max-width:480px;margin:0 auto}
.cover{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:24px;padding:32px;text-align:center;box-shadow:0 8px 40px rgba(77,182,172,0.2);margin-bottom:16px;border:1px solid rgba(77,182,172,0.3)}
.cover-title{font-size:28px;font-weight:800;color:#4DD4AC;margin-bottom:8px;text-shadow:0 2px 10px rgba(77,182,172,0.5)}
.cover-subtitle{color:#80DEEA;margin-bottom:20px}
.section{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,0.3);margin-bottom:16px;border:1px solid rgba(255,255,255,0.1)}
.section-title{font-size:18px;font-weight:700;color:#4DD4AC;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.interact-area{background:rgba(77,182,172,0.1);border-radius:12px;padding:20px;text-align:center;margin-bottom:12px;border:2px solid rgba(77,182,172,0.3)}
.btn{background:linear-gradient(135deg,#4DD4AC,#00897B);color:#0A1628;border:none;padding:12px 24px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(77,182,172,0.4)}
.btn-secondary{background:linear-gradient(135deg,#4FC3F7,#0277BD);color:#fff}
.story-text{line-height:1.8;font-size:16px;color:#E0E0E0}
.dialogue{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid #4DD4AC}
.dialogue-name{font-weight:700;color:#4DD4AC;margin-bottom:4px}
.quiz-option{background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;transition:all 0.3s;text-align:left}
.quiz-option:hover{border-color:#4DD4AC;background:rgba(77,182,172,0.1)}
.quiz-option.correct{border-color:#4CAF50;background:rgba(76,175,80,0.2)}
.quiz-option.wrong{border-color:#F44336;background:rgba(244,67,54,0.2)}
.bubble{position:fixed;pointer-events:none;animation:rise 3s ease-in infinite}
@keyframes rise{0%{transform:translateY(100%) scale(1);opacity:0.7}100%{transform:translateY(-100%) scale(0.5);opacity:0}}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.4)}
.story-text.speaking{background:rgba(255,215,0,0.15);animation:pulse 1.2s ease-in-out infinite}
.dialogue{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid #FFD700;cursor:pointer;transition:background 0.2s}
.dialogue:active{background:rgba(255,255,255,0.15)}
.dialogue.speaking{animation:pulse 1.2s ease-in-out infinite;border-left-color:#FFA500}
@media (max-width:360px){
  body{padding:8px}
  .cover{padding:20px 16px;border-radius:18px}
  .cover-title{font-size:22px}
  .section{padding:16px;border-radius:16px}
  .section-title{font-size:16px}
  .story-text{font-size:14px;line-height:1.6}
  .dialogue{padding:10px 12px;font-size:14px}
  .quiz-option{padding:10px;font-size:14px}
  .poem-line{font-size:17px;padding:8px 0}
  .btn{padding:10px 18px;font-size:13px}
  .cover-subtitle{font-size:13px}
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.4)}
  50%{box-shadow:0 0 0 8px rgba(255,215,0,0)}
}
.story-text.speaking{background:rgba(255,215,0,0.15);animation:pulse 1.2s ease-in-out infinite}
.dialogue{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid #FFD700;cursor:pointer;transition:background 0.2s}
.page-section.swipe-active{opacity:1;transform:translateX(0)}


</style>
</head>
<body>
<div class="container">
  <div class="cover">
    <div style="font-size:64px;margin-bottom:12px">🌈</div>
    <h1 class="cover-title">彩虹尽头的宝藏</h1>
    <p class="cover-subtitle">最好的宝藏，一直都在你身边</p>
    <button class="btn" onclick="document.getElementById('content').scrollIntoView()">开始探险</button>
  </div>
  <div id="content"></div>
  <div id="quiz-container"></div>
</div>

<script>
const TEMPLATE_CONFIG = {
  theme: 'ocean',
  title: '彩虹尽头的宝藏',
  subtitle: '最好的宝藏，一直都在你身边',
  colors: {
    primary: '#0A1628',
    secondary: '#1565C0',
    accent: '#4DD4AC',
    text: '#FFFFFF',
    card: 'rgba(255,255,255,0.1)'
  },
  decorations: ['🌈', '🐰', '🐿️', '🍄', '🌟', '💕']
};

class QuizEngine {
  constructor(containerId) {
    this.container = document.getElementById(containerId);
    this.questions = [];
    this.current = 0;
    this.score = 0;
  }
  init(questions) {
    this.questions = questions;
    this.current = 0;
    this.score = 0;
  }
  mount() { this.render(); }
  unmount() { if (this.container) this.container.innerHTML = ''; }
  render() {
    if (!this.container || !this.questions[this.current]) return;
    const q = this.questions[this.current];
    this.container.innerHTML = `
      <div class="section">
        <div class="section-title">🐚 第${this.current + 1}题</div>
        <p style="margin-bottom:16px">${q.question}</p>
        ${q.options.map((opt, i) => `
          <div class="quiz-option" data-index="${i}" onclick="quizEngine.check(${i})">${opt}</div>
        `).join('')}
        <p style="margin-top:12px;color:#80DEEA">得分: ${this.score}/${this.questions.length}</p>
      </div>
    `;
  }
  check(index) {
    const q = this.questions[this.current];
    const options = this.container.querySelectorAll('.quiz-option');
    options.forEach((opt, i) => {
      opt.style.pointerEvents = 'none';
      if (i === q.answer) opt.classList.add('correct');
      else if (i === index && i !== q.answer) opt.classList.add('wrong');
    });
    if (index === q.answer) this.score++;
    setTimeout(() => {
      this.current++;
      if (this.current < this.questions.length) this.render();
      else {
        this.container.innerHTML = `
          <div class="section">
            <div class="section-title">🎉 完成!</div>
            <p>最终得分: ${this.score}/${this.questions.length}</p>
            <p style="margin-top:12px;color:#80DEEA">记住：最好的宝藏，就是分享和友谊！</p>
          </div>
        `;
      }
    }, 1000);
  }
}

class StoryEngine {
  constructor(containerId) {
    this.container = document.getElementById(containerId);
    this.sections = [];
    this.current = 0;
  }
  init(sections) {
    this.sections = sections;
    this.current = 0;
  }
  mount() { this.render(); }
  unmount() { if (this.container) this.container.innerHTML = ''; }
  render() {
    if (!this.container || !this.sections[this.current]) return;
    const s = this.sections[this.current];
    let html = `<div class="section"><div class="section-title">${s.emoji || '📖'} ${s.title}</div>`;
    if (s.type === 'text') {
      html += `<div class="story-text">${s.content}</div>`;
    } else if (s.type === 'dialogue') {
      s.lines.forEach(line => {
        html += `<div class="dialogue"><div class="dialogue-name">${line.name}</div><div>${line.text}</div></div>`;
      });
    } else if (s.type === 'mixed') {
      s.blocks.forEach(block => {
        if (block.type === 'text') {
          html += `<div class="story-text">${block.content}</div>`;
        } else if (block.type === 'dialogue') {
          block.lines.forEach(line => {
            html += `<div class="dialogue"><div class="dialogue-name">${line.name}</div><div>${line.text}</div></div>`;
          });
        }
      });
    }
    if (this.current < this.sections.length - 1) {
      html += `<button class="btn" style="margin-top:16px" onclick="storyEngine.next()">下一页</button>`;
    } else {
      html += `<button class="btn btn-secondary" style="margin-top:16px" onclick="startQuiz()">进入互动问答</button>`;
    }
    html += `</div>`;
    this.container.innerHTML = html;
  }
  next() {
    this.current++;
    if (this.current < this.sections.length) this.render();
  }
}

function startQuiz() {
  document.getElementById('quiz-container').scrollIntoView({ behavior: 'smooth' });
  quizEngine.init([
    {
      question: '朵朵和奇奇在彩虹尽头发现了什么？',
      options: ['一块彩虹形状的石头和一首歌谣', '一堆金币', '一棵大树', '一个山洞'],
      answer: 0
    },
    {
      question: '歌谣里说宝藏藏在哪里？',
      options: ['笑起来的酒窝和帮助朋友的心', '石头下面', '盒子里', '树洞里'],
      answer: 0
    },
    {
      question: '爬山时奇奇滑倒了，朵朵怎么做的？',
      options: ['抓住他的尾巴救了他', '没有管他', '叫别人来帮忙', '自己先跑了'],
      answer: 0
    },
    {
      question: '回家路上，他们做了什么？',
      options: ['把食物分给小蚂蚁，教小刺猬唱歌', '直接回家睡觉', '又去找了一次宝藏', '把歌谣撕掉了'],
      answer: 0
    }
  ]);
  quizEngine.mount();
}

const storyEngine = new StoryEngine('content');
const quizEngine = new QuizEngine('quiz-container');

document.addEventListener('DOMContentLoaded', () => {
  const container = document.querySelector('.container');
  for (let i = 0; i < 15; i++) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '○';
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.animationDelay = Math.random() * 3 + 's';
    bubble.style.fontSize = (Math.random() * 20 + 10) + 'px';
    bubble.style.color = 'rgba(77,182,172,0.5)';
    container.appendChild(bubble);
  }

  storyEngine.init([
    {
      emoji: '🌈',
      title: '雨后的彩虹',
      type: 'mixed',
      blocks: [
        { type: 'text', content: '一个雨后清晨，小兔子朵朵推开木窗，惊喜地喊道："妈妈快看！彩虹！"七彩的拱桥横跨天空，最亮的地方落在了远处蘑菇山后。' },
        { type: 'dialogue', lines: [{ name: '🐰 朵朵', text: '奶奶说过，彩虹尽头藏着宝藏呢！我也要去找宝藏！' }] },
        { type: 'text', content: '她背上小布包，装上胡萝卜饼和水壶。刚出门就遇见小松鼠奇奇。' },
        { type: 'dialogue', lines: [{ name: '🐿️ 奇奇', text: '我也要去！等我拿松果！' }] }
      ]
    },
    {
      emoji: '🏃',
      title: '追逐彩虹',
      type: 'mixed',
      blocks: [
        { type: 'text', content: '彩虹好像在移动，他们追过叮咚小溪，穿过叮当风铃似的狗尾草田。' },
        { type: 'dialogue', lines: [{ name: '🐿️ 奇奇', text: '宝藏会是什么呢？一定是会发光的宝石！' }] },
        { type: 'dialogue', lines: [{ name: '🐰 朵朵', text: '也许是比宝石更特别的东西？' }] }
      ]
    },
    {
      emoji: '⛰️',
      title: '互助爬山',
      type: 'mixed',
      blocks: [
        { type: 'text', content: '追到蘑菇山脚，彩虹落在了陡坡上。奇奇哧溜爬上岩石，突然脚一滑——' },
        { type: 'dialogue', lines: [{ name: '🐿️ 奇奇', text: '哎呀！' }] },
        { type: 'text', content: '朵朵赶紧抓住他的尾巴，两人跌坐在草地上，互相看着哈哈大笑。' },
        { type: 'text', content: '这次他们互相帮助：朵朵用长耳朵当绳索，奇奇用爪子刨台阶。爬啊爬，终于到了山顶！' }
      ]
    },
    {
      emoji: '📜',
      title: '彩虹歌谣',
      type: 'mixed',
      blocks: [
        { type: 'text', content: '森林地面铺满彩虹色的落叶。他们发现一块彩虹形状的透明石头，石板下压着羊皮纸卷。' },
        { type: 'text', content: '朵朵小心地打开，上面写着歌谣：' },
        { type: 'dialogue', lines: [{ name: '📜 歌谣', text: '亲爱的小小探险家：宝藏不在石下不在盒，它藏在你笑起来的酒窝，在你为朋友擦干眼泪的手，在你把最后一块饼干分一半的勇气里。' }] }
      ]
    },
    {
      emoji: '💕',
      title: '真正的宝藏',
      type: 'mixed',
      blocks: [
        { type: 'dialogue', lines: [{ name: '🐿️ 奇奇', text: '没有宝石呀……' }] },
        { type: 'dialogue', lines: [{ name: '🐰 朵朵', text: '今天我好开心，这是不是宝藏？你拉住我的时候，我也觉得心里暖暖的！' }] },
        { type: 'text', content: '彩虹光晕里，他们看见彼此笑容比宝石还亮。' },
        { type: 'text', content: '回家路上，他们把胡萝卜饼分给迷路的小蚂蚁，教小刺猬唱彩虹歌谣。' },
        { type: 'dialogue', lines: [{ name: '🐰 朵朵', text: '我们找到宝藏啦！就在这里呀，' }]},
        { type: 'text', content: '朵朵指指自己的心，又指指牵着的手。' }
      ]
    },
    {
      emoji: '🌟',
      title: '晚安，宝藏',
      type: 'mixed',
      blocks: [
        { type: 'text', content: '那天晚上，朵朵在日记本上画了一道彩虹，彩虹这头写着"分享"，那头写着"友谊"。' },
        { type: 'text', content: '窗外星星眨眼，仿佛在说："是呀，最好的宝藏呀，一直都在你身边呢。"' },
        { type: 'dialogue', lines: [{ name: '📖 寓意', text: '通过寻找外在宝藏，最终发现内在品质的可贵。最好的宝藏，就是分享和友谊。' }] }
      ]
    }
  ]);
  storyEngine.mount();
});
function launchConfetti() {
  let box = document.querySelector('.confetti-container');
  if (!box) {
    box = document.createElement('div');
    box.className = 'confetti-container';
    document.body.appendChild(box);
  }
  }
const Speech = {
  _speaking: false,
  detectLang(text) {
    const cjk = /[\u4e00-\u9fff\u3400-\u4dbf]/;
    const latin = /[a-zA-Z]/;
    let cn = 0, en = 0;
    for (let i = 0; i < text.length; i++) {
      if (cjk.test(text[i])) cn++;
      else if (latin.test(text[i])) en++;
    }
    return cn > en ? 'zh-CN' : 'en-US';
  },
  speak(text, lang) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    if (!text || !text.trim()) return;
    const u = new SpeechSynthesisUtterance(text.trim());
    u.lang = lang || this.detectLang(text);
    u.rate = 0.9;
    u.pitch = 1.05;
    this._speaking = true;
    u.onend = () => { this._speaking = false; };
    u.onerror = () => { this._speaking = false; };
    window.speechSynthesis.speak(u);
  },
  stop() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    this._speaking = false;
  }
};

function initSwipe() {
  contentEl.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  contentEl.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
    const sections = getSections();
    if (sections.length < 2) return;
    if (dx < 0 && currentPage < sections.length - 1) {
      swipePage(currentPage, currentPage + 1);
    } else if (dx > 0 && currentPage > 0) {
      swipePage(currentPage, currentPage - 1);
    }
  }, { passive: true });
}

</script>
</body>
</html>
