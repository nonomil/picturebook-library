<script>
// ====== SPEECH INIT (fix Chrome silent TTS) ======
(function initSpeech(){

    window.speechSynthesis.getVoices();

// ====== PAGE DATA ======
const pages = [
  { cover:true, title:'Twinkle Twinkle Little Star', subtitle:'✦ 一首关于星星的英语儿歌 ✦' },
  { sentence:'<span class="hl" data-word="Twinkle">Twinkle</span>, <span class="hl" data-word="twinkle">twinkle</span>,<br><span class="hl" data-word="little">little</span> <span class="hl" data-word="star">star</span>', desc:'— 一闪一闪小星星 —', game:'twinkle', svg:'star1', words:['star:星星','sky:天空'] },
  { sentence:'<span class="hl" data-word="How">How</span> <span class="hl" data-word="I">I</span> <span class="hl" data-word="wonder">wonder</span><br><span class="hl" data-word="what">what</span> <span class="hl" data-word="you">you</span> <span class="hl" data-word="are">are</span>', desc:'— 我真想知道你是什么 —', game:'wonder', svg:'star2' },
  { sentence:'<span class="hl" data-word="Up">Up</span> <span class="hl" data-word="above">above</span> <span class="hl" data-word="the">the</span> <span class="hl" data-word="world">world</span><br><span class="hl" data-word="so">so</span> <span class="hl" data-word="high">high</span>', desc:'— 在世界上方那么高 —', game:'high', svg:'star3', words:['world:世界','diamond:钻石'] },
  { sentence:'<span class="hl" data-word="Like">Like</span> <span class="hl" data-word="a">a</span> <span class="hl" data-word="diamond">diamond</span><br><span class="hl" data-word="in">in</span> <span class="hl" data-word="the">the</span> <span class="hl" data-word="sky">sky</span>', desc:'— 像天空中的钻石 —', game:'diamond', svg:'diamond', words:['twinkle:闪烁','wonder:好奇'] },
  { sentence:'<span class="hl" data-word="Twinkle">Twinkle</span>, <span class="hl" data-word="twinkle">twinkle</span>,<br><span class="hl" data-word="little">little</span> <span class="hl" data-word="star">star</span>', desc:'— 一闪一闪小星星（重复）—', game:'little', svg:'star5' },
  { sentence:'<span class="hl" data-word="How">How</span> <span class="hl" data-word="I">I</span> <span class="hl" data-word="wonder">wonder</span><br><span class="hl" data-word="what">what</span> <span class="hl" data-word="you">you</span> <span class="hl" data-word="are">are</span>', desc:'— 我真想知道你是什么（重复）—', game:'star', svg:'star6', words:['traveller:旅行者','dark:黑暗'] },
  { quiz:true, title:'✨ 知识小问答' },
  { starfind:true, title:'🔭 找星星游戏' },
  { final:true, title:'🎉 太棒了!' }
];

let currentPage = 0;
let gameDone = new Array(pages.length).fill(false);
let buildingWord = [];
let dragData = null;

// ====== WEB AUDIO API ======
const NOTE = { C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88, C5:523.25 };
const TWINKLE_MELODY = [
  [NOTE.C4,0.4],[NOTE.C4,0.4],[NOTE.G4,0.4],[NOTE.G4,0.4],[NOTE.A4,0.4],[NOTE.A4,0.4],[NOTE.G4,0.8],
  [NOTE.F4,0.4],[NOTE.F4,0.4],[NOTE.E4,0.4],[NOTE.E4,0.4],[NOTE.D4,0.4],[NOTE.D4,0.4],[NOTE.C4,0.8],
  [NOTE.G4,0.4],[NOTE.G4,0.4],[NOTE.F4,0.4],[NOTE.F4,0.4],[NOTE.E4,0.4],[NOTE.E4,0.4],[NOTE.D4,0.8],
  [NOTE.G4,0.4],[NOTE.G4,0.4],[NOTE.F4,0.4],[NOTE.F4,0.4],[NOTE.E4,0.4],[NOTE.E4,0.4],[NOTE.D4,0.8],
  [NOTE.C4,0.4],[NOTE.C4,0.4],[NOTE.G4,0.4],[NOTE.G4,0.4],[NOTE.A4,0.4],[NOTE.A4,0.4],[NOTE.G4,0.8],
  [NOTE.F4,0.4],[NOTE.F4,0.4],[NOTE.E4,0.4],[NOTE.E4,0.4],[NOTE.D4,0.4],[NOTE.D4,0.4],[NOTE.C4,0.8]
];

function playMelody(notes) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let t = ctx.currentTime;
  notes.forEach(function(n) {
    const [freq, dur] = n;
    if(freq > 0) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'triangle';
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.start(t); osc.stop(t + dur);
      t += dur + 0.05;
    }
  });
}

// ===== PLAY FULL SONG MP3 =====
var songAudio = null;
function playSong() {

}

  if(idx===0) return svgCoverScene();

  if(p.final) return svgCompletionScene();
  const s=p.svg||'star1';

}

// ====== WORD GAME ======
function startWordGame(idx,word) {
  if(gameDone[idx]) return '<div class="word-game" style="background:#E8F5E9"><h3>✅ 完成！</h3></div>';
  const letters=[...word].sort(()=>Math.random()-0.5);
  buildingWord=[];
  gameDone[idx]=false;
  return '<div class="word-game">'+
    '<h3>⚙️ 拼单词: <strong>"'+word+'"</strong> 🔊</h3>'+
    '<div class="word-slots" id="ws-'+idx+'" ondragover="onDragOver(event,'+idx+')" ondrop="onDrop(event,'+idx+')" ondragleave="onDragLeave(event,'+idx+')">'+
    word.split('').map(function(_,i){return '<div class="word-slot" id="slot-'+idx+'-'+i+'"></div>';}).join('')+
    '</div>'+
    '<div class="letter-tiles">'+
    letters.map(function(l){return '<div class="letter-tile" draggable="true" ondragstart="onDragStart(event,'+idx+',\''+l+'\')" ondragend="onDragEnd(event)" onclick="pickLetter('+idx+',\''+l+'\',this)">'+l+'</div>';}).join('')+
    '</div>'+
  '</div>';
}

function pickLetter(idx,letter,el) {
  if(gameDone[idx]||el.classList.contains('used')) return;
  const p=pages[idx]; const word=p.game; const slot=buildingWord.length;
  if(slot>=word.length) return;
  const slots=document.querySelectorAll('#ws-'+idx+' .word-slot');
  if(letter===word[slot]){
    buildingWord.push(letter); slots[slot].textContent=letter; slots[slot].classList.add('filled');
    el.classList.add('correct','used');
    if(buildingWord.length===word.length){gameDone[idx]=true;setTimeout(function(){showBubble('🎉 Great!');launchConfetti();renderPage(idx);},500);}
  } else { el.classList.add('wrong'); setTimeout(function(){el.classList.remove('wrong');},400); }
}

function onDragStart(e,idx,letter){dragData={idx:idx,letter:letter,el:e.target};e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function onDragEnd(e){e.target.classList.remove('dragging');document.querySelectorAll('.word-slot.drag-over').forEach(function(s){s.classList.remove('drag-over');});}
function onDragOver(e,idx){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('#ws-'+idx+' .word-slot:not(.filled)').forEach(function(s){s.classList.add('drag-over');});}
function onDragLeave(e,idx){document.querySelectorAll('#ws-'+idx+' .word-slot').forEach(function(s){s.classList.remove('drag-over');});}
function onDrop(e,idx){
  e.preventDefault();document.querySelectorAll('#ws-'+idx+' .word-slot').forEach(function(s){s.classList.remove('drag-over');});
  if(!dragData||dragData.idx!==idx||gameDone[idx]) return;
  pickLetter(idx,dragData.letter,dragData.el);dragData=null;
}

  {q:'星星为什么晚上才看到？',options:['它们晚上才出来','白天太阳光太强','它们在睡觉'],correct:1},
  {q:'北斗七星有多少颗星？',options:['5颗','7颗','9颗'],correct:1}
];
let quizIdx = 0;
let quizAnswered = false;

function initQuiz(){
  quizIdx = 0;
  quizAnswered = false;
  showQuizQuestion();
}

function showQuizQuestion(){
  if(quizIdx>=quizData.length){
    document.getElementById('q-text').textContent = '🎉 全部答对！你真是小天文家！';
    document.getElementById('q-options').innerHTML = '';
    document.getElementById('q-feedback').textContent = '✅ 知识问答完成!';
    return;
  }
  const q = quizData[quizIdx];
  document.getElementById('q-text').textContent = 'Q'+(quizIdx+1)+': '+q.q;
  const optContainer = document.getElementById('q-options');
  optContainer.innerHTML = '';
  document.getElementById('q-feedback').textContent = '';
  quizAnswered = false;
  q.options.forEach(function(opt,idx){
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:2px;';
    const btn = document.createElement('button');
    btn.className = 'quiz-btn';
    btn.textContent = opt;
    btn.addEventListener('click',function(){
      if(quizAnswered) return;
      quizAnswered = true;
      if(idx===q.correct){
        this.classList.add('correct');
        document.getElementById('q-feedback').textContent = '✅ 正确! '+(idx===0?'星星内部发生核聚变反应发光发热。':'');
        setTimeout(function(){quizIdx++;showQuizQuestion();},1500);
      }else{
        this.classList.add('wrong');
        document.getElementById('q-feedback').textContent = '❌ 再想想哦!';
        setTimeout(function(){this.classList.remove('wrong');quizAnswered = false;}.bind(this),800);
      }
    });
    wrapper.appendChild(btn);
    var speakBtn = document.createElement('span');
    speakBtn.className = 'quiz-opt-speak';
    speakBtn.textContent = '🔊';
    speakBtn.title = '朗读选项';
    speakBtn?.addEventListener('click',function(e){
      e.stopPropagation();
      speakText(opt);
      showBubble('🔊 '+opt);
    });
    wrapper.appendChild(speakBtn);
    optContainer.appendChild(wrapper);
  });
}

// ====== STAR FIND GAME ======
let starsFound = 0;
let starFindCompleted = false;

function initStarFind(){
  starsFound = 0;
  starFindCompleted = false;
  document.getElementById('star-found-count').textContent = '0';
  document.getElementById('star-find-msg').textContent = '';
  document.querySelectorAll('.clickable-star').forEach(function(s){
    s.classList.remove('found');
    s.setAttribute('fill','#FFD700');
    s.style.pointerEvents = 'auto';
    s.style.opacity = '1';
    s.style.filter = 'drop-shadow(0 0 4px #FFD700)';
  });
  showBubble('🔭 在夜空中找到3颗星星吧！');
}

function setupStarFind() {
  var svg = document.getElementById('star-find-svg');
  if(!svg) return;
  svg.addEventListener('click',function(e){
    if(starFindCompleted) return;
    var target = e.target;
    if(target.classList.contains('clickable-star') && !target.classList.contains('found')){
      target.classList.add('found');
      target.setAttribute('fill','#FFEB3B');
      target.style.pointerEvents = 'none';
      target.style.filter = 'drop-shadow(0 0 10px #FFD700)';
      var origR = target.getAttribute('r');
      target.setAttribute('r', parseFloat(origR)*2.5);
      setTimeout(function(){target.setAttribute('r', origR);},300);
      starsFound++;
      document.getElementById('star-found-count').textContent = starsFound;
      var msgs = ['✨ You found a star! ⭐','🌟 好棒！又找到一颗！','🎉 太厉害了！'];
      showBubble(msgs[starsFound-1]);
      speakText('You found a star');
      if(starsFound>=3){
        starFindCompleted = true;
        setTimeout(function(){
          document.getElementById('star-find-msg').textContent = '🎉 太棒了！你找到了3颗星星！Twinkle Twinkle~ ⭐';
          showBubble('🎉 恭喜通关！Twinkle Twinkle Little Star ⭐');
          speakText('Twinkle Twinkle Little Star');
        },600);
      }
    }
  });
}

// ====== COMPLETION ======
function initCompletion(){
  var grid = document.getElementById('star-grid');
  if(!grid) return;
  grid.innerHTML = '';
  for(var i=0;i<15;i++){
    var cell = document.createElement('div');
    cell.className = 'final-star-cell';
    cell.textContent = '☆';
    cell.addEventListener('click',function(){
      this.classList.toggle('lit');
      this.textContent = this.classList.contains('lit')?'★':'☆';
    });
    grid.appendChild(cell);
  }

}

function launchConfetti() {
  var d=document.createElement('div');d.className='celebration';
  var colors=['#FF6B6B','#FFB347','#4ECDC4','#FFE66D','#A78BFA','#FF9FF3'];
  for(var i=0;i<40;i++){var c=document.createElement('div');c.style.cssText='position:absolute;width:'+(6+Math.random()*8)+'px;height:'+(6+Math.random()*8)+'px;border-radius:50%;left:'+(Math.random()*100)+'%;top:10%;background:'+colors[i%colors.length]+';animation:confetti-fall '+(1.5+Math.random())+'s ease-out forwards;animation-delay:'+(Math.random()*0.5)+'s;';d.appendChild(c);}
  document.body.appendChild(d);setTimeout(function(){d.remove()},3000);
}

function renderPage(idx) {
  var area=document.getElementById('pageArea');
  var p=pages[idx];

  if(p.cover){
    area.innerHTML='<div class="page active cover-page">'+
      '<div class="cover-svg">'+getSVG(0)+'</div>'+
      '<div class="page-title">'+p.title+'</div>'+
      '<div class="page-desc">'+p.subtitle+'</div>'+
      '<div style="display:flex;gap:16px;justify-content:center;align-items:center;margin-top:4px">'+
        '<button class="big-start-btn smaller" onclick="playSong();showMusicNotes()" style="width:90px;height:90px;font-size:28px;animation:float 2s ease-in-out infinite">🎵</button>'+
        '<button class="big-start-btn" onclick="nextPage()">▶</button>'+
      '</div>'+
    '</div>';
    updateUI(idx); return;
  }

  if(p.final){
    area.innerHTML='<div class="page active">'+
      '<div class="completion-title">'+p.title+'</div>'+
      '<div class="completion-sub">你已经完成了 Twinkle Twinkle Little Star 的学习!</div>'+
      '<div class="scene-wrap" style="position:relative;max-width:340px">'+getSVG(idx)+'</div>'+
      '<div class="star-final-grid" id="star-grid"></div>'+
      '<button class="final-replay-btn" onclick="goToPage(0)">↺ 重新学习</button>'+
      '<a class="home-link" href="../village.html">🏠 回课件列表</a>'+
    '</div>';
    initCompletion(); updateUI(idx); return;
  }

  if(p.quiz){
    area.innerHTML='<div class="page active">'+
      '<div class="page-title">'+p.title+'</div>'+
      '<p style="text-align:center;font-size:.95rem;color:#8D6E63;margin-bottom:5px">关于星星的小知识，选一选 !</p>'+
      '<div class="scene-wrap" style="position:relative;max-width:320px">'+getSVG(idx)+'</div>'+
      '<div class="quiz-area" id="quiz-area">'+
        '<div class="quiz-question" id="q-text">Q1: 星星为什么会发光？</div>'+
        '<div class="quiz-options" id="q-options"></div>'+
        '<div class="quiz-feedback" id="q-feedback"></div>'+
      '</div>'+
    '</div>';
    initQuiz(); updateUI(idx); return;
  }

  if(p.starfind){
    area.innerHTML='<div class="page active">'+
      '<div class="page-title">'+p.title+'</div>'+
      '<p style="text-align:center;font-size:.95rem;color:#8D6E63;margin-bottom:3px">点击夜空中的星星 🌟 找到全部 <strong>3</strong> 颗!</p>'+
      '<div class="star-find-count">已找到: <span id="star-found-count">0</span> / 3</div>'+
      '<div class="scene-wrap star-find-area" id="star-find-scene">'+
        '<svg viewBox="0 0 380 230" id="star-find-svg">'+
          svgStarFindScene().replace('<svg viewBox="0 0 380 230">','').replace('</svg>','')+
        '</svg>'+
      '</div>'+
      '<div class="star-find-msg" id="star-find-msg"></div>'+
    '</div>';
    initStarFind(); updateUI(idx);
    setTimeout(setupStarFind,100); return;
  }

  // Default: lyric page with scene + sentence + game
  var gameHTML='', vb='';
  if(p.game){
    gameHTML=startWordGame(idx,p.game);
    buildingWord=[];
  }
  if(p.words){vb=renderVocabRow(p);}

  area.innerHTML='<div class="page active">'+
    '<div class="scene-wrap" style="position:relative">'+getSVG(idx)+'</div>'+
    '<div class="lyrics">'+p.sentence+'</div>'+
    (p.desc?'<div class="page-desc">'+p.desc+'</div>':'')+
    vb+gameHTML+
  '</div>';

  // Make clickable words speak
  area.querySelectorAll('.hl[data-word]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      speakText(this.getAttribute('data-word'));
      showBubble('🔊 '+this.getAttribute('data-word'));
    });
  });

  updateUI(idx);
}

function updateUI(idx) {
  var dots=document.getElementById('progressDots');
  dots.innerHTML=pages.map(function(_,i){return '<div class="dot '+(i===idx?'active':'')+(gameDone[i]?' done':'')+'" onclick="goToPage('+i+')"></div>';}).join('');
  document.getElementById('prevBtn').disabled=idx===0;
  document.getElementById('nextBtn').disabled=idx===pages.length-1;
  document.getElementById('pageCounter').textContent='第'+(idx+1)+'页 / 共'+pages.length+'页';
  document.getElementById('nextBtn').style.display=idx===pages.length-1?'none':'';
  currentPage=idx;
}

function prevPage(){if(currentPage>0)goToPage(currentPage-1);}
function nextPage(){if(currentPage<pages.length-1)goToPage(currentPage+1);}
function goToPage(idx){renderPage(idx);}

function speakPage() {
  var p=pages[currentPage];
  if(p.cover) { showBubble('Twinkle Twinkle Little Star! ⭐'); speakText('Twinkle Twinkle Little Star'); return; }
  if(p.final) { showBubble('You did it! Wonderful! 🌟'); speakText('Great job!'); return; }
  if(p.quiz) { showBubble('Star Quiz! Let us learn about stars! 🌟'); speakText('Star quiz!'); return; }
  if(p.starfind) { showBubble('Find the stars in the sky!'); speakText('Find the stars in the sky!'); return; }
  var txt=p.sentence.replace(/<[^>]+>/g,'');
  showBubble('🔊 '+txt);
  speakText(txt);
}

// ====== KEYBOARD ======
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft') prevPage();
  if(e.key==='ArrowRight') nextPage();
});

// ====== INIT ======
renderPage(0);

<script>
(function(){
  var sx = 0, sy = 0, swiping = false;
  document.addEventListener('touchstart', function(e) {
    var t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; swiping = true;
  }, {passive:true});
  document.addEventListener('touchmove', function(e) {
    if (!swiping) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiping = false;
      // Find and click the appropriate nav button
      if (dx < 0) {
        // Swipe left → next
        var n = document.querySelector('[onclick*="next"], [onclick*="Next"], .nav-btn:last-of-type:not([disabled]), a[href*="next"], [class*="next"], #nextBtn');
        if (n) n.click();
        else { var a = document.querySelector('a[href]:not([href*="#"])'); if (a && !a.href.includes("#")) a.click(); }
      } else {
        // Swipe right → prev
        var p = document.querySelector('[onclick*="prev"], [onclick*="Prev"], .nav-btn:first-of-type:not([disabled]), [class*="prev"], #prevBtn');
        if (p) p.click();
      }
    }
  }, {passive:true});
  document.addEventListener('touchend', function() { swiping = false; }, {passive:true});
})();
</script>

<!-- ═══ Speak Page - MP3优先, TTS后备 ═══ -->
<script>
(function(){
  var btn = document.getElementById('speakBtn') || document.querySelector('.speak-btn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'speakBtn'; btn.className = 'speak-btn'; btn.title = '朗读本页';
    btn.textContent = '🔊';
    btn.style.cssText = 'position:fixed;bottom:90px;right:16px;z-index:9999;width:48px;height:48px;border-radius:50%;border:2px solid #42A5F5;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(66,165,245,.3);display:flex;align-items:center;justify-content:center';
    document.body.appendChild(btn);
  }
  var sp = false, audioEl = null;
  var courseName = (window.COURSE_NAME || (window.location.pathname.match(/\/(\w[\w-]*)\.html/) || [,''])[1] || '');
  var lang = (document.documentElement.lang || 'en-US').indexOf('zh')>=0?'zh-CN':'en-US';

  function getPageIdx(){
    var a=document.querySelector('.page.active,.slide.active');
    return a?Array.prototype.indexOf.call(a.parentNode.children,a):-1;
  }

  function speakPage(){
    if(sp){stopPage();return;}
    var idx=getPageIdx(); if(idx<0) return;
    var mp3='../audio/'+courseName+'/page-'+(idx+1)+'.mp3';
    if(audioEl){audioEl.pause();audioEl=null;}
    audioEl=new Audio(mp3);
    audioEl.onerror=function(){
      var flat=new Audio('../audio/'+courseName+'.mp3');
      flat.onerror=function(){speakTTS();};
      flat.oncanplaythrough=function(){
        if(audioEl)audioEl.pause(); audioEl=flat;
        audioEl.play().catch(function(){speakTTS();});
        btn.textContent='⏹';btn.classList.add('speaking');
      };
      flat.load();
    };
    audioEl.oncanplaythrough=function(){
      audioEl.play(); btn.textContent='⏹';btn.classList.add('speaking');
      sp=true; audioEl.onended=function(){stopPage();};
    };
    audioEl.load();
  }

  function speakTTS(){
    if(!window.speechSynthesis)return;
    var a=document.querySelector('.page.active,.slide.active');
    if(!a)return;
    var t=(a.innerText||a.textContent||'').replace(/\s+/g,' ').trim();
    if(!t||t.length<2)return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang=lang;u.rate=0.85;
    u.onstart=function(){sp=true;btn.classList.add('speaking');btn.textContent='⏹';};
    u.onend=u.onerror=function(){stopPage();};
    window.speechSynthesis.speak(u);
  }

  function stopPage(){
    if(audioEl){audioEl.pause();audioEl=null;}
    if(window.speechSynthesis)window.speechSynthesis.cancel();
    sp=false;btn.classList.remove('speaking');btn.textContent='🔊';
  }

  btn.addEventListener('click',function(e){e.stopPropagation();speakPage();});
  if(btn.textContent.trim()===''||btn.textContent.trim()==='▶')btn.textContent='🔊';
})();
