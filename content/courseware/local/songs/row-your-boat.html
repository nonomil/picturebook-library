const NOTE = {

};
function playMelody(notes) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let t = ctx.currentTime;
  notes.forEach(function(n) {
    const [freq, dur] = n;
    if(freq > 0) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'triangle';
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.start(t); osc.stop(t + dur);
      t += dur + 0.05;
    }
  });
}
// Row Row Row Your Boat melody (simplified)

var songAudio = null;
function playSong() {
  if(songAudio) { songAudio.pause(); songAudio.currentTime = 0; }

function showMusicNotes() {
  const scene=document.querySelector('.scene-wrap'); if(!scene) return;
  const notes=['♪','♫','♩','♬'];
  for(let i=0;i<8;i++){const n=document.createElement('div');n.textContent=notes[i%notes.length];n.style.cssText='position:absolute;font-size:'+(14+Math.random()*18)+'px;color:#42A5F5;opacity:0;pointer-events:none;z-index:10;left:'+(Math.random()*80+10)+'%;top:'+(Math.random()*50+10)+'%;animation:noteFloat '+(1+Math.random())+'s ease-out forwards;animation-delay:'+(i*0.15)+'s;';scene.appendChild(n);setTimeout(function(e){e.remove()},3000,n);}
}

function showBubble(text) {
  const b=document.getElementById('speechBubble');b.textContent=text;b.classList.add('show');

function getSVG(idx) {
  if(idx===0) return svgCoverScene();
  const p=pages[idx];
  if(p.final) return svgFinalScene();
  const s=p.svg||'row';
  if(s==='row') return svgRowScene();
  if(s==='dream') return svgDreamScene();
  if(s==='stream') return svgStreamScene();
  if(s==='merrily') return svgMerrilyScene();
  return svgRowScene();
}

// ====== VOCAB ROW ======
function renderVocabRow(p){var words=p.words;var btns=words.map(function(w){var parts=w.split(':');var en=parts[0],zh=parts[1];return '<button class="vocab-btn" data-word="'+en+'" onclick="speakWord(this.dataset.word)"><span class="spkr">🔊</span> <span class="en">'+en+'</span> <span class="zh">'+zh+'</span></button>';}).join('');return '<div class="vocab-row">'+btns+'</div>';}
function speakWord(w){speakText(w);showBubble('🔊 '+w);}

// ====== GAME LOGIC ======
function startWordGame(idx,word) {
  if(gameDone[idx]) return '<div class="word-game" style="background:#C8E6C9"><h3>✅ 完成！</h3></div>';
  const letters=[...word].sort(()=>Math.random()-0.5);
  buildingWord=[];
  gameDone[idx]=false;
  var slotsHtml = word.split('').map((_,i)=>'<div class="word-slot" id="slot-'+idx+'-'+i+'"></div>').join('');
  var tilesHtml = letters.map(function(l){
    var letter = l;
    var escapedLetter = letter.replace(/'/g, "&#39;");
    return '<div class="letter-tile" draggable="true" data-idx="'+idx+'" data-letter="'+escapedLetter+'" ondragstart="tileDragStart(event)" ondragend="tileDragEnd(event)" onclick="tileClick(event,this)">'+letter+'</div>';
  }).join('');
  return '<div class="word-game"><h3>⚙️ 拼单词: <strong>"'+word+'"</strong> 🔊</h3><div class="word-slots" id="ws-'+idx+'" ondragover="tileDragOver(event,'+idx+')" ondrop="tileDrop(event,'+idx+')" ondragleave="tileDragLeave(event,'+idx+')">'+slotsHtml+'</div><div class="letter-tiles">'+tilesHtml+'</div></div>';
}

function pickLetter(idx,letter,el) {
  if(gameDone[idx]||el.classList.contains('used')) return;
  const p=pages[idx]; const word=p.game; const slot=buildingWord.length;
  if(slot>=word.length) return;
  const slots=document.querySelectorAll('#ws-'+idx+' .word-slot');
  if(letter===word[slot]){
    buildingWord.push(letter); slots[slot].textContent=letter; slots[slot].classList.add('filled');
    el.classList.add('correct','used');
    if(buildingWord.length===word.length){gameDone[idx]=true;setTimeout(()=>{showBubble('Great! 🎉');launchConfetti();renderPage(idx);},500);}
  } else { el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),400); }
}

function tileClick(event,el) {
  if(el.classList.contains('used')) return;
  var idx = parseInt(el.getAttribute('data-idx'));
  var letter = el.getAttribute('data-letter');
  pickLetter(idx, letter, el);
}

function tileDragStart(event) {
  dragData = { el: event.target };
  event.target.classList.add('dragging');
  event.dataTransfer.setData('text/plain', event.target.getAttribute('data-letter'));
  event.dataTransfer.effectAllowed = 'move';
}

function tileDragEnd(event) {
  event.target.classList.remove('dragging');
  document.querySelectorAll('.word-slot.drag-over').forEach(function(s){s.classList.remove('drag-over');});
}

function tileDragOver(event, idx) {
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('#ws-'+idx+' .word-slot:not(.filled)').forEach(function(s){s.classList.add('drag-over');});
}

function tileDragLeave(event, idx) {
  document.querySelectorAll('#ws-'+idx+' .word-slot').forEach(function(s){s.classList.remove('drag-over');});
}

function tileDrop(event, idx) {
  event.preventDefault();
  document.querySelectorAll('#ws-'+idx+' .word-slot').forEach(function(s){s.classList.remove('drag-over');});
  if(!dragData || gameDone[idx]) return;
  var letter = event.dataTransfer.getData('text/plain');
  pickLetter(idx, letter, dragData.el);
  dragData = null;
}

// ====== RENDER ======
function renderPage(idx) {
  const area=document.getElementById('pageArea');
  const p=pages[idx];

  if(p.cover){
    area.innerHTML=`<div class="page active cover-page">
      <div class="cover-svg">${getSVG(0)}</div>
      <div class="page-title">${p.title}</div>
      <div class="page-desc">${p.subtitle}</div>
      <div style="display:flex;gap:16px;justify-content:center;align-items:center;margin-top:4px">
        <button class="big-start-btn" onclick="playSong();showMusicNotes()" style="width:90px;height:90px;font-size:28px;animation:float 2s ease-in-out infinite">🎵</button>
        <button class="big-start-btn green" onclick="nextPage()">▶</button>
      </div>
    </div>`;
    updateUI(idx); return;
  }

  if(p.final){
    area.innerHTML=`<div class="page active">
      <div class="page-title">${p.title}</div>
      <div class="scene-wrap" style="position:relative">${getSVG(idx)}</div>
      <div class="final-grid">
        <div class="final-word"><div class="emoji">🚣</div><div class="label">Row</div></div>
        <div class="final-word"><div class="emoji">⛵</div><div class="label">Boat</div></div>
        <div class="final-word"><div class="emoji">🏞️</div><div class="label">Stream</div></div>
        <div class="final-word"><div class="emoji">😊</div><div class="label">Merrily</div></div>
        <div class="final-word"><div class="emoji">💭</div><div class="label">Dream</div></div>
      </div>
      <div style="font-size:24px;margin:10px 0">🎉 ⭐ ⭐ ⭐ 🎉</div>
      <a class="home-link" href="../village.html">🏠 回课件列表</a>
    </div>`;
    launchConfetti(); updateUI(idx); return;
  }

  let gameHTML='',vb='';
  if(p.game){
    gameHTML=startWordGame(idx,p.game);
    buildingWord=[];
  }
  if(p.words){vb=renderVocabRow(p);}

  area.innerHTML=`<div class="page active">
    <div class="scene-wrap" style="position:relative">${getSVG(idx)}</div>
    <div class="lyrics">${p.sentence}</div>
    ${vb}${gameHTML}
  </div>`;

  // Make clickable words speak
  area.querySelectorAll('.hl[data-word]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      speakText(this.getAttribute('data-word'));
      showBubble('🔊 '+this.getAttribute('data-word'));
    });
  });

  updateUI(idx);
}

function updateUI(idx) {
  const dots=document.getElementById('progressDots');
  dots.innerHTML=pages.map((_,i)=>'<div class="dot '+(i===idx?'active':'')+(gameDone[i]?' done':'')+'" onclick="goToPage('+i+')"></div>').join('');
  document.getElementById('prevBtn').disabled=idx===0;
  document.getElementById('nextBtn').disabled=idx===pages.length-1;
  document.getElementById('pageCounter').textContent='第'+(idx+1)+'页 / 共'+pages.length+'页';
  document.getElementById('nextBtn').style.display=idx===pages.length-1?'none':'';
  currentPage=idx;
}

function prevPage(){if(currentPage>0)goToPage(currentPage-1);}
function nextPage(){if(currentPage<pages.length-1)goToPage(currentPage+1);}
function goToPage(idx){renderPage(idx);}

function speakPage() {
  const p=pages[currentPage];
  if(p.cover) { showBubble('Row Row Row Your Boat! 🚣'); speakText('Row Row Row Your Boat'); return; }
  if(p.final) { showBubble('You did it! Super Boat Star! 🌟'); speakText('You did it! Super Boat Star!'); return; }
  const txt=p.sentence.replace(/<[^>]+>/g,'');
  showBubble('🔊 '+txt);
  speakText(txt);
}

// ====== CONFETTI ======
function launchConfetti() {
  const d=document.createElement('div');d.className='celebration';
  const colors=['#42A5F5','#66BB6A','#FFD54F','#FF7043','#AB47BC','#FF9FF3'];
  for(let i=0;i<40;i++){const c=document.createElement('div');c.style.cssText='position:absolute;width:'+(6+Math.random()*8)+'px;height:'+(6+Math.random()*8)+'px;border-radius:50%;left:'+(Math.random()*100)+'%;top:10%;background:'+colors[i%colors.length]+';animation:confetti-fall '+(1.5+Math.random())+'s ease-out forwards;animation-delay:'+(Math.random()*0.5)+'s;';d.appendChild(c);}
  document.body.appendChild(d);setTimeout(()=>d.remove(),3000);
}

// ====== KEYBOARD ======
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft') prevPage();
  if(e.key==='ArrowRight') nextPage();
});

// ====== INIT ======
renderPage(0);
</script>

<script>
(function(){
  var sx = 0, sy = 0, swiping = false;
  document.addEventListener('touchstart', function(e) {
    var t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; swiping = true;
  }, {passive:true});
  document.addEventListener('touchmove', function(e) {
    if (!swiping) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiping = false;
      // Find and click the appropriate nav button
      if (dx < 0) {
        // Swipe left → next
        var n = document.querySelector('[onclick*="next"], [onclick*="Next"], .nav-btn:last-of-type:not([disabled]), a[href*="next"], [class*="next"], #nextBtn');
        if (n) n.click();
        else { var a = document.querySelector('a[href]:not([href*="#"])'); if (a && !a.href.includes("#")) a.click(); }
      } else {
        // Swipe right → prev
        var p = document.querySelector('[onclick*="prev"], [onclick*="Prev"], .nav-btn:first-of-type:not([disabled]), [class*="prev"], #prevBtn');
        if (p) p.click();
      }
    }
  }, {passive:true});
  document.addEventListener('touchend', function() { swiping = false; }, {passive:true});
})();
</script>

<!-- ═══ Speak Page - MP3优先, TTS后备 ═══ -->
<script>
(function(){
  var btn = document.getElementById('speakBtn') || document.querySelector('.speak-btn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'speakBtn'; btn.className = 'speak-btn'; btn.title = '朗读本页';
    btn.textContent = '🔊';
    btn.style.cssText = 'position:fixed;bottom:90px;right:16px;z-index:9999;width:48px;height:48px;border-radius:50%;border:2px solid #42A5F5;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(66,165,245,.3);display:flex;align-items:center;justify-content:center';
    document.body.appendChild(btn);
  }
  var sp = false, audioEl = null;
  var courseName = (window.COURSE_NAME || (window.location.pathname.match(/\/(\w[\w-]*)\.html/) || [,''])[1] || '');
  var lang = (document.documentElement.lang || 'en-US').indexOf('zh')>=0?'zh-CN':'en-US';

  function getPageIdx(){
    var a=document.querySelector('.page.active,.slide.active');
    return a?Array.prototype.indexOf.call(a.parentNode.children,a):-1;
  }

  function speakPage(){
    if(sp){stopPage();return;}
    var idx=getPageIdx(); if(idx<0) return;
    var mp3='../audio/'+courseName+'/page-'+(idx+1)+'.mp3';
    if(audioEl){audioEl.pause();audioEl=null;}
    audioEl=new Audio(mp3);
    audioEl.onerror=function(){
      var flat=new Audio('../audio/'+courseName+'.mp3');
      flat.onerror=function(){speakTTS();};
      flat.oncanplaythrough=function(){
        if(audioEl)audioEl.pause(); audioEl=flat;
        audioEl.play().catch(function(){speakTTS();});
        btn.textContent='⏹';btn.classList.add('speaking');
      };
      flat.load();
    };
    audioEl.oncanplaythrough=function(){
      audioEl.play(); btn.textContent='⏹';btn.classList.add('speaking');
      sp=true; audioEl.onended=function(){stopPage();};
    };
    audioEl.load();
  }

  function speakTTS(){
    if(!window.speechSynthesis)return;
    var a=document.querySelector('.page.active,.slide.active');
    if(!a)return;
    var t=(a.innerText||a.textContent||'').replace(/\s+/g,' ').trim();
    if(!t||t.length<2)return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang=lang;u.rate=0.85;
    u.onstart=function(){sp=true;btn.classList.add('speaking');btn.textContent='⏹';};
    u.onend=u.onerror=function(){stopPage();};
    window.speechSynthesis.speak(u);
  }

  function stopPage(){
    if(audioEl){audioEl.pause();audioEl=null;}
    if(window.speechSynthesis)window.speechSynthesis.cancel();
    sp=false;btn.classList.remove('speaking');btn.textContent='🔊';
  }

  btn.addEventListener('click',function(e){e.stopPropagation();speakPage();});
  if(btn.textContent.trim()===''||btn.textContent.trim()==='▶')btn.textContent='🔊';
})();
