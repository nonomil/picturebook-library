// ====== WEB AUDIO API ======
const NOTE = {
  C4:261.63, D4:293.66, E4:329.63, F4:349.23,
  G4:392.00, A4:440.00, B4:493.88, C5:523.25
};
function playMelody(notes) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let t = ctx.currentTime;
  notes.forEach(function(n) {
    const [freq, dur] = n;
    if(freq > 0) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'triangle';
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.start(t); osc.stop(t + dur);
      t += dur + 0.05;
    }
  });
}
// Old MacDonald E-I-E-I-O melody
const MACDONALD = [
  [NOTE.G4,0.4],[NOTE.G4,0.4],[NOTE.G4,0.4],[NOTE.D4,0.4],
  [NOTE.E4,0.4],[NOTE.E4,0.4],[NOTE.D4,0.8],
  [NOTE.B4,0.4],[NOTE.B4,0.4],[NOTE.A4,0.4],[NOTE.A4,0.4],
  [NOTE.G4,1.2]
];
// ===== PLAY FULL SONG MP3 =====
var songAudio = null;
function playSong() {
  if(songAudio) { songAudio.pause(); songAudio.currentTime = 0; }
  songAudio = new Audio('../audio/oldmacdonald.mp3');
  songAudio.volume = 0.8;
  songAudio.play().catch(function(){});
}
// Animal sounds (simple beeps)
function playSound(freq, dur) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.frequency.value = freq;
  osc.type = 'square';
  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.start(); osc.stop(ctx.currentTime + dur);
}
function playSoundEffect(freqStart,freqEnd,dur) {
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended') ctx.resume();
  const t=ctx.currentTime;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(freqStart,t); o.frequency.exponentialRampToValueAtTime(freqEnd,t+dur);
  g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.01,t+dur-0.05);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur);
}
function showMusicNotes() {
  const scene=document.querySelector('.scene-wrap'); if(!scene) return;
  const notes=['♪','♫','♩','♬'];
  for(let i=0;i<8;i++){const n=document.createElement('div');n.textContent=notes[i%notes.length];n.style.cssText='position:absolute;font-size:'+(14+Math.random()*18)+'px;color:#FFB347;opacity:0;pointer-events:none;z-index:10;left:'+(Math.random()*80+10)+'%;top:'+(Math.random()*50+10)+'%;animation:noteFloat '+(1+Math.random())+'s ease-out forwards;animation-delay:'+(i*0.15)+'s;';scene.appendChild(n);setTimeout(function(e){e.remove()},3000,n);}
}

function showBubble(text) {

}

// ====== GAME LOGIC ======
function startWordGame(idx,word) {
  if(gameDone[idx]) return '<div class="word-game" style="background:#E8F5E9"><h3>✅ 完成！</h3></div>';
  const letters=[...word].sort(()=>Math.random()-0.5);
  buildingWord=[];
  gameDone[idx]=false;
  return `<div class="word-game">
    <h3>⚙️ 拼单词: <strong>"${word}"</strong> 🔊</h3>
    <div class="word-slots" id="ws-${idx}" ondragover="onDragOver(event,${idx})" ondrop="onDrop(event,${idx})" ondragleave="onDragLeave(event,${idx})">
      ${word.split('').map((_,i)=>'<div class="word-slot" id="slot-'+idx+'-'+i+'"></div>').join('')}
    </div>
    <div class="letter-tiles">
      ${letters.map(l=>'<div class="letter-tile" draggable="true" ondragstart="onDragStart(event,'+idx+',\''+l+'\')" ondragend="onDragEnd(event)" onclick="pickLetter('+idx+',\''+l+'\',this)">'+l+'</div>').join('')}
    </div>
  </div>`;
}

function pickLetter(idx,letter,el) {
  if(gameDone[idx]||el.classList.contains('used')) return;
  const p=pages[idx]; const word=p.game; const slot=buildingWord.length;
  if(slot>=word.length) return;
  const slots=document.querySelectorAll('#ws-'+idx+' .word-slot');
  if(letter===word[slot]){
    buildingWord.push(letter); slots[slot].textContent=letter; slots[slot].classList.add('filled');
    el.classList.add('correct','used');
    if(buildingWord.length===word.length){gameDone[idx]=true;setTimeout(()=>{showBubble('Great! 🎉');launchConfetti();renderPage(idx);},500);}
  } else { el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),400); }
}

function onDragStart(e,idx,letter){dragData={idx,letter,el:e.target};e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function onDragEnd(e){e.target.classList.remove('dragging');document.querySelectorAll('.word-slot.drag-over').forEach(s=>s.classList.remove('drag-over'));}
function onDragOver(e,idx){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('#ws-'+idx+' .word-slot:not(.filled)').forEach(s=>s.classList.add('drag-over'));}
function onDragLeave(e,idx){document.querySelectorAll('#ws-'+idx+' .word-slot').forEach(s=>s.classList.remove('drag-over'));}
function onDrop(e,idx){
  e.preventDefault();document.querySelectorAll('#ws-'+idx+' .word-slot').forEach(s=>s.classList.remove('drag-over'));
  if(!dragData||dragData.idx!==idx||gameDone[idx]) return;
  pickLetter(idx,dragData.letter,dragData.el);dragData=null;
}

let matchRound=0; const MATCHES=[{sound:'moo',animal:'cow',freq:[150,100],label:'Cow 🐄'},{sound:'oink',animal:'pig',freq:[300,200],label:'Pig 🐷'},{sound:'quack',animal:'duck',freq:[600,400],label:'Duck 🐤'}];

      </svg>
      <span class="label">${o.label}</span>
    </div>`;
  });
  return `<div class="match-game">
    <h3>🔊 听听是谁的声音？</h3>
    <button class="sound-btn" onclick="playMatchSound()">🔊</button>
    <p style="font-size:14px;color:#6B4F3A;margin-bottom:8px;font-weight:bold">${matchRound+1}/${MATCHES.length}</p>

}

function playMatchSound(){
  if(matchRound>=MATCHES.length) return;
  playSoundEffect(MATCHES[matchRound].freq[0],MATCHES[matchRound].freq[1],0.4);
  showBubble('🔊 '+MATCHES[matchRound].sound+'!');
}

function checkMatch(animal,el){
  if(matchRound>=MATCHES.length||matchDone.includes(animal)) return;
  if(animal===MATCHES[matchRound].animal){
    el.classList.add('correct'); matchDone.push(animal);
    showBubble('Great! Wonderful! 🎉');
    playSoundEffect(800,1200,0.15);
    matchRound++;
    setTimeout(()=>renderPage(12),600);
  } else {
    el.classList.add('wrong');
    setTimeout(()=>el.classList.remove('wrong'),400);
    showBubble('再试试~ Try again!');
  }
}

  if(p.match){
    area.innerHTML=`<div class="page active">
      <div class="scene-wrap" style="position:relative">${getSVG(idx)}</div>

  // Make clickable words speak
  area.querySelectorAll('.hl[data-word]').forEach(function(el){

function updateUI(idx) {
  const dots=document.getElementById('progressDots');
  dots.innerHTML=pages.map((_,i)=>'<div class="dot '+(i===idx?'active':'')+(gameDone[i]?' done':'')+'" onclick="goToPage('+i+')"></div>').join('');
  document.getElementById('prevBtn').disabled=idx===0;
  document.getElementById('nextBtn').disabled=idx===pages.length-1;
  document.getElementById('pageCounter').textContent='第'+(idx+1)+'页 / 共'+pages.length+'页';
  document.getElementById('nextBtn').style.display=idx===pages.length-1?'none':'';

<script>
(function(){
  var sx = 0, sy = 0, swiping = false;
  document.addEventListener('touchstart', function(e) {
    var t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; swiping = true;
  }, {passive:true});
  document.addEventListener('touchmove', function(e) {
    if (!swiping) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiping = false;
      // Find and click the appropriate nav button
      if (dx < 0) {
        // Swipe left → next
        var n = document.querySelector('[onclick*="next"], [onclick*="Next"], .nav-btn:last-of-type:not([disabled]), a[href*="next"], [class*="next"], #nextBtn');
        if (n) n.click();
        else { var a = document.querySelector('a[href]:not([href*="#"])'); if (a && !a.href.includes("#")) a.click(); }
      } else {
        // Swipe right → prev
        var p = document.querySelector('[onclick*="prev"], [onclick*="Prev"], .nav-btn:first-of-type:not([disabled]), [class*="prev"], #prevBtn');
        if (p) p.click();
      }
    }
  }, {passive:true});
  document.addEventListener('touchend', function() { swiping = false; }, {passive:true});
})();
</script>

    audioEl.oncanplaythrough=function(){
      audioEl.play(); btn.textContent='⏹';btn.classList.add('speaking');
      sp=true; audioEl.onended=function(){stopPage();};
    };
    audioEl.load();
  }

  function speakTTS(){
    if(!window.speechSynthesis)return;
    var a=document.querySelector('.page.active,.slide.active');
    if(!a)return;
    var t=(a.innerText||a.textContent||'').replace(/\s+/g,' ').trim();
    if(!t||t.length<2)return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang=lang;u.rate=0.85;
    u.onstart=function(){sp=true;btn.classList.add('speaking');btn.textContent='⏹';};
    u.onend=u.onerror=function(){stopPage();};
    window.speechSynthesis.speak(u);
  }

  function stopPage(){
    if(audioEl){audioEl.pause();audioEl=null;}
    if(window.speechSynthesis)window.speechSynthesis.cancel();
    sp=false;btn.classList.remove('speaking');btn.textContent='🔊';
  }

  btn.addEventListener('click',function(e){e.stopPropagation();speakPage();});
  if(btn.textContent.trim()===''||btn.textContent.trim()==='▶')btn.textContent='🔊';
})();

    $(_book).bind('turned', function(e, page, pages) {
      if (page >= pages) {
        setTimeout(function() { if (window.celebrate) window.celebrate(); }, 500);
      }
    });
  }
})();
</script>
