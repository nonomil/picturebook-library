<script>
const pages=[{
cover:true,icon:'⏰',title:'认识钟表',subtitle:'数学课 第16课',goals:['认识钟面：时针和分针','会看整点和半点','知道早上、中午、晚上的时间','学会合理安排时间']
},{
 title:'🕐 钟面',text:'钟面上有12个数字，从1到12。<br><br>⏱️ 时针(短) — 指向几点<br>⏱️ 分针(长) — 指向几分<br><br>整点：分针指向12，时针指向数字<br>例如：3点整 → 时针指向3，分针指向12！',
 svg:'<svg viewBox="0 0 200 200" style="width:80%;max-width:220px"><circle cx="100" cy="100" r="85" fill="none" stroke="#fff" stroke-width="3"/><circle cx="100" cy="100" r="82" fill="rgba(255,255,255,.08)"/>'+
 Array.from({length:12},(_,i)=>'<text x="'+(100+68*Math.sin((i+1)*30*Math.PI/180))+'" y="'+(100-68*Math.cos((i+1)*30*Math.PI/180))+'" font-size="16" fill="#fff" text-anchor="middle" dominant-baseline="central" font-weight="700">'+(i+1)+'</text>').join('')+
 '<g><line x1="100" y1="100" x2="61" y2="78" stroke="#FFD54F" stroke-width="5" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="0 100 100;90 100 100;0 100 100" dur="4s" repeatCount="indefinite"/></line></g><g><line x1="100" y1="100" x2="100" y2="30" stroke="#fff" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="8s" repeatCount="indefinite"/></line></g><circle cx="100" cy="100" r="4" fill="#fff"/><text x="100" y="185" font-size="11" fill="rgba(255,255,255,.72)" text-anchor="middle">观察：分针转得更快</text></svg>'
  },{
 title:'🕐 半点',text:'半点：分针指向6，时针在两个数字中间<br><br>例如：3:30 → 分针指向6，时针在3和4之间<br>"三点半"！<br><br>分针走一圈=60分钟<br>分针走半圈=30分钟=半点',
 svg:'<svg viewBox="0 0 200 200" style="width:80%;max-width:220px"><circle cx="100" cy="100" r="85" fill="none" stroke="#fff" stroke-width="3"/><circle cx="100" cy="100" r="82" fill="rgba(255,255,255,.08)"/>'+
 Array.from({length:12},(_,i)=>'<text x="'+(100+68*Math.sin((i+1)*30*Math.PI/180))+'" y="'+(100-68*Math.cos((i+1)*30*Math.PI/180))+'" font-size="16" fill="#fff" text-anchor="middle" dominant-baseline="central" font-weight="700">'+(i+1)+'</text>').join('')+
 '<line x1="100" y1="100" x2="80" y2="55" stroke="#FFD54F" stroke-width="5" stroke-linecap="round"/><g><line x1="100" y1="100" x2="100" y2="32" stroke="#fff" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="0 100 100;180 100 100;0 100 100" dur="5s" repeatCount="indefinite"/></line></g><circle cx="100" cy="100" r="4" fill="#fff"/><text x="100" y="185" font-size="11" fill="rgba(255,255,255,.72)" text-anchor="middle">分针走半圈就是半点</text></svg>'
},{
title:'🔄 一天的时间',text:'早上7点 — 起床🛌<br>早上8点 — 上学🏫<br>中午12点 — 午饭🍚<br>下午3点 — 上课📖<br>下午5点 — 放学回家🏠<br>晚上7点 — 晚饭🍽️<br>晚上9点 — 睡觉😴',
svg:'<svg viewBox="0 0 280 100" style="width:90%;max-width:280px"><text x="10" y="15" font-size="11" fill="#FFD54F">🌅 早上</text><text x="10" y="35" font-size="11" fill="#fff">☀️ 中午</text><text x="10" y="55" font-size="11" fill="#FFD54F">🌆 下午</text><text x="10" y="75" font-size="11" fill="rgba(255,255,255,.6)">🌙 晚上</text><text x="100" y="15" font-size="11" fill="#fff">7:00 起床</text><text x="100" y="35" font-size="11" fill="#fff">12:00 午饭</text><text x="100" y="55" font-size="11" fill="#fff">15:00 上课</text><text x="100" y="75" font-size="11" fill="#fff">21:00 睡觉</text></svg>'
},{
title:'❌ 常见误解',items:[
{title:'时针和分针弄反',w:'短针看分钟，长针看小时',r:'短针=时针→看小时，长针=分针→看分钟！'},
{title:'半点读错',w:'3:30读成4:30',r:'3:30时针在3和4之间，分针指向6！'},
{title:'整点读错',w:'12:00看成6:00',r:'12:00时针和分针都指向12！'}
]
},{
title:'✏️ 选一选',interactive:true,type:'quiz',q:'分针指向12，时针指向7，是几点？',options:['7:00','7:30','12:00'],correct:0
},{
title:'✏️ 再选一选',interactive:true,type:'quiz2',q:'分针指向6，时针在5和6之间，是几点？',options:['5:00','5:30','6:00'],correct:1
},{
title:'🎉 太棒了！',final:true,msg:'你完成了认识钟表！🏅<br>获得「时间小管家」徽章！<br><br>记住：短针看小时，长针看分钟！<br>你会看时间了！'
}];
let cur=0,quizA={};
function render(n){
  const el=document.getElementById('slides');const p=pages[n];
  if(!p)return;let h='';
  if(p.cover){
    h=`<div class="slide active"><div class="page-shell"><div class="page-kicker">Learning goals</div><div style="font-size:64px;margin:6px auto;text-align:center">${p.icon}</div><div class="page-title">${p.title}</div><p class="page-kicker" style="font-size:16px;margin-top:6px">${p.subtitle}</p>`;
    h+=`<div class="goal-card"><h3>📋 学习目标</h3><ul>`;p.goals.forEach(g=>h+=`<li>${g}</li>`);h+=`</ul></div></div></div>`;
  }else if(p.final){
    h=`<div class="slide active" style="justify-content:center;text-align:center;gap:12px"><div class="page-shell"><div style="font-size:72px">🎉</div><h2 style="font-size:30px;color:#fff;margin-top:4px">${p.title}</h2><p style="font-size:17px;color:rgba(255,255,255,.94);line-height:1.75;margin-top:10px">${p.msg}</p></div></div>`;
    setTimeout(doConfetti,300);
  }else if(p.interactive){
    h=`<div class="slide active" style="gap:10px"><div class="page-shell"><div class="page-kicker">Try it now</div><h3 style="font-size:24px;color:#fff;text-align:center">${p.title}</h3><div class="card"><p style="font-size:17px;font-weight:800;color:#1565C0;margin-bottom:8px">${p.q}</p>`;
    p.options.forEach((o,i)=>{h+=`<div class="quiz-opt" onclick="clickQuiz(${n},${i})" data-idx="${i}">${String.fromCharCode(65+i)}. ${o}</div>`;});
    h+=`<div class="feedback" id="fb${n}"></div></div></div></div>`;
  }else{
    h=`<div class="slide active" style="gap:8px"><div class="page-shell"><div class="page-kicker">Math story page</div><h3 style="font-size:24px;color:#fff;text-align:center">${p.title}</h3>`;
    if(p.svg)h+=`<div class="svg-stage">${p.svg}</div>`;if(p.text||p.items||p.svg){h+=`<div class="story-figure"><img src="../images/math-16-clock/webp/page-${String(n+1).padStart(2,"0")}.webp" loading="lazy" alt="配图" onerror="this.style.background='#f0f0f0';this.alt='图片加载中';this.onerror=null"></div>`;}
    if(p.text)h+=`<div class="card"><p>${p.text}</p></div>`;
    if(p.items){p.items.forEach(it=>{h+=`<div class="card mis-card"><h4 style="font-size:18px;color:#1565C0;margin-bottom:8px">${it.title}</h4><p><span style="color:#F44336">❌</span> ${it.w}</p><p><span style="color:#4CAF50">✅</span> ${it.r}</p></div>`;});}
    h+=`</div></div>`;
  }
  el.innerHTML=h;
  document.getElementById('prevBtn').disabled=n===0;document.getElementById('nextBtn').disabled=n===pages.length-1;
  document.getElementById('pageTitle').textContent=p.title.replace(/^[^\u4e00-\u9fa5A-Za-z0-9]+/,'');
  document.getElementById('pageCount').textContent='第 '+(n+1)+' / '+pages.length+' 页';
  document.getElementById('topProgress').textContent=(n+1)+' / '+pages.length;
  updateDots(n);
  gsap.fromTo('.slide.active>*',{opacity:0,y:15},{opacity:1,y:0,duration:.3,stagger:.05,ease:'power2.out'});
}
function clickQuiz(n,i){const p=pages[n];if(quizA[n])return;quizA[n]=true;
  document.querySelectorAll('.quiz-opt').forEach((el,j)=>{el.className='quiz-opt'+(j===p.correct?' correct':j===i?' wrong':'');});
  const fb=document.getElementById('fb'+n);if(fb){fb.className='feedback show '+(i===p.correct?' good':' bad');fb.textContent=i===p.correct?'✅ 正确！':'❌ 再想想';}
}
function go(d){cur=Math.max(0,Math.min(pages.length-1,cur+d));render(cur);}
function updateDots(n){const el=document.getElementById('dots');el.innerHTML='';for(let i=0;i<pages.length;i++){const d=document.createElement('button');d.className='dot'+(i===n?' active':'');d.onclick=()=>{cur=i;render(cur);};el.appendChild(d);}}
function doConfetti(){const el=document.getElementById('confetti');const c=['#FF6B6B','#FFB347','#4ECDC4','#A78BFA','#FFD93D','#FF9FF3'];for(let i=0;i<50;i++){const p=document.createElement('div');p.style.cssText='position:absolute;left:'+(Math.random()*100)+'%;top:-10px;width:'+(5+Math.random()*8)+'px;height:'+(5+Math.random()*8)+'px;background:'+c[Math.floor(Math.random()*6)]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';animation:confetti-fall '+(2+Math.random()*2)+'s ease-in '+(Math.random()*2)+'s forwards;';el.appendChild(p);setTimeout(()=>p.remove(),4500);}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
render(0);
</script>


<script>
/* ── Speech Synthesis ── */
(function() {
  var isSpeaking = false;
  var speakBtn = document.getElementById('speakBtn');
  if (!speakBtn) return;

  function getPageText() {
    var active = document.querySelector('.slide.active, .page.active, [class*="active"]');
    if (!active) return '';
    return active.textContent.replace(/\s+/g, ' ').trim();
  }

  function speakText(text) {
    if (!text || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.85; u.pitch = 1.1; u.volume = 1;
    u.onstart = function() { isSpeaking = true; speakBtn.classList.add('speaking'); speakBtn.textContent = '⏹'; };
    u.onend = function() { isSpeaking = false; speakBtn.classList.remove('speaking'); speakBtn.textContent = '🔊'; };
    u.onerror = function() { isSpeaking = false; speakBtn.classList.remove('speaking'); speakBtn.textContent = '🔊'; };
    window.speechSynthesis.speak(u);
  }

  function stopSpeaking() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    isSpeaking = false; speakBtn.classList.remove('speaking'); speakBtn.textContent = '🔊';
  }

  speakBtn?.addEventListener('click', function() {
    if (isSpeaking) { stopSpeaking(); return; }
    speakText(getPageText());
  });
})();
</script>


<script>
(function(){
  var sx = 0, sy = 0, swiping = false;
  document.addEventListener('touchstart', function(e) {
    var t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; swiping = true;
  }, {passive:true});
  document.addEventListener('touchmove', function(e) {
    if (!swiping) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiping = false;
      // Find and click the appropriate nav button
      if (dx < 0) {
        // Swipe left → next
        var n = document.querySelector('[onclick*="next"], [onclick*="Next"], .nav-btn:last-of-type:not([disabled]), a[href*="next"], [class*="next"], #nextBtn');
        if (n) n.click();
        else { var a = document.querySelector('a[href]:not([href*="#"])'); if (a && !a.href.includes("#")) a.click(); }
      } else {
        // Swipe right → prev
        var p = document.querySelector('[onclick*="prev"], [onclick*="Prev"], .nav-btn:first-of-type:not([disabled]), [class*="prev"], #prevBtn');
        if (p) p.click();
      }
    }
  }, {passive:true});
  document.addEventListener('touchend', function() { swiping = false; }, {passive:true});
})();
</script>

<!-- ═══ Speak Page - MP3优先, TTS后备 ═══ -->
<script>
(function(){
  var btn = document.getElementById('speakBtn') || document.querySelector('.speak-btn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'speakBtn'; btn.className = 'speak-btn'; btn.title = '朗读本页';
    btn.textContent = '🔊';
    btn.style.cssText = 'position:fixed;bottom:90px;right:16px;z-index:9999;width:48px;height:48px;border-radius:50%;border:2px solid #42A5F5;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(66,165,245,.3);display:flex;align-items:center;justify-content:center';
    document.body.appendChild(btn);
  }
  var sp = false, audioEl = null;
  var courseName = (window.COURSE_NAME || (window.location.pathname.match(/\/(\w[\w-]*)\.html/) || [,''])[1] || '');
  var lang = (document.documentElement.lang || 'en-US').indexOf('zh')>=0?'zh-CN':'en-US';

  function getPageIdx(){
    var a=document.querySelector('.page.active,.slide.active');
    return a?Array.prototype.indexOf.call(a.parentNode.children,a):-1;
  }

  function speakPage(){
    if(sp){stopPage();return;}
    var idx=getPageIdx(); if(idx<0) return;
    var mp3='../audio/'+courseName+'/page-'+(idx+1)+'.mp3';
    if(audioEl){audioEl.pause();audioEl=null;}
    audioEl=new Audio(mp3);
    audioEl.onerror=function(){
      var flat=new Audio('../audio/'+courseName+'.mp3');
      flat.onerror=function(){speakTTS();};
      flat.oncanplaythrough=function(){
        if(audioEl)audioEl.pause(); audioEl=flat;
        audioEl.play().catch(function(){speakTTS();});
        btn.textContent='⏹';btn.classList.add('speaking');
      };
      flat.load();
    };
    audioEl.oncanplaythrough=function(){
      audioEl.play(); btn.textContent='⏹';btn.classList.add('speaking');
      sp=true; audioEl.onended=function(){stopPage();};
    };
    audioEl.load();
  }

  function speakTTS(){
    if(!window.speechSynthesis)return;
    var a=document.querySelector('.page.active,.slide.active');
    if(!a)return;
    var t=(a.innerText||a.textContent||'').replace(/\s+/g,' ').trim();
    if(!t||t.length<2)return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang=lang;u.rate=0.85;
    u.onstart=function(){sp=true;btn.classList.add('speaking');btn.textContent='⏹';};
    u.onend=u.onerror=function(){stopPage();};
    window.speechSynthesis.speak(u);
  }

  function stopPage(){
    if(audioEl){audioEl.pause();audioEl=null;}
    if(window.speechSynthesis)window.speechSynthesis.cancel();
    sp=false;btn.classList.remove('speaking');btn.textContent='🔊';
  }

  btn.addEventListener('click',function(e){e.stopPropagation();speakPage();});
  if(btn.textContent.trim()===''||btn.textContent.trim()==='▶')btn.textContent='🔊';
})();
