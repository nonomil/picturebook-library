<title>应用题大挑战 — Math Lesson 23</title>
  <meta name="description" content="应用题大挑战 — Math Lesson 23 - 幼儿数学思维互动课件，适合5-7岁幼小衔接">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
    background: #e3f2fd;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
  }
  /* TOP BAR */
  .topbar {
    width: 100%;
    max-width: 800px;
    background: #42A5F5;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 10px 18px;
    border-radius: 0 0 16px 16px;
    box-shadow: 0 2px 8px rgba(66,165,245,0.4);
    gap: 10px;
    font-size: 22px;
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 10;
    margin-bottom: 20px;
  }
  .topbar a {
    color: #fff;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: opacity 0.2s;
  }
  .topbar a:hover { opacity: 0.8; }
  .topbar .sep { opacity: 0.6; }
  .topbar .spacer { flex: 1; }
  .topbar .title { font-size: 18px; }

  /* MAIN CARD */
  .container {
    width: 100%;
    max-width: 800px;
    padding: 0 16px 40px;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 28px 24px 32px;
    margin-bottom: 20px;
  }

  /* HEADER */
  .lesson-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .lesson-header h1 {
    font-size: 28px;
    color: #1565C0;
    margin-bottom: 4px;
  }
  .lesson-header .sub {
    color: #666;
    font-size: 15px;
  }

  /* SCORE */
  .score-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .score-box {
    background: #e3f2fd;
    border-radius: 14px;
    padding: 8px 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
    font-weight: 600;
    color: #1565C0;
  }
  .score-box .num { color: #0d47a1; font-size: 22px; }
  .progress-bar-wrap {
    width: 200px;
    height: 10px;
    background: #bbdefb;
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: #42A5F5;
    border-radius: 10px;
    transition: width 0.5s ease;
  }

  /* PROBLEM */
  .problem-area {
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .problem-number {
    font-size: 14px;
    color: #90a4ae;
    margin-bottom: 6px;
  }
  .problem-story {
    font-size: 20px;
    line-height: 1.6;
    text-align: center;
    color: #212121;
    max-width: 500px;
    margin-bottom: 16px;
    background: #f5f7fa;
    padding: 14px 20px;
    border-radius: 16px;
    border-left: 4px solid #42A5F5;
  }
  .problem-story .highlight {
    color: #1565C0;
    font-weight: 700;
  }

  /* VISUAL AID */
  .visual-aid {
    background: #fafcff;
    border: 2px dashed #b0d4f1;
    border-radius: 20px;
    padding: 18px 20px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 80px;
    width: 100%;
    max-width: 480px;
  }
  .visual-aid svg { display: block; }

  /* OPTIONS */
  .options {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin: 14px 0 20px;
  }
  .option-btn {
    background: #e3f2fd;
    border: 2px solid #90caf9;
    border-radius: 16px;
    padding: 10px 28px;
    font-size: 20px;
    font-weight: 600;
    color: #1565C0;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 70px;
  }
  .option-btn:hover { background: #bbdefb; transform: scale(1.04); }
  .option-btn.correct { background: #c8e6c9; border-color: #66bb6a; color: #2e7d32; }
  .option-btn.wrong { background: #ffcdd2; border-color: #ef5350; color: #c62828; }
  .option-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

  /* FEEDBACK */
  .feedback {
    min-height: 50px;
    text-align: center;
    padding: 12px 16px;
    border-radius: 16px;
    margin-top: 4px;
    width: 100%;
    max-width: 500px;
  }
  .feedback.fb-correct { background: #e8f5e9; color: #2e7d32; }
  .feedback.fb-wrong { background: #fbe9e7; color: #bf360c; }
  .feedback .fb-head { font-weight: 700; font-size: 18px; margin-bottom: 4px; }
  .feedback .fb-detail { font-size: 15px; line-height: 1.5; }

  /* NEXT BUTTON */
  .next-area { text-align: center; margin-top: 12px; }
  .btn-next {
    background: #42A5F5;
    border: none;
    border-radius: 30px;
    padding: 12px 40px;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    box-shadow: 0 4px 12px rgba(66,165,245,0.35);
    display: none;
  }
  .btn-next:hover { background: #1e88e5; transform: scale(1.03); }

  /* CELEBRATION */
  .celebration {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .celebration.show { display: flex; }
  .celebration .big-icon { font-size: 64px; margin-bottom: 6px; }
  .celebration h2 { font-size: 28px; color: #1565C0; margin-bottom: 6px; }
  .celebration p { font-size: 17px; color: #555; max-width: 380px; }
  .celebration .final-score {
    font-size: 48px;
    font-weight: 800;
    color: #42A5F5;
    margin: 10px 0;
  }
  .celebration .stars svg { display: block; margin: 0 auto; }

  /* RESET */
  .btn-reset {
    background: #fff;
    border: 2px solid #42A5F5;
    border-radius: 30px;
    padding: 10px 32px;
    font-size: 16px;
    font-weight: 600;
    color: #42A5F5;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 12px;
  }
  .btn-reset:hover { background: #e3f2fd; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .card { padding: 18px 14px; }
    .problem-story { font-size: 18px; padding: 12px 14px; }
    .option-btn { padding: 8px 18px; font-size: 18px; min-width: 56px; }
    .topbar { font-size: 18px; }
    .topbar .title { font-size: 15px; }
    .score-box { font-size: 15px; padding: 6px 14px; }
  }

  /* ── speak button ── */
  .speak-btn {
    background: rgba(255,255,255,.2); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.15); border-radius: 50%;
    width: 40px; height: 40px; color: #fff; font-size: 20px;
    cursor: pointer; display: inline-flex; align-items: center;
    justify-content: center; transition: all .2s;
    touch-action: manipulation; user-select: none;
    line-height: 1;
  }
  .speak-btn:hover { background: rgba(255,255,255,.35); }
  .speak-btn:active { transform: scale(.88); }
  .speak-btn.speaking { background: rgba(255,255,255,.4); animation: speakPulse 1s ease-in-out infinite; }
  @keyframes speakPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,.5); transform: scale(1); } 50% { box-shadow: 0 0 0 10px rgba(255,255,255,0); transform: scale(1.08); } }


@media (min-width: 768px) {
  body { padding: 20px; }
  h1 { font-size: 36px; }
  h2 { font-size: 26px; }
  .nav-btn { width: 56px; height: 56px; font-size: 24px; }
}

<div class="container">

  <div class="card">
    <div class="lesson-header">
      <h1>🧮 应用题大挑战</h1>
      <div class="sub">Word Problem Challenge · L17–L22 Skills</div>
    </div>

    <!-- SCORE -->
    <div class="score-row">
      <div class="score-box">⭐ <span class="num" id="scoreNum">0</span> / <span id="totalNum">6</span></div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>

    <!-- PROBLEM AREA -->
    <div class="problem-area" id="problemArea">

      <div id="problemDisplay">
        <div class="problem-number" id="problemNumLabel">Problem 1 of 6</div>

        <div class="visual-aid" id="visualAid"></div>

        <!-- OPTIONS -->
        <div class="options" id="optionsContainer"></div>

        <!-- FEEDBACK -->
        <div class="feedback" id="feedbackArea"></div>

        <div class="next-area">
          <button class="btn-next" id="nextBtn">Next ➜</button>

      </div>

<script>
// ===========================
// PROBLEM DATA
// ===========================
const PROBLEMS = [
  {
    id: 1,
    story: 'Steve has <span class="highlight">8 apples</span> 🍎. He gives <span class="highlight">3 apples</span> to Alex. How many apples does Steve have left?',
    visual: 'apples',
    options: ['3', '5', '8', '11'],
    answer: 1, // index
    correctAnswer: '5',
    explanation: 'Steve starts with 8 apples. He gives 3 away. 8 − 3 = <b>5</b> apples left.',
    skill: 'Subtraction'
  },
  {
    id: 2,
    story: 'There are <span class="highlight">3 groups</span> of sheep. Each group has <span class="highlight">4 sheep</span> 🐑. How many sheep are there in total?',
    visual: 'sheep',
    options: ['7', '8', '12', '16'],
    answer: 2,
    correctAnswer: '12',
    explanation: '3 groups × 4 sheep each = <b>12</b> sheep total. (Multiplication)',
    skill: 'Multiplication'
  },
  {
    id: 3,
    story: 'Alex has <span class="highlight">12 cookies</span> 🍪. He eats <span class="highlight">5 cookies</span>. How many cookies does Alex have now?',
    visual: 'cookies',
    options: ['5', '7', '12', '17'],
    answer: 1,
    correctAnswer: '7',
    explanation: 'Alex starts with 12 cookies. He eats 5. 12 − 5 = <b>7</b> cookies remaining.',
    skill: 'Subtraction'
  },
  {
    id: 4,
    story: 'A pizza 🍕 is shared equally among <span class="highlight">4 friends</span>. What fraction of the pizza does each friend get?',
    visual: 'pizza',
    options: ['1/2', '1/3', '1/4', '1/8'],
    answer: 2,
    correctAnswer: '1/4',
    explanation: 'One pizza divided into 4 equal parts. Each friend gets <b>1/4</b> (one quarter) of the pizza.',
    skill: 'Fractions'
  },
  {
    id: 5,
    story: 'Steve is <span class="highlight">3 blocks</span> tall 🧱. Alex is <span class="highlight">5 blocks</span> tall 🧱. Who is taller, and by how many blocks?',
    visual: 'towers',
    options: ['Steve by 2', 'Alex by 2', 'Steve by 8', 'Alex by 8'],
    answer: 1,
    correctAnswer: 'Alex by 2',
    explanation: 'Alex is 5 blocks − Steve is 3 blocks = <b>2 blocks</b> taller. Alex is taller!',
    skill: 'Comparison'
  },
  {
    id: 6,
    story: 'There are <span class="highlight">2 baskets</span> 🧺. Each basket has <span class="highlight">6 eggs</span> 🥚. How many eggs are there in total?',
    visual: 'eggs',
    options: ['8', '10', '12', '14'],
    answer: 2,
    correctAnswer: '12',
    explanation: '2 baskets × 6 eggs each = <b>12</b> eggs altogether.',
    skill: 'Multiplication'
  }
];

// ===========================
// STATE
// ===========================
let currentIndex = 0;
let score = 0;
let answered = false;
let totalProblems = PROBLEMS.length;
const MAX_SCORE = totalProblems;

// ===========================
// DOM REFS
// ===========================
const storyText = document.getElementById('storyText');
const visualAid = document.getElementById('visualAid');
const optionsContainer = document.getElementById('optionsContainer');
const feedbackArea = document.getElementById('feedbackArea');
const nextBtn = document.getElementById('nextBtn');
const problemNumLabel = document.getElementById('problemNumLabel');
const scoreNum = document.getElementById('scoreNum');
const totalNum = document.getElementById('totalNum');
const progressFill = document.getElementById('progressFill');
const problemDisplay = document.getElementById('problemDisplay');
const celebrationArea = document.getElementById('celebrationArea');
const finalScore = document.getElementById('finalScore');
const starsSvg = document.getElementById('starsSvg');

totalNum.textContent = totalProblems;

// ===========================
// SVG GENERATORS
// ===========================
function svgApples() {
  // 8 apples: 5 top row, 3 bottom row, with 3 crossed out
  return `<svg width="340" height="120" viewBox="0 0 340 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <text x="10" y="22" font-size="13" fill="#666">Steve's apples:</text>
    <!-- Row 1: 5 apples -->
    ${[0,1,2,3,4].map(i => {
      const x = 20 + i*44;
      const crossed = i < 3 ? '' : '';
      return `<g>
        <circle cx="${x}" cy="50" r="16" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
        <path d="M${x-5} ${50-12} Q${x} ${50-18} ${x+5} ${50-12}" stroke="#4e342e" stroke-width="2" fill="none"/>
        <line x1="${x-3}" y1="${50-6}" x2="${x+3}" y2="${50-6}" stroke="#4e342e" stroke-width="1.5"/>
        <text x="${x}" y="${54}" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">${i+1}</text>
        ${i < 3 ? `<line x1="${x-12}" y1="${50-12}" x2="${x+12}" y2="${50+12}" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
                   <line x1="${x+12}" y1="${50-12}" x2="${x-12}" y2="${50+12}" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>` : ''}
      </g>`;
    }).join('')}
    <!-- Row 2: 3 apples -->
    ${[0,1,2].map(i => {
      const x = 42 + i*44;
      return `<g>
        <circle cx="${x}" cy="90" r="16" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
        <path d="M${x-5} ${90-12} Q${x} ${90-18} ${x+5} ${90-12}" stroke="#4e342e" stroke-width="2" fill="none"/>
        <line x1="${x-3}" y1="${90-6}" x2="${x+3}" y2="${90-6}" stroke="#4e342e" stroke-width="1.5"/>
        <text x="${x}" y="${94}" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">${i+6}</text>
      </g>`;
    }).join('')}
    <text x="280" y="56" font-size="12" fill="#c62828">✖ 3 given</text>
    <text x="140" y="116" font-size="11" fill="#777">8 − 3 = 5 left</text>
  </svg>`;
}

function svgSheep() {
  // 3 groups of 4 sheep = 12 sheep
  const cols = 4, rows = 3;
  let circles = '';
  let labels = '';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = 40 + c * 66;
      const y = 30 + r * 48;
      circles += `<circle cx="${x}" cy="${y}" r="16" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/>`;
      circles += `<ellipse cx="${x}" cy="${y-2}" rx="12" ry="10" fill="#fff" stroke="#78909c" stroke-width="1"/>`;
      circles += `<circle cx="${x-4}" cy="${y-5}" r="2.5" fill="#333"/>`;
      circles += `<circle cx="${x+4}" cy="${y-5}" r="2.5" fill="#333"/>`;
      circles += `<ellipse cx="${x}" cy="${y+2}" rx="3" ry="2" fill="#78909c"/>`;
      const num = r * cols + c + 1;
      labels += `<text x="${x}" y="${y+22}" text-anchor="middle" font-size="9" fill="#555">${num}</text>`;
    }
  }
  // group brackets
  const bracketGroups = [0,1,2].map((r,i) => {
    const y = 30 + r * 48;
    const x1 = 40 - 2;
    const x2 = 40 + 3*66 + 2;
    return `<text x="${x1-14}" y="${y+5}" font-size="11" fill="#1565C0" font-weight="600">G${i+1}</text>`;
  }).join('');
  return `<svg width="340" height="200" viewBox="0 0 340 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <text x="10" y="18" font-size="13" fill="#666">3 groups × 4 sheep:</text>
    ${circles}
    ${labels}
    ${bracketGroups}
    <text x="170" y="192" text-anchor="middle" font-size="11" fill="#777">3 × 4 = 12 sheep total</text>
  </svg>`;
}

function svgCookies() {
  // 12 cookies in 3 rows of 4, 5 crossed out
  const cols = 4, rows = 3;
  let circles = '';
  let count = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      count++;
      const x = 50 + c * 60;
      const y = 35 + r * 48;
      const crossed = count <= 5;
      circles += `<circle cx="${x}" cy="${y}" r="17" fill="#ffe0b2" stroke="#ff8a65" stroke-width="1.5"/>`;
      circles += `<circle cx="${x}" cy="${y}" r="10" fill="#ffcc80" stroke="#ff8a65" stroke-width="0.8"/>`;
      // chocolate chips
      circles += `<circle cx="${x-4}" cy="${y-4}" r="2" fill="#5d4037" opacity="0.7"/>`;
      circles += `<circle cx="${x+5}" cy="${y-3}" r="2" fill="#5d4037" opacity="0.7"/>`;
      circles += `<circle cx="${x}" cy="${y+4}" r="2" fill="#5d4037" opacity="0.7"/>`;
      if (crossed) {
        circles += `<line x1="${x-13}" y1="${y-13}" x2="${x+13}" y2="${y+13}" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>`;
        circles += `<line x1="${x+13}" y1="${y-13}" x2="${x-13}" y2="${y+13}" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>`;
      }
      circles += `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="9" fill="#5d4037" font-weight="600">${count}</text>`;
    }
  }
  return `<svg width="340" height="200" viewBox="0 0 340 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <text x="10" y="18" font-size="13" fill="#666">Cookies: 5 eaten (✖), 7 left</text>
    ${circles}
    <text x="170" y="192" text-anchor="middle" font-size="11" fill="#777">12 − 5 = 7 cookies left</text>
  </svg>`;
}

function svgPizza() {
  // A pizza divided into 4 quarters
  return `<svg width="240" height="200" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <text x="120" y="22" text-anchor="middle" font-size="13" fill="#666">🍕 Pizza shared by 4 friends</text>
    <!-- Main pizza circle -->
    <circle cx="120" cy="110" r="60" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
    <!-- Divider lines -->
    <line x1="120" y1="50" x2="120" y2="170" stroke="#e65100" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="60" y1="110" x2="180" y2="110" stroke="#e65100" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Labels -->
    <text x="90" y="100" text-anchor="middle" font-size="14" fill="#bf360c" font-weight="700">¼</text>
    <text x="150" y="100" text-anchor="middle" font-size="14" fill="#bf360c" font-weight="700">¼</text>
    <text x="90" y="140" text-anchor="middle" font-size="14" fill="#bf360c" font-weight="700">¼</text>
    <text x="150" y="140" text-anchor="middle" font-size="14" fill="#bf360c" font-weight="700">¼</text>
    <!-- Toppings -->
    <circle cx="100" cy="95" r="5" fill="#e53935" opacity="0.7"/>
    <circle cx="140" cy="105" r="4" fill="#4caf50" opacity="0.7"/>
    <circle cx="110" cy="130" r="5" fill="#e53935" opacity="0.7"/>
    <circle cx="135" cy="125" r="4" fill="#4caf50" opacity="0.7"/>
    <!-- Friends labels -->
    <text x="120" y="185" text-anchor="middle" font-size="11" fill="#777">Each friend gets 1/4</text>
  </svg>`;
}

function svgTowers() {
  // Two towers: Steve 3 blocks, Alex 5 blocks
  const blockH = 22;
  const blockW = 30;
  const gap = 20;
  const startX = 60;
  let svg = `<svg width="320" height="180" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <text x="160" y="18" text-anchor="middle" font-size="13" fill="#666">Block towers: compare heights</text>`;
  // Steve tower (3 blocks)
  const steveX = 70;
  for (let i = 0; i < 3; i++) {
    const y = 145 - i * blockH;
    svg += `<rect x="${steveX}" y="${y}" width="${blockW}" height="${blockH-2}" rx="3" fill="#42A5F5" stroke="#1565C0" stroke-width="1.2"/>
            <text x="${steveX + blockW/2}" y="${y + blockH/2 + 1}" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">${i+1}</text>`;
  }
  // Alex tower (5 blocks)
  const alexX = 170;
  for (let i = 0; i < 5; i++) {
    const y = 145 - i * blockH;
    svg += `<rect x="${alexX}" y="${y}" width="${blockW}" height="${blockH-2}" rx="3" fill="#66bb6a" stroke="#2e7d32" stroke-width="1.2"/>
            <text x="${alexX + blockW/2}" y="${y + blockH/2 + 1}" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">${i+1}</text>`;
  }
  // labels
  svg += `<text x="${steveX + blockW/2}" y="172" text-anchor="middle" font-size="12" fill="#1565C0" font-weight="600">Steve<br/>3 blocks</text>`;
  svg += `<text x="${alexX + blockW/2}" y="172" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="600">Alex<br/>5 blocks</text>`;
  // difference arrow
  svg += `<line x1="${alexX + blockW + 8}" y1="80" x2="${alexX + blockW + 8}" y2="146" stroke="#e53935" stroke-width="2" stroke-dasharray="4,3" marker-end=""/>
          <text x="${alexX + blockW + 18}" y="115" font-size="13" fill="#e53935" font-weight="700">+2</text>`;
  svg += `</svg>`;
  return svg;
}

function svgEggs() {
  // 2 baskets with 6 eggs each
  let svg = `<svg width="320" height="180" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <text x="160" y="18" text-anchor="middle" font-size="13" fill="#666">2 baskets × 6 eggs each</text>`;
  // Basket 1
  svg += `<path d="M30 145 L50 100 L130 100 L150 145 Z" fill="#d7ccc8" stroke="#8d6e63" stroke-width="1.5" rx="4"/>`;
  svg += `<rect x="35" y="98" width="110" height="8" rx="3" fill="#a1887f"/>`;
  // eggs in basket 1 (3x2 grid)
  const e1x = 55, e1y = 118;
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 3; c++) {
      const x = e1x + c * 28;
      const y = e1y + r * 20;
      svg += `<ellipse cx="${x}" cy="${y}" rx="10" ry="13" fill="#fff9c4" stroke="#f9a825" stroke-width="1.2"/>`;
      const num = r * 3 + c + 1;
      svg += `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="8" fill="#f57f17" font-weight="600">${num}</text>`;
    }
  }
  // Basket 2
  svg += `<path d="M170 145 L190 100 L270 100 L290 145 Z" fill="#d7ccc8" stroke="#8d6e63" stroke-width="1.5" rx="4"/>`;
  svg += `<rect x="175" y="98" width="110" height="8" rx="3" fill="#a1887f"/>`;
  const e2x = 195, e2y = 118;
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 3; c++) {
      const x = e2x + c * 28;
      const y = e2y + r * 20;
      svg += `<ellipse cx="${x}" cy="${y}" rx="10" ry="13" fill="#fff9c4" stroke="#f9a825" stroke-width="1.2"/>`;
      const num = r * 3 + c + 7;
      svg += `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="8" fill="#f57f17" font-weight="600">${num}</text>`;
    }
  }
  // labels
  svg += `<text x="90" y="165" text-anchor="middle" font-size="11" fill="#5d4037">Basket 1</text>`;
  svg += `<text x="230" y="165" text-anchor="middle" font-size="11" fill="#5d4037">Basket 2</text>`;
  svg += `<text x="160" y="178" text-anchor="middle" font-size="11" fill="#777">2 × 6 = 12 eggs</text>`;
  svg += `</svg>`;
  return svg;
}

function getVisual(type) {
  switch(type) {
    case 'apples': return svgApples();
    case 'sheep': return svgSheep();
    case 'cookies': return svgCookies();
    case 'pizza': return svgPizza();
    case 'towers': return svgTowers();
    case 'eggs': return svgEggs();
    default: return '';
  }
}

// ===========================
// RENDER STAR RATING
// ===========================
function renderStars(score) {
  const full = Math.floor(score);
  const half = (score % 1) >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  let stars = '';
  for (let i = 0; i < full; i++) {
    stars += `<svg width="44" height="44" viewBox="0 0 44 44" style="display:inline-block;margin:0 3px"><polygon points="22,4 27,16 40,16 30,24 34,38 22,30 10,38 14,24 4,16 17,16" fill="#FFD54F" stroke="#F9A825" stroke-width="1.2"/></svg>`;
  }
  for (let i = 0; i < half; i++) {
    stars += `<svg width="44" height="44" viewBox="0 0 44 44" style="display:inline-block;margin:0 3px">
      <polygon points="22,4 27,16 40,16 30,24 34,38 22,30 10,38 14,24 4,16 17,16" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="1.2"/>
      <clipPath id="halfClip"><rect x="0" y="0" width="22" height="44"/></clipPath>
      <polygon points="22,4 27,16 40,16 30,24 34,38 22,30 10,38 14,24 4,16 17,16" fill="#FFD54F" stroke="#F9A825" stroke-width="1.2" clip-path="url(#halfClip)"/>
    </svg>`;
  }
  for (let i = 0; i < empty; i++) {
    stars += `<svg width="44" height="44" viewBox="0 0 44 44" style="display:inline-block;margin:0 3px"><polygon points="22,4 27,16 40,16 30,24 34,38 22,30 10,38 14,24 4,16 17,16" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="1.2"/></svg>`;
  }
  return stars;
}

// ===========================
// GAME LOGIC
// ===========================
function loadProblem(index) {
  const p = PROBLEMS[index];
  answered = false;
  storyText.innerHTML = p.story;
  visualAid.innerHTML = getVisual(p.visual);
  problemNumLabel.textContent = `Problem ${index+1} of ${totalProblems} · ${p.skill}`;
  feedbackArea.innerHTML = '';
  feedbackArea.className = 'feedback';
  nextBtn.style.display = 'none';

  // Options
  optionsContainer.innerHTML = '';
  p.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.dataset.index = i;
    btn.addEventListener('click', () => selectAnswer(i));
    optionsContainer.appendChild(btn);
  });
}

function selectAnswer(index) {
  if (answered) return;
  answered = true;
  const p = PROBLEMS[currentIndex];
  const btns = optionsContainer.querySelectorAll('.option-btn');
  const correct = index === p.answer;

  // Disable all
  btns.forEach(b => b.disabled = true);

  // Highlight
  btns.forEach((b, i) => {
    if (i === p.answer) b.classList.add('correct');
    if (i === index && !correct) b.classList.add('wrong');
  });

  // Score
  if (correct) {
    score++;
    scoreNum.textContent = score;
  }

  // Progress
  updateProgress();

  // Feedback
  const head = correct ? '✅ Correct!' : '❌ Not quite';
  feedbackArea.className = `feedback ${correct ? 'fb-correct' : 'fb-wrong'}`;
  feedbackArea.innerHTML = `<div class="fb-head">${head}</div><div class="fb-detail">${p.explanation}</div>`;

  // Show next
  nextBtn.style.display = 'inline-block';
  if (currentIndex === totalProblems - 1) {
    nextBtn.textContent = '🎉 See Results';
  } else {
    nextBtn.textContent = 'Next ➜';
  }
}

function updateProgress() {
  const pct = (score / MAX_SCORE) * 100;
  progressFill.style.width = Math.min(pct, 100) + '%';
}

function goNext() {
  if (currentIndex < totalProblems - 1) {
    currentIndex++;
    loadProblem(currentIndex);
  } else {
    showCelebration();
  }
}

function showCelebration() {
  problemDisplay.style.display = 'none';
  celebrationArea.classList.add('show');
  finalScore.textContent = `${score} / ${totalProblems}`;
  starsSvg.innerHTML = renderStars(score);
  updateProgress();
}

function resetGame() {
  currentIndex = 0;
  score = 0;
  answered = false;
  scoreNum.textContent = '0';
  progressFill.style.width = '0%';
  problemDisplay.style.display = 'block';
  celebrationArea.classList.remove('show');
  nextBtn.style.display = 'none';
  loadProblem(0);
}

// ===========================
// INIT
// ===========================
nextBtn.addEventListener('click', goNext);
loadProblem(0);
</script>


<script>
/* ── Speech Synthesis ── */
(function() {
  var isSpeaking = false;
  var speakBtn = document.getElementById('speakBtn');
  if (!speakBtn) return;

  function getPageText() {
    var active = document.querySelector('.slide.active, .page.active, [class*="active"]');
    if (!active) return '';
    return active.textContent.replace(/\s+/g, ' ').trim();
  }

  function speakText(text) {
    if (!text || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.85; u.pitch = 1.1; u.volume = 1;
    u.onstart = function() { isSpeaking = true; speakBtn.classList.add('speaking'); speakBtn.textContent = '⏹'; };
    u.onend = function() { isSpeaking = false; speakBtn.classList.remove('speaking'); speakBtn.textContent = '🔊'; };
    u.onerror = function() { isSpeaking = false; speakBtn.classList.remove('speaking'); speakBtn.textContent = '🔊'; };
    window.speechSynthesis.speak(u);
  }

  function stopSpeaking() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    isSpeaking = false; speakBtn.classList.remove('speaking'); speakBtn.textContent = '🔊';
  }

  speakBtn?.addEventListener('click', function() {
    if (isSpeaking) { stopSpeaking(); return; }
    speakText(getPageText());
  });
})();
</script>

<script>
(function(){
  var sx = 0, sy = 0, swiping = false;
  document.addEventListener('touchstart', function(e) {
    var t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; swiping = true;
  }, {passive:true});
  document.addEventListener('touchmove', function(e) {
    if (!swiping) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiping = false;
      // Find and click the appropriate nav button
      if (dx < 0) {
        // Swipe left → next
        var n = document.querySelector('[onclick*="next"], [onclick*="Next"], .nav-btn:last-of-type:not([disabled]), a[href*="next"], [class*="next"], #nextBtn');
        if (n) n.click();
        else { var a = document.querySelector('a[href]:not([href*="#"])'); if (a && !a.href.includes("#")) a.click(); }
      } else {
        // Swipe right → prev
        var p = document.querySelector('[onclick*="prev"], [onclick*="Prev"], .nav-btn:first-of-type:not([disabled]), [class*="prev"], #prevBtn');
        if (p) p.click();
      }
    }
  }, {passive:true});
  document.addEventListener('touchend', function() { swiping = false; }, {passive:true});
})();
</script>

<!-- ═══ Speak Page - MP3优先, TTS后备 ═══ -->
<script>
(function(){
  var btn = document.getElementById('speakBtn') || document.querySelector('.speak-btn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'speakBtn'; btn.className = 'speak-btn'; btn.title = '朗读本页';
    btn.textContent = '🔊';
    btn.style.cssText = 'position:fixed;bottom:90px;right:16px;z-index:9999;width:48px;height:48px;border-radius:50%;border:2px solid #42A5F5;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(66,165,245,.3);display:flex;align-items:center;justify-content:center';
    document.body.appendChild(btn);
  }
  var sp = false, audioEl = null;
  var courseName = (window.COURSE_NAME || (window.location.pathname.match(/\/(\w[\w-]*)\.html/) || [,''])[1] || '');
  var lang = (document.documentElement.lang || 'en-US').indexOf('zh')>=0?'zh-CN':'en-US';

  function getPageIdx(){
    var a=document.querySelector('.page.active,.slide.active');
    return a?Array.prototype.indexOf.call(a.parentNode.children,a):-1;
  }

  function speakPage(){
    if(sp){stopPage();return;}
    var idx=getPageIdx(); if(idx<0) return;
    var mp3='../audio/'+courseName+'/page-'+(idx+1)+'.mp3';
    if(audioEl){audioEl.pause();audioEl=null;}
    audioEl=new Audio(mp3);
    audioEl.onerror=function(){
      var flat=new Audio('../audio/'+courseName+'.mp3');
      flat.onerror=function(){speakTTS();};
      flat.oncanplaythrough=function(){
        if(audioEl)audioEl.pause(); audioEl=flat;
        audioEl.play().catch(function(){speakTTS();});
        btn.textContent='⏹';btn.classList.add('speaking');
      };
      flat.load();
    };
    audioEl.oncanplaythrough=function(){
      audioEl.play(); btn.textContent='⏹';btn.classList.add('speaking');
      sp=true; audioEl.onended=function(){stopPage();};
    };
    audioEl.load();
  }

  function speakTTS(){
    if(!window.speechSynthesis)return;
    var a=document.querySelector('.page.active,.slide.active');
    if(!a)return;
    var t=(a.innerText||a.textContent||'').replace(/\s+/g,' ').trim();
    if(!t||t.length<2)return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang=lang;u.rate=0.85;
    u.onstart=function(){sp=true;btn.classList.add('speaking');btn.textContent='⏹';};
    u.onend=u.onerror=function(){stopPage();};
    window.speechSynthesis.speak(u);
  }

  function stopPage(){
    if(audioEl){audioEl.pause();audioEl=null;}
    if(window.speechSynthesis)window.speechSynthesis.cancel();
    sp=false;btn.classList.remove('speaking');btn.textContent='🔊';
  }

  btn.addEventListener('click',function(e){e.stopPropagation();speakPage();});
  if(btn.textContent.trim()===''||btn.textContent.trim()==='▶')btn.textContent='🔊';
})();

(function() {
  var celebrationDone = false;
  function tryCelebrate() {
    if (celebrationDone) return;
    celebrationDone = true;
    setTimeout(function() { if (window.celebrate) window.celebrate(); }, 300);
  }
  // Trigger on scroll to bottom
  window.addEventListener('scroll', function() {
    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 100) {
      tryCelebrate();
    }
  });
  // Trigger on last nav button click
  document.addEventListener('click', function(e) {
    if (e.target && (e.target.id === 'nextBtn' || e.target.classList.contains('next-btn'))) {
      var btn = e.target;
      if (btn.disabled || btn.classList.contains('disabled')) {
        tryCelebrate();
      }
    }
  });
})();
</script>
