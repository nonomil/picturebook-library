<style>

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #e8f5e9;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ===== APP CONTAINER ===== */
.app {
  position: relative;
  width: 100%; max-width: 960px;
  height: 100vh; max-height: 780px;
  margin: 0 auto;
  background: linear-gradient(145deg, #ffffff 0%, #f1f8e9 100%);

}

/* ===== PROGRESS BAR ===== */
.progress-wrap {

  z-index: 25;
  height: 4px;
  background: rgba(200,230,200,0.4);
}
.progress-bar {
  height: 100%;
  width: 0%;

  border-radius: 0 2px 2px 0;

}

/* ===== HEADER ===== */
.header {

  z-index: 20;

  padding: 12px 18px;

}
.header a, .header button {

  font-size: 26px; line-height: 1;

}

.header a:active, .header button:active { transform: scale(0.92); }
#speakBtn { color: #43A047; font-size: 22px; }

@keyframes pulse-speak {

}

/* ===== SLIDES ===== */
.slides {

}
.slide {

}
.slide.active {

}
.slide.exit { z-index: 5; }

.slide-icon { font-size: 72px; margin-bottom: 10px; line-height: 1.2; }
.slide-img {

.slide-word {

.slide-hint {

}
.phonics-words {

}
.phonics-word {

/* Content slide */
.slide-content-text {

.sight-word-box {

/* Quiz / interactive */
.quiz-options {

.quiz-opt {

.quiz-feedback {
  font-size: 14px; padding: 6px 14px; border-radius: 8px;
  margin-top: 8px; display: none;
  font-weight: 600;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.correct { background: #E8F5E9; color: #2E7D32; }
.quiz-feedback.wrong { background: #FFEBEE; color: #C62828; }

/* Fill-in-the-blank */
.fill-group {
  display: flex; flex-direction: column; gap: 10px;
  width: 100%; max-width: 300px;
  margin-top: 8px;
}
.fill-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 15px; font-weight: 600;
  color: #333;
  flex-wrap: wrap;
  justify-content: center;
}
.fill-item .fill-blank {
  display: inline-block;

  padding: 3px 12px;
  min-width: 80px;
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  color: #2e7d32;

  transition: all 0.15s;
}
.fill-item .fill-blank:hover { background: #f1f8e9; }
.fill-item .fill-blank.filled { border-style: solid; background: #e8f5e9; }

/* Day Wheel activity */
.wheel-container {
  position: relative;
  width: 200px; height: 200px;
  margin: 8px 0;
}
.wheel-svg {
  width: 100%; height: 100%;
  transform: rotate(-90deg);
  transition: transform 0.8s cubic-bezier(0.34,1.56,0.64,1);
}
.wheel-svg.spinning {
  transform: rotate(calc(-90deg + 360deg * var(--spin-target, 0)));
}
.wheel-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 42px;
  pointer-events: none;
}
.wheel-label {
  font-size: 14px; font-weight: 700;
  color: #2e7d32;
  margin-top: 6px;
  min-height: 24px;
}
.spin-btn {
  background: #43A047;
  border: none;
  color: #FFF;
  font-family: 'Nunito', sans-serif;
  font-size: 16px; font-weight: 700;
  padding: 10px 28px;
  border-radius: 30px;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
  box-shadow: 0 4px 12px rgba(67,160,71,0.30);
  touch-action: manipulation;
}
.spin-btn:active { transform: scale(0.92); }
.spin-btn:hover { background: #2e7d32; }

/* ===== NAVIGATION ===== */
.nav {
  position: absolute; bottom: 0; left: 0; right: 0;
  z-index: 20;
  display: flex; align-items: center; justify-content: center;
  gap: 12px;
  padding: 10px 18px 18px;
  background: linear-gradient(0deg, rgba(255,255,255,0.98) 60%, transparent);
}
.nav button {
  background: #43A047; border: none; cursor: pointer;
  width: 48px; height: 48px;
  border-radius: 50%;
  font-size: 20px; color: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, transform 0.2s, opacity 0.2s;
  box-shadow: 0 4px 12px rgba(67,160,71,0.30);
  touch-action: manipulation;
}
.nav button:active { transform: scale(0.88); }
.nav button:disabled { opacity: 0.35; box-shadow: none; background: #bdbdbd; pointer-events: none; }
.nav button:hover:not(:disabled) { background: #2e7d32; }

.dots {
  display: flex; gap: 8px; align-items: center;
}
.dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #c8e6c9;
  cursor: pointer;
  transition: all 0.3s ease;
  border: none; padding: 0;
  touch-action: manipulation;
}
.dot.active {
  width: 28px; border-radius: 6px;
  background: #43A047;
}
.dot:hover:not(.active) { background: #a5d6a7; }

/* Page counter */
.page-num {
  position: absolute; bottom: 80px; left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  font-size: 12px; font-weight: 700;
  color: #a5d6a7;
  background: rgba(255,255,255,0.85);
  padding: 4px 14px;
  border-radius: 20px;
  letter-spacing: 0.5px;
  backdrop-filter: blur(4px);
}

/* ===== CELEBRATION OVERLAY ===== */
.celebration {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.0);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.celebration.show {
  opacity: 1;

}
.celeb-inner {
  text-align: center;
  background: #fff;

.celeb-icon { font-size: 56px; margin-bottom: 8px; }
.celeb-title { font-size: 28px; font-weight: 900; color: #1b5e20; }
.celeb-sub { font-size: 18px; font-weight: 700; color: #43A047; margin-top: 2px; }
.celeb-text { font-size: 14px; font-weight: 600; color: #66BB6A; margin-top: 10px; line-height: 1.4; }

// ── BUILD DOTS ──────────────────────────────────────────────
function buildDots() {
  SLIDES.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.dataset.index = i;
    dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
    dot.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(dot);
  });
}

// ── NAVIGATION ──────────────────────────────────────────────
function goTo(index) {
  if (isAnimating || index === current) return;
  if (index < 0 || index >= SLIDES.length) return;

  isAnimating = true;
  const prev = current;
  current = index;

  const prevSlide = slidesEl.children[prev];
  const nextSlide = slidesEl.children[current];

  // Exit animation
  gsap.to(prevSlide, {
    opacity: 0,
    scale: 0.92,
    duration: 0.30,
    ease: 'power2.in',
    onComplete: () => {
      prevSlide.classList.remove('active');
      prevSlide.classList.add('exit');
      prevSlide.style.cssText = '';
    }
  });

  // Enter animation
  nextSlide.classList.remove('exit');
  nextSlide.classList.add('active');
  gsap.fromTo(nextSlide,
    { opacity: 0, scale: 1.08 },
    { opacity: 1, scale: 1, duration: 0.38, ease: 'back.out(1.4)', onComplete: () => { isAnimating = false; } }
  );

  // Entrance stagger for inner elements
  const kids = nextSlide.querySelectorAll('.slide-word, .slide-chinese, .slide-icon, .slide-img, .phonics-rule, .phonics-word, .review-card, .title-main, .title-sub, .title-icons, .lesson-num, .slide-content-text, .slide-highlight, .sight-word-box, .slide-sentence, .story-text-block, .quiz-opt, .quiz-question, .fill-item, .wheel-container, .spin-btn, .wheel-label, .celeb-icon, .celeb-title, .dual-item');
  if (kids.length) {
    gsap.fromTo(kids,
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.35, stagger: 0.04, ease: 'power2.out', delay: 0.10 }
    );
  }

  updateUI();

  // Confetti on last page
  if (current === SLIDES.length - 1) {
    launchConfetti();
  }
}

function prev() { goTo(current - 1); }
function next() { goTo(current + 1); }

function updateUI() {
  const total = SLIDES.length;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;

  // Update dots
  document.querySelectorAll('.dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === current);
  });

  // Update progress bar
  const pct = ((current + 1) / total) * 100;
  if (progressBar) progressBar.style.width = pct + '%';

  // Update page counter
  if (pageNumEl) pageNumEl.textContent = (current + 1) + ' / ' + total;

  // Toggle celebration overlay on last page
  if (celebration) {
    if (current === total - 1) {
      celebration.classList.add('show');
    } else {
      celebration.classList.remove('show');
    }
  }
}

// ── SPEECH SYNTHESIS ────────────────────────────────────────
function speak(text) {
  if (!window.speechSynthesis) return;

  // Cancel any ongoing speech
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = 0.88;
  utterance.pitch = 1.05;
  utterance.volume = 1;

  speechUtterance = utterance;

  speakBtn.classList.add('speaking');

  utterance.onend = () => {
    speakBtn.classList.remove('speaking');
    speechUtterance = null;
  };
  utterance.onerror = () => {
    speakBtn.classList.remove('speaking');
    speechUtterance = null;
  };

  window.speechSynthesis.speak(utterance);
}

function speakCurrent() {
  const slide = slidesEl.children[current];
  if (!slide) return;
  const text = slide.dataset.speak || '';
  if (text) speak(text);
}

// ── INTERACTIVE: DAY WHEEL ──────────────────────────────────
function spinWheel() {
  const svg = document.getElementById('wheelSvg');
  const label = document.getElementById('wheelLabel');
  if (!svg || !label) return;

  const segments = SLIDES.find(s => s.type === 'wheel');
  if (!segments || !segments.segments) return;

  // Random spin
  const target = Math.floor(Math.random() * segments.segments.length);
  const extraSpins = 2 + Math.floor(Math.random() * 3);
  const degrees = (extraSpins * 360) + (target * 90);

  svg.style.setProperty('--spin-target', degrees / 360);
  svg.classList.add('spinning');

  setTimeout(() => {
    const seg = segments.segments[target];
    label.textContent = seg.label + ' — ' + seg.activity;
    speak(seg.label.replace(/[🌅☀️🌙🎡]/g,'').trim());
    svg.classList.remove('spinning');
  }, 900);
}

// ── INTERACTIVE: FILL-IN ────────────────────────────────────
function fillSelectWord(word) {
  window._fillState.selectedWord = word;
  // Visually highlight selected word
  document.querySelectorAll('.phonics-word[data-word]').forEach(el => {
    el.style.border = el.dataset.word === word ? '3px solid #43A047' : '2px solid #e8f5e9';
  });
}

function onFillBlank(idx) {
  const blank = document.querySelector('.fill-blank[data-idx="' + idx + '"]');
  const feedback = document.getElementById('fillFeedback');
  if (!blank || !feedback) return;

  const answer = blank.dataset.answer;
  const sel = window._fillState.selectedWord;

  if (!sel) {
    feedback.className = 'quiz-feedback show wrong';
    feedback.textContent = '👆 Tap a word first!';
    return;
  }

  if (sel === answer) {
    blank.textContent = sel;
    blank.classList.add('filled');
    window._fillState.filled[idx] = true;
    feedback.className = 'quiz-feedback show correct';
    feedback.textContent = '✅ Correct!';

    // Check if all filled
    const blanks = document.querySelectorAll('.fill-blank');
    let allDone = true;
    blanks.forEach(b => {
      if (!b.classList.contains('filled')) allDone = false;
    });
    if (allDone) {
      setTimeout(() => {
        feedback.textContent = '🎉 Great! You completed the fill-in!';
        speak('Great job! Morning, afternoon, night!');
      }, 300);
    }
  } else {
    feedback.className = 'quiz-feedback show wrong';
    feedback.textContent = '❌ Try a different word!';
  }
}

// ── INTERACTIVE: QUIZ ───────────────────────────────────────
function onQuizAnswer(qidx, optidx) {
  const slide = SLIDES[current];
  if (!slide || slide.type !== 'quiz') return;
  const q = slide.questions[qidx];
  if (!q) return;

  const fb = document.getElementById('qfb-' + qidx);
  if (!fb) return;

  // Check if already answered
  if (window._quizState[qidx] !== undefined) return;

  const allOpts = document.querySelectorAll('.quiz-opt[data-qidx="' + qidx + '"]');

  if (optidx === q.correct) {
    allOpts.forEach(el => {
      if (parseInt(el.dataset.optidx) === optidx) el.classList.add('correct');
    });
    fb.className = 'quiz-feedback show correct';
    fb.textContent = '✅ Correct!';
    window._quizState[qidx] = true;
    speak(q.options[optidx] + ' is correct!');
  } else {
    allOpts.forEach(el => {
      if (parseInt(el.dataset.optidx) === optidx) el.classList.add('wrong');
    });
    fb.className = 'quiz-feedback show wrong';
    fb.textContent = '❌ ' + (q.wrongHint || 'Try again!');
  }
}

// ── CONFETTI ────────────────────────────────────────────────
const confettiParticles = [];
const CONFETTI_COLORS = ['#43A047','#66BB6A','#FFD54F','#FF7043','#42A5F5','#AB47BC','#EF5350','#26C6DA','#FFEE58'];

function launchConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  if (!canvas) return;
  const W = canvas.width  = window.innerWidth;
  const H = canvas.height = window.innerHeight;

  // Clear old particles
  confettiParticles.length = 0;

  // Burst 200 particles
  for (let i = 0; i < 200; i++) {
    confettiParticles.push({
      x: W / 2 + (Math.random() - 0.5) * 60,
      y: H / 2,
      vx: (Math.random() - 0.5) * 18,
      vy: -Math.random() * 16 - 4,
      size: Math.random() * 10 + 5,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 12,
      gravity: 0.30 + Math.random() * 0.15,
      opacity: 1,
      drag: 0.97
    });
  }

  if (!confettiParticles.length) return;
  animateConfetti();
}

function animateConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  if (!canvas) return;
  const ctx = confettiCtx;
  const W = canvas.width;
  const H = canvas.height;

  ctx.clearRect(0, 0, W, H);

  for (let i = confettiParticles.length - 1; i >= 0; i--) {
    const p = confettiParticles[i];
    p.vx *= p.drag;
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;
    p.rotation += p.rotSpeed;
    p.opacity -= 0.002;

    if (p.opacity <= 0 || p.y > H + 20) {
      confettiParticles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation * Math.PI / 180);
    ctx.globalAlpha = Math.max(0, p.opacity);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    ctx.restore();
  }

  if (confettiParticles.length > 0) {
    requestAnimationFrame(animateConfetti);
  } else {
    ctx.clearRect(0, 0, W, H);
  }
}

// ── KEYBOARD / SWIPE ────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prev();
  if (e.key === 'ArrowRight') next();
  if (e.key === ' ') { e.preventDefault(); speakCurrent(); }
});

// Touch swipe
let touchStartX = 0;
let touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    if (dx < 0) next();
    else prev();
  }
}, { passive: true });

// ── EVENT LISTENERS ─────────────────────────────────────────
prevBtn.addEventListener('click', prev);

<!-- ═══ Speak Page - MP3优先, TTS后备 ═══ -->
<script>
(function(){
  var btn = document.getElementById('speakBtn') || document.querySelector('.speak-btn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'speakBtn'; btn.className = 'speak-btn'; btn.title = '朗读本页';
    btn.textContent = '🔊';
    btn.style.cssText = 'position:fixed;bottom:90px;right:16px;z-index:9999;width:48px;height:48px;border-radius:50%;border:2px solid #42A5F5;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(66,165,245,.3);display:flex;align-items:center;justify-content:center';
    document.body.appendChild(btn);
  }
  var sp = false, audioEl = null;
  var courseName = (window.COURSE_NAME || (window.location.pathname.match(/\/(\w[\w-]*)\.html/) || [,''])[1] || '');
  var uiv = document.documentElement.lang || 'en-US';
  var lang = uiv.indexOf('zh') >= 0 ? 'zh-CN' : 'en-US';

  function getPageIdx() {
    var active = document.querySelector('.page.active, .slide.active');
    if (!active) return -1;
    var parent = active.parentNode;
    return Array.prototype.indexOf.call(parent.children, active);
  }

  function speakPage() {
    if (sp) { stopPage(); return; }
    var idx = getPageIdx();
    if (idx < 0) return;

    // Try MP3 first: audio/COURSENAME/page-N.mp3
    var mp3Path = '../audio/' + courseName + '/page-' + (idx + 1) + '.mp3';
    if (audioEl) { audioEl.pause(); audioEl = null; }
    audioEl = new Audio(mp3Path);
    audioEl.onerror = function() {
      // MP3 failed → try flat MP3: audio/COURSENAME.mp3 or audio/songname.mp3
      var flatPath = '../audio/' + courseName + '.mp3';
      var flatAudio = new Audio(flatPath);
      flatAudio.onerror = function() {
        // Both MP3 failed → use speechSynthesis TTS
        speakTTS();
      };
      flatAudio.oncanplaythrough = function() {
        if (audioEl) audioEl.pause();
        audioEl = flatAudio;
        audioEl.play().catch(function(){ speakTTS(); });
        btn.textContent = '⏹'; btn.classList.add('speaking');
      };
      flatAudio.load();
    };
    audioEl.oncanplaythrough = function() {
      audioEl.play();
      btn.textContent = '⏹'; btn.classList.add('speaking');
      sp = true;
      audioEl.onended = function(){ stopPage(); };
    };
    audioEl.load();
  }

  function speakTTS() {
    if (!window.speechSynthesis) return;
    var active = document.querySelector('.page.active, .slide.active');
    if (!active) return;
    var txt = (active.innerText || active.textContent || '').replace(/\s+/g, ' ').trim();
    if (!txt || txt.length < 2) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = lang; u.rate = 0.85;
    u.onstart = function(){ sp = true; btn.classList.add('speaking'); btn.textContent = '⏹'; };
    u.onend = u.onerror = function(){ stopPage(); };
    window.speechSynthesis.speak(u);
  }

  function stopPage() {
    if (audioEl) { audioEl.pause(); audioEl = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    sp = false; btn.classList.remove('speaking'); btn.textContent = '🔊';
  }

  btn.addEventListener('click', function(e){ e.stopPropagation(); speakPage(); });
  if (btn.textContent.trim() === '' || btn.textContent.trim() === '▶') btn.textContent = '🔊';
})();
</script>

<script>
/* Unified nav (added by conversion) - uses unique names to avoid conflicts */
(function(){
  var pages = document.querySelectorAll('.page,.slide');
  var total = pages.length;
  if(total < 2) return;
  var cur = 0;
  pages.forEach(function(p,i){ if(p.classList.contains('active')) cur = i; });
  
  window.navGoTo = function(n){
    n = Math.max(0, Math.min(total - 1, n));
    pages.forEach(function(p,i){ p.classList.toggle('active', i === n); });
    var p = document.getElementById('prevBtn'), nx = document.getElementById('nextBtn');
    if(p) p.disabled = n === 0;
    if(nx) nx.disabled = n === total - 1;
    var c = document.getElementById('pageDots');
    if(c){ c.querySelectorAll('.dot').forEach(function(d,i){ d.classList.toggle('active', i === n); }); }
    cur = n;
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    // Trigger page change callback if exists
    if(typeof window.onPageChange === 'function') window.onPageChange(n);
  };
  window.navPrev = function(){ window.navGoTo(cur - 1); };
  window.navNext = function(){ window.navGoTo(cur + 1); };
  window.navSpeakCurrentPage = function(){
    var btn = document.getElementById('speakBtn') || document.querySelector('.speak-btn');
    if(btn) btn.click();
  };
  
  // Build dots
  var c = document.getElementById('pageDots');
  if(c){
    c.innerHTML = '';
    for(var i = 0; i < total; i++){
      var d = document.createElement('button');
      d.className = 'dot' + (i === cur ? ' active' : '');
      d.setAttribute('data-idx', i);
      d.onclick = function(){ window.navGoTo(parseInt(this.getAttribute('data-idx'))); };
      c.appendChild(d);
    }
  }
  var p = document.getElementById('prevBtn');
  if(p) p.disabled = cur === 0;
})();
