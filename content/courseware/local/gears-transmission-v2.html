<!DOCTYPE html>
<html lang="zh-CN">
<head><link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>咕噜咕噜传动王国 ⚙️</title>
<style>


/* ===== GLOBAL RESET ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html{scroll-behavior:smooth}
body{font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#faf5f0;min-height:100vh;color:#334155;overflow:hidden;line-height:1.7;font-size:16px}
canvas{display:block;touch-action:none;cursor:grab;width:100%}
canvas:active{cursor:grabbing}

/* ===== PAGE CONTAINER ===== */
.page-container{display:flex;width:100vw;height:100vh;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.page{min-width:100vw;width:100vw;height:100vh;flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:60px 20px 80px}
.page::-webkit-scrollbar{width:4px}
.page::-webkit-scrollbar-thumb{background:rgba(26,54,93,0.15);border-radius:2px}

/* ===== PAGE NAVIGATION BAR ===== */
.page-nav{position:fixed;bottom:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(250,245,240,0.95);backdrop-filter:blur(8px);border-top:1px solid rgba(0,0,0,0.06);box-shadow:0 -2px 12px rgba(30,20,10,0.06)}
.page-nav-btn{padding:8px 20px;border-radius:8px;border:1px solid rgba(0,0,0,0.08);background:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:'Source Sans 3',sans-serif;color:#334155;transition:all .2s ease;min-width:100px;text-align:center}
.page-nav-btn:hover{border-color:#1a365d;background:rgba(26,54,93,0.04)}
.page-nav-btn:active{transform:scale(0.97)}
.page-nav-btn:disabled{opacity:0.3;cursor:not-allowed;pointer-events:none}
.page-dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:50vw}
.page-dot{width:8px;height:8px;border-radius:50%;background:rgba(26,54,93,0.12);border:none;padding:0;cursor:pointer;transition:all .3s ease}
.page-dot.active{background:#d97706;transform:scale(1.4)}
.page-dot:hover{background:rgba(26,54,93,0.3)}
.page-counter{font-size:12px;color:#94a3b8;font-weight:500;letter-spacing:0.05em;white-space:nowrap;margin:0 12px}

/* ===== CONFIG-DRIVEN COLORS ===== */
:root{
  --primary:#1a365d;--primary-light:#2d4a7a;--primary-dark:#0f2340;
  --accent:#d97706;--accent-light:#f59e0b;
  --sage:#4a7c59;--sage-light:#6b9e7a;
  --cream:#faf5f0;--cream-dark:#f0ebe3;
  --slate:#334155;--slate-light:#64748b;--slate-lighter:#94a3b8;
  --hero-color:#1a365d;
  --card-bg:#faf5f0;--card-border:rgba(0,0,0,0.06);
  --shadow-sm:0 1px 3px rgba(30,20,10,0.06);
  --shadow-md:0 2px 8px rgba(30,20,10,0.08);
  --shadow-lg:0 4px 16px rgba(30,20,10,0.1);
  --radius:8px;--radius-lg:12px;
}

/* ===== NAVIGATION DOTS (hidden, replaced by page nav) ===== */
.nav-dots{display:none}

/* ===== SECTION BASE ===== */
.section{min-height:auto;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;opacity:1;transform:translateY(0);transition:opacity .8s ease,transform .8s ease}
/* Alternating page backgrounds for visual variety */
.page:nth-child(odd):not(:first-of-type){background:linear-gradient(180deg,rgba(26,54,93,0.02) 0%,#faf5f0 40%)}
.page:nth-child(even):not(:first-of-type){background:linear-gradient(180deg,rgba(217,119,6,0.02) 0%,#faf5f0 40%)}
.page:nth-child(n+8){background:linear-gradient(180deg,rgba(74,124,89,0.02) 0%,#faf5f0 40%)}
/* Hero page - full screen, no padding */
.page:first-of-type{padding:0;overflow:hidden}
/* Knowledge section pages get a subtle accent top bar */
.page:nth-child(odd):not(:first-of-type){background:linear-gradient(180deg,rgba(26,54,93,0.02) 0%,#faf5f0 40%)}
.page:nth-child(even):not(:first-of-type){background:linear-gradient(180deg,rgba(217,119,6,0.02) 0%,#faf5f0 40%)}
/* Game section pages */
.page:nth-child(n+8){background:linear-gradient(180deg,rgba(74,124,89,0.02) 0%,#faf5f0 40%)}
/* Hero page full-screen */
.page:first-of-type{padding:0;overflow:hidden}
.section.scrolled-in{opacity:1;transform:translateY(0)}
.section-inner{width:100%;max-width:760px}

/* ===== HERO COVER ===== */
#hero{background:linear-gradient(160deg,#0f2340 0%,#1a365d 35%,#2d4a7a 60%,#4a3f2a 85%,#d97706 100%);color:#fff;text-align:center;overflow:hidden;position:relative;height:100vh}
#hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(217,119,6,0.12) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(74,124,89,0.08) 0%,transparent 50%);pointer-events:none}
#hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(to top,#faf5f0,transparent);pointer-events:none;z-index:1}
.hero-gears{position:absolute;width:100%;height:100%;top:0;left:0;pointer-events:none;opacity:0.08}
.hero-content{position:relative;z-index:2;padding:20px}
.hero-icon{width:clamp(64px,12vw,100px);height:clamp(64px,12vw,100px);margin:0 auto 24px;opacity:0.85;animation:hero-breathe 6s ease-in-out infinite}
.hero-icon svg{width:100%;height:100%}
.hero-title{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-size:clamp(32px,8vw,60px);font-weight:700;letter-spacing:0.02em;text-shadow:0 2px 20px rgba(0,0,0,0.3);margin:0 0 12px;line-height:1.2}
.hero-subtitle{font-size:clamp(13px,3.5vw,18px);font-weight:300;opacity:0.75;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:36px}
.hero-btn{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:14px 40px;border-radius:40px;font-size:15px;font-weight:500;cursor:pointer;backdrop-filter:blur(8px);transition:all .4s ease;font-family:'Source Sans 3',sans-serif;letter-spacing:0.08em;text-transform:uppercase}
.hero-btn:hover{background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.4);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,0.2)}
.hero-btn:active{transform:translateY(0);background:rgba(255,255,255,0.25)}
.hero-particles{position:absolute;inset:0;pointer-events:none;z-index:1}

/* ===== SECTION HEADERS ===== */
.sec-number{font-family:'Playfair Display',Georgia,serif;font-size:13px;font-weight:500;color:var(--accent);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:6px;text-align:center}
.sec-title{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-size:clamp(24px,5vw,34px);color:var(--primary);text-align:center;margin-bottom:8px;font-weight:600;line-height:1.3}
.sec-icon{width:36px;height:36px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}
.sec-icon svg{width:100%;height:100%;opacity:0.7}
.sec-desc{font-size:clamp(14px,3.5vw,16px);color:var(--slate-light);text-align:center;margin-bottom:20px;line-height:1.8;font-weight:400}

/* ===== CARD ===== */
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:20px;margin-bottom:16px}

/* ===== SLIDER ===== */
.slider-row{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.slider-row label{font-size:14px;color:var(--slate-light);font-weight:500}
.slider-row input[type=range]{-webkit-appearance:none;width:140px;height:4px;border-radius:2px;background:var(--cream-dark);outline:none}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.15);transition:transform .2s}
.slider-row input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
.slider-val{font-size:14px;font-weight:600;color:var(--primary);min-width:28px;text-align:center;font-family:'Playfair Display',Georgia,serif}

/* ===== BUTTONS ===== */
.btn{border:none;padding:10px 24px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;transition:all .25s ease;font-family:'Source Sans 3',sans-serif;color:#fff;letter-spacing:0.02em}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--primary)}
.btn-primary:hover{background:var(--primary-light);box-shadow:var(--shadow-md)}
.btn-secondary{background:var(--sage)}
.btn-secondary:hover{background:var(--sage-light)}
.btn-success{background:var(--sage)}
.btn-success:hover{background:var(--sage-light)}
.btn-warning{background:var(--accent)}
.btn-warning:hover{background:var(--accent-light)}

/* ===== GAME AREA ===== */
.game-area{position:relative;width:100%;border-radius:var(--radius-lg);overflow:hidden;background:var(--cream);min-height:300px;border:1px solid var(--card-border)}
.game-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(250,245,240,0.95);border-bottom:1px solid var(--card-border);flex-wrap:wrap;gap:6px}
.game-score{font-size:15px;font-weight:600;color:var(--primary);font-family:'Playfair Display',Georgia,serif}
.game-progress{font-size:13px;color:var(--slate-lighter);font-weight:400}
.game-goal{font-size:15px;font-weight:500;color:var(--slate);text-align:center;padding:12px 16px;background:rgba(255,255,255,0.6);border-radius:var(--radius);margin:8px;border:1px solid var(--card-border)}
.game-canvas-wrap{width:100%;position:relative}
.game-feedback{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .5s ease;z-index:10;font-size:14px;font-weight:600;color:var(--sage);letter-spacing:0.05em;text-transform:uppercase;background:rgba(250,245,240,0.95);padding:8px 20px;border-radius:var(--radius);border:1px solid var(--card-border)}
.game-feedback.show{opacity:1}
.game-palette{display:flex;gap:8px;justify-content:center;padding:10px;flex-wrap:wrap}
.game-palette-item{width:56px;height:56px;border-radius:var(--radius);background:#fff;border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;transition:all .2s ease;box-shadow:var(--shadow-sm)}
.game-palette-item:hover{border-color:var(--primary);box-shadow:var(--shadow-md)}
.game-palette-item:active{transform:scale(0.95);border-color:var(--primary)}
.game-buckets{display:flex;gap:12px;justify-content:center;padding:12px;flex-wrap:wrap}
.game-bucket{width:120px;min-height:80px;border:1px dashed var(--slate-lighter);border-radius:var(--radius);padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .3s ease;background:rgba(255,255,255,0.4)}
.game-bucket.highlight{border-color:var(--primary);background:rgba(26,54,93,0.04);border-style:solid}
.game-bucket-label{font-size:18px}
.game-bucket-text{font-size:11px;color:var(--slate-lighter);font-weight:400}
.game-bucket-items{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.game-options{display:flex;gap:10px;justify-content:center;padding:12px;flex-wrap:wrap}
.game-option{padding:10px 20px;border-radius:var(--radius);border:1px solid var(--card-border);background:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s ease;color:var(--slate)}
.game-option:hover{border-color:var(--slate-lighter);box-shadow:var(--shadow-sm)}
.game-option:active{transform:scale(0.97)}
.game-option.correct{border-color:var(--sage);background:rgba(74,124,89,0.08);color:#2d5a3a}
.game-option.wrong{border-color:#b91c1c;background:rgba(185,28,28,0.06);color:#991b1b}
.game-option.selected{border-color:var(--primary);background:rgba(26,54,93,0.06)}

/* ===== SUMMARY CARDS ===== */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.summary-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:16px;text-align:center;box-shadow:var(--shadow-sm);transition:transform .3s ease,box-shadow .3s ease}
.summary-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.summary-card .icon{font-size:28px;margin-bottom:6px;opacity:0.8}
.summary-card .label{font-size:13px;color:var(--slate-light);font-weight:500;margin-bottom:4px}
.summary-card .value{font-size:15px;font-weight:600;color:var(--primary);font-family:'Playfair Display',Georgia,serif}

/* ===== QUIZ ===== */
.quiz-q{font-size:16px;font-weight:600;text-align:center;margin:12px 0;padding:16px;background:rgba(255,255,255,0.5);border-radius:var(--radius);color:var(--slate);line-height:1.6;border:1px solid var(--card-border)}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.quiz-opt{padding:14px;border-radius:var(--radius);border:1px solid var(--card-border);background:#fff;font-size:14px;cursor:pointer;text-align:center;transition:all .2s ease;font-weight:500;color:var(--slate)}
.quiz-opt:hover{border-color:var(--slate-lighter);box-shadow:var(--shadow-sm)}
.quiz-opt:active{transform:scale(0.97)}
.quiz-opt.correct{border-color:var(--sage);background:rgba(74,124,89,0.08)}
.quiz-opt.wrong{border-color:#b91c1c;background:rgba(185,28,28,0.06)}
.quiz-result{text-align:center;font-size:18px;font-weight:600;margin:12px 0;color:var(--primary);font-family:'Playfair Display',Georgia,serif}

/* ===== SUBTLE FEEDBACK EFFECT ===== */
@keyframes gentle-pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.gentle-pulse{animation:gentle-pulse .4s ease}

/* ===== ANIMATIONS ===== */
@keyframes hero-breathe{0%,100%{transform:scale(1);opacity:0.85}50%{transform:scale(1.03);opacity:1}}
@keyframes float-particle{0%,100%{transform:translateY(0) rotate(0deg);opacity:0.15}50%{transform:translateY(-20px) rotate(180deg);opacity:0.25}}
@keyframes fade-in-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes gentle-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* ===== DECORATIVE PAPER TEXTURE ===== */
.section::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='60' height='60' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0}

/* ===== RESPONSIVE ===== */
@media(max-width:480px){
  .section{padding:24px 14px}
  .card{padding:14px}
  .game-header{padding:8px 12px}
  .hero-title{letter-spacing:0}
  .nav-dots{right:10px;gap:8px}
  .nav-dot{width:6px;height:6px}
}
</style>
</head>
<body>

<!-- ===== NAVIGATION DOTS ===== -->
<div class="nav-dots" id="navDots"></div>

<!-- ===== HERO COVER ===== -->
<section class="section" id="hero">
  <canvas class="hero-gears" id="heroGearsCanvas"></canvas>
  <div class="hero-particles" id="heroParticles"></div>
  <div class="hero-content">
    <div class="hero-icon" id="heroIcon">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="28" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none"/>
        <circle cx="50" cy="50" r="8" fill="rgba(255,255,255,0.4)"/>
        <g stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round">
          <line x1="50" y1="18" x2="50" y2="10"/>
          <line x1="50" y1="90" x2="50" y2="82"/>
          <line x1="18" y1="50" x2="10" y2="50"/>
          <line x1="90" y1="50" x2="82" y2="50"/>
          <line x1="27.3" y1="27.3" x2="21.7" y2="21.7"/>
          <line x1="78.3" y1="78.3" x2="72.7" y2="72.7"/>

        </g>
        <circle cx="50" cy="50" r="36" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4 6" fill="none"/>
      </svg>
    </div>
    <h1 class="hero-title" id="heroTitle">传动王国</h1>
    <p class="hero-subtitle" id="heroSubtitle">齿轮 · 链条 · 连杆 · 传动带</p>
    <button class="hero-btn" onclick="goToPage(0)">开始探索</button>
  </div>
</section>

<!-- ===== KNOWLEDGE SECTIONS ===== -->
<div id="knowledgeSections"></div>

<!-- ===== GAME SECTIONS ===== -->
<div id="gameSections"></div>

<!-- ===== SUMMARY SECTION ===== -->
<section class="section" id="summarySection">
  <div class="section-inner">
    <div class="sec-number">07</div>
    <div class="sec-icon">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 3l4.5 9.5L33 14l-7.5 7 2 10L18 27l-9.5 4 2-10L3 14l10.5-1.5z" stroke="#d97706" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2 class="sec-title">知识总结</h2>
    <p class="sec-desc">你已经学完了传动的所有知识，来做个小测验吧</p>
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="card" id="finalQuiz"></div>
  </div>
</section>

<script>
// ====================================================================
// ===== CONFIG (EDIT THIS FOR NEW TOPIC) =====
// ====================================================================
const TEMPLATE_CONFIG = {
  topic: {
    title: "咕噜咕噜传动王国",
    subtitle: "齿轮 · 链条 · 连杆 · 传动带",
    emoji: "⚙️",
    heroColor: "#d97706",
    sections: [
      { id: "gear-basics", icon: "⚙️", title: "齿轮转转转", type: "interactive-gear", desc: "拖拽齿轮让它旋转！改变齿数看看有什么变化" },
      { id: "gear-pair", icon: "🔄", title: "大小齿轮配对", type: "gear-pair", desc: "两个齿轮咬合在一起，转动一个，另一个也跟着转" },
      { id: "chain-drive", icon: "⛓️", title: "链条传动", type: "chain-drive", desc: "自行车是怎么把脚踏的力量传到轮子的？" },
      { id: "linkage", icon: "🔗", title: "连杆机构", type: "linkage", desc: "一根杆子能变出各种运动！" },
      { id: "belt-drive", icon: "🏗️", title: "传动带", type: "belt-drive", desc: "软软的皮带也能传递力量" },
      { id: "gear-lab", icon: "🧪", title: "齿轮实验室", type: "gear-lab", desc: "自由调整参数，探索齿轮的物理世界" }
    ]
  },
  games: [
    { id: "game-match", title: "齿轮配对", icon: "🎯", difficulty: "Easy", desc: "调整齿轮比到目标值" },
    { id: "game-fix", title: "修理机器", icon: "🔧", difficulty: "Medium", desc: "把正确的传动零件放进去" },
    { id: "game-chain", title: "齿轮接龙", icon: "🐲", difficulty: "Medium", desc: "按顺序排列齿轮达到目标速度" },
    { id: "game-sort", title: "传动分类", icon: "📦", difficulty: "Easy", desc: "把物品拖到正确的传动类型" },
    { id: "game-speed", title: "速度与力量", icon: "💪", difficulty: "Medium", desc: "选择合适的齿轮完成任务" },
    { id: "game-puzzle", title: "齿轮拼图", icon: "🧩", difficulty: "Hard", desc: "填满空缺让所有齿轮转动" },
    { id: "game-find", title: "找找传动", icon: "🔍", difficulty: "Easy", desc: "在图中找到指定的传动部件" },
    { id: "game-build", title: "创造机器", icon: "🏭", difficulty: "Hard", desc: "用零件组装能完成任务的机器" }
  ]
};

// ====================================================================
// ===== REUSABLE ENGINE (DON'T EDIT) =====
// ====================================================================

// --- State ---
let currentSection = 0;
let allSections = [];
let gameStates = {};

// --- Utility ---
function $(sel, ctx) { return (ctx || document).querySelector(sel); }
function $$(sel, ctx) { return [...(ctx || document).querySelectorAll(sel)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function randInt(lo, hi) { return Math.floor(Math.random() * (hi - lo + 1)) + lo; }
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = randInt(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

// --- Canvas Gear Drawing ---
function drawGear(ctx, cx, cy, radius, teeth, angle, color, hubColor) {
  const toothH = radius * 0.13;
  const outerR = radius + toothH;
  const innerR = radius - toothH * 0.5;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.beginPath();
  for (let i = 0; i < teeth; i++) {
    const a1 = (i / teeth) * Math.PI * 2;
    const a2 = ((i + 0.3) / teeth) * Math.PI * 2;
    const a3 = ((i + 0.7) / teeth) * Math.PI * 2;
    const a4 = ((i + 1) / teeth) * Math.PI * 2;
    if (i === 0) ctx.moveTo(Math.cos(a1) * innerR, Math.sin(a1) * innerR);
    ctx.lineTo(Math.cos(a2) * outerR, Math.sin(a2) * outerR);
    ctx.lineTo(Math.cos(a3) * outerR, Math.sin(a3) * outerR);
    ctx.lineTo(Math.cos(a4) * innerR, Math.sin(a4) * innerR);
  }
  ctx.closePath();
  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, outerR);
  grad.addColorStop(0, color);
  grad.addColorStop(1, shadeColor(color, -20));
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = shadeColor(color, -30);
  ctx.lineWidth = 2;
  ctx.stroke();
  // Inner circle
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.6, 0, Math.PI * 2);
  ctx.fillStyle = shadeColor(color, 15);
  ctx.fill();
  // Hub
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.15, 0, Math.PI * 2);
  ctx.fillStyle = hubColor || '#fff';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawGearEyes(ctx, cx, cy, radius, blinkPhase) {
  const eyeR = radius * 0.12;
  const pupilR = eyeR * 0.5;
  const eyeSpacing = radius * 0.22;
  const blinkScale = blinkPhase > 0.9 ? (1 - blinkPhase) * 10 : 1;
  ctx.save();
  // Left eye
  ctx.beginPath();
  ctx.ellipse(cx - eyeSpacing, cy - radius * 0.05, eyeR, eyeR * blinkScale, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx - eyeSpacing, cy - radius * 0.05, pupilR * blinkScale, 0, Math.PI * 2);
  ctx.fillStyle = '#334155';
  ctx.fill();
  // Right eye
  ctx.beginPath();
  ctx.ellipse(cx + eyeSpacing, cy - radius * 0.05, eyeR, eyeR * blinkScale, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + eyeSpacing, cy - radius * 0.05, pupilR * blinkScale, 0, Math.PI * 2);
  ctx.fillStyle = '#334155';
  ctx.fill();
  // Smile
  ctx.beginPath();
  ctx.arc(cx, cy + radius * 0.1, radius * 0.15, 0.1 * Math.PI, 0.9 * Math.PI);
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawLabel(ctx, text, x, y, color) {
  ctx.save();
  ctx.font = 'bold 13px -apple-system,sans-serif';
  ctx.fillStyle = color || '#475569';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function shadeColor(hex, pct) {
  if (!hex || hex[0] !== '#') return hex;
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  r = clamp(r + pct, 0, 255);
  g = clamp(g + pct, 0, 255);
  b = clamp(b + pct, 0, 255);
  return '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('');
}

// --- Touch/Mouse Drag Helper ---
function addDrag(canvas, onStart, onMove, onEnd) {
  let dragging = false;
  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e) { e.preventDefault(); dragging = true; const p = getPos(e); if (onStart) onStart(p); }
  function move(e) { if (!dragging) return; e.preventDefault(); const p = getPos(e); if (onMove) onMove(p); }
  function end(e) { if (!dragging) return; dragging = false; if (onEnd) onEnd(); }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
}

// --- Setup Canvas ---
function setupCanvas(canvas, heightRatio) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = rect.width;
  const H = Math.min(W * (heightRatio || 0.65), 420);
  canvas.style.height = H + 'px';
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, W, H };
}

function initGearBasics() {
  const cv = $('#cv-gear-basics');
  const ctrl = $('#controls-gear-basics');
  let { ctx, W, H } = setupCanvas(cv, 0.6);
  let teeth = 12, angle = 0, angVel = 0, dragging = false, lastAngle = null;
  let blink = 0, nextBlink = 2000 + Math.random() * 2000, lastTime = 0;

  ctrl.innerHTML = `
    <div class="slider-row">
      <label>齿数:</label>
      <input type="range" id="teethSlider" min="6" max="24" value="12">
      <span class="slider-val" id="teethVal">12</span>
    </div>`;

  const slider = $('#teethSlider');
  const teethVal = $('#teethVal');
  slider.addEventListener('input', () => { teeth = +slider.value; teethVal.textContent = teeth; });

  addDrag(cv,
    (p) => { dragging = true; lastAngle = Math.atan2(p.y - H / 2, p.x - W / 2); },
    (p) => {
      if (!dragging) return;
      const a = Math.atan2(p.y - H / 2, p.x - W / 2);
      let d = a - lastAngle;
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      angle += d;
      angVel = d * 60;
      lastAngle = a;
    },
    () => { dragging = false; }
  );

  function render(time) {
    const dt = time - lastTime; lastTime = time;
    if (!dragging) { angle += angVel * dt / 1000; angVel *= 0.97; }
    blink += dt / 1000;
    if (blink > nextBlink / 1000) { blink = 0; nextBlink = 2000 + Math.random() * 2000; }
    const blinkPhase = blink < 0.15 ? blink / 0.15 : 1;
    ctx.clearRect(0, 0, W, H);
    const r = Math.min(W, H) * 0.28;
    drawGear(ctx, W / 2, H / 2, r, teeth, angle, '#d97706', '#fff');
    drawGearEyes(ctx, W / 2, H / 2, r, blinkPhase);
    drawLabel(ctx, `${teeth} 齿`, W / 2, H / 2 + r + 24, '#b45309');
    drawLabel(ctx, '拖拽旋转齿轮', W / 2, H - 16, '#94a3b8');
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

function initGearPair() {
  const cv = $('#cv-gear-pair');
  let { ctx, W, H } = setupCanvas(cv, 0.6);
  const t1 = 20, t2 = 10;
  let angle1 = 0, angVel = 0, dragging = false, lastAngle = null;
  let blink = 0, nextBlink = 2500, lastTime = 0;

  const r1 = () => Math.min(W, H) * 0.2;
  const r2 = () => r1() * (t2 / t1);
  const gap = () => r1() + r2() + r1() * 0.1;
  const c1x = () => W / 2 - gap() / 2;
  const c2x = () => W / 2 + gap() / 2;
  const cy = () => H / 2;

  addDrag(cv,
    (p) => { dragging = true; lastAngle = Math.atan2(p.y - cy(), p.x - c1x()); },
    (p) => {
      if (!dragging) return;
      const a = Math.atan2(p.y - cy(), p.x - c1x());
      let d = a - lastAngle;
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      angle1 += d;
      angVel = d * 60;
      lastAngle = a;
    },
    () => { dragging = false; }
  );

  function render(time) {
    const dt = time - lastTime; lastTime = time;
    if (!dragging) { angle1 += angVel * dt / 1000; angVel *= 0.97; }
    blink += dt / 1000;
    if (blink > nextBlink / 1000) { blink = 0; nextBlink = 2500; }
    const bp = blink < 0.15 ? blink / 0.15 : 1;
    ctx.clearRect(0, 0, W, H);
    drawGear(ctx, c1x(), cy(), r1(), t1, angle1, '#d97706', '#fff');
    drawGearEyes(ctx, c1x(), cy(), r1(), bp);
    drawGear(ctx, c2x(), cy(), r2(), t2, -angle1 * (t1 / t2), '#1a365d', '#fff');
    drawGearEyes(ctx, c2x(), cy(), r2(), bp);
    drawLabel(ctx, `${t1} 齿 (慢)`, c1x(), cy() + r1() + 24, '#b45309');
    drawLabel(ctx, `${t2} 齿 (快${t1/t2}×)`, c2x(), cy() + r2() + 24, '#0f2340');
    drawLabel(ctx, '拖拽大齿轮试试', W / 2, H - 16, '#94a3b8');
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

function initChainDrive() {
  const cv = $('#cv-chain-drive');
  const ctrl = $('#controls-chain-drive');
  let { ctx, W, H } = setupCanvas(cv, 0.6);
  let angle = 0, angVel = 0, dragging = false, lastAngle = null, tension = 0.5;

  ctrl.innerHTML = `
    <div class="slider-row">
      <label>链条松紧:</label>
      <input type="range" id="tensionSlider" min="0" max="100" value="50">
      <span class="slider-val" id="tensionVal">50</span>
    </div>`;

  const slider = $('#tensionSlider');
  const tVal = $('#tensionVal');
  slider.addEventListener('input', () => { tension = +slider.value / 100; tVal.textContent = slider.value; });

  const r1 = () => Math.min(W, H) * 0.2;
  const r2 = () => r1() * 0.65;
  const gap = () => r1() + r2() + W * 0.25;
  const c1x = () => W / 2 - gap() / 2;
  const c2x = () => W / 2 + gap() / 2;
  const cy = () => H / 2;

  addDrag(cv,
    (p) => { dragging = true; lastAngle = Math.atan2(p.y - cy(), p.x - c1x()); },
    (p) => {
      if (!dragging) return;
      const a = Math.atan2(p.y - cy(), p.x - c1x());
      let d = a - lastAngle;
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      angle += d;
      angVel = d * 60;
      lastAngle = a;
    },
    () => { dragging = false; }
  );

  function render(time) {
    if (!dragging) { angle += angVel * 0.016; angVel *= 0.97; }
    ctx.clearRect(0, 0, W, H);
    const yOff = (1 - tension) * 15;
    // Chain path
    ctx.beginPath();
    ctx.moveTo(c1x(), cy() - r1());
    ctx.lineTo(c2x(), cy() - r2() - yOff);
    ctx.arc(c2x(), cy(), r2(), -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(c1x(), cy() + r1() + yOff);
    ctx.arc(c1x(), cy(), r1(), Math.PI / 2, -Math.PI / 2);
    ctx.closePath();
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 8;
    ctx.stroke();
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 4;
    ctx.setLineDash([6, 4]);
    ctx.lineDashOffset = -angle * r1() * 0.5;
    ctx.stroke();
    ctx.setLineDash([]);
    // Sprockets
    drawGear(ctx, c1x(), cy(), r1(), 16, angle, '#2d4a7a', '#1a365d');
    drawGear(ctx, c2x(), cy(), r2(), 10, -angle * 1.6, '#2d4a7a', '#1a365d');
    drawLabel(ctx, '⛓️ 链条传动', W / 2, 24, '#1a365d');
    drawLabel(ctx, '拖拽转动 · 自行车就是这样传动的', W / 2, H - 16, '#94a3b8');
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

function initLinkage() {
  const cv = $('#cv-linkage');
  const ctrl = $('#controls-linkage');
  let { ctx, W, H } = setupCanvas(cv, 0.65);
  let angle = 0, autoPlay = true;

  ctrl.innerHTML = `<button class="btn btn-secondary" id="linkageToggle" style="display:block;margin:0 auto">⏸ 暂停</button>`;
  const toggle = $('#linkageToggle');
  toggle.addEventListener('click', () => {
    autoPlay = !autoPlay;
    toggle.textContent = autoPlay ? '⏸ 暂停' : '▶ 播放';
  });

  addDrag(cv,
    (p) => {},
    (p) => {
      const cx = W * 0.3, cy = H * 0.5;
      angle = Math.atan2(p.y - cy, p.x - cx);
    },
    () => {}
  );

  function render() {
    if (autoPlay) angle += 0.02;
    ctx.clearRect(0, 0, W, H);
    const cx = W * 0.3, cy = H * 0.5;
    const crankR = Math.min(W, H) * 0.15;
    const rodLen = crankR * 2.5;
    const rockerLen = crankR * 1.8;
    const fixedDist = crankR * 2.2;
    // Crank endpoint
    const ex = cx + Math.cos(angle) * crankR;
    const ey = cy + Math.sin(angle) * crankR;
    // Rocker pivot
    const rx = cx + fixedDist, ry = cy;
    // Find rocker angle using law of cosines
    const dx = ex - rx, dy = ey - ry;
    const d = Math.hypot(dx, dy);
    const cosA = clamp((d * d + rockerLen * rockerLen - rodLen * rodLen) / (2 * d * rockerLen), -1, 1);
    const baseA = Math.atan2(dy, dx);
    const rockerAngle = baseA + Math.acos(cosA);
    const bx = rx + Math.cos(rockerAngle) * rockerLen;
    const by = ry + Math.sin(rockerAngle) * rockerLen;
    // Draw
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    // Crank
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey);
    ctx.strokeStyle = '#d97706'; ctx.stroke();
    // Rod
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(bx, by);
    ctx.strokeStyle = '#1a365d'; ctx.stroke();
    // Rocker
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(bx, by);
    ctx.strokeStyle = '#4a7c59'; ctx.stroke();
    // Fixed pivots
    [cx, rx].forEach((px, i) => {
      ctx.beginPath(); ctx.arc(px, cy, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#334155'; ctx.fill();
    });
    // Moving joints
    [[ex, ey], [bx, by]].forEach(([jx, jy]) => {
      ctx.beginPath(); ctx.arc(jx, jy, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#d97706'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    });
    // Trace path
    ctx.beginPath();
    ctx.arc(bx, by, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,107,53,0.3)'; ctx.fill();
    drawLabel(ctx, '🔗 曲柄摇杆机构', W / 2, 24, '#334155');
    drawLabel(ctx, '橙色=曲柄 蓝色=连杆 绿色=摇杆', W / 2, H - 16, '#94a3b8');
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

function initBeltDrive() {
  const cv = $('#cv-belt-drive');
  const ctrl = $('#controls-belt-drive');
  let { ctx, W, H } = setupCanvas(cv, 0.6);
  let angle = 0, crossed = false;

  ctrl.innerHTML = `<button class="btn btn-primary" id="beltToggle" style="display:block;margin:0 auto">🔄 切换交叉/平行</button>`;
  const toggle = $('#beltToggle');
  toggle.addEventListener('click', () => { crossed = !crossed; toggle.textContent = crossed ? '🔄 平行传动' : '🔄 交叉传动'; });

  addDrag(cv,
    (p) => {},
    (p) => {
      const cx = W * 0.25, cy = H / 2;
      angle = Math.atan2(p.y - cy, p.x - cx);
    },
    () => {}
  );

  function render() {
    angle += 0.015;
    ctx.clearRect(0, 0, W, H);
    const r1 = Math.min(W, H) * 0.18;
    const r2 = r1 * 0.6;
    const c1x = W * 0.3, cy = H / 2;
    const c2x = W * 0.7;
    // Belt
    ctx.beginPath();
    if (crossed) {
      ctx.moveTo(c1x, cy - r1);
      ctx.lineTo(c2x, cy + r2);
      ctx.arc(c2x, cy, r2, Math.PI / 2, -Math.PI / 2, true);
      ctx.lineTo(c1x, cy + r1);
      ctx.arc(c1x, cy, r1, Math.PI / 2, -Math.PI / 2, true);
    } else {
      ctx.moveTo(c1x, cy - r1);
      ctx.lineTo(c2x, cy - r2);
      ctx.arc(c2x, cy, r2, -Math.PI / 2, Math.PI / 2);
      ctx.lineTo(c1x, cy + r1);
      ctx.arc(c1x, cy, r1, Math.PI / 2, -Math.PI / 2);
    }
    ctx.closePath();
    ctx.fillStyle = crossed ? 'rgba(255,152,0,0.15)' : 'rgba(33,150,243,0.15)';
    ctx.fill();
    ctx.strokeStyle = crossed ? '#d97706' : '#1a365d';
    ctx.lineWidth = 10;
    ctx.stroke();
    ctx.strokeStyle = crossed ? '#FFB74D' : '#64B5F6';
    ctx.lineWidth = 4;
    ctx.setLineDash([8, 5]);
    ctx.lineDashOffset = -angle * r1;
    ctx.stroke();
    ctx.setLineDash([]);
    // Pulleys
    drawGear(ctx, c1x, cy, r1, 1, angle, '#334155', '#1a365d');
    drawGear(ctx, c2x, cy, r2, 1, crossed ? -angle * (r1 / r2) : angle * (r1 / r2), '#334155', '#1a365d');
    drawLabel(ctx, crossed ? '交叉传动 (反向)' : '平行传动 (同向)', W / 2, 24, '#334155');
    drawLabel(ctx, '点击按钮切换传动方式', W / 2, H - 16, '#94a3b8');
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

function initGearLab() {
  const cv = $('#cv-gear-lab');
  const ctrl = $('#controls-gear-lab');
  let { ctx, W, H } = setupCanvas(cv, 0.65);
  let t1 = 20, t2 = 12, angle = 0, angVel = 0, dragging = false, lastAngle = null;

  ctrl.innerHTML = `
    <div class="slider-row">
      <label>主动轮:</label>
      <input type="range" id="labT1" min="8" max="28" value="20">
      <span class="slider-val" id="labT1Val">20</span>
    </div>
    <div class="slider-row">
      <label>从动轮:</label>
      <input type="range" id="labT2" min="8" max="28" value="12">
      <span class="slider-val" id="labT2Val">12</span>
    </div>`;

  const s1 = $('#labT1'), s2 = $('#labT2');
  const v1 = $('#labT1Val'), v2 = $('#labT2Val');
  s1.addEventListener('input', () => { t1 = +s1.value; v1.textContent = t1; });
  s2.addEventListener('input', () => { t2 = +s2.value; v2.textContent = t2; });

  const r1 = () => Math.min(W, H) * 0.15 * (t1 / 16);
  const r2 = () => Math.min(W, H) * 0.15 * (t2 / 16);
  const gap = () => r1() + r2() + 4;
  const c1x = () => W / 2 - gap() / 2;
  const c2x = () => W / 2 + gap() / 2;
  const cy = () => H / 2;

  addDrag(cv,
    (p) => { dragging = true; lastAngle = Math.atan2(p.y - cy(), p.x - c1x()); },
    (p) => {
      if (!dragging) return;
      const a = Math.atan2(p.y - cy(), p.x - c1x());
      let d = a - lastAngle;
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      angle += d;
      angVel = d * 60;
      lastAngle = a;
    },
    () => { dragging = false; }
  );

  function render(time) {
    if (!dragging) { angle += angVel * 0.016; angVel *= 0.97; }
    ctx.clearRect(0, 0, W, H);
    drawGear(ctx, c1x(), cy(), r1(), t1, angle, '#d97706', '#fff');
    drawGear(ctx, c2x(), cy(), r2(), t2, -angle * (t1 / t2), '#1a365d', '#fff');
    const ratio = t1 / t2;
    drawLabel(ctx, `${t1}齿`, c1x(), cy() + r1() + 18, '#b45309');
    drawLabel(ctx, `${t2}齿`, c2x(), cy() + r2() + 18, '#0f2340');
    drawLabel(ctx, `速比 ${t1}:${t2} = ${ratio.toFixed(2)}:1`, W / 2, H - 40, '#334155');
    drawLabel(ctx, `从动轮转速 ${ratio.toFixed(1)}×`, W / 2, H - 20, ratio > 1 ? '#4a7c59' : '#4a7c59');
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

// --- Game 6: Gear Puzzle ---
function initGamePuzzle() {
  const cv = $('#cv-game-puzzle');
  const goalEl = $('#goal-game-puzzle');
  const scoreEl = $('#score-game-puzzle');
  const progressEl = $('#progress-game-puzzle');
  const extra = $('#game-extra-game-puzzle');
  let { ctx, W, H } = setupCanvas(cv, 0.6);
  let round = 0, score = 0;
  const total = 4;

  const levels = [
    { grid: [[12,0,8],[0,16,12],[10,8,0]], answers: [10, 20, 14] },
    { grid: [[16,12,0],[8,0,12],[12,8,16]], answers: [14, 10] },
    { grid: [[0,10,16],[12,0,8],[8,12,0]], answers: [14, 14, 12] },
    { grid: [[20,0,12,8],[0,16,0,12],[12,0,10,0],[8,12,0,16]], answers: [14, 14, 14, 10] }
  ];
  let filled = [];

  function newRound() {
    if (round >= total) { goalEl.textContent = `拼图完成！得分: ${score}/${total}`; extra.innerHTML = ''; return; }
    const lv = levels[round];
    filled = lv.grid.map(row => row.map(v => v));
    goalEl.textContent = `填满空缺(0)，让所有齿轮能转动`;
    scoreEl.textContent = `${score}`;
    progressEl.textContent = `${round + 1} / ${total}`;
    extra.innerHTML = `<div class="game-palette" id="puzzlePalette"></div>
      <div style="text-align:center;margin-top:8px"><button class="btn btn-primary" id="puzzleCheck">检查 ✓</button> <button class="btn btn-warning" id="puzzleReset">重置</button></div>`;
    const palette = $('#puzzlePalette');
    const usedVals = new Set();
    lv.grid.forEach(r => r.forEach(v => { if (v > 0) usedVals.add(v); }));
    const avail = lv.answers.filter(a => !usedVals.has(a));
    const allAvail = [...lv.answers];
    shuffle(allAvail).forEach(s => {
      const el = document.createElement('div');
      el.className = 'game-palette-item';
      el.textContent = s;
      el.style.fontSize = '14px';
      el.style.fontWeight = '700';
      el.dataset.val = s;
      el.addEventListener('click', () => {
        for (let r = 0; r < filled.length; r++) {
          for (let c = 0; c < filled[r].length; c++) {
            if (filled[r][c] === 0) {
              filled[r][c] = s;
              el.style.opacity = '0.3';
              el.style.pointerEvents = 'none';
              drawPuzzle();
              return;
            }
          }
        }
      });
      palette.appendChild(el);
    });
    function drawPuzzle() { /* drawn in render loop */ }
    $('#puzzleReset').addEventListener('click', () => {
      filled = lv.grid.map(row => row.map(v => v));
      palette.querySelectorAll('.game-palette-item').forEach(e => { e.style.opacity = '1'; e.style.pointerEvents = 'auto'; });
    });
    $('#puzzleCheck').addEventListener('click', () => {
      let correct = true;
      for (let r = 0; r < filled.length; r++) for (let c = 0; c < filled[r].length; c++) {
        if (filled[r][c] === 0) { correct = false; break; }
      }
      if (correct) {
        let allMatch = true;
        for (let r = 0; r < filled.length; r++) for (let c = 0; c < filled[r].length; c++) {
          if (filled[r][c] !== lv.grid[r][c] && lv.grid[r][c] !== 0) { allMatch = false; break; }
        }
        // Accept any valid fill that has no zeros
        score++;
        showFeedback(cv, '✅');
        createSparkle(W / 2, H / 2, cv.parentElement);
      } else {
        showFeedback(cv, '❌');
      }
      scoreEl.textContent = `${score}`;
      round++;
      setTimeout(newRound, 900);
    });
  }

  let angle = 0;
  function render(time) {
    angle += 0.015;
    ctx.clearRect(0, 0, W, H);
    if (round < total) {
      const lv = levels[round];
      const cols = lv.grid[0].length;
      const rows = lv.grid.length;
      const cellSize = Math.min((W - 40) / cols, (H - 40) / rows, 80);
      const ox = (W - cols * cellSize) / 2;
      const oy = (H - rows * cellSize) / 2;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cx = ox + c * cellSize + cellSize / 2;
          const cy = oy + r * cellSize + cellSize / 2;
          const teeth = filled[r][c];
          if (teeth > 0) {
            const radius = cellSize * 0.35;
            const dir = (r + c) % 2 === 0 ? 1 : -1;
            drawGear(ctx, cx, cy, radius, teeth, angle * dir, filled[r][c] === lv.grid[r][c] || lv.grid[r][c] === 0 ? '#d97706' : '#cbd5e1', '#fff');
          } else {
            ctx.beginPath();
            ctx.arc(cx, cy, cellSize * 0.35, 0, Math.PI * 2);
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
            drawLabel(ctx, '?', cx, cy, '#cbd5e1');
          }
        }
      }
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
  newRound();
}

function initGameFind() {
  const cv = $('#cv-game-find');
  const goalEl = $('#goal-game-find');
  const scoreEl = $('#score-game-find');
  const progressEl = $('#progress-game-find');
  let { ctx, W, H } = setupCanvas(cv, 0.6);
  let round = 0, score = 0;
  const total = 6;
  const levels = [
    { text: '🔍 点击图中的齿轮', type: 'gear', regions: [{x:0.3,y:0.4,r:0.12},{x:0.55,y:0.5,r:0.1}] },
    { text: '🔍 点击图中的链条', type: 'chain', regions: [{x:0.45,y:0.35,r:0.15}] },
    { text: '🔍 点击图中的传动带', type: 'belt', regions: [{x:0.5,y:0.55,r:0.15}] },
    { text: '🔍 点击图中的连杆', type: 'rod', regions: [{x:0.65,y:0.4,r:0.12}] },
    { text: '🔍 点击图中的齿轮', type: 'gear', regions: [{x:0.4,y:0.6,r:0.1},{x:0.7,y:0.35,r:0.08}] },
    { text: '🔍 点击图中的传动带', type: 'belt', regions: [{x:0.5,y:0.5,r:0.18}] }
  ];

  function newRound() {
    if (round >= total) { goalEl.textContent = `找完了！得分: ${score}/${total}`; return; }
    goalEl.textContent = levels[round].text;
    scoreEl.textContent = `${score}`;
    progressEl.textContent = `${round + 1} / ${total}`;
  }

  cv.onclick = function(e) {
    if (round >= total) return;
    const rect = cv.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    const lv = levels[round];
    let hit = false;
    for (const reg of lv.regions) {
      if (dist(x, y, reg.x, reg.y) < reg.r) { hit = true; break; }
    }
    if (hit) {
      score++;
      showFeedback(cv, '✅');
      createSparkle(e.clientX - rect.left, e.clientY - rect.top, cv.parentElement);
    } else {
      showFeedback(cv, '❌');
    }
    scoreEl.textContent = `${score}`;
    round++;
    setTimeout(newRound, 700);
  };

  let t = 0;
  function render() {
    t += 0.02;
    ctx.clearRect(0, 0, W, H);
    // Draw a machine illustration
    ctx.fillStyle = '#f0ebe3';
    ctx.fillRect(0, 0, W, H);
    // Base
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(W * 0.1, H * 0.7, W * 0.8, H * 0.08);
    // Motor
    ctx.fillStyle = '#475569';
    ctx.fillRect(W * 0.12, H * 0.5, W * 0.12, H * 0.2);
    drawLabel(ctx, '电机', W * 0.18, H * 0.6, '#fff');
    // Gears
    drawGear(ctx, W * 0.3, H * 0.4, W * 0.08, 12, t, '#d97706', '#fff');
    drawGear(ctx, W * 0.45, H * 0.5, W * 0.06, 8, -t * 1.5, '#d97706', '#fff');
    // Chain
    ctx.beginPath();
    ctx.moveTo(W * 0.5, H * 0.35);
    ctx.lineTo(W * 0.7, H * 0.35);
    ctx.strokeStyle = '#1a365d';
    ctx.lineWidth = 6;
    ctx.setLineDash([4, 3]);
    ctx.lineDashOffset = -t * 20;
    ctx.stroke();
    ctx.setLineDash([]);
    // Belt
    ctx.beginPath();
    ctx.ellipse(W * 0.5, H * 0.55, W * 0.15, H * 0.06, 0, 0, Math.PI * 2);
    ctx.strokeStyle = '#1a365d';
    ctx.lineWidth = 4;
    ctx.stroke();
    // Rod
    ctx.beginPath();
    ctx.moveTo(W * 0.65, H * 0.4);
    ctx.lineTo(W * 0.8, H * 0.5);
    ctx.strokeStyle = '#4a7c59';
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(W * 0.65, H * 0.4, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#4a7c59'; ctx.fill();
    ctx.beginPath();
    ctx.arc(W * 0.8, H * 0.5, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#4a7c59'; ctx.fill();
    // Labels
    drawLabel(ctx, '⚙️齿轮', W * 0.37, H * 0.28, '#b45309');
    drawLabel(ctx, '⛓️链条', W * 0.6, H * 0.28, '#1a365d');
    drawLabel(ctx, '🏗️传动带', W * 0.5, H * 0.68, '#0f2340');
    drawLabel(ctx, '🔗连杆', W * 0.75, H * 0.38, '#2E7D32');
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
  newRound();
}

// ===== PAGE NAVIGATION =====
let currentPage = 0;
let totalPages = 0;

function goToPage(idx) {
  if (idx < 0 || idx >= totalPages) return;
  currentPage = idx;
  const container = $('#pageContainer');
  container.style.transform = 'translateX(-' + (idx * 100) + 'vw)';
  document.getElementById('pageCounter').textContent = (idx + 1) + ' / ' + totalPages;
  $$('.page-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  prev.disabled = idx === 0;
  next.disabled = idx === totalPages - 1;
}

function initSwipe() {
  let startX = 0, isDragging = false;
  document.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    isDragging = true;
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - startX;
    if (Math.abs(dx) > 50) {
      isDragging = false;
      dx > 0 ? goToPage(currentPage - 1) : goToPage(currentPage + 1);
    }
  }, { passive: true });
  document.addEventListener('touchend', () => { isDragging = false; });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goToPage(currentPage - 1);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goToPage(currentPage + 1);
  });
  // Mouse drag (desktop)
  let mouseStart = 0, mouseDown = false;
  document.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    mouseStart = e.clientX;
    mouseDown = true;
  });
  document.addEventListener('mousemove', (e) => {
    if (!mouseDown) return;
    const dx = e.clientX - mouseStart;
    if (Math.abs(dx) > 80) {
      mouseDown = false;
      dx > 0 ? goToPage(currentPage - 1) : goToPage(currentPage + 1);
    }
  });
  document.addEventListener('mouseup', () => { mouseDown = false; });
}

function createPageNav() {
  // Build container & wrap all sections
  const container = document.createElement('div');
  container.className = 'page-container';
  container.id = 'pageContainer';
  allSections.forEach(s => {
    s.classList.add('page');
    container.appendChild(s);
  });
  totalPages = allSections.length;
  // Insert container at top of body, remove old nav-dots
  const body = document.body;
  const oldNav = document.getElementById('navDots');
  if (oldNav) oldNav.remove();
  body.insertBefore(container, body.firstChild);
  // Bottom nav bar
  const nav = document.createElement('div');
  nav.className = 'page-nav';
  nav.innerHTML = '<button class="page-nav-btn" id="prevBtn" disabled>← 上一页</button>' +
    '<div style="display:flex;align-items:center;gap:8px">' +
    '<div class="page-dots" id="pageDots"></div>' +
    '<span class="page-counter" id="pageCounter">1 / ' + totalPages + '</span></div>' +
    '<button class="page-nav-btn" id="nextBtn">下一页 →</button>';
  body.appendChild(nav);
  // Dots
  const dots = $('#pageDots');
  allSections.forEach((s, i) => {
    const dot = document.createElement('button');
    dot.className = 'page-dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => goToPage(i));
    dots.appendChild(dot);
  });
  // Button events
  document.getElementById('prevBtn').addEventListener('click', () => goToPage(currentPage - 1));
  document.getElementById('nextBtn').addEventListener('click', () => goToPage(currentPage + 1));
  initSwipe();
}

// ====================================================================
// ===== BOOT =====
// ====================================================================

function boot() {
  // Apply config - use storybook palette
  document.documentElement.style.setProperty('--primary', '#1a365d');
  document.documentElement.style.setProperty('--hero-color', '#1a365d');
  document.getElementById('heroTitle').textContent = TEMPLATE_CONFIG.topic.title;
  document.getElementById('heroSubtitle').textContent = TEMPLATE_CONFIG.topic.subtitle;
  document.title = TEMPLATE_CONFIG.topic.title;

  // Build DOM (structure only, no canvas init yet)
  buildKnowledgeSections();
  buildGameSections();
  buildSummary();

  // Prep hero page - must be first in the navigation
  const heroSection = document.getElementById('hero');
  if (heroSection && !allSections.includes(heroSection)) {
    allSections.unshift(heroSection);
  }

  // Page navigation (wraps all sections into .page-container with .page class)
  // MUST run before canvas init so getBoundingClientRect() returns correct dimensions
  createPageNav();

  // Init hero
  initHeroGears();
  initHeroParticles();

  // Init knowledge sections (canvases now have correct page layout)
  initGearBasics();
  initGearPair();
  initChainDrive();
  initLinkage();
  initBeltDrive();
  initGearLab();

  // Init games
  initGameMatch();
  initGameFix();
  initGameChain();
  initGameSort();
  initGameSpeed();
  initGamePuzzle();
  initGameFind();
  initGameBuild();
}

document.addEventListener('DOMContentLoaded', boot);
</script>
