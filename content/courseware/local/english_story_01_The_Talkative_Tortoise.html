<!DOCTYPE html>
<html lang="zh-CN">
<head><link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Talkative Tortoise - 森林英语故事</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#1A3A2A 0%,#2E7D32 50%,#1A3A2A 100%);min-height:100vh;padding:16px;color:#fff}
.container{max-width:480px;margin:0 auto}
.cover{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:24px;padding:32px;text-align:center;box-shadow:0 8px 40px rgba(139,195,74,0.2);margin-bottom:16px;border:1px solid rgba(139,195,74,0.3)}
.cover-title{font-size:28px;font-weight:800;color:#8BC34A;margin-bottom:8px;text-shadow:0 2px 10px rgba(139,195,74,0.5)}
.cover-subtitle{color:#A5D6A7;margin-bottom:20px}
.section{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,0.3);margin-bottom:16px;border:1px solid rgba(255,255,255,0.1)}
.section-title{font-size:18px;font-weight:700;color:#8BC34A;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.interact-area{background:rgba(139,195,74,0.1);border-radius:12px;padding:20px;text-align:center;margin-bottom:12px;border:2px solid rgba(139,195,74,0.3)}
.btn{background:linear-gradient(135deg,#8BC34A,#689F38);color:#1A3A2A;border:none;padding:12px 24px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(139,195,74,0.4)}
.btn-secondary{background:linear-gradient(135deg,#81C784,#388E3C);color:#fff}
.story-text{line-height:1.8;font-size:16px;color:#E0E0E0}
.dialogue{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid #8BC34A}
.dialogue-name{font-weight:700;color:#8BC34A;margin-bottom:4px}
.quiz-option{background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;transition:all 0.3s;text-align:left}
.quiz-option:hover{border-color:#8BC34A;background:rgba(139,195,74,0.1)}
.quiz-option.correct{border-color:#4CAF50;background:rgba(76,175,80,0.2)}
.quiz-option.wrong{border-color:#F44336;background:rgba(244,67,54,0.2)}
.poem-line{font-size:20px;text-align:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1);color:#8BC34A}
.poem-explain{font-size:14px;color:#A5D6A7;padding:8px 0}
.leaf{position:fixed;pointer-events:none;animation:fall 4s linear infinite}
@keyframes fall{0%{transform:translateY(-100%) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(360deg);opacity:0}}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.4)}
.story-text.speaking{background:rgba(255,215,0,0.15);animation:pulse 1.2s ease-in-out infinite}
.dialogue{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid #FFD700;cursor:pointer;transition:background 0.2s}
.dialogue:active{background:rgba(255,255,255,0.15)}
.dialogue.speaking{animation:pulse 1.2s ease-in-out infinite;border-left-color:#FFA500}
@media (max-width:360px){
  body{padding:8px}
  .cover{padding:20px 16px;border-radius:18px}
  .cover-title{font-size:22px}
  .section{padding:16px;border-radius:16px}
  .section-title{font-size:16px}
  .story-text{font-size:14px;line-height:1.6}
  .dialogue{padding:10px 12px;font-size:14px}
  .quiz-option{padding:10px;font-size:14px}
  .poem-line{font-size:17px;padding:8px 0}
  .btn{padding:10px 18px;font-size:13px}
  .cover-subtitle{font-size:13px}
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.4)}
  50%{box-shadow:0 0 0 8px rgba(255,215,0,0)}
}
.story-text.speaking{background:rgba(255,215,0,0.15);animation:pulse 1.2s ease-in-out infinite}
.dialogue{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid #FFD700;cursor:pointer;transition:background 0.2s}
.page-section.swipe-active{opacity:1;transform:translateX(0)}


</style>
</head>
<body>
<div class="container">
  <div class="cover">
    <div style="font-size:64px;margin-bottom:12px">🐢</div>
    <h1 class="cover-title">The Talkative Tortoise</h1>
    <p class="cover-subtitle">多话的乌龟 · 森林英语故事</p>
    <button class="btn" onclick="document.getElementById('content').scrollIntoView()">开始探险</button>
  </div>
  <div id="content"></div>
</div>

<script>
const TEMPLATE_CONFIG = {
  theme: 'forest',
  title: 'The Talkative Tortoise',
  subtitle: '多话的乌龟',
  colors: {
    primary: '#1A3A2A',
    secondary: '#2E7D32',
    accent: '#8BC34A',
    text: '#FFFFFF',
    card: 'rgba(255,255,255,0.1)'
  },
  decorations: ['🍄', '🦋', '🌿', '🌲', '🦊', '🐿️']
};

class CanvasRenderer {
  constructor(canvasId) {
    this.canvas = document.getElementById(canvasId);
    this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
    this.animationId = null;
  }
  init() { if (this.canvas) this.ctx = this.canvas.getContext('2d'); }
  mount() { this.init(); }
  unmount() { if (this.animationId) cancelAnimationFrame(this.animationId); }
  resize(w, h) { if (this.canvas) { this.canvas.width = w; this.canvas.height = h; } }
  clear() { if (this.ctx) this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }
  drawLeaf(x, y, size, color) {
    if (!this.ctx) return;
    this.ctx.beginPath();
    this.ctx.moveTo(x, y - size);
    this.ctx.bezierCurveTo(x + size, y - size, x + size, y + size, x, y + size);
    this.ctx.bezierCurveTo(x - size, y + size, x - size, y - size, x, y - size);
    this.ctx.fillStyle = color || TEMPLATE_CONFIG.colors.accent;
    this.ctx.fill();
  }
  animate(drawFn) {
    const loop = () => {
      this.clear();
      drawFn(this.ctx, this.canvas);
      this.animationId = requestAnimationFrame(loop);
    };
    loop();
  }
}

class QuizEngine {
  constructor(containerId) {
    this.container = document.getElementById(containerId);
    this.questions = [];
    this.current = 0;
    this.score = 0;
  }
  init(questions) {
    this.questions = questions;
    this.current = 0;
    this.score = 0;
  }
  mount() { this.render(); }
  unmount() { if (this.container) this.container.innerHTML = ''; }
  render() {
    if (!this.container || !this.questions[this.current]) return;
    const q = this.questions[this.current];
    this.container.innerHTML = `
      <div class="section-title">🌿 第${this.current + 1}题</div>
      <p style="margin-bottom:16px">${q.question}</p>
      ${q.options.map((opt, i) => `
        <div class="quiz-option" data-index="${i}" onclick="quizEngine.check(${i})">${opt}</div>
      `).join('')}
      <p style="margin-top:12px;color:#A5D6A7">得分: ${this.score}/${this.questions.length}</p>
    `;
  }
  check(index) {
    const q = this.questions[this.current];
    const options = this.container.querySelectorAll('.quiz-option');
    options.forEach((opt, i) => {
      opt.style.pointerEvents = 'none';
      if (i === q.answer) opt.classList.add('correct');
      else if (i === index && i !== q.answer) opt.classList.add('wrong');
    });
    if (index === q.answer) this.score++;
    setTimeout(() => {
      this.current++;
      if (this.current < this.questions.length) this.render();
      else {
        this.container.innerHTML = `
          <div class="section-title">🎉 完成!</div>
          <p>最终得分: ${this.score}/${this.questions.length}</p>
        `;
      }
    }, 1000);
  }
}

class StoryEngine {
  constructor(containerId) {
    this.container = document.getElementById(containerId);
    this.type = 'english';
    this.sections = [];
    this.current = 0;
  }
  init(type, sections) {
    this.type = type;
    this.sections = sections;
    this.current = 0;
  }
  mount() { this.render(); }
  unmount() { if (this.container) this.container.innerHTML = ''; }
  render() {
    if (!this.container || !this.sections[this.current]) return;
    const s = this.sections[this.current];
    let html = `<div class="section-title">${s.emoji || '📖'} ${s.title}</div>`;
    if (s.type === 'text') {
      html += `<div class="story-text">${s.content}</div>`;
    } else if (s.type === 'dialogue') {
      s.lines.forEach(line => {
        html += `<div class="dialogue"><div class="dialogue-name">${line.name}</div><div>${line.text}</div></div>`;
      });
    } else if (s.type === 'moral') {
      html += `<div class="section" style="background:rgba(139,195,74,0.15);border:2px solid rgba(139,195,74,0.4)">
        <div class="story-text" style="text-align:center;font-style:italic;color:#C8E6C9">${s.content}</div>
      </div>`;
    }
    if (this.current < this.sections.length - 1) {
      html += `<button class="btn" style="margin-top:16px" onclick="storyEngine.next()">下一页 →</button>`;
    } else {
      html += `<button class="btn btn-secondary" style="margin-top:16px" onclick="storyEngine.restart()">🔄 重读故事</button>`;
    }
    this.container.innerHTML = html;
  }
  next() {
    this.current++;
    if (this.current < this.sections.length) this.render();
  }
  restart() {
    this.current = 0;
    this.render();
    window.scrollTo(0, 0);
  }
}

function createLeaves() {
  const container = document.querySelector('.container');
  const leafEmojis = ['🍃', '🍂', '🌿'];
  for (let i = 0; i < 10; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.innerHTML = leafEmojis[i % leafEmojis.length];
    leaf.style.left = Math.random() * 100 + '%';
    leaf.style.animationDelay = Math.random() * 4 + 's';
    leaf.style.fontSize = (Math.random() * 16 + 12) + 'px';
    container.appendChild(leaf);
  }
}

const storyEngine = new StoryEngine('content');
const quizEngine = new QuizEngine('quiz-container');

storyEngine.init('english', [
  {
    emoji: '🐢',
    title: 'The Talkative Tortoise',
    type: 'text',
    content: `Tilly the tortoise lived in a sunny meadow with her friends: the wise Owl, the busy Squirrel, and the gentle Rabbit. Tilly loved her friends, but she loved one thing more—her own voice. She talked all day long.`
  },
  {
    emoji: '💬',
    title: 'Tilly\'s Endless Chatter',
    type: 'dialogue',
    lines: [
      { name: 'Tilly 🐢', text: 'Good morning, Owl! Did you see the dewdrops? I counted thirty-seven on one leaf. Well, maybe thirty-eight. One was very tiny. Do you think dewdrops have dreams? I dreamt I was a cloud once. It was very floaty...' },
      { name: 'Owl 🦉', text: '*nods politely, eyelids growing heavy*' }
    ]
  },
  {
    emoji: '🧺',
    title: 'The Picnic',
    type: 'text',
    content: `One day, the animals decided to have a picnic by the sparkling pond. Everyone brought something to share. Rabbit brought clover buns, Squirrel brought acorn pie, and Owl brought a jar of honey. Tilly brought herself, and she brought plenty of stories.`
  },
  {
    emoji: '🗣️',
    title: 'The Talking Goes On',
    type: 'dialogue',
    lines: [
      { name: 'Tilly 🐢', text: 'Did I ever tell you about the time I raced a turtle? Well, it was actually a snail. He was very slow. Or was it me who was slow? Let me think...' },
      { name: 'Tilly 🐢', text: 'And then the wind blew the flower petals all over. They were pink, but also a bit purple. Purple is an interesting color, isn\'t it? My cousin\'s shell has a purple speck...' }
    ]
  },
  {
    emoji: '😫',
    title: 'Friends Grow Tired',
    type: 'text',
    content: `Her friends tried to listen, but their ears were tired. They were hungry too. The delicious smells from the picnic made their tummies rumble. Finally, Squirrel couldn't wait anymore. He reached for a clover bun.`
  },
  {
    emoji: '😤',
    title: 'Tilly Gets Upset',
    type: 'dialogue',
    lines: [
      { name: 'Tilly 🐢', text: 'Squirrel! I\'m not finished with my story! It\'s not polite to eat when someone is talking.' },
      { name: '', text: 'Squirrel pulled his paw back. The picnic was not fun anymore. Rabbit looked at the ground. Owl stared at the clouds. Tilly was so busy talking, she hadn\'t noticed how quiet her friends were.' }
    ]
  },
  {
    emoji: '🌬️',
    title: 'The Wind Comes!',
    type: 'text',
    content: `Just then, a loud WHOOOOSH swept through the meadow. A gust of wind grabbed the picnic blanket! It flipped it over, scattering buns, pie, and the honey jar high into the air! The food landed with a splish-splash right in the middle of the pond.`
  },
  {
    emoji: '😢',
    title: 'A Ruined Picnic',
    type: 'text',
    content: `The four friends stood at the edge of the pond, very sad. The picnic was ruined, and nobody had gotten to eat a single bite. Tilly looked at her sad friends. For the first time all day, her mouth was closed.`
  },
  {
    emoji: '💭',
    title: 'Tilly\'s Realization',
    type: 'dialogue',
    lines: [
      { name: 'Tilly 🐢', text: 'I\'m sorry. I was so busy talking that I forgot to listen. And I forgot to let you eat. A picnic isn\'t just about talking. It\'s about sharing.' },
      { name: 'Owl 🦉', text: 'We love hearing your stories, Tilly. But sharing means everyone gets a turn to speak. And to eat.' }
    ]
  },
  {
    emoji: '🔨',
    title: 'Building Together',
    type: 'text',
    content: `The next day, Tilly invited her friends back to the meadow. This time, she was quiet at first. She had spent the morning thinking of a plan. "Let's build a new picnic table, right here under this big oak tree. Then, the wind can't take our blanket away!" Tilly didn't talk while they worked. She listened to Rabbit's ideas, and Squirrel's, and Owl's. They found smooth stones for legs and a wide, flat board for the top.`
  },
  {
    emoji: '🎉',
    title: 'A Better Picnic',
    type: 'text',
    content: `When they were done, they had a wonderful, sturdy table. They sat down, and Tilly passed the food around first. "Now," she said with a smile, "I will tell you a new story. It's about a tortoise who learned how to listen. But first, does anyone want more clover buns?" Her friends laughed. They shared the food, and then they shared stories, each animal taking a turn. Tilly talked, but she also listened. And she found that the stories from her friends were just as wonderful as her own.`
  },
  {
    emoji: '💚',
    title: 'Moral of the Story',
    type: 'moral',
    content: 'Talking is wonderful, but listening is a gift. When we share our voices and our time, everyone feels happy and heard.<br><br>说话是美好的，但倾听是一份礼物。当我们分享自己的声音和时间时，每个人都会感到快乐和被倾听。'
  }
]);

document.addEventListener('DOMContentLoaded', () => {
  createLeaves();
  storyEngine.mount();
});
function launchConfetti() {
  let box = document.querySelector('.confetti-container');
  if (!box) {
    box = document.createElement('div');
    box.className = 'confetti-container';
    document.body.appendChild(box);
  }
  }
const Speech = {
  _speaking: false,
  detectLang(text) {
    const cjk = /[\u4e00-\u9fff\u3400-\u4dbf]/;
    const latin = /[a-zA-Z]/;
    let cn = 0, en = 0;
    for (let i = 0; i < text.length; i++) {
      if (cjk.test(text[i])) cn++;
      else if (latin.test(text[i])) en++;
    }
    return cn > en ? 'zh-CN' : 'en-US';
  },
  speak(text, lang) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    if (!text || !text.trim()) return;
    const u = new SpeechSynthesisUtterance(text.trim());
    u.lang = lang || this.detectLang(text);
    u.rate = 0.9;
    u.pitch = 1.05;
    this._speaking = true;
    u.onend = () => { this._speaking = false; };
    u.onerror = () => { this._speaking = false; };
    window.speechSynthesis.speak(u);
  },
  stop() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    this._speaking = false;
  }
};

function initSwipe() {
  contentEl.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  contentEl.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
    const sections = getSections();
    if (sections.length < 2) return;
    if (dx < 0 && currentPage < sections.length - 1) {
      swipePage(currentPage, currentPage + 1);
    } else if (dx > 0 && currentPage > 0) {
      swipePage(currentPage, currentPage - 1);
    }
  }, { passive: true });
}

</script>
</body>
</html>
